      47: [
        ["保健所に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「保健所は、現在、その設置や役割が [ A ] に定められており、都道府県や [ B ] に設置され、これら自治体には美容所に対し [ C ] を行う環境衛生監視員が配置されている。」",["A:地域保健法 ― B:保健所設置市又は東京都の特別区 ― C:立入検査","A:保健所法 ― B:すべての市町村 ― C:立入検査","A:保健所法 ― B:保健所設置市又は東京都の特別区 ― C:経営指導","A:地域保健法 ― B:すべての市町村 ― C:経営指導"],1],
        ["美容師名簿の登録に関する次の記述のうち、正しいものはどれか。",["名簿を備えて美容師の免許に関する事項を登録する事務は、都道府県知事が行う。","美容師が氏名を変更したときは、2か月以内に名簿の訂正を申請しなければならない。","美容師が管理美容師資格認定講習会の課程を修了したときは、30日以内に名簿の登録事項の追加を申請しなければならない。","美容師が死亡したときは、戸籍法による届出義務者は、30日以内に名簿の登録の消除を申請しなければならない。"],4],
        ["管理美容師に関する次の文章の [ ] に入る数値の組合せのうち、正しいものはどれか。「美容師である従業者が常時 [ A ] 人以上の美容所の開設者は、美容所ごとに管理美容師を置かなければならない。美容師の免許を受け [ B ] 年以上美容の業務に従事し、管理美容師資格認定講習会の課程を修了した開設者は、自ら主として管理する [ C ] か所の美容所の管理美容師となることができる。」",["A:1 ― B:3 ― C:2","A:1 ― B:5 ― C:1","A:2 ― B:3 ― C:1","A:2 ― B:5 ― C:2"],3],
        ["美容所の開設に関する次の記述のうち、誤っているものはどれか。",["国内に住民票がある外国人は、美容所の開設者になれる場合がある。","美容所の開設者が講ずべき衛生上必要な措置については、都道府県等の条例でも定められている。","美容所の開設者が講ずべき衛生上必要な措置を怠ったときは、そのことにより30万円以下の罰金に処せられる。","施術者全員が理容師及び美容師双方の資格を有するときは、同一の場所で理容所及び美容所の重複開設が認められる場合がある。"],3],
        ["美容所の開設者が行う届出に関する次の記述のうち、正しいものはどれか。",["美容所の開設者は、美容所の名称のみを変更した場合には、届出をする必要はない。","管理美容師を設置すべき美容所の開設者は、開設時に管理美容師の氏名と住所を届け出なければならない。","美容所の開設者は、届出事項に変更が生じた場合には、30日以内に届け出なければならない。","美容所の開設者が開設の届出を怠った場合、閉鎖処分となることがある。"],2],
        ["次のうち、そのことにより罰金に処せられることがある場合として正しいものの組合せはどれか。\na 美容師の免許を受けず美容を業とした場合\nb 美容師が業務停止処分に違反した場合\nc 管理美容師を設置すべき美容所の開設者が管理美容師を設置しない場合\nd 美容所の開設者が構造設備についての検査確認前に美容所を使用した場合",["aとb","bとc","cとd","aとd"],4],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「生活衛生関係営業の振興を図るため、[ A ] が業種ごとに振興指針を定め、この指針に基づいて [ B ] が振興計画を定める仕組みが設けられている。また、サービスの内容を適正に表示すること等により利用者又は消費者の選択の利便を図るため、全国生活衛生営業指導センターは、[ C ] を定めることができる。」",["A:厚生労働大臣 ― B:生活衛生同業組合 ― C:標準営業約款","A:都道府県知事 ― B:生活衛生同業組合 ― C:標準営業約款","A:都道府県知事 ― B:生活衛生同業組合 ― C:適正化規程","A:厚生労働大臣 ― B:都道府県知事 ― C:適正化規程"],1],
        ["美容所の経営についての税金に関する次の記述のうち、誤っているものはどれか。",["所得税や法人税は、利益が出ているときに納める税金である。","雇用主は、従業員の給与から源泉所得税を預かり、原則翌月10日までに税務署に納める。","固定資産税は、経営がうまくいかず損失が出ている場合には、納付が免除される税金である。","申告納税しなければならない者が申告や納税義務を怠った場合には、罰則として追加の税が課されることになっている。"],3],
        ["労働基準法に関する次の記述のうち、誤っているものはどれか。",["労働条件の最低基準を定めている。","同居の親族以外で、使用している従業員が5人未満の美容所には適用されない。","使用者は、技能の習得を目的とする者であることを理由として、労働者を酷使してはならない。","雇用契約を結ぶときは、労働者に賃金等の労働条件を明示しなければならない。"],2],
        ["介護保険制度に関する次の記述のうち、正しいものの組合せはどれか。\na 介護保険の運営主体(保険者)は、都道府県である。\nb 介護保険の被保険者は、20歳以上のすべての国民である。\nc 介護保険の給付には、介護給付のほかに予防給付もある。\nd 介護給付を受けるには、要介護状態について認定を受けなければならない。",["aとb","bとc","cとd","aとd"],3],
        ["わが国の2015年の統計指標に関する次の組合せのうち、Aの数値がBの数値より大きいものはどれか。",["A:肺炎死亡者数 ― B:心疾患死亡者数","A:男性の平均寿命 ― B:女性の平均寿命","A:女性の粗死亡率 ― B:男性の粗死亡率","A:死亡数 ― B:出生数"],4],
        ["生活習慣病に関する次の記述のうち、誤っているものはどれか。",["脳血管疾患の死亡率は、2000年以降減少傾向にある。","悪性新生物の年齢調整死亡率は、増加傾向にある。","虚血性心疾患の患者数や死亡者数は、40歳代以降で加齢とともに急速に増える傾向がある。","2型糖尿病は、肥満や運動、食事などの生活習慣の改善によって予防できる場合がある。"],2],
        ["次のうち、わが国の2015年の65歳以上人口はどれか。",["約1200万人","約2300万人","約3400万人","約5500万人"],3],
        ["カビとダニに関する次の記述のうち、誤っているものはどれか。",["室内の天井や壁に発生している黒カビは、アレルギー反応を引き起こすことはない。","カビの発育は、酸素や湿度、温度、栄養によって影響を受ける。","ダニのなかには、人の皮膚から落下するフケや垢を栄養とするものがいる。","ダニの死骸やふんを吸い込んで、アレルギー反応を引き起こすことがある。"],1],
        ["下水道と浄化槽に関する次の記述のうち、誤っているものはどれか。",["下水道の整備により、日常生活の快適性や公衆衛生の向上が期待できる。","下水処理を終えて川や海に放流される水の水質は、法律により規制されている。","下水道が整備されていない地域では、浄化槽が広く使用されている。","浄化槽の設置や保守点検に関係する法律は、定められていない。"],4],
        ["次の感染症のうち、美容師が感染している場合、感染症法に基づき、美容の業務に従事できないものの正しい組合せはどれか。\na 後天性免疫不全症候群(エイズ)\nb 結核\nc エボラ出血熱\nd 梅毒",["aとb","bとc","cとd","aとd"],2],
        ["予防接種法に基づく予防接種に関する次の記述のうち、誤っているものはどれか。",["予防接種を受けるように努めなければならないという努力義務は、これを受けなければならないという義務に改められている。","定期に行われるものや臨時に行われるもの、希望者が任意に受けるものがある。","予防接種には、感染症に対する個人や集団の抵抗力を高める効果がある。","定期予防接種の対象疾病にはA類疾病、B類疾病があり、救済の内容などに違いがある。"],1],
        ["感染症と病原体に関する次の組合せのうち、正しいものはどれか。",["ペスト ― 細菌","破傷風 ― 原虫","ジフテリア ― ウイルス","デング熱 ― 蠕虫"],1],
        ["次の感染症のうち、胎内感染することがあるものはどれか。",["腸管出血性大腸菌感染症","百日せき","風しん","コレラ"],3],
        ["次の対策のうち、感染症予防の3原則に含まれないものはどれか。",["感染源に関する対策","感染経路に関する対策","宿主の感受性対策","個人予防対策"],4],
        ["紫外線消毒に関する次の記述のうち、誤っているものはどれか。",["タオルやケープなどの布片類の消毒に適している。","物体の表面にしか作用しないので、深部や陰の部分は消毒できない。","目や皮膚に直接照射すると害がある。","プラスチックの一部には劣化するものがある。"],1],
        ["美容所で行う蒸気消毒に関する次の記述のうち、正しいものはどれか。",["かみそりの消毒に適用できる。","消毒に要する時間は、煮沸消毒より短い。","タオル蒸し器内の圧力は、大気圧と同じである。","細菌の芽胞を不活化できる。"],3],
        ["消毒薬水溶液の特徴に関する次の記述のうち、正しいものはどれか。",["エタノール水溶液は、無色透明で揮発性がある。","次亜塩素酸ナトリウム水溶液は、無色透明で引火性がある。","両性界面活性剤水溶液は、赤桃色で振ると泡立つ。","逆性石けん水溶液は、無色透明で一般の石けんと併用すると消毒力が高まる。"],1],
        ["消毒薬水溶液の調製に関する次の記述のうち、正しいものはどれか。",["5%次亜塩素酸ナトリウムを50倍希釈して、0.01%水溶液を調製する。","10%逆性石けんを100倍希釈して、0.1%水溶液を調製する。","20%グルコン酸クロルヘキシジンを200倍希釈して、0.05%水溶液を調製する。","15%両性界面活性剤を150倍希釈して、1%水溶液を調製する。"],2],
        ["血液が付着しているくしの消毒方法に関する次の記述のうち、正しいものの組合せはどれか。\na 80℃を超える蒸気に10分間以上触れさせる。\nb 0.1%以上の次亜塩素酸ナトリウムに10分間以上浸す。\nc 消毒用エタノールに10分間以上浸す。\nd 1cm²当たり85マイクロワット以上の紫外線を20分間以上照射する。",["aとb","bとc","cとd","aとd"],2],
        ["次の関節のうち、最も自由に運動できる形態のものはどれか。",["蝶番関節","鞍関節","車軸関節","球関節"],4],
        ["次の筋のうち、表情筋に含まれないものはどれか。",["眼輪筋","口輪筋","前頭筋","側頭筋"],4],
        ["次のうち、交感神経が優位に機能するときに起こる変化はどれか。",["アドレナリン分泌低下","瞳孔散大","心筋収縮力低下","消化管機能亢進"],2],
        ["次の眼の部分のうち、網膜にあるものはどれか。",["虹彩","中心窩","硝子体","毛様体"],2],
        ["次のうち、血液の小循環の経路に含まれるものはどれか。",["右心室","左心室","脳の毛細血管","門脈"],1],
        ["皮膚に関する次の記述のうち、誤っているものはどれか。",["頭の皮膚は厚くて強く、ゴムのようなかたさと弾力を持っている。","体幹の皮膚は、腹側よりも背側の方が厚い。","顔の皮膚は、全体的に厚さが均一である。","耳を覆う皮膚の皮下組織は少なく、皮下脂肪はほとんどない。"],3],
        ["皮膚付属器官に関する次の記述のうち、正しいものはどれか。",["毛根の下端のフラスコ状に膨らんだ部分を毛幹という。","脂腺は、手掌や足底に最も多く分布する。","汗腺には、エクリン腺とアポクリン腺がある。","爪の主な成分は、エラスチンである。"],3],
        ["皮膚と皮膚付属器官の生理機能に関する次の記述のうち、誤っているものはどれか。",["皮膚に冷たい刺激を与えると、立毛筋が収縮して、いわゆる鳥肌反応(立毛筋反射)が起こることがある。","脂腺の発育は、女性ホルモンの刺激によって行われる。","温度と関係なく精神的な感動によって手掌や足底、腋窩から急激に汗が出ることがある。","皮膚の表面にある脂肪膜は弱酸性で、細菌の増殖を抑制する。"],2],
        ["皮膚と皮膚付属器官の保健に関する次の記述のうち、誤っているものはどれか。",["肝臓障害によって胆汁色素が皮膚に沈着すると、皮膚は紫色を帯びる。","更年期の女性では、フケの増加やひげの発育、四肢の硬毛の発育がみられることがある。","尋常性痤瘡(ニキビ)のなかには、便秘により悪化するものがある。","UVAは真皮にまで達し、しわやたるみを招く。"],1],
        ["皮膚の疾患と病原体に関する次の組合せのうち、正しいものはどれか。",["伝染性軟属腫(ミズイボ) ― 細菌","伝染性膿痂疹(トビヒ) ― ヒゼンダニ","帯状疱疹 ― 真菌","尋常性疣贅 ― ウイルス"],4],
        ["香粧品の水性原料である水とエタノールに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「多くの化粧水のように物質が均一に溶け合って液体となった溶液において、物質を溶かしている液体を溶媒といい、溶けている物質を [ A ] という。水のような炭素を含まない溶媒を [ B ] 溶媒という。エタノールは水に溶けない物質を溶かす溶媒としての働きだけでなく、蒸発する際に皮膚の熱を奪って冷感を与えて皮膚組織を引き締める [ C ] 作用も持っている。」",["A:溶剤 ― B:無機 ― C:保湿","A:溶剤 ― B:有機 ― C:収れん","A:溶質 ― B:有機 ― C:保湿","A:溶質 ― B:無機 ― C:収れん"],4],
        ["油性原料に関する次の組合せのうち、誤っているものはどれか。",["油脂 ― オリーブ油","ロウ類 ― ホホバ油","炭化水素 ― マイクロクリスタリンワックス","シリコーン油 ― ワセリン"],4],
        ["界面活性剤に関する次の記述のうち、正しいものはどれか。",["石けんは、陽イオン界面活性剤(カチオン界面活性剤)に分類され、洗浄力に優れている。","第四級アンモニウム塩は、陰イオン界面活性剤(アニオン界面活性剤)に分類され、ヘアリンス剤に用いられる。","レシチンは、両性界面活性剤に分類され、大豆や卵黄などから得ることができる。","ラノリンは、非イオン界面活性剤(ノニオン界面活性剤)に分類され、クリームや乳液などの乳化剤として用いられる。"],3],
        ["酸化・還元に関する次の記述のうち、誤っているものはどれか。",["過酸化水素は、染毛剤中で還元剤として作用する。","パーマ剤第1剤中のチオグリコール酸は、還元剤として用いられ、シスチン結合に水素を与える。","パーマ剤第2剤中の臭素酸ナトリウムは、毛髪内のシスチン結合を酸化により再結合させる。","抗酸化剤は、香粧品の自動酸化を防ぐ。"],1],
        ["ヘアカラー製品に関する次の記述のうち、誤っているものはどれか。",["パラフェニレンジアミンは、毛髪内部まで浸透し、重合により発色する。","脱色剤は、毛髪内部のメラニン色素を酸化して分解する。","酸化染料は、ヘアマニキュアに配合される。","染料中間体をカップラーとともに用いると、さまざまな色調に発色する。"],3],
        ["昭和時代に流行した髪型に関する次の記述のうち、誤っているものはどれか。",["セシールカットとは、髪全体を極端に短くしたボーイッシュな髪型である。","サーファーカットとは、肩よりやや長めのセミロングのレイヤードヘアである。","ソバージュとは、根元から毛先まで細かくパーマをかけてウェーブをつけた髪型である。","ヘップバーンスタイルとは、後頭部で束ねた毛束を子馬のしっぽのように垂らした髪型である。"],4],
        ["次のうち、1960年代から1970年代にかけて流行した若者男性のヘアスタイルに該当しないものはどれか。",["GI刈","ロングヘア","マッシュルームカット","アフロヘア"],1],
        ["1960年代の服装に関する次の記述のうち、誤っているものはどれか。",["高田賢三が、アメリカのアイビースタイルをアメトラ(アメリカン・トラディショナル)ファッションとして定着させた。","東京・銀座で西銀座族やみゆき族と名付けられた若者たちのファッションが話題となった。","パリのオートクチュールデザイナーが作りはじめた高級既製服が日本でも販売されるようになった。","アンドレ・クレージュがミニスカートをパリ・コレクションで取り上げ、話題となった。"],1],
        ["美容技術における作業姿勢に関する次の記述のうち、誤っているものはどれか。",["立位作業を行うときは、技術者の重心から下した垂線が両足に囲まれた領域内にあると姿勢が安定する。","技術を施す箇所に正対して作業することが、正しい姿勢の基本である。","パーマネントウェーブ技術でロッドを巻くときは、頭部が技術者の目の高さとなるようにする。","肩の関節を固定させて手を動かす作業を行うときは、肘に余裕を持たせて手先を動かすとよい。"],4],
        ["シザーズに関する次の記述のうち、正しいものはどれか。",["母指で操作する方の刃を静刃という。","ティッシュペーパーをゆっくりと切ってみたときに、すべるものがよい。","交点での接触圧が開くときより閉じるときに強いものがよい。","動刃と静刃の間に凸レンズ状のあきが正確につくられているものがよい。"],4],
        ["ヘアアイロンに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「ヘアアイロンは、[ A ] と物理的な力によって毛髪の構造に変化を与える。ロッドの素材には、ステンレスやセラミックの他、ヘアローションなどが焦げつかないように表面に [ B ] 加工を施したものなどがある。電熱式ヘアアイロンでは、ニクロム線と [ C ] との接続部分は壊れやすく、絶縁体が不良になると感電の危険がある。」",["A:熱 ― B:アクリル樹脂 ― C:プラグ","A:光 ― B:フッ素樹脂 ― C:プラグ","A:光 ― B:アクリル樹脂 ― C:コード","A:熱 ― B:フッ素樹脂 ― C:コード"],4],
        ["次のスキャルプトリートメントの方法のうち、化学的方法に分類されるものはどれか。",["ブラッシングによる方法","スキャルプマッサージによる方法","ヘアトニックを用いる方法","ヘアスチーマーの湿熱を用いる方法"],3],
        ["デザインの比率に関する次の記述のうち、誤っているものはどれか。",["パルテノン神殿など歴史的な建造物の中に、最も安定した比率とされる黄金比を見ることができる。","人間のプロポーションでは、身体に対して頭が相対的に大きいと全体的に大人っぽい成熟した印象を与える。","アンバランスなデザインは、緊張感を生み出す。","レオナルド・ダ・ヴィンチは、人体のプロポーションのカノン(基準)を描いた。"],2],
        ["シザーズによるカット技法に関する次の記述のうち、正しいものはどれか。",["ブラントカットとは、カッティングされたラインを修整する技法である。","ポインティングカットとは、毛髪を直線でブツ切りにする技法である。","スライドカットとは、毛先を穂先のような状態にする技法である。","トリミングカットとは、毛量を減らして調整する技法である。"],3],
        ["パーマネントウェーブ技術に関する次の記述のうち、正しいものはどれか。",["吸水性毛は薬剤をはじき、パーマがかかりにくい。","施術前のシャンプーは、刺激が少なく適度に洗浄力のあるシャンプー剤がよい。","パーマがかかりすぎるおそれのある毛髪の場合は、つけ巻きをするとよい。","テストカール時の適正カールの直径は、ロッドの直径の1.5倍である。"],2],
        ["次のストランドカールのベースの種類のうち、ステムをオーバーラップさせやすいものはどれか。",["スクエアベース","オブロングベース","パラレログラムベース","トライアンギュラーベース"],4],
        ["酸化染毛剤に関する次の記述のうち、誤っているものはどれか。",["カラーチェックは、1か所で行う。","頭髪全体を明るくする場合は、細かいブロックに分けて、ネープから塗布する。","おしゃれ染の場合は、先に中間部と毛先に塗布し、希望色に近づいたら根元部分に塗布する。","白髪は染まりにくいので、多い部分から塗布し、放置時間を長めにする。"],1],
        ["アーティフィシャルネイルに関する次の記述のうち、誤っているものはどれか。",["チップとは、チップを装着し、弱い爪の補強や修復を行うテクニックである。","チップオーバーレイとは、チップを装着した上にジェル等で補強するテクニックである。","スカルプチュアとは、人工爪の土台となるフォームを使用し、ジェル等で長さを出すテクニックである。","ナチュラルネイルオーバーレイとは、爪の上をジェル等で覆い、補強や修復などを行うテクニックである。"],1],
        ["まつ毛エクステンションの注意事項に関する次の記述のうち、正しいものはどれか。",["まつ毛エクステンションの施術中に体に何らかの違和感を生じた場合は、直ちに施術者が塗り薬などで対処する。","グルーは硬化するまでに時間がかかるため、施術後、最低でも5〜6時間は洗顔・入浴など高温・多湿の環境は避ける。","個人差はあるが、おおむね5〜6週間でリペアが必要になる。","再来時のカウンセリングは必要ない。"],2],
        ["下図は、日本髪を表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:前髷 ― B:髱 ― C:鬢","A:前髪 ― B:髱 ― C:鬢","A:前髷 ― B:鬢 ― C:髱","A:前髪 ― B:鬢 ― C:髱"],4,"nihongami_47_55"]
      ],
      46: [
        ["美容師法に関する次の記述のうち、誤っているものはどれか。",["公衆衛生の向上に資することで国民全体の利益を図っている。","美容の業務が適正に行われるように規律している。","美容業の経営の健全化を促進することにより、美容業の振興を図っている。","美容師の資格を定め、美容師の免許を受けた者でなければ美容を業としてはならないとしている。"],3],
        ["美容師の免許に関する次の記述のうち、正しいものはどれか。",["美容師が住所を変更したときは、速やかに美容師名簿の訂正を申請しなければならない。","美容師が氏名を変更したときは、30日以内に美容師名簿の訂正を申請しなければならない。","美容師が免許取消処分を受けたときは、速やかに住所地の都道府県知事に免許証(免許証明書)を返納しなければならない。","美容師が業務停止処分を受けたときは、速やかに厚生労働大臣に免許証(免許証明書)を返納しなければならない。"],2],
        ["次のうち、美容師の免許取消処分の対象となるものはどれか。",["伝染性の疾病にかかり、その就業が公衆衛生上不適当と認められる場合","美容師法等で定める衛生上必要な措置を講じなかった場合","法の規定による業務の停止処分に違反して、美容の業をした場合","美容師法の政令又は都道府県等の条例で定める特別の事情がないにもかかわらず、美容所以外の場所で美容の業をした場合"],3],
        ["管理美容師に関する次の記述のうち、正しいものの組合せはどれか。\na 管理美容師は、美容師である従業者が常時2人以上の美容所に設置しなければならない。\nb 同一人が複数の美容所の管理美容師となることはできない。\nc 管理美容師は、美容所の施設を衛生的に管理するものであり、美容の業務を衛生的に管理することまでは求められていない。\nd 管理美容師は、美容師の免許を受けた後2年以上美容の業務に従事し、厚生労働大臣の指定する講習会の課程を修了した者でなければならない。",["aとb","bとc","cとd","aとd"],1],
        ["美容所の開設に関する次の記述のうち、正しいものはどれか。",["美容所の開設者は、美容師の免許を有する者でなければならない。","美容所を開設する者は、使用開始後に届出を行い、構造設備の検査確認を受けなければならない。","会社が従業員の福利厚生のために設ける美容所については、開設の届出は不要である。","美容所の開設者の地位を承継する相続人は、その旨を都道府県知事等に届け出なければならない。"],4],
        ["次のうち、美容所の閉鎖命令の対象となるものはどれか。",["開設者が、美容師でない者に美容の業務を行わせた場合","開設者が、構造設備の変更届を怠った場合","従事する美容師が、精神の機能の障害により業務を適正に行うことができない場合","従事する美容師が、環境衛生監視員による立入検査を妨げた場合"],1],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に関する次の記述のうち、正しいものはどれか。",["厚生労働大臣は、衛生上の規制措置のための適正化規程を定めることができる。","生活衛生同業組合は、営業に関する技能の改善向上についても事業としている。","都道府県知事は、振興指針を定めることができる。","全国生活衛生営業指導センターが定める標準営業約款では、営業日の統一についても定めている。"],2],
        ["会計に関する次の記述のうち、誤っているものはどれか。",["損益計算書では、一定の期間における利益や費用がどのような状況になっているのかを把握することができる。","損益計算書において、利益は「利益＝収益(売上)－費用(コスト)」により求められる。","貸借対照表では、一時点においてどれだけの資産があるのか、借金はどれだけあるのかなどの状況を把握することができる。","貸借対照表において、1年以内に返済しなければならない借金は固定負債に分類される。"],4],
        ["医療保険制度に関する次の記述のうち、正しいものはどれか。",["国民健康保険の保険者は、国民健康保険組合と全国健康保険協会である。","国民健康保険の保険料は、保険者にかかわらず全国一律である。","健康保険の保険料には、被保険者負担はない。","健康保険においては、育児休業中の保険料が免除される制度がある。"],4],
        ["労働保険に関する次の記述のうち、誤っているものはどれか。",["雇用保険の保険料には、被保険者負担と事業主負担がある。","雇用保険の基本手当は、自己都合で退職し失業した場合には支給されない。","労働者災害補償保険の適用事業に雇用される者は、国籍や身分、年齢などにかかわらず適用労働者となる。","労働者災害補償保険は、通勤途上の事故に対しても適用されることがある。"],2],
        ["わが国の死亡に関する次の記述のうち、正しいものはどれか。",["年齢別死亡率は、一般的に思春期のころ最も低くなる。","年齢調整死亡率は、人口1,000人に対して1年間に死亡した人の数である。","がんによる死亡数は、減少傾向にある。","粗死亡率は、低下傾向にある。"],1],
        ["2015年のわが国の平均寿命に関する次の記述のうち、正しいものはどれか。",["平均寿命の伸長は、公衆衛生の向上発展とは無関係である。","男女とも80年以上である。","男女とも世界第1位である。","男女の差は、3年以下である。"],2],
        ["次の疾病のうち、生活習慣病に該当しないものはどれか。",["がん","脳卒中","肺炎","心臓病"],3],
        ["一酸化炭素に関する次の記述のうち、誤っているものはどれか。",["不完全燃焼により生じる。","不快な臭いがする。","赤血球のヘモグロビンと結合する。","空気中の濃度が高くなると、頭痛、めまい、吐き気などを起こし、死に至る場合もある。"],2],
        ["採光と照明に関する次の記述のうち、誤っているものはどれか。",["自然光には、直射日光と、雲を通してくる光や北の窓からの光などの天空光がある。","一般に日常生活に不自由のない明るさは、10ルクス程度である。","照明には、作業場所だけを明るくする局所照明と部屋全体を明るくする全般照明がある。","直接照明は、照明効率は高いが、コントラストが強かったり影をつくったりして、眼精疲労を起こすことがある。"],2],
        ["感染症とその病原体の身体への侵入・媒介経路に関する次の組合せのうち、誤っているものはどれか。",["百日せき ― 気道","腸管出血性大腸菌感染症 ― 飲食物","C型肝炎 ― 動物・節足動物","後天性免疫不全症候群(エイズ) ― 直接接触・傷口"],3],
        ["細菌に関する次の記述のうち、正しいものはどれか。",["細菌の成分の約80%は、タンパク質である。","細菌の芽胞は、熱や乾燥に弱い。","細菌のなかには、酸素があると発育、増殖できないものがある。","細菌は、生きた細胞内でないと発育、増殖できない。"],3],
        ["細菌の変異に関する次の記述のうち、誤っているものはどれか。",["変異には、細菌が新たな性質を獲得する場合と本来持っていた性質を失う場合がある。","変異によって、細菌の病原性が低下することがある。","変異によって、化学療法剤や消毒剤に対する耐性を獲得することがある。","変異によって、細菌の形態が変化することはない。"],4],
        ["感染と発病に関する次の記述のうち、誤っているものはどれか。",["病原体が体内に侵入しても、発育、増殖することができず、体外に排出されてしまう状態のことも感染という。","健康な人であれば、通常、感染を起こさないような病原性が低い病原体によって感染、発病する感染症を日和見感染症という。","感染していても発病していない状態を不顕性感染という。","病原体が体内に侵入してから最初に症状があらわれるまでの期間を潜伏期という。"],1],
        ["結核に関する次の記述のうち、正しいものの組合せはどれか。\na 2015年のわが国の新登録患者数は、約100人である。\nb 感染経路は、主として飛沫核感染である。\nc 患者の早期発見のため、定期の健康診断が行われている。\nd 肺以外の臓器は侵されない。",["aとb","bとc","cとd","aとd"],2],
        ["次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「微生物を殺すことの総称は、[ A ] である。微生物のなかでも、病原微生物を殺すか除去して感染力をなくすことを [ B ] という。また、[ C ] とは、あらゆる微生物を殺すか除去して微生物の存在をなくすことをいう。」",["A:殺菌 ― B:防腐 ― C:滅菌","A:滅菌 ― B:消毒 ― C:殺菌","A:殺菌 ― B:消毒 ― C:滅菌","A:滅菌 ― B:防腐 ― C:殺菌"],3],
        ["美容師法施行規則に定められている消毒法に関する次の記述のうち、正しいものの組合せはどれか。\na 血液が付着していないブラシは、逆性石けんが0.1%以上である水溶液中に10分間以上浸す。\nb 血液が付着したはさみは、1cm²あたり85マイクロワット以上の紫外線を20分間以上照射する。\nc 血液が付着していないかみそりは、エタノールが76.9〜81.4%の水溶液を含ませた綿もしくはガーゼで表面を拭く。\nd 血液が付着したくしは、次亜塩素酸ナトリウムが0.1%以上である水溶液中に10分間以上浸す。",["aとb","bとc","cとd","aとd"],4],
        ["消毒・殺菌に関する次の記述のうち、誤っているものはどれか。",["同じ時間と温度であれば、湿熱は乾熱より効果が高い。","消毒薬水溶液の温度は低いほど効果がある。","消毒薬には、消毒しようとする対象によって適した濃度がある。","蒸気消毒は、煮沸消毒より長く時間がかかる。"],2],
        ["消毒用エタノールに関する次の記述のうち、誤っているものはどれか。",["逆性石けんと併用すると効果が低下する。","細菌の芽胞には効果がない。","揮発性が強いので、濃度が変化しやすい。","引火性があるので、保管や取扱い時に火気を避ける。"],1],
        ["消毒薬の希釈方法に関する次の記述の [ ] 内に入る数値のうち、正しいものはどれか。「5%次亜塩素酸ナトリウムを用いて0.1%の水溶液をつくるには、5%次亜塩素酸ナトリウム5mLに水を加えて [ ] mLの溶液とする。」",["100","250","500","1,000"],2],
        ["次の頭頸部の部位のうち、頬骨部と接しているものはどれか。",["オトガイ部","鼻部","前頸部","眼窩部"],4],
        ["骨を形づくる次の構造のうち、造血作用を持つものはどれか。",["海綿質","骨膜","赤色骨髄","緻密質"],3],
        ["次の筋のうち、眼を閉じるときに働く骨格筋はどれか。",["オトガイ筋","眼輪筋","頬筋","前頭筋"],2],
        ["次の神経のうち、中枢神経系に分類されるものはどれか。",["脳神経","脊髄","自律神経","体性神経"],2],
        ["次の耳の部分のうち、聴覚に関与しないものはどれか。",["前庭","蝸牛","耳小骨","鼓膜"],1],
        ["皮膚の構造に関する次の記述のうち、正しいものはどれか。",["表皮は、基底層、有棘層、顆粒層、角質層の4つの層からなる。","角化細胞(ケラチノサイト)は、表皮内に侵入した抗原物質(アレルゲン)を取り込む性質がある。","ランゲルハンス細胞は、約1か月かけて基底細胞から角質細胞に分化する。","色素細胞(メラノサイト)の数は、同一部位で比較すると人種によって大きく異なる。"],1],
        ["皮膚付属器官の構造に関する次の記述のうち、誤っているものはどれか。",["すべての毛に毛髄質はある。","毛は、皮膚表面に出ている部分を毛幹、皮膚の内部にある部分を毛根という。","毛は、毛母でつくられる。","毛は、ケラチンという硫黄を含んだタンパク質でできている。"],1],
        ["皮膚と皮膚付属器官の生理機能に関する次の記述のうち、誤っているものはどれか。",["ヒトでは、皮膚呼吸はほとんど行われない。","皮膚表面の脂肪膜と角質層のケラチンは、化学的刺激に対する保護の働きをしている。","皮膚表面の脂肪膜は、pHは7ぐらいなので、細菌の発育を抑制しない。","温度と関係なく精神的な感動によって手掌や足底、腋窩から急激に汗が出ることを精神性発汗という。"],3],
        ["皮膚と皮膚付属器官の保健に関する次の記述のうち、誤っているものはどれか。",["抗しわ療法として、ボツリヌス毒素による筋弛緩作用を利用することがある。","尋常性痤瘡(ニキビ)、蕁麻疹、湿疹のなかには、便秘により悪化するものもある。","男性ホルモンの増加は、脂腺の発育を促し、尋常性痤瘡や脂漏を引き起こす。","UVAは真皮にまで達し、色素細胞の働きを弱める。"],4],
        ["皮膚疾患に関する次の記述のうち、正しいものはどれか。",["脂漏性皮膚炎は、フケ症やあぶら症の人に多い皮膚炎で、紅斑や落屑がみられる。","手には、足のように白癬菌による病変は生じない。","化粧品によるアレルギー性の接触皮膚炎(カブレ)は、薄めれば発症しない。","尋常性疣贅は、真菌によってできる。"],1],
        ["溶媒に関する次の記述のうち、正しいものはどれか。",["水は、有機溶媒である。","メタノールは、化粧水の溶媒として用いられる。","イソプロパノールには、殺菌力がない。","アセトンは、エナメルリムーバーに用いられる。"],4],
        ["香粧品に含まれる有機化合物とその分類に関する次の組合せのうち、正しいものはどれか。",["セタノール ― 炭化水素","ワセリン ― ロウ","ステアリン酸 ― 脂肪酸エステル","システイン ― アミノ酸"],4],
        ["香粧品に含まれる成分とその配合目的に関する次の組合せのうち、誤っているものはどれか。",["パラアミノ安息香酸エステル ― 紫外線吸収剤","パラオキシ安息香酸エステル(パラベン) ― 防腐剤","パラフィン ― 水性原料","パラフェノールスルホン酸亜鉛 ― 収れん剤"],3],
        ["パーマ剤に含まれる成分とその配合目的に関する次の記述のうち、誤っているものはどれか。",["システインは第2剤に含まれ、酸化剤として働く。","臭素酸ナトリウムは第2剤に含まれ、酸化剤として働く。","チオグリコール酸は第1剤に含まれ、還元剤として働く。","モノエタノールアミンは第1剤に含まれ、アルカリ剤として働く。"],1],
        ["ヘアカラー製品に関する次の記述のうち、正しいものの組合せはどれか。\na 酸性染毛料は、医薬部外品に分類される。\nb 脱染剤には、強い酸化剤である過硫酸塩が用いられる。\nc 酸化染毛剤第2剤中の過酸化水素から放出される酸素により、メラニン色素の分解が起こる。\nd パラフェニレンジアミンは、もともと色を有する直接染料である。",["aとb","bとc","cとd","aとd"],2],
        ["明治時代の女性の髪型に関する次の記述のうち、誤っているものはどれか。",["洋服を着る人はごく一部で、和装に束髪という組合せが発達した。","束髪は、日本髪よりも衛生的で手入れがしやすく、日常生活に便利であった。","束髪は、上流階級や知識層の女性にまず受け入れられ、さらに働く女性に普及していった。","日本髪は、日常的には結われなくなった。"],4],
        ["次のうち、1970年代に流行した襟足あたりは長めで、段々に削いだ野性的な髪型はどれか。",["ヘップバーンカット","セシールカット","ウルフカット","マッシュルームカット"],3],
        ["次の着物のうち、一つ紋を付けることによって、女性の準礼装となるものはどれか。",["紬","江戸小紋","浴衣","紗袷"],2],
        ["下図は、頭部の基準となるポイントを表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:ゴールデンポイント ― B:トップポイント ― C:イヤーポイント","A:トップポイント ― B:ゴールデンポイント ― C:イヤーポイント","A:ゴールデンポイント ― B:トップポイント ― C:ネープポイント","A:トップポイント ― B:ゴールデンポイント ― C:ネープポイント"],2,"head_46_44"],
        ["下図は、シザーズが応用しているてこの原理での力学的な点を表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:作用点 ― B:支点 ― C:力点","A:力点 ― B:交点 ― C:作用点","A:力点 ― B:支点 ― C:作用点","A:作用点 ― B:交点 ― C:力点"],1,"scissors_46_45"],
        ["次のうち、スキャルプマッサージ手技の打法に該当しないものはどれか。",["タッピング","ハッキング","カッピング","ストローキング"],4],
        ["ヘアデザインに関する次の記述のうち、誤っているものはどれか。",["幾何学的錯視は大きく分類すると、距離・大きさに関する錯視と角度・方向に関する錯視の2つに分けられる。","ドンディスによる形の3つの基本形は、正方形・円・正五角形である。","面を構成する要素として、形・大きさ・テクスチャーがある。","ヘアスタイルにおけるテクスチャーは、ストレートかウェーブもしくはラフな表面の仕上り感である。"],2],
        ["下図は、パネルと頭皮の角度を表したものである。ダウンステムに該当するものはどれか。",["(1)","(2)","(3)","(4)"],4,"stem_46_48"],
        ["パーマネントウェーブ技術に関する次の記述のうち、正しいものはどれか。",["中間リンスは、役割を終えた第2剤を洗い流すために行う。","ロッドアウト後のプレーンリンスは、ぬるま湯で手早く簡単にすませる。","アフターリンスの目的の1つには、酸性成分を中和し毛髪を膨潤させるということがある。","アフターリンスの目的の1つには、施術中に脱脂した油分をヘアトリートメントで補うということがある。"],4],
        ["次のピンカールのうち、ストランドの根元から巻きはじめ、根元に強いカールがあらわれるものはどれか。",["スカルプチュアカール","リフトカール","メイポールカール","クロッキノールカール"],1],
        ["色の基本に関する次の記述のうち、誤っているものはどれか。",["プライマリーカラー(色の三原色)とは、赤、黄、青の3色である。","明度は色の明るさのことで、彩度は色の鮮やかさのことである。","明度と彩度が組み合わさった調子を色のトーンという。","プライマリーカラーを2色ずつ混合したものをカラーサークル(色相環)という。"],4],
        ["マニキュア技術に関する次の記述のうち、正しいものはどれか。",["爪が長い場合は、キューティクルニッパーで爪をカットした後、ファイリングを行う。","ファイリングは、ストレスポイントからセンターに向け、往復しながら行う。","はみ出したカラーエナメルは、コットンスティックにエナメルリムーバーを含ませて拭き取る。","ベースコート、カラーエナメルの順に塗布した後に油分処理をし、仕上げにトップコートを塗布する。"],3],
        ["アイブロウメイクアップに関する次の記述のうち、正しいものはどれか。",["芯のかたいアイブロウペンシルを用いて、1本1本の眉毛を植えこむように描くとよい。","眉山は、黒目の中央と外側の延長線の間が基本である。","ドローイングは、アイシャドーで眉毛の部分に陰を付け、自然な仕上がりにすることである。","アーチ形の眉は、眉頭から眉尻にかけて直線的に描くとよい。"],1],
        ["まつ毛エクステンションに関する次の記述のうち、正しいものはどれか。",["エクステンションは、まつ毛の成長期初期の装着が最適である。","エクステンションは、地肌から3mm以上離して接着する。","エクステンションは、通常2〜3週間持つ。","エクステンションを装着しやすいように、眼鏡の代わりにコンタクトレンズの使用を勧める。"],3],
        ["着物に関する次の記述のうち、誤っているものはどれか。",["男物、女物ともに、身八つ口がある。","女物の身丈は、着丈(首より下の長さ)よりも長く仕立てられている。","男物の身丈は、着丈で仕立てられている。","前身ごろを合わせたときに上になるほうの身ごろ(向かって右側)を上前という。"],1]

      45: [
        ["次のうち、都道府県知事、保健所設置市の市長又は特別区の区長が行う事務に含まれないものはどれか。",["美容所の開設届の受理","美容所の構造設備の検査確認","美容所について講じなければならない衛生措置の実施状況の立入検査","美容師免許証の交付"],4],
        ["美容師の免許及び業務に関する次の記述のうち、誤っているものはどれか。",["美容師試験に合格しても、美容師名簿に登録されなければ美容師の免許は与えられない。","美容師が美容の業を行う場合の衛生上必要な措置については、美容所が所在する都道府県等の条例にも従う必要がある。","外国の美容師の資格を持っている者は、日本の美容師の免許がなくても日本国内で美容を業とすることができる。","染毛は、理容師か美容師でなければ業として行うことはできない。"],3],
        ["美容師の免許に関する次の記述のうち、正しいものはどれか。",["美容師試験に合格しても、かつて無免許で美容の業を行った者には美容師の免許が与えられないことがある。","免許の申請にあたっては、添付書類として結核及び伝染性皮膚疾患の有無に関する医師の診断書が必要である。","免許を受けた者は、10年ごとに更新の手続きを行わなければならない。","免許証を紛失した場合には、住所地の都道府県知事に免許証の再交付を申請しなければならない。"],1],
        ["次のうち、美容師の業務停止処分の対象として誤っているものはどれか。",["美容師法の政令又は都道府県等の条例で定める特別の事情がないにもかかわらず、美容所以外の場所で美容の業をした場合","免許証を破り、汚し、又は紛失した場合","美容師法等で定める衛生上必要な措置を講じなかった場合","伝染性の疾病にかかり、その就業が公衆衛生上不適当と認められる場合"],2],
        ["美容所に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「美容所の開設にあたっては、事前に [ A ] が必要とされ、美容所の [ B ] について検査確認を受けた後でなければ使用してはならず、これに反した場合には、[ C ] となることがある。」",["A:許可 ― B:器具機材 ― C:罰金刑","A:許可 ― B:構造設備 ― C:閉鎖処分","A:届出 ― B:器具機材 ― C:閉鎖処分","A:届出 ― B:構造設備 ― C:罰金刑"],4],
        ["次のうち、美容所の開設者が美容師法に基づく変更の届出を行う必要がないものはどれか。",["管理美容師が変更となった場合","美容師が退職した場合","美容師を新たに雇用した場合","美容所の営業日が変更となった場合"],4],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に関する次の記述のうち、正しいものはどれか。",["美容業については、1つの都道府県に複数の生活衛生同業組合を設立することができる。","生活衛生同業組合は、施術料金を統一するための標準営業約款を定めることができる。","生活衛生同業組合は、組合員に対する設備改善の資金のあっせんを行うことができる。","生活衛生同業組合は、営利を目的として設立された組織である。"],3],
        ["労働安全衛生法に関する次の記述のうち、誤っているものはどれか。",["小規模な事業者には、労働者に対する医師による健康診断の実施は義務付けられていない。","事業者には、特定の伝染性の疾病にかかった者の就業を禁止することが義務付けられている。","事業者には、労働者の健康に配慮して、労働者の従事する作業を適切に管理する努力が求められている。","事業者には、労働者に対する健康教育、健康相談など健康の保持増進のための措置を実施する努力が求められている。"],1],
        ["国民年金制度に関する次の記述のうち、誤っているものはどれか。",["老齢基礎年金の給付額は、保険料を納付した期間によって異なる。","障害基礎年金の給付額は、障害の程度にかかわらず、すべて同額である。","国民年金の保険料に上乗せした付加保険料を納付することで、付加年金が支給される制度が設けられている。","所得が低いなど、保険料を納めることが困難な場合に保険料の免除や納付猶予となる制度が設けられている。"],2],
        ["医療保険に関する次の記述のうち、誤っているものはどれか。",["健康保険における保険者(運営主体)は、全国健康保険協会と健康保険組合である。","75歳未満の美容所の従業者で健康保険などの被用者保険に加入していない者は、国民健康保険の対象となる。","医療保険の療養の給付における一部負担金は、年齢にかかわらず、すべてかかった医療費の3割である。","健康保険の出産育児一時金は、被保険者や一定要件に該当する扶養家族が出産したときに支給される。"],3],
        ["出生と死亡に関する次の統計指標のうち、2015年の数値が1980年より増加しているものはどれか。",["出生率","合計特殊出生率","乳児死亡率","粗死亡率"],4],
        ["わが国の平均寿命と死亡率に関する次の記述のうち、正しいものはどれか。",["平均寿命が男女とも50歳を超えたのは、1935年である。","平均寿命は、2015年には男性87.05歳、女性80.79歳となった。","1981年以降は、主要死因別死亡率の第1位は、がんである。","近年、がんの部位別年齢調整死亡率の第1位は、男女ともに肺がんである。"],3],
        ["喫煙や飲酒に関する次の記述のうち、誤っているものはどれか。",["喫煙者では、肺がん、膀胱がんなどのほか、心疾患の危険性も増す。","わが国の女性の喫煙者率は、他の先進諸国に比べて高率である。","わが国のアルコール消費量は、増加傾向を示していたが、平成に入るとやがて減少傾向に転じた。","飲酒に起因する問題には、アルコール依存症、肝疾患などの健康問題や労働災害、犯罪などの社会問題が含まれる。"],2],
        ["次の文章の [ ] 内に入る数値の組合せのうち、正しいものはどれか。「理容所及び美容所における衛生管理要領では、美容所の温度は [ A ] ℃が望ましいとされ、湿度は相対湿度 [ B ] %が望ましいとされている。」",["A:10〜15 ― B:10〜30","A:10〜15 ― B:40〜70","A:17〜28 ― B:10〜30","A:17〜28 ― B:40〜70"],4],
        ["アタマジラミに関する次の記述のうち、誤っているものはどれか。",["幼虫は吸血しない。","毛髪に卵を産む。","タオルや帽子を介して感染することがある。","主として保育園児や幼稚園児、低学年児童に発生する。"],1],
        ["感染症と感染経路に関する次の記述のうち、誤っているものはどれか。",["百日せきは、蚊を介して感染する。","結核は、飛沫核を介して感染する。","B型肝炎は、血液を介して感染する。","コレラは、食物や水を介して感染する。"],1],
        ["微生物に関する次の記述のうち、正しいものの組合せはどれか。\na 細菌のなかには、酸素があると発育できないものがある。\nb ウイルスは、タンパク質の殻の中にDNAとRNAの両方の核酸をもっている。\nc 芽胞をもつ細菌は、熱や乾燥に対する抵抗力がない。\nd ウイルスは、しばしば変異を起こす。",["aとb","bとc","cとd","aとd"],4],
        ["感染と発病に関する次の記述のうち、誤っているものはどれか。",["感染とは、病原体が人体の組織に侵入して増殖することである。","病原体が人体に付着すると必ず感染する。","発病とは、感染した人体の組織や臓器に病的な変化が起きることである。","感染しても発病しないこともある。"],2],
        ["予防接種法に基づく予防接種に関する次の記述のうち、誤っているものはどれか。",["感染症に対する免疫をつけたり、免疫を強くしたりするためにワクチンを接種することをいう。","自らが感染症にかかりにくくなるだけではなく、社会全体で流行を防ぐ効果もある。","対象疾病が異なっても、接種対象年齢及び接種回数は同じである。","定期に行うものと臨時に行うものがある。"],3],
        ["麻しんに関する次の記述のうち、誤っているものはどれか。",["別名、はしかともいう。","潜伏期は2〜3日である。","病原体はウイルスである。","発疹をともなう感染症である。"],2],
        ["美容所における衛生管理に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「微生物を殺すことの総称は [ A ] である。生きている微生物が存在しない状態にすることを [ B ] という。微生物の中でも病原微生物を死滅させるか、発育や増殖を止めて感染力をなくすことを [ C ] という。美容所で求められるのは [ C ] である。」",["A:滅菌 ― B:消毒 ― C:殺菌","A:殺菌 ― B:消毒 ― C:滅菌","A:滅菌 ― B:殺菌 ― C:消毒","A:殺菌 ― B:滅菌 ― C:消毒"],4],
        ["紫外線消毒に関する次の記述のうち、誤っているものはどれか。",["紫外線消毒器に入れる器具は、互いに重なり合わないように配置する。","紫外線は、目や皮膚に直接照射しても害はない。","血液が付着した器具の消毒には適していない。","紫外線灯は、使用にともない出力が低下するので、定期的な交換が必要である。"],2],

    // 問題番号(1〜55)から公式5科目へ自動分類する関数
    function getCategoryIdByQNum(num) {
      if (num <= 10) return 'law';
      if (num <= 25) return 'hygiene';
      if (num <= 35) return 'health';
      if (num <= 40) return 'phys_chem';
      return 'theory';
    }

    // 問題の解説を自動生成
    function generateExplanation(session, qNum, qText, options, correctIdxOneBased) {
      const idx = correctIdxOneBased - 1;
      const correctOptText = options[idx] || '';
      let specialNote = '';
      if (session === 49 && qNum === 20) {
        specialNote = '【公式採点注記】第49回問20は、梅毒(2)だけでなく麻しんウイルス(4)も経胎盤感染の可能性を排除できないため、(2)と(4)のいずれも正解として採点されました。\n';
      } else if (session === 49 && qNum === 33) {
        specialNote = '【公式採点注記】第49回問33は、公式試験では採点対象から除外（全員正解扱い）となった問題です。脂肪膜の保護作用は主に「化学的刺激・微生物」に対するものです。\n';
      } else if (session === 49 && qNum === 37) {
        specialNote = '【公式採点注記】第49回問37は、公式試験において(2)と(3)のいずれも正解として採点されました。\n';
      }

      const isWrongSearch = qText.includes('誤っているもの') || qText.includes('該当しないもの') || qText.includes('含まれないもの') || qText.includes('ないものはどれか');
      const leadText = isWrongSearch
        ? `正解は（${correctIdxOneBased}）「${correctOptText}」です（これが誤りの記述／非該当項目です）。`
        : `正解は（${correctIdxOneBased}）「${correctOptText}」です。`;

      const otherRights = !isWrongSearch
        ? '他の選択肢の誤りポイントと比較して、正しい定義・数値・組合せを確実に押さえておきましょう。'
        : 'この選択肢のどこが誤っているのか（数値・主語・対象の違い）を確認し、残りの3つの正しい記述も知識として定着させましょう。';

      return `${specialNote}${leadText}\n${otherRights}`;
    }

    // 全550問＋管理者が追加・訂正した問題を結合して構築
    function buildAllQuestions() {
      const list = [];
      EXAM_PDF_LIST.forEach(exam => {
        const s = exam.session;
        const rawList = RAW_EXAM_DATA[s] || [];
        rawList.forEach((item, index) => {
          const qNum = index + 1;
          const qId = `q${s}_${String(qNum).padStart(2, '0')}`;
          const [qText, options, correctOne, svgKey] = item;
          const baseObj = {
            id: qId,
            session: s,
            questionNumber: qNum,
            category: getCategoryIdByQNum(qNum),
            question: qText,
            options: [...options],
            correctIndex: correctOne - 1,
            alsoCorrectIndex: (s === 49 && qNum === 20) ? 3 : (s === 49 && qNum === 37) ? 1 : null,
            svgKey: svgKey || null,
            explanation: generateExplanation(s, qNum, qText, options, correctOne),
            isCustomAdded: false,
            isModified: false
          };
          if (memoryStore.customOverrides[qId]) {
            list.push({ ...baseObj, ...memoryStore.customOverrides[qId], isModified: true });
          } else {
            list.push(baseObj);
          }
        });
      });

      // 管理者が新規追加した問題を追加
      Object.values(memoryStore.addedQuestions).forEach(addedQ => {
        list.push({
          ...addedQ,
          isCustomAdded: true
        });
      });

      return list;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // クラウドから全学生アカウントをリアルタイム購読
    function subscribeAllStudentAccounts() {
      if (!db || !fbUser) return;
      const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'student_accounts');
      onSnapshot(colRef, (snap) => {
        snap.forEach(d => {
          memoryStore.accounts[d.id] = d.data();
        });
        saveLocalStore();
        if (state.studentAccount && memoryStore.accounts[state.studentAccount.studentId]) {
          const myData = memoryStore.accounts[state.studentAccount.studentId];
          try { state.studentProgress = myData.progress ? JSON.parse(myData.progress) : {}; } catch(e){}
          try { state.studentStickies = myData.stickies ? JSON.parse(myData.stickies) : {}; } catch(e){}
          try { state.examLogs = myData.examLogs ? JSON.parse(myData.examLogs) : []; } catch(e){}
        }
        render();
      }, (err) => console.warn("Accounts sync warning:", err));
    }

    function subscribeCustomQuestions() {
      if (!db || !fbUser) return;
      const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'custom_questions');
      onSnapshot(colRef, (snap) => {
        snap.forEach(d => {
          const data = d.data();
          if (data.isCustomAdded) {
            memoryStore.addedQuestions[d.id] = data;
          } else {
            memoryStore.customOverrides[d.id] = data;
          }
        });
        saveLocalStore();
        render();
      }, (err) => console.warn("Custom questions sync warning:", err));
    }

    async function saveStudentDataToCloud() {
      if (!state.studentAccount) return;
      const id = state.studentAccount.studentId;
      const existing = memoryStore.accounts[id] || {};
      const payload = {
        ...existing,
        studentId: id,
        name: state.studentAccount.name,
        progress: JSON.stringify(state.studentProgress),
        stickies: JSON.stringify(state.studentStickies),
        examLogs: JSON.stringify(state.examLogs),
        updatedAt: Date.now()
      };
      memoryStore.accounts[id] = payload;
      saveLocalStore();
      if (db && fbUser) {
        try {
          const ref = doc(db, 'artifacts', appId, 'public', 'data', 'student_accounts', id);
          await setDoc(ref, payload, { merge: true });
        } catch (e) {
          console.warn("Save fallback:", e);
        }
      }

    // =========================================================
    // 6. 全学生データからの「リアルタイム問題別正答率」「参加人数」「順位・合格判定」計算
    // =========================================================
    function computeGlobalMetrics(allQuestions) {
      const studentList = Object.values(memoryStore.accounts);
      const totalStudentsCount = studentList.length;

      const questionRealtimeStats = {};
      allQuestions.forEach(q => {
        questionRealtimeStats[q.id] = { attempts: 0, correct: 0, rate: null, studentCount: 0 };
      });

      const studentRankings = studentList.map(st => {
        let prog = {};
        let logs = [];
        let stickies = {};
        try { prog = st.progress ? JSON.parse(st.progress) : {}; } catch(e){}
        try { logs = st.examLogs ? JSON.parse(st.examLogs) : []; } catch(e){}
        try { stickies = st.stickies ? JSON.parse(st.stickies) : {}; } catch(e){}

        let mastered = 0;
        let review = 0;
        let totalAttempts = 0;
        let totalCorrect = 0;

        const catScores = {};
        CATEGORIES.forEach(c => { catScores[c.id] = { mastered: 0, review: 0, attempts: 0, correct: 0, accuracy: 0 }; });

        Object.entries(prog).forEach(([qId, p]) => {
          if (questionRealtimeStats[qId]) {
            questionRealtimeStats[qId].attempts += (p.attempts || 0);
            questionRealtimeStats[qId].correct += (p.correctCount || 0);
            if ((p.attempts || 0) > 0) questionRealtimeStats[qId].studentCount += 1;
          }
          totalAttempts += (p.attempts || 0);
          totalCorrect += (p.correctCount || 0);
          if (p.status === 'mastered') mastered += 1;
          else if (p.status === 'review') review += 1;

          const qObj = allQuestions.find(x => x.id === qId);
          if (qObj && catScores[qObj.category]) {
            catScores[qObj.category].attempts += (p.attempts || 0);
            catScores[qObj.category].correct += (p.correctCount || 0);
            if (p.status === 'mastered') catScores[qObj.category].mastered += 1;
            else if (p.status === 'review') catScores[qObj.category].review += 1;
          }
        });

        CATEGORIES.forEach(c => {
          const cs = catScores[c.id];
          cs.accuracy = cs.attempts > 0 ? Math.round((cs.correct / cs.attempts) * 100) : 0;
        });

        const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
        const powerScore = accuracy * 10 + mastered * 3;

        return {
          studentId: st.studentId,
          name: st.name || st.studentId,
          password: st.password || 'pass',
          updatedAt: st.updatedAt || st.createdAt || Date.now(),
          mastered,
          review,
          attemptedCount: mastered + review,
          totalAttempts,
          totalCorrect,
          accuracy,
          powerScore,
          catScores,
          progressMap: prog,
          stickiesMap: stickies,
          examLogs: logs
        };
      });

      Object.keys(questionRealtimeStats).forEach(qId => {
        const qs = questionRealtimeStats[qId];
        if (qs.attempts > 0) {
          qs.rate = Math.round((qs.correct / qs.attempts) * 100);
        }
      });

      studentRankings.sort((a, b) => b.powerScore - a.powerScore || b.accuracy - a.accuracy);
      studentRankings.forEach((s, idx) => { s.rank = idx + 1; });

      const avgAccuracy = totalStudentsCount > 0
        ? Math.round(studentRankings.reduce((acc, s) => acc + s.accuracy, 0) / totalStudentsCount)
        : 0;
      const avgMastered = totalStudentsCount > 0
        ? Math.round(studentRankings.reduce((acc, s) => acc + s.mastered, 0) / totalStudentsCount)
        : 0;

      return {
        totalStudentsCount,
        questionRealtimeStats,
        studentRankings,
        avgAccuracy,
        avgMastered
      };
    }

    function evaluatePassCriteria(overallAccuracy, mastered, totalAttempts, zeroScoreCategoryCount) {
      if (totalAttempts === 0) {
        return {
          passGrade: '未判定',
          passProbability: 20,
          passComment: 'まだ演習データがありません。まずは過去問を解いて実力を診断しましょう！',
          passBadgeColor: 'bg-slate-500'
        };
      } else if (overallAccuracy >= 80 && mastered >= 10 && zeroScoreCategoryCount === 0) {
        return {
          passGrade: 'S判定 (合格安全圏)',
          passProbability: 95,
          passComment: '素晴らしい成績です！60%の合格基準を大きく上回っています。要復習ループで完全定着を維持しましょう。',
          passBadgeColor: 'bg-emerald-600'
        };
      } else if (overallAccuracy >= 70 && zeroScoreCategoryCount === 0) {
        return {
          passGrade: 'A判定 (合格有望圏)',
          passProbability: 85,
          passComment: '合格ライン(60%)を安定してクリアしています！苦手科目の取りこぼしをループ復習で潰せば万全です。',
          passBadgeColor: 'bg-teal-600'
        };
      } else if (overallAccuracy >= 60 && zeroScoreCategoryCount === 0) {
        return {
          passGrade: 'B判定 (合格基準到達)',
          passProbability: 68,
          passComment: '国家試験の合格基準(60%)に到達しています！本番で確実に合格できるよう、正答率75%を目指して反復しましょう。',
          passBadgeColor: 'bg-blue-600'
        };
      } else if (overallAccuracy >= 48) {
        return {
          passGrade: 'C判定 (あと一歩)',
          passProbability: 45,
          passComment: `合格基準(60%)まであと+${Math.max(1, 60 - overallAccuracy)}%です！「要復習ループ」を回して間違えた問題を定着させましょう。`,
          passBadgeColor: 'bg-amber-500'
        };
      } else {
        return {
          passGrade: 'D判定 (要強化)',
          passProbability: 25,
          passComment: '基礎知識の定着が必要です。解説をじっくり読み、付箋機能と「要復習ループ」で1問ずつ確実に覚えましょう！',
          passBadgeColor: 'bg-rose-600'
        };
      }
    }

    // 学生個人の統計＋合格可能性判定の算出
    function computeStudentStats(allQuestions, globalMetrics) {
      let mastered = 0, review = 0, unattempted = 0;
      let totalAttempts = 0, totalCorrect = 0;

      const categoryStats = {};
      CATEGORIES.forEach(c => {
        categoryStats[c.id] = { total: 0, mastered: 0, review: 0, unattempted: 0, attempts: 0, correct: 0, accuracy: 0 };
      });

      const sessionStats = {};
      EXAM_PDF_LIST.forEach(e => {
        sessionStats[e.session] = { total: 0, mastered: 0, review: 0, unattempted: 0 };
      });

      allQuestions.forEach(q => {
        const p = state.studentProgress[q.id];
        const cat = categoryStats[q.category];
        const ses = sessionStats[q.session];
        if (cat) cat.total++;
        if (ses) ses.total++;

        if (!p) {
          unattempted++;
          if (cat) cat.unattempted++;
          if (ses) ses.unattempted++;
        } else {
          totalAttempts += p.attempts || 0;
          totalCorrect += p.correctCount || 0;
          if (cat) {
            cat.attempts += p.attempts || 0;
            cat.correct += p.correctCount || 0;
          }
          if (p.status === 'mastered') {
            mastered++;
            if (cat) cat.mastered++;
            if (ses) ses.mastered++;
          } else {
            review++;
            if (cat) cat.review++;
            if (ses) ses.review++;
          }
        }
      });

      let zeroScoreCategoryCount = 0;
      CATEGORIES.forEach(c => {
        const cs = categoryStats[c.id];
        cs.accuracy = cs.attempts > 0 ? Math.round((cs.correct / cs.attempts) * 100) : 0;
        if (cs.attempts > 0 && cs.correct === 0) zeroScoreCategoryCount++;
      });

      const totalQuestions = allQuestions.length;
      const masteryRate = totalQuestions > 0 ? Math.round((mastered / totalQuestions) * 100) : 0;
      const overallAccuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
      const stickyCount = Object.keys(state.studentStickies).length;

      const myRankObj = globalMetrics.studentRankings.find(s => s.studentId === state.studentAccount?.studentId);
      const myRank = myRankObj ? myRankObj.rank : globalMetrics.totalStudentsCount;
      const topPercent = globalMetrics.totalStudentsCount > 0
        ? Math.max(1, Math.round((myRank / globalMetrics.totalStudentsCount) * 100))
        : 50;

      const diffFromAvg = overallAccuracy - globalMetrics.avgAccuracy;
      const deviationValue = Math.min(78, Math.max(32, Math.round(50 + diffFromAvg * 0.6 + (mastered - globalMetrics.avgMastered) * 0.15)));

      const passEval = evaluatePassCriteria(overallAccuracy, mastered, totalAttempts, zeroScoreCategoryCount);

      return {
        totalQuestions,
        mastered,
        review,
        unattempted,
        masteryRate,
        totalAttempts,
        totalCorrect,
        overallAccuracy,
        stickyCount,
        categoryStats,
        sessionStats,
        myRank,
        topPercent,
        deviationValue,
        ...passEval
      };
    }

      // =====================================================
      // 演習スタート関連
      // =====================================================
      startQuiz(mode, filterValue) {
        const allQ = buildAllQuestions();
        let targetQuestions = [];
        let title = '';
        let sessionLabel = '';

        if (mode === 'session_all') {
          const sesNum = Number(filterValue);
          targetQuestions = allQ.filter(q => q.session === sesNum).sort((a, b) => a.questionNumber - b.questionNumber);
          title = `第${sesNum}回 国家試験 全${targetQuestions.length}問演習`;
          sessionLabel = `第${sesNum}回`;
        } else if (mode === 'category') {
          const catObj = CATEGORIES.find(c => c.id === filterValue);
          targetQuestions = allQ.filter(q => q.category === filterValue);
          title = `${catObj ? catObj.name : ''} 集中ループ (${targetQuestions.length}問)`;
          sessionLabel = catObj ? catObj.name : '科目別';
        } else if (mode === 'review_loop') {
          targetQuestions = allQ.filter(q => state.studentProgress[q.id]?.status === 'review');
          title = `要復習ループ演習 (${targetQuestions.length}問)`;
          sessionLabel = '要復習ループ';
        } else if (mode === 'sticky_loop') {
          targetQuestions = allQ.filter(q => {
            const st = state.studentStickies[q.id];
            if (!st) return false;
            return filterValue === 'all' ? true : st.color === filterValue;
          });
          title = `付箋問題ループ演習 (${targetQuestions.length}問)`;
          sessionLabel = '付箋ループ';
        } else if (mode === 'single') {
          const qObj = allQ.find(q => q.id === filterValue);
          if (qObj) {
            targetQuestions = [qObj];
            title = `第${qObj.session}回 問${qObj.questionNumber} ピンポイント演習`;
            sessionLabel = `第${qObj.session}回`;
          }
        } else if (mode === 'filtered_custom') {
          targetQuestions = getFilteredQuestions(allQ);
          title = `絞り込み問題演習 (${targetQuestions.length}問)`;
          sessionLabel = 'カスタム演習';
        }

        if (!targetQuestions.length) {
          showToast('対象となる問題がありません');
          return;
        }

        state.quizSession = {
          title,
          sessionLabel,
          mode,
          questions: targetQuestions,
          currentIndex: 0,
          answers: {}, // { [qId]: { selectedIdx, isCorrect } }
          isFinished: false
        };
        state.showJumpGrid = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      answerQuestion(selectedIdx) {
        const qs = state.quizSession;
        if (!qs || qs.isFinished) return;
        const currentQ = qs.questions[qs.currentIndex];
        if (!currentQ) return;
        if (qs.answers[currentQ.id] !== undefined) return;

        const isCorrect = (selectedIdx === currentQ.correctIndex) ||
          (currentQ.alsoCorrectIndex !== null && currentQ.alsoCorrectIndex !== undefined && selectedIdx === currentQ.alsoCorrectIndex);

        qs.answers[currentQ.id] = { selectedIdx, isCorrect };

        const prev = state.studentProgress[currentQ.id] || { status: 'unattempted', attempts: 0, correctCount: 0 };
        const nextAttempts = (prev.attempts || 0) + 1;
        const nextCorrect = (prev.correctCount || 0) + (isCorrect ? 1 : 0);
        const nextStatus = isCorrect ? 'mastered' : 'review';

        state.studentProgress[currentQ.id] = {
          status: nextStatus,
          attempts: nextAttempts,
          correctCount: nextCorrect,
          lastAnsweredAt: Date.now()
        };

        saveStudentDataToCloud();
        render();
      },

      nextQuestion() {
        const qs = state.quizSession;
        if (!qs) return;
        if (qs.currentIndex < qs.questions.length - 1) {
          qs.currentIndex++;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        } else {
          this.finishQuizSession();
        }
      },

      prevQuestion() {
        const qs = state.quizSession;
        if (!qs || qs.currentIndex <= 0) return;
        qs.currentIndex--;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      jumpToQuestion(idx) {
        const qs = state.quizSession;
        if (!qs || idx < 0 || idx >= qs.questions.length) return;
        qs.currentIndex = idx;
        state.showJumpGrid = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      toggleJumpGrid() {
        state.showJumpGrid = !state.showJumpGrid;
        render();
      },

      finishQuizSession() {
        const qs = state.quizSession;
        if (!qs) return;
        qs.isFinished = true;
        const answeredCount = Object.keys(qs.answers).length;
        const correctCount = Object.values(qs.answers).filter(a => a.isCorrect).length;
        if (answeredCount > 0) {
          state.examLogs.unshift({
            date: Date.now(),
            score: correctCount,
            total: qs.questions.length,
            answered: answeredCount,
            mode: qs.title,
            session: qs.sessionLabel
          });
          if (state.examLogs.length > 30) state.examLogs = state.examLogs.slice(0, 30);
          saveStudentDataToCloud();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      retryWrongInSession() {
        const qs = state.quizSession;
        if (!qs) return;
        const wrongQs = qs.questions.filter(q => {
          const ans = qs.answers[q.id];
          return !ans || !ans.isCorrect;
        });
        if (!wrongQs.length) {
          showToast('全問正解しています！素晴らしい！');
          return;
        }
        state.quizSession = {
          title: `${qs.sessionLabel} 間違えた問題ループ (${wrongQs.length}問)`,
          sessionLabel: qs.sessionLabel,
          mode: 'retry_wrong',
          questions: wrongQs,
          currentIndex: 0,
          answers: {},
          isFinished: false
        };
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      closeQuizSession() {
        state.quizSession = null;
        state.showJumpGrid = false;
        render();
      },

        const stId = state.adminSelectedStudentId;
        const newPw = state.adminNewPasswordInput.trim();
        if (!stId || !newPw) {
          showToast('新しいパスワードを入力してください');
          return;
        }
        const acct = memoryStore.accounts[stId];
        if (!acct) return;
        acct.password = newPw;
        acct.updatedAt = Date.now();
        await saveAccountObjectToCloud(acct);
        showToast(`${acct.name} さんのパスワードを「${newPw}」に再発行しました`);
        render();
      },

      setAdminQSessionFilter(val) {
        state.adminQSessionFilter = String(val);
        render();
      },
      setAdminQCategoryFilter(val) {
        state.adminQCategoryFilter = val;
        render();
      },
      setAdminQSort(val) {
        state.adminQSort = val;
        render();
      },

      openAdminEditQuestionModal(qId) {
        const allQ = buildAllQuestions();
        const q = allQ.find(x => x.id === qId);
        if (!q) return;
        state.adminEditingQuestion = {
          id: q.id,
          session: q.session,
          questionNumber: q.questionNumber,
          category: q.category,
          question: q.question,
          opt1: q.options[0] || '',
          opt2: q.options[1] || '',
          opt3: q.options[2] || '',
          opt4: q.options[3] || '',
          correctOne: (q.correctIndex || 0) + 1,
          explanation: q.explanation || '',
          isCustomAdded: !!q.isCustomAdded
        };
        render();
      },
      closeAdminEditQuestionModal() {
        state.adminEditingQuestion = null;
        render();
      },
      updateEditingQuestionField(field, val) {
        if (!state.adminEditingQuestion) return;
        state.adminEditingQuestion[field] = val;
      },
      async saveEditedQuestion(e) {
        if (e) e.preventDefault();
        const eq = state.adminEditingQuestion;
        if (!eq) return;
        const qText = eq.question.trim();
        const options = [eq.opt1.trim(), eq.opt2.trim(), eq.opt3.trim(), eq.opt4.trim()];
        if (!qText || options.some(o => !o)) {
          showToast('問題文と4つの選択肢をすべて入力してください');
          return;
        }
        const correctOne = Number(eq.correctOne) || 1;
        const payload = {
          id: eq.id,
          session: Number(eq.session),
          questionNumber: Number(eq.questionNumber),
          category: eq.category,
          question: qText,
          options,
          correctIndex: correctOne - 1,
          explanation: eq.explanation.trim() || generateExplanation(Number(eq.session), Number(eq.questionNumber), qText, options, correctOne),
          isCustomAdded: !!eq.isCustomAdded,
          updatedAt: Date.now()
        };
        await saveCustomQuestionToCloud(eq.id, payload);
        state.adminEditingQuestion = null;
        showToast(`第${payload.session}回 問${payload.questionNumber} の問題・正答を訂正保存しました`);
        render();
      },

      updateNewQuestionField(field, val) {
        state.newQuestionDraft[field] = val;
      },
      async submitNewQuestion(e) {
        if (e) e.preventDefault();
        const d = state.newQuestionDraft;
        const qText = d.question.trim();
        const options = [d.opt1.trim(), d.opt2.trim(), d.opt3.trim(), d.opt4.trim()];
        if (!qText || options.some(o => !o)) {
          showToast('問題文と選択肢(1)〜(4)をすべて入力してください');
          return;
        }
        const sesNum = Number(d.session) || 54;
        const allQ = buildAllQuestions();
        const existingInSession = allQ.filter(q => q.session === sesNum);
        const nextQNum = existingInSession.length > 0
          ? Math.max(...existingInSession.map(q => q.questionNumber)) + 1
          : 56;
        const newId = `q${sesNum}_custom_${Date.now()}`;
        const correctOne = Number(d.correctOne) || 1;

        const payload = {
          id: newId,
          session: sesNum,
          questionNumber: nextQNum,
          category: d.category || 'law',
          question: qText,
          options,
          correctIndex: correctOne - 1,
          alsoCorrectIndex: null,
          svgKey: null,
          explanation: d.explanation.trim() || generateExplanation(sesNum, nextQNum, qText, options, correctOne),
          isCustomAdded: true,
          createdAt: Date.now()
        };

        await saveCustomQuestionToCloud(newId, payload);
        state.newQuestionDraft = {
          session: sesNum,
          category: d.category,
          question: '',
          opt1: '',
          opt2: '',
          opt3: '',
          opt4: '',
          correctOne: 1,
          explanation: ''
        };
        state.adminQSessionFilter = String(sesNum);
        state.adminTab = 'questions';
        showToast(`第${sesNum}回 問${nextQNum} として新規問題を追加しました！`);
        render();
      }
    };

    function getFilteredQuestions(allQuestions) {
      return allQuestions.filter(q => {
        if (state.selectedSessionFilter !== 'all' && String(q.session) !== String(state.selectedSessionFilter)) return false;
        if (state.selectedCategoryFilter !== 'all' && q.category !== state.selectedCategoryFilter) return false;
        if (state.searchQuery.trim() !== '') {
          const kw = state.searchQuery.trim().toLowerCase();
          const inQ = q.question.toLowerCase().includes(kw);
          const inOpt = q.options.some(o => o.toLowerCase().includes(kw));
          if (!inQ && !inOpt) return false;
        }
        return true;
      }).sort((a, b) => (b.session - a.session) || (a.questionNumber - b.questionNumber));
    }

      const reviewQuestions = allQuestions.filter(q => state.studentProgress[q.id]?.status === 'review');

                ${reviewQuestions.map(q => `
                  <div class="p-3 rounded-2xl bg-rose-50/60 border border-rose-200 flex items-center justify-between gap-3">
                    <div class="min-w-0">
                      <div class="flex items-center gap-2">
                        <span class="text-xs font-black text-rose-700">第${q.session}回 問${q.questionNumber}</span>

            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">

                <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
                  <i data-lucide="bookmark" class="w-5 h-5 text-amber-500"></i> マイ付箋ノート：${stickyQuestions.length}問

                <p class="text-xs text-slate-500">色分け付箋と自分だけの暗記メモを一覧管理できます</p>
              </div>
              <button type="button" onclick="window.appActions.startQuiz('sticky_loop', '${state.selectedStickyFilter}')"
                class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs shadow-sm transition">

            <div class="flex items-center gap-2 mb-3">
              <button type="button" onclick="window.appActions.setStickyFilter('all')"
                class="px-3 py-1.5 rounded-xl text-xs font-bold ${state.selectedStickyFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">

          <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
            <h3 class="text-base font-black text-slate-900 mb-1">5科目別 正答率＆定着カルテ（合格基準：総得点60%以上・無得点科目なし）</h3>
            <p class="text-xs text-slate-500 mb-4">各科目の正答率が60%を超えているか確認しましょう</p>
            <div class="space-y-3">
              ${CATEGORIES.map(c => {
                const cs = stats.categoryStats[c.id];
                const passLineMet = cs.accuracy >= 60;
                return `
                  <div class="p-3.5 rounded-2xl border border-slate-200 bg-slate-50/50">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <div class="flex items-center gap-2">
                        <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold ${c.lightBg} ${c.text}">${c.name}</span>
                        <span class="text-xs text-slate-500">${c.range}</span>
                      </div>
                      <div class="flex items-center gap-3 text-xs">
                        <span>定着 <strong>${cs.mastered}</strong>/${cs.total}問</span>
                        <span class="font-black ${passLineMet ? 'text-emerald-600' : 'text-rose-600'}">

              <div>
                <h3 class="text-base font-black text-slate-900">参加学生 全体ランキング（現在${globalMetrics.totalStudentsCount}名参加中）</h3>
                <p class="text-xs text-slate-500">他の学生は匿名表示され、あなた自身の位置がハイライトされます</p>

            <div class="space-y-2">
              ${globalMetrics.studentRankings.map(st => {
                const isMe = st.studentId === state.studentAccount?.studentId;
                const displayName = isMe ? `${st.name} （あなた）` : `受験生メンバー (${st.studentId.slice(0, 5)}***)`;

                  <div class="p-3 rounded-2xl border ${isMe ? 'bg-rose-50 border-rose-300 shadow-sm' : 'bg-slate-50 border-slate-200'} flex items-center justify-between gap-3">

                        ${st.rank}
                      </span>
                      <div class="min-w-0">
                        <div class="text-xs font-bold ${isMe ? 'text-rose-700' : 'text-slate-800'} truncate">${escapeHtml(displayName)}</div>
                        <div class="text-[11px] text-slate-500">定着 ${st.mastered}問 ・ 総解答 ${st.totalAttempts}回</div>
                      </div>
                    </div>
                    <div class="text-right shrink-0">
                      <div class="text-sm font-black ${st.accuracy >= 60 ? 'text-emerald-600' : 'text-slate-700'}">正答率 ${st.accuracy}%</div>

    // ---------------------------------------------------------
    // G. 公式過去問PDF 10回分リンクタブ

          <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
            <h2 class="text-base font-black text-slate-900 mb-1">美容師国家試験 過去10回分（第45回〜第54回）原本PDF＆全55問演習</h2>
            <p class="text-xs text-slate-500 mb-4">すべての回について、アプリ内での全55問演習と公式試験問題PDFの閲覧が可能です</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${EXAM_PDF_LIST.map(ex => `
                <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50 flex flex-col justify-between gap-3">
                  <div>
                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700">第${ex.session}回 筆記試験</span>

                      アプリで全55問を解く
                    </button>
                    <a href="${ex.url}" target="_blank" rel="noopener noreferrer"
                      class="px-3 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-700 font-bold text-xs border border-slate-200 flex items-center gap-1">
                      <i data-lucide="external-link" class="w-3.5 h-3.5"></i> PDF

    // ---------------------------------------------------------
    // H. クイズ演習実行画面（リアルタイム正答率・図表SVG・付箋対応）
    // ---------------------------------------------------------
    function renderQuizRunner(globalMetrics) {
      const qs = state.quizSession;
      if (!qs) return '';

      if (qs.isFinished) {
        const total = qs.questions.length;
        const answered = Object.keys(qs.answers).length;
        const correct = Object.values(qs.answers).filter(a => a.isCorrect).length;
        const rate = total > 0 ? Math.round((correct / total) * 100) : 0;
        const passed = rate >= 60;

        return `
          <div class="max-w-2xl mx-auto bg-white rounded-3xl p-6 shadow-md border border-slate-200 animate-fadeIn space-y-5">
            <div class="text-center space-y-2">
              <span class="px-3 py-1 rounded-full text-xs font-black ${passed ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                ${passed ? '合格基準(60%)クリア！' : 'あと一歩！復習ループで定着させましょう'}
              </span>
              <h2 class="text-xl font-black text-slate-900">${escapeHtml(qs.title)} 結果</h2>
              <div class="text-4xl font-black ${passed ? 'text-emerald-600' : 'text-rose-600'}">
                ${correct} <span class="text-lg text-slate-500">/ ${total}問正解 (${rate}%)</span>
              </div>
              <p class="text-xs text-slate-500">解答数: ${answered}問 ｜ 全学生成績カルテにリアルタイム反映されました</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <button type="button" onclick="window.appActions.retryWrongInSession()"
                class="py-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm transition flex items-center justify-center gap-1.5">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> 間違えた問題だけループ復習する
              </button>
              <button type="button" onclick="window.appActions.closeQuizSession()"
                class="py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs transition flex items-center justify-center gap-1.5">
                <i data-lucide="check" class="w-4 h-4"></i> ダッシュボードに戻る
              </button>
            </div>
          </div>
        `;
      }

      const currentQ = qs.questions[qs.currentIndex];
      const ans = qs.answers[currentQ.id];
      const cat = CATEGORIES.find(c => c.id === currentQ.category) || CATEGORIES[0];
      const sticky = state.studentStickies[currentQ.id];
      const qRealtime = globalMetrics.questionRealtimeStats[currentQ.id];

      return `
        <div class="max-w-2xl mx-auto space-y-4 animate-fadeIn">
          <!-- 上部進行バー -->
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 flex items-center justify-between gap-2">
            <button type="button" onclick="window.appActions.closeQuizSession()"
              class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1">
              <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 終了
            </button>
            <div class="text-xs font-black text-slate-800 truncate">
              ${escapeHtml(qs.title)} (${qs.currentIndex + 1} / ${qs.questions.length})
            </div>
            <button type="button" onclick="window.appActions.toggleJumpGrid()"
              class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1">
              <i data-lucide="grid" class="w-3.5 h-3.5"></i> 一覧
            </button>
          </div>

          ${state.showJumpGrid ? `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
              <div class="text-xs font-bold text-slate-600 mb-2">問題番号ジャンプ</div>
              <div class="grid grid-cols-10 gap-1.5">
                ${qs.questions.map((qItem, i) => {
                  const a = qs.answers[qItem.id];
                  let cls = 'bg-slate-100 text-slate-700';
                  if (a?.isCorrect === true) cls = 'bg-emerald-500 text-white';
                  else if (a?.isCorrect === false) cls = 'bg-rose-500 text-white';
                  if (i === qs.currentIndex) cls += ' ring-2 ring-slate-900';
                  return `<button type="button" onclick="window.appActions.jumpToQuestion(${i})" class="py-1.5 rounded-lg text-xs font-bold ${cls}">${i + 1}</button>`;
                }).join('')}
              </div>
            </div>
          ` : ''}

          <!-- 問題カード本体 -->
          <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="px-2.5 py-1 rounded-xl text-xs font-black bg-slate-900 text-white">第${currentQ.session}回 問${currentQ.questionNumber}</span>
                <span class="px-2.5 py-1 rounded-xl text-xs font-bold ${cat.lightBg} ${cat.text}">${cat.name}</span>
              </div>
              <div class="flex items-center gap-1.5">
                ${renderRealtimeBadge(qRealtime)}
                <button type="button" onclick="window.appActions.openStickyModal('${currentQ.id}')"
                  class="px-2.5 py-1 rounded-xl text-xs font-bold border ${sticky ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-slate-50 text-slate-600 border-slate-200'} flex items-center gap-1">
                  <i data-lucide="bookmark" class="w-3.5 h-3.5"></i> 付箋
                </button>
              </div>
            </div>

            <div class="text-base font-bold text-slate-900 leading-relaxed whitespace-pre-line">${escapeHtml(currentQ.question)}</div>

            ${currentQ.svgKey && QUESTION_SVGS[currentQ.svgKey] ? `
              <div class="my-2">${QUESTION_SVGS[currentQ.svgKey]}</div>
            ` : ''}

            <!-- 4択ボタン -->
            <div class="space-y-2.5 pt-1">
              ${currentQ.options.map((optText, idx) => {
                let btnCls = 'bg-slate-50 hover:bg-rose-50/60 border-slate-200 text-slate-800';
                let badgeCls = 'bg-white text-slate-700 border-slate-300';
                if (ans !== undefined) {
                  const isThisCorrect = (idx === currentQ.correctIndex) || (currentQ.alsoCorrectIndex === idx);
                  const isSelected = ans.selectedIdx === idx;
                  if (isThisCorrect) {
                    btnCls = 'bg-emerald-50 border-emerald-500 text-emerald-950 font-bold';
                    badgeCls = 'bg-emerald-600 text-white border-emerald-600';
                  } else if (isSelected) {
                    btnCls = 'bg-rose-50 border-rose-500 text-rose-950 font-bold';
                    badgeCls = 'bg-rose-600 text-white border-rose-600';
                  } else {
                    btnCls = 'bg-slate-50 border-slate-200 text-slate-400 opacity-75';
                  }
                }
                return `
                  <button type="button" onclick="window.appActions.answerQuestion(${idx})"
                    ${ans !== undefined ? 'disabled' : ''}
                    class="w-full p-3.5 rounded-2xl border-2 text-left transition flex items-start gap-3 ${btnCls}">
                    <span class="w-6 h-6 rounded-lg border text-xs font-black flex items-center justify-center shrink-0 mt-0.5 ${badgeCls}">
                      ${idx + 1}
                    </span>
                    <span class="text-sm leading-snug">${escapeHtml(optText)}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- 解答後の正誤＆解説ボックス -->
            ${ans !== undefined ? `
              <div class="mt-4 p-4 rounded-2xl border ${ans.isCorrect ? 'bg-emerald-50/70 border-emerald-200' : 'bg-rose-50/70 border-rose-200'} space-y-2 animate-fadeIn">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-black ${ans.isCorrect ? 'text-emerald-700' : 'text-rose-700'} flex items-center gap-1.5">
                    <i data-lucide="${ans.isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-5 h-5"></i>
                    ${ans.isCorrect ? '正解！「定着済」に記録されました' : `不正解… 正解は（${currentQ.correctIndex + 1}）です（「要復習」に登録）`}
                  </div>
                  ${renderRealtimeBadge(globalMetrics.questionRealtimeStats[currentQ.id])}
                </div>
                <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-line">${escapeHtml(currentQ.explanation)}</p>
              </div>
            ` : ''}

            <!-- 前後の問題ナビゲーション -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-3">
              <button type="button" onclick="window.appActions.prevQuestion()"
                ${qs.currentIndex === 0 ? 'disabled' : ''}
                class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 font-bold text-xs">
                前の問題
              </button>
              <button type="button" onclick="window.appActions.nextQuestion()"
                class="px-6 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm">
                ${qs.currentIndex === qs.questions.length - 1 ? '結果を見る' : '次の問題へ'}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================
    // 9. 管理者・教員専用ポータル画面（学生管理・PW再発行・正答訂正・問題追加）
    // =========================================================
    function renderAdminPortal(allQuestions, globalMetrics) {
      const filteredStudents = globalMetrics.studentRankings.filter(st => {
        if (!state.adminStudentSearch.trim()) return true;
        const kw = state.adminStudentSearch.trim().toLowerCase();
        return st.name.toLowerCase().includes(kw) || st.studentId.toLowerCase().includes(kw);
      });

      let adminQuestions = allQuestions.filter(q => {
        if (state.adminQSessionFilter !== 'all' && String(q.session) !== String(state.adminQSessionFilter)) return false;
        if (state.adminQCategoryFilter !== 'all' && q.category !== state.adminQCategoryFilter) return false;
        return true;
      });

      if (state.adminQSort === 'worst') {
        adminQuestions.sort((a, b) => {
          const ra = globalMetrics.questionRealtimeStats[a.id]?.rate ?? 999;
          const rb = globalMetrics.questionRealtimeStats[b.id]?.rate ?? 999;
          return ra - rb;
        });
      } else if (state.adminQSort === 'most_attempts') {
        adminQuestions.sort((a, b) => {
          const aa = globalMetrics.questionRealtimeStats[a.id]?.attempts ?? 0;
          const ab = globalMetrics.questionRealtimeStats[b.id]?.attempts ?? 0;
          return ab - aa;
        });
      } else {
        adminQuestions.sort((a, b) => (b.session - a.session) || (a.questionNumber - b.questionNumber));
      }

      return `
        <div class="min-h-screen bg-slate-100 pb-safe-main">
          <!-- 管理者トップバー -->
          <header class="sticky top-0 z-30 bg-indigo-950 text-white px-4 pt-safe-top pb-3 shadow-md">
            <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-sm">管理</div>
                <div>
                  <div class="flex items-center gap-2">
                    <h1 class="text-sm font-black">BEAUTE LOOP 教員・管理者ポータル</h1>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">
                      参加学生 ${globalMetrics.totalStudentsCount}名
                    </span>
                  </div>
                  <p class="text-[11px] text-indigo-200">学生別成績カルテ・パスワード再発行・リアルタイム正答率・問題の訂正と追加</p>
                </div>
              </div>
              <button type="button" onclick="window.appActions.logout()"
                class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-bold flex items-center gap-1">
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i> ログアウト
              </button>
            </div>
          </header>

          <main class="max-w-5xl mx-auto px-4 pt-4 space-y-4">
            <!-- 全体サマリーKPI -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                <div class="text-xs text-slate-500 font-bold">参加学生総数</div>
                <div class="text-2xl font-black text-indigo-600 mt-1">${globalMetrics.totalStudentsCount} <span class="text-xs font-normal text-slate-500">名</span></div>
              </div>
              <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                <div class="text-xs text-slate-500 font-bold">全体平均正答率</div>
                <div class="text-2xl font-black text-emerald-600 mt-1">${globalMetrics.avgAccuracy}%</div>
              </div>
              <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                <div class="text-xs text-slate-500 font-bold">収録問題総数</div>
                <div class="text-2xl font-black text-slate-900 mt-1">${allQuestions.length} <span class="text-xs font-normal text-slate-500">問</span></div>
              </div>
              <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                <div class="text-xs text-slate-500 font-bold">訂正・追加済問題</div>
                <div class="text-2xl font-black text-amber-600 mt-1">
                  ${Object.keys(memoryStore.customOverrides).length + Object.keys(memoryStore.addedQuestions).length} <span class="text-xs font-normal text-slate-500">件</span>
                </div>
              </div>
            </div>

            <!-- 管理者機能タブ切替 -->
            <div class="grid grid-cols-3 bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm text-xs font-bold">
              <button type="button" onclick="window.appActions.setAdminTab('students')"
                class="py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 ${state.adminTab === 'students' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                <i data-lucide="users" class="w-4 h-4"></i> 学生成績＆PW再発行 (${globalMetrics.totalStudentsCount})
              </button>
              <button type="button" onclick="window.appActions.setAdminTab('questions')"
                class="py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 ${state.adminTab === 'questions' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                <i data-lucide="file-text" class="w-4 h-4"></i> 問題別正答率＆解答訂正
              </button>
              <button type="button" onclick="window.appActions.setAdminTab('add_question')"
                class="py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 ${state.adminTab === 'add_question' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> 新規問題の追加
              </button>
            </div>

            ${state.adminTab === 'students' ? `
              <!-- 1. 学生一覧・成績確認・パスワード再発行 -->
              <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 class="text-base font-black text-slate-900">参加学生一覧・個人別成績カルテ・パスワード再発行</h2>
                    <p class="text-xs text-slate-500">学生を選択すると5科目別正答率や演習ログの確認、パスワードの即時再発行が行えます</p>
                  </div>
                  <input type="text" value="${escapeHtml(state.adminStudentSearch)}" oninput="window.appActions.setAdminStudentSearch(this.value)"
                    placeholder="学生氏名・IDで検索..."
                    class="px-3.5 py-2 rounded-xl border border-slate-200 text-xs w-full sm:w-64" />
                </div>

                <div class="space-y-2.5">
                  ${filteredStudents.map(st => {
                    const passEval = evaluatePassCriteria(st.accuracy, st.mastered, st.totalAttempts, 0);
                    return `
                      <div class="p-4 rounded-2xl border border-slate-200 hover:border-indigo-300 bg-slate-50/70 flex flex-wrap items-center justify-between gap-3 transition">
                        <div class="flex items-center gap-3 min-w-0">
                          <span class="w-8 h-8 rounded-xl bg-indigo-600 text-white font-black text-xs flex items-center justify-center shrink-0">
                            ${st.rank}位
                          </span>
                          <div class="min-w-0">
                            <div class="flex items-center gap-2">
                              <span class="text-sm font-black text-slate-900">${escapeHtml(st.name)}</span>

                              <span>正答率: <strong class="text-slate-900">${st.accuracy}%</strong> (${st.totalCorrect}/${st.totalAttempts}回)</span>

                              (${idx + 1}) ${escapeHtml(opt)}

                        </div>

                      <input type="text" value="${escapeHtml(state.newQuestionDraft.opt4)}" oninput="window.appActions.updateNewQuestionField('opt4', this.value)"
