      // =====================================================
      // 演習スタート（前回の続きから再開 ＆ 今日の15問 ＆ 何周でもループ復習対応）
      // startOption: 'resume' (デフォルト: 続きがあれば続きから) | 'from_start' (問1から)
      // =====================================================
      startQuiz(mode, filterValue, startOption = 'resume') {
        const allQ = buildAllQuestions();
        let targetQuestions = [];
        let title = '';
        let sessionLabel = '';
        let cursorKey = null;
        let initialIndex = 0;

        if (mode === 'todays_15') {
          const t15 = getTodays15Summary(allQ);
          targetQuestions = t15.questions;
          title = `今日の15問（${t15.dateLabel} おすすめセット${t15.setNumber > 1 ? ` #${t15.setNumber}` : ''}）`;
          sessionLabel = '今日の15問';
          if (startOption !== 'from_start' && t15.resumeIdx > 0 && t15.resumeIdx < targetQuestions.length) {
            initialIndex = t15.resumeIdx;
          }
        } else if (mode === 'session_all') {
          const sesNum = Number(filterValue);
          cursorKey = `ses_${sesNum}`;
          targetQuestions = allQ.filter(q => q.session === sesNum).sort((a, b) => a.questionNumber - b.questionNumber);
          title = `第${sesNum}回 国家試験 全${targetQuestions.length}問演習`;
          sessionLabel = `第${sesNum}回`;
          if (startOption === 'from_start') {
            state.lastCursors[cursorKey] = 0;
            savePersonalData();
            initialIndex = 0;
          } else {
            const resumeInfo = getResumeInfoForSet(cursorKey, targetQuestions);
            if (resumeInfo.hasResume) {
              initialIndex = resumeInfo.resumeIndex;
            }
          }
        } else if (mode === 'session_wrong') {
          const sesNum = Number(filterValue);
          targetQuestions = allQ.filter(q => {
            if (q.session !== sesNum) return false;
            const p = state.studentProgress[q.id];
            if (!p) return false;
            const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0));
            return p.status === 'review' || wrg > 0;
          }).sort((a, b) => a.questionNumber - b.questionNumber);
          title = `第${sesNum}回 間違えた問題ループ (${targetQuestions.length}問)`;
          sessionLabel = `第${sesNum}回 復習`;
        } else if (mode === 'category') {
          const catObj = CATEGORIES.find(c => c.id === filterValue);
          cursorKey = `cat_${filterValue}`;
          targetQuestions = allQ.filter(q => q.category === filterValue);
          title = `${catObj ? catObj.name : ''} 全14回横断ループ (${targetQuestions.length}問)`;
          sessionLabel = catObj ? catObj.shortName : '科目別';
          if (startOption === 'from_start') {
            state.lastCursors[cursorKey] = 0;
            savePersonalData();
            initialIndex = 0;
          } else {
            const resumeInfo = getResumeInfoForSet(cursorKey, targetQuestions);
            if (resumeInfo.hasResume) {
              initialIndex = resumeInfo.resumeIndex;
            }
          }
        } else if (mode === 'category_wrong') {
          const catObj = CATEGORIES.find(c => c.id === filterValue);
          targetQuestions = allQ.filter(q => {
            if (q.category !== filterValue) return false;
            const p = state.studentProgress[q.id];
            if (!p) return false;
            const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0));
            return p.status === 'review' || wrg > 0;
          });
          title = `${catObj ? catObj.shortName : ''} 弱点ループ (${targetQuestions.length}問)`;
          sessionLabel = `${catObj ? catObj.shortName : ''} 弱点`;
        } else if (mode === 'review_loop') {
          targetQuestions = allQ.filter(q => state.studentProgress[q.id]?.status === 'review');
          title = `要復習（直近ミス）ループ演習 (${targetQuestions.length}問)`;
          sessionLabel = '要復習ループ';
        } else if (mode === 'ever_wrong_loop') {
          targetQuestions = allQ.filter(q => {
            const p = state.studentProgress[q.id];
            if (!p) return false;
            const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0));
            return wrg > 0 || p.status === 'review';
          });
          title = `過去に1度でも間違えた問題 徹底周回ループ (${targetQuestions.length}問)`;
          sessionLabel = '過去ミス徹底ループ';
        } else if (mode === 'unattempted_loop') {
          targetQuestions = allQ.filter(q => !state.studentProgress[q.id] || !state.studentProgress[q.id].attempts).slice(0, 55);
          title = `未着手問題 55問チャレンジ (${targetQuestions.length}問)`;
          sessionLabel = '未着手チャレンジ';
        } else if (mode === 'sticky_loop') {
          targetQuestions = allQ.filter(q => {
            const st = state.studentStickies[q.id];
            if (!st) return false;
            return filterValue === 'all' ? true : st.color === filterValue;
          });
          title = `付箋問題ループ演習 (${targetQuestions.length}問)`;
          sessionLabel = '付箋ループ';
        } else if (mode === 'single') {
          const qObj = allQ.find(q => q.id === filterValue);
          if (qObj) {
            targetQuestions = [qObj];
            title = `第${qObj.session}回 問${qObj.questionNumber} ピンポイント演習`;
            sessionLabel = `第${qObj.session}回`;
          }
        } else if (mode === 'filtered_custom') {
          targetQuestions = getFilteredQuestions(allQ);
          title = `絞り込み問題ループ演習 (${targetQuestions.length}問)`;
          sessionLabel = 'カスタム演習';
        }

        if (!targetQuestions.length) {
          showToast('対象となる問題がありません（他の条件や回数をお試しください）');
          return;
        }

        state.quizSession = {
          title,
          sessionLabel,
          mode,
          filterValue,
          cursorKey,
          loopCountInSession: 1,
          questions: targetQuestions,
          currentIndex: initialIndex,
          answers: {}, // { [qId]: { selectedIdx, isCorrect } }
          sessionStreak: 0,
          lastPraise: null,
          peekExplanation: false,
          isFinished: false
        };
        state.showJumpGrid = false;
        if (initialIndex > 0) {
          const resumeQ = targetQuestions[initialIndex];
          showToast(`前回の続き（${initialIndex + 1}問目：第${resumeQ.session}回 問${resumeQ.questionNumber}）から開始しました！`);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      answerQuestion(selectedIdx) {
        const qs = state.quizSession;
        if (!qs || qs.isFinished) return;
        const currentQ = qs.questions[qs.currentIndex];
        if (!currentQ) return;
        if (qs.answers[currentQ.id] !== undefined) return;

        const isCorrect = (selectedIdx === currentQ.correctIndex) ||
          (currentQ.alsoCorrectIndex !== null && currentQ.alsoCorrectIndex !== undefined && selectedIdx === currentQ.alsoCorrectIndex);

        qs.answers[currentQ.id] = { selectedIdx, isCorrect };
        qs.peekExplanation = false;
        qs.sessionStreak = isCorrect ? ((qs.sessionStreak || 0) + 1) : 0;

        const prev = state.studentProgress[currentQ.id] || { status: 'unattempted', attempts: 0, correctCount: 0, wrongCount: 0, streak: 0 };
        const prevWrong = prev.wrongCount !== undefined ? prev.wrongCount : Math.max(0, (prev.attempts || 0) - (prev.correctCount || 0));
        const nextAttempts = (prev.attempts || 0) + 1;
        const nextCorrect = (prev.correctCount || 0) + (isCorrect ? 1 : 0);
        const nextWrong = prevWrong + (isCorrect ? 0 : 1);
        const nextStreak = isCorrect ? ((prev.streak || 0) + 1) : 0;
        const nextStatus = isCorrect ? 'mastered' : 'review';

        state.studentProgress[currentQ.id] = {
          status: nextStatus,
          attempts: nextAttempts,
          correctCount: nextCorrect,
          wrongCount: nextWrong,
          streak: nextStreak,
          lastAnsweredAt: Date.now()
        };

        // 5科目別ループ・過去問14回分ループの「前回の続き」位置を次の問題へ更新
        if (qs.cursorKey) {
          const nextIdx = (qs.currentIndex + 1) < qs.questions.length ? (qs.currentIndex + 1) : 0;
          state.lastCursors[qs.cursorKey] = nextIdx;
        }

        // 「今日の15問」に含まれる問題を解いた場合、完了リストに記録
        if (state.dailyMission && Array.isArray(state.dailyMission.questionIds) && state.dailyMission.questionIds.includes(currentQ.id)) {
          if (!Array.isArray(state.dailyMission.completedIds)) state.dailyMission.completedIds = [];
          if (!state.dailyMission.completedIds.includes(currentQ.id)) {
            state.dailyMission.completedIds.push(currentQ.id);
          }
        }

        // キリのいい問題数・連続正解・累計55問突破などの褒め言葉判定
        const allQ = buildAllQuestions();
        const latestStats = computeStudentStats(allQ);
        qs.lastPraise = evaluateQuizPraiseMilestone(qs, isCorrect, latestStats);

        savePersonalData();
        render();
      },

      togglePeekExplanation() {
        const qs = state.quizSession;
        if (!qs) return;
        qs.peekExplanation = !qs.peekExplanation;
        render();
      },

      nextQuestion() {
        const qs = state.quizSession;
        if (!qs) return;
        qs.peekExplanation = false;
        qs.lastPraise = null;
        if (qs.currentIndex < qs.questions.length - 1) {
          qs.currentIndex++;
          if (qs.cursorKey) {
            state.lastCursors[qs.cursorKey] = qs.currentIndex;
            savePersonalData();
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        } else {
          if (qs.cursorKey) {
            state.lastCursors[qs.cursorKey] = 0;
            savePersonalData();
          }
          this.finishQuizSession();
        }
      },

      prevQuestion() {
        const qs = state.quizSession;
        if (!qs || qs.currentIndex <= 0) return;
        qs.peekExplanation = false;
        qs.lastPraise = null;
        qs.currentIndex--;
        if (qs.cursorKey) {
          state.lastCursors[qs.cursorKey] = qs.currentIndex;
          savePersonalData();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      jumpToQuestion(idx) {
        const qs = state.quizSession;
        if (!qs || idx < 0 || idx >= qs.questions.length) return;
        qs.peekExplanation = false;
        qs.lastPraise = null;
        qs.currentIndex = idx;
        if (qs.cursorKey) {
          state.lastCursors[qs.cursorKey] = qs.currentIndex;
          savePersonalData();
        }
        state.showJumpGrid = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      toggleJumpGrid() {
        state.showJumpGrid = !state.showJumpGrid;
        render();
      },

      finishQuizSession() {
        const qs = state.quizSession;
        if (!qs) return;
        qs.isFinished = true;
        const answeredCount = Object.keys(qs.answers).length;
        const correctCount = Object.values(qs.answers).filter(a => a.isCorrect).length;
        if (answeredCount > 0) {
          if (qs.mode === 'review_loop' || qs.mode === 'ever_wrong_loop' || qs.mode === 'retry_wrong') {
            state.completedReviewLoops = (state.completedReviewLoops || 0) + 1;
          }
          state.examLogs.unshift({
            date: Date.now(),
            score: correctCount,
            total: qs.questions.length,
            answered: answeredCount,
            mode: qs.title,
            session: qs.sessionLabel,
            loopRound: qs.loopCountInSession || 1
          });
          if (state.examLogs.length > 50) state.examLogs = state.examLogs.slice(0, 50);
          savePersonalData();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      // この演習で間違えた問題だけを即座に次の周回へループ
      retryWrongInSession() {
        const qs = state.quizSession;
        if (!qs) return;
        const wrongQs = qs.questions.filter(q => {
          const ans = qs.answers[q.id];
          return !ans || !ans.isCorrect;
        });
        if (!wrongQs.length) {
          showToast('全問正解しています！「同じセットをもう1周する」から再周回もできます');
          return;
        }
        const nextLoop = (qs.loopCountInSession || 1) + 1;
        state.quizSession = {
          title: `${qs.sessionLabel} 間違い直しループ ${nextLoop}周目 (${wrongQs.length}問)`,
          sessionLabel: qs.sessionLabel,
          mode: 'retry_wrong',
          cursorKey: null,
          loopCountInSession: nextLoop,
          questions: wrongQs,
          currentIndex: 0,
          answers: {},
          sessionStreak: 0,
          lastPraise: null,
          peekExplanation: false,
          isFinished: false
        };
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      // 同じ問題セットをもう1周最初から解き直す（何周でも反復可能）
      repeatSameQuizSet() {
        const qs = state.quizSession;
        if (!qs) return;
        const nextLoop = (qs.loopCountInSession || 1) + 1;
        if (qs.cursorKey) {
          state.lastCursors[qs.cursorKey] = 0;
          savePersonalData();
        }
        state.quizSession = {
          title: `${qs.sessionLabel} 反復ループ ${nextLoop}周目 (${qs.questions.length}問)`,
          sessionLabel: qs.sessionLabel,
          mode: qs.mode,
          cursorKey: qs.cursorKey || null,
          loopCountInSession: nextLoop,
          questions: [...qs.questions],
          currentIndex: 0,
          answers: {},
          sessionStreak: 0,
          lastPraise: null,
          peekExplanation: false,
          isFinished: false
        };
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      closeQuizSession() {
        state.quizSession = null;
        state.showJumpGrid = false;
        render();
      },

      // =====================================================
      // 付箋（Sticky）モーダル操作
      // =====================================================
      openStickyModal(qId) {
        state.stickyModalQId = qId;
        const existing = state.studentStickies[qId];
        state.stickyDraftColor = existing ? existing.color : 'red';
        state.stickyDraftMemo = existing ? existing.memo : '';
        render();
      },
      closeStickyModal() {
        state.stickyModalQId = null;
        render();
      },
      setStickyDraftColor(c) {
        state.stickyDraftColor = c;
        render();
      },
      saveSticky() {
        const qId = state.stickyModalQId;
        if (!qId) return;
        state.studentStickies[qId] = {
          color: state.stickyDraftColor,
          memo: state.stickyDraftMemo.trim(),
          updatedAt: Date.now()
        };
        state.stickyModalQId = null;
        savePersonalData();
        showToast('付箋メモをブラウザに保存しました');
        render();
      },
      removeSticky(qId) {
        const target = qId || state.stickyModalQId;
        if (!target) return;
        delete state.studentStickies[target];
        state.stickyModalQId = null;
        savePersonalData();
        showToast('付箋を外しました');
        render();
      },

      // =====================================================
      // 学習データリセット・周回リセット確認モーダル
      // =====================================================
      openResetConfirmModal(type) {
        if (type === 'reopen_ever_wrong') {
          state.confirmModal = {
            title: '過去に間違えた問題をすべて「要復習」に戻す',
            message: 'これまでに1度でも間違えたことがある問題をすべて「要復習」ステータスに戻し、もう1周最初から復習ループできるようにします。（これまでの解答回数や付箋メモは消えません）',
            confirmLabel: '要復習に戻して周回する',
            actionType: 'reopen_ever_wrong'
          };
        } else if (type === 'reset_all') {
          state.confirmModal = {
            title: '学習履歴のリセット確認',
            message: 'このブラウザに保存されている解答履歴・演習ログ・続き位置を初期状態にリセットしますか？（※貼った付箋メモはそのまま残ります）',
            confirmLabel: '履歴をリセットする',
            actionType: 'reset_all'
          };
        }
        render();
      },
      closeConfirmModal() {
        state.confirmModal = null;
        render();
      },
      executeConfirmModal() {
        if (!state.confirmModal) return;
        const act = state.confirmModal.actionType;
        state.confirmModal = null;
        if (act === 'reopen_ever_wrong') {
          let count = 0;
          Object.keys(state.studentProgress).forEach(qId => {
            const p = state.studentProgress[qId];
            const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0));
            if (wrg > 0) {
              p.status = 'review';
              count++;
            }
          });
          savePersonalData();
          showToast(`${count}問の過去ミス問題を「要復習」に再セットしました！`);
        } else if (act === 'reset_all') {
          state.studentProgress = {};
          state.examLogs = [];
          state.completedReviewLoops = 0;
          state.lastCursors = {};
          state.dailyMission = null;
          savePersonalData();
          showToast('学習履歴をリセットしました（新しい1周目を開始できます）');
        }
        render();
      }
    };

    function getFilteredQuestions(allQuestions) {
      return allQuestions.filter(q => {
        if (state.selectedSessionFilter !== 'all' && String(q.session) !== String(state.selectedSessionFilter)) return false;
        if (state.selectedCategoryFilter !== 'all' && q.category !== state.selectedCategoryFilter) return false;
        if (state.selectedStatusFilter !== 'all') {
          const p = state.studentProgress[q.id];
          const wrg = p ? (p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0))) : 0;
          if (state.selectedStatusFilter === 'review' && p?.status !== 'review') return false;
          if (state.selectedStatusFilter === 'ever_wrong' && !(wrg > 0 || p?.status === 'review')) return false;
          if (state.selectedStatusFilter === 'unattempted' && (p && p.attempts > 0)) return false;
          if (state.selectedStatusFilter === 'mastered' && p?.status !== 'mastered') return false;
        }
        if (state.searchQuery.trim() !== '') {
          const kw = state.searchQuery.trim().toLowerCase();
          const inQ = q.question.toLowerCase().includes(kw);
          const inOpt = q.options.some(o => o.toLowerCase().includes(kw));
          const inExp = q.explanation.toLowerCase().includes(kw);
          if (!inQ && !inOpt && !inExp) return false;
        }
        return true;
      }).sort((a, b) => (b.session - a.session) || (a.questionNumber - b.questionNumber));
    }

    function updateExamListDomOnly() {
      const allQuestions = buildAllQuestions();
      const filtered = getFilteredQuestions(allQuestions);
      const listContainer = document.getElementById('exam-questions-list-container');
      if (listContainer) {
        listContainer.innerHTML = renderExamQuestionCardsHtml(filtered);
      }
      const countSpan = document.getElementById('filtered-quiz-btn-count');
      if (countSpan) {
        countSpan.textContent = `表示中の${filtered.length}問を演習`;
      }
      const clearBtn = document.getElementById('exam-search-clear-btn');
      if (clearBtn) {
        if (state.searchQuery && state.searchQuery.length > 0) {
          clearBtn.classList.remove('hidden');
          clearBtn.classList.add('flex');
        } else {
          clearBtn.classList.add('hidden');
          clearBtn.classList.remove('flex');
        }
      }
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    function renderExamQuestionCardsHtml(filtered) {
      if (filtered.length === 0) {
        return `
          <div class="bg-white rounded-2xl p-8 text-center shadow-sm border border-slate-200 space-y-2">
            <div class="text-sm font-black text-slate-700">該当する問題が見つかりませんでした</div>
            <p class="text-xs text-slate-500">検索キーワードや回数・学習状態フィルターを変更してお試しください。</p>
            ${state.searchQuery ? `
              <button type="button" onclick="window.appActions.clearSearchQuery()"
                class="mt-2 inline-flex items-center gap-1 px-4 py-2 rounded-xl bg-rose-50 text-rose-700 font-bold text-xs border border-rose-200">
                検索文字をクリアする
              </button>
            ` : ''}
          </div>
        `;
      }
      return filtered.map(q => {
        const p = state.studentProgress[q.id];
        const sticky = state.studentStickies[q.id];
        const cat = CATEGORIES.find(c => c.id === q.category) || CATEGORIES[0];
        const isExpOpen = state.showAllExplanationsInList || !!state.expandedExplanationIds[q.id];

        let statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-500">未着手</span>`;
        if (p?.status === 'mastered') statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700">定着済 ○</span>`;
        else if (p?.status === 'review') statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700">要復習 ×</span>`;

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 hover:border-rose-300 transition space-y-2.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="px-2.5 py-0.5 rounded-lg text-xs font-black bg-slate-900 text-white">第${q.session}回 問${q.questionNumber}</span>
                <span class="px-2 py-0.5 rounded-lg text-[11px] font-bold ${cat.lightBg} ${cat.text}">${cat.name}</span>
                ${statusBadge}
              </div>
              <div class="flex items-center gap-1.5">
                ${renderPersonalAttemptBadge(q.id)}
              </div>
            </div>

            <p class="text-sm font-bold text-slate-900 leading-relaxed whitespace-pre-line">${escapeHtml(q.question)}</p>

            ${q.svgKey && QUESTION_SVGS[q.svgKey] ? `
              <div class="my-1">${QUESTION_SVGS[q.svgKey]}</div>
            ` : ''}

            <!-- 4つの選択肢一覧 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 pt-1">
              ${q.options.map((opt, idx) => {
                const isCorrectOpt = isExpOpen && ((idx === q.correctIndex) || (q.alsoCorrectIndex === idx));
                return `
                  <div class="px-3 py-1.5 rounded-xl border text-xs ${isCorrectOpt ? 'bg-emerald-50 border-emerald-400 text-emerald-950 font-bold' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                    <span class="font-black mr-1">(${idx + 1})</span>${escapeHtml(opt)}
                    ${isCorrectOpt ? `<span class="ml-1 text-[10px] font-extrabold text-emerald-700 bg-emerald-100 px-1.5 py-0.2 rounded">正解</span>` : ''}
                  </div>
                `;
              }).join('')}
            </div>

            ${sticky ? `
              <div class="p-2.5 rounded-xl ${STICKY_COLORS[sticky.color]?.bg || 'bg-amber-50'} border ${STICKY_COLORS[sticky.color]?.border || 'border-amber-200'} text-xs flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full ${STICKY_COLORS[sticky.color]?.dot || 'bg-amber-500'}"></span>
                <span class="font-bold ${STICKY_COLORS[sticky.color]?.text || 'text-amber-800'}">${escapeHtml(sticky.memo || STICKY_COLORS[sticky.color]?.label)}</span>
              </div>
            ` : ''}

            ${isExpOpen ? `

    // D. 復習ループ・付箋メモ帳タブ
    function renderStickiesTab(allQuestions, stats) {
      const stickyQuestions = allQuestions.filter(q => {
        const st = state.studentStickies[q.id];
        if (!st) return false;
        return state.selectedStickyFilter === 'all' ? true : st.color === state.selectedStickyFilter;
      });

      const reviewQuestions = allQuestions.filter(q => state.studentProgress[q.id]?.status === 'review');
      const everWrongQuestions = allQuestions.filter(q => {
        const p = state.studentProgress[q.id];
        if (!p) return false;
        const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0));
        return wrg > 0 || p.status === 'review';
      });

      return `
        <div class="space-y-5 animate-fadeIn">
          <!-- 間違えた問題・過去ミス周回ボックス -->

                <p class="text-xs text-slate-500">1度正解して「定着済」になった問題も、「過去ミス徹底ループ」から何度でも周回できます</p>

              </div>
            ` : `
              <div class="space-y-2.5 max-h-[30rem] overflow-y-auto pr-1">

                  const p = state.studentProgress[q.id];

                        <div class="flex flex-wrap items-center gap-1.5">

                      ` : ''}

                  `;

            </div>

            <div class="flex flex-wrap items-center gap-2 mb-3">
              <button type="button" onclick="window.appActions.setStickyFilter('all')"
                class="px-3 py-1.5 rounded-xl text-xs font-bold ${state.selectedStickyFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">
                すべて (${Object.keys(state.studentStickies).length})

                該当する付箋問題がありません。演習画面や問題一覧から「付箋」を追加できます。
              </div>
            ` : `
              <div class="space-y-2.5">
                ${stickyQuestions.map(q => {
                  const st = state.studentStickies[q.id];
                  const sc = STICKY_COLORS[st.color] || STICKY_COLORS.red;
                  const isExpOpen = !!state.expandedExplanationIds[q.id];
                  return `
                    <div class="p-4 rounded-2xl border ${sc.border} ${sc.bg} space-y-2">

                      </div>

                    <div class="relative w-full h-2.5 bg-slate-200 rounded-full overflow-hidden mt-2">
                      <div class="h-full ${c.color}" style="width: ${cs.attemptedPct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 過去14回（第54回〜第41回）回数別達成度棒グラフ・正答率 -->
          <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
            <h3 class="text-base font-black text-slate-900 mb-1">過去問14回分（第54回〜第41回）回数別の達成度棒グラフ・正答率</h3>
            <p class="text-xs text-slate-500 mb-3">各回55問のうち何問解けたかが棒グラフで表示されます。前回の続きからいつでも再開できます</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${EXAM_PDF_LIST.map(ex => {
                const ss = stats.sessionStats[ex.session] || { total: 55, mastered: 0, review: 0, attempted: 0, attemptedPct: 0, accuracy: 0, attempts: 0 };
                const sesQuestions = allQuestions.filter(q => q.session === ex.session).sort((a, b) => a.questionNumber - b.questionNumber);
                const resumeInfo = getResumeInfoForSet(`ses_${ex.session}`, sesQuestions);
                const resumeQ = resumeInfo.resumeQuestion;
                const isComplete = ss.attempted >= ss.total;
                return `
                  <div class="p-3.5 rounded-2xl border border-slate-200 bg-slate-50 flex flex-col justify-between gap-2">
                    <div>
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-black text-slate-800">${ex.year}</span>
                        <span class="text-[11px] font-bold ${isComplete ? 'text-emerald-600' : 'text-rose-600'}">
                          解答済 ${ss.attempted}/${ss.total}問 (${ss.attemptedPct}%)
                        </span>
                      </div>
                      <div class="text-[11px] text-slate-500 mt-0.5">
                        定着 ${ss.mastered}問 ・ 要復習 ${ss.review}問 ・ 正答率 ${ss.accuracy}%
                      </div>
                      <div class="w-full h-2.5 bg-white rounded-full overflow-hidden mt-1.5 border border-slate-200">
                        <div class="h-full ${isComplete ? 'bg-emerald-500' : 'bg-rose-500'}" style="width: ${ss.attemptedPct}%"></div>
                      </div>
                    </div>
                    <div class="flex items-center justify-end gap-1.5 pt-1">
                      ${resumeInfo.hasResume && resumeQ ? `
                        <button type="button" onclick="window.appActions.startQuiz('session_all', ${ex.session}, 'resume')"
                          class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs">
                          続きから(問${resumeQ.questionNumber}〜)
                        </button>
                        <button type="button" onclick="window.appActions.startQuiz('session_all', ${ex.session}, 'from_start')"
                          class="px-2.5 py-1.5 rounded-xl bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 font-bold text-[11px]">
                          問1から
                        </button>
                      ` : `
                        <button type="button" onclick="window.appActions.startQuiz('session_all', ${ex.session}, 'from_start')"
                          class="px-3 py-1.5 rounded-xl bg-white hover:bg-rose-50 text-rose-600 border border-rose-200 font-bold text-xs">
                          全55問を演習
                        </button>
                      `}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 直近の演習履歴ログ & データ管理 -->
          <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h3 class="text-base font-black text-slate-900">直近の演習履歴ログ</h3>
                <p class="text-xs text-slate-500">解き進めたスコアの推移が自動で記録されます</p>
              </div>
              <button type="button" onclick="window.appActions.openResetConfirmModal('reset_all')"
                class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-xs font-bold transition">
                学習履歴をリセット
              </button>
            </div>
            ${state.examLogs.length === 0 ? `
              <div class="p-6 text-center text-xs text-slate-500 bg-slate-50 rounded-2xl">
                まだ演習完了ログがありません。問題を解いて結果画面まで進むとここに記録されます。
              </div>
            ` : `
              <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
                ${state.examLogs.map(log => {
                  const rate = log.total > 0 ? Math.round((log.score / log.total) * 100) : 0;
                  const d = new Date(log.date);
                  const dateStr = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                  return `
                    <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2 text-xs">
                      <div>
                        <span class="font-black text-slate-800">${escapeHtml(log.mode)}</span>
                        <span class="text-slate-400 ml-2">${dateStr}</span>
                      </div>
                      <div class="font-black ${rate >= 60 ? 'text-emerald-600' : 'text-rose-600'} shrink-0">
                        ${log.score} / ${log.total}問正解 (${rate}%)
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // F. 公式過去問PDF 14回分リンクタブ
    function renderPdfsTab() {
      return `
        <div class="space-y-4 animate-fadeIn">
          <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
            <h2 class="text-base font-black text-slate-900 mb-1">美容師国家試験 過去14回分（第41回〜第54回・全770問）一覧＆全55問演習</h2>
            <p class="text-xs text-slate-500 mb-4">新たに第41回・第42回・第43回・第44回を追加した全14回分をアプリ内で解説付きで演習できます</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${EXAM_PDF_LIST.map(ex => `
                <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50 flex flex-col justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700">第${ex.session}回 筆記試験</span>
                      ${ex.session <= 44 ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700">新規追加・解説完備</span>` : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-50 text-indigo-700">全問解説付</span>`}
                    </div>
                    <h3 class="text-sm font-black text-slate-900 mt-1">${ex.year}</h3>
                    <p class="text-xs text-slate-500 mt-0.5">問1〜問55 完全収録（解答・詳細解説付き）</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button type="button" onclick="window.appActions.startQuiz('session_all', ${ex.session}, 'resume')"
                      class="flex-1 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs text-center transition">
                      アプリで55問を解く（続き対応）
                    </button>
                    <button type="button" onclick="window.appActions.setSessionFilter('${ex.session}'); window.appActions.setTab('exam');"
                      class="px-3 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-700 font-bold text-xs border border-slate-200 flex items-center gap-1">
                      <i data-lucide="list" class="w-3.5 h-3.5"></i> 問題・解説一覧
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // G. クイズ演習実行画面（キリのいいところでの褒め言葉バナー ＆ 前回の続き保存 ＆ 全問解説振り返り付き）
    function renderQuizRunner() {
      const qs = state.quizSession;
      if (!qs) return '';

      if (qs.isFinished) {
        const total = qs.questions.length;
        const answered = Object.keys(qs.answers).length;
        const correct = Object.values(qs.answers).filter(a => a.isCorrect).length;
        const wrongCount = total - correct;
        const rate = total > 0 ? Math.round((correct / total) * 100) : 0;
        const passed = rate >= 60;

        return `
          <div class="max-w-2xl mx-auto space-y-5 animate-fadeIn">
            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-5">
              <div class="text-center space-y-2">
                <span class="px-3 py-1 rounded-full text-xs font-black ${passed ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                  ${passed ? '🎉 合格基準(60%)クリア！素晴らしい実力です！' : '👏 完走お疲れさまでした！間違えた問題をループ復習しましょう'}
                </span>
                <h2 class="text-xl font-black text-slate-900">${escapeHtml(qs.title)} 結果</h2>
                <div class="text-4xl font-black ${passed ? 'text-emerald-600' : 'text-rose-600'}">
                  ${correct} <span class="text-lg text-slate-500">/ ${total}問正解 (${rate}%)</span>
                </div>
                <p class="text-xs text-slate-500">解答数: ${answered}問 ｜ このスマホブラウザの個人成績カルテに保存されました</p>
              </div>

              <!-- 完走ねぎらい＆褒め言葉メッセージ -->
              <div class="p-4 rounded-2xl bg-gradient-to-r from-amber-50 to-rose-50 border border-rose-200 text-xs text-slate-800 leading-relaxed">
                <div class="font-black text-rose-700 mb-1">🌟 最後までやり抜いたあなたへ</div>
                ${rate >= 80
                  ? '驚異的な正答率です！知識が正確に定着しています。この調子で他の回や科目も100%にしていきましょう！'
                  : rate >= 60
                    ? '見事に合格ライン(60%)を突破しました！今回間違えた問題だけをすぐ下のボタンで1周おさらいすると記憶が完璧になります！'
                    : '最後まで解き切った集中力が本当に素晴らしいです！間違えた問題は宝の山です。「間違えた問題だけループ」で解説を読みながらもう1周してみましょう！'}
              </div>

              <!-- 何周でもループできるアクションボタン群 -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <button type="button" onclick="window.appActions.retryWrongInSession()"
                  ${wrongCount === 0 ? 'disabled' : ''}
                  class="py-3 px-3 rounded-2xl bg-rose-600 hover:bg-rose-700 disabled:opacity-40 text-white font-bold text-xs shadow-sm transition flex items-center justify-center gap-1.5">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i> 間違えた${wrongCount}問だけループ
                </button>
                <button type="button" onclick="window.appActions.repeatSameQuizSet()"
                  class="py-3 px-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-sm transition flex items-center justify-center gap-1.5">
                  <i data-lucide="repeat" class="w-4 h-4"></i> 同じ${total}問をもう1周する
                </button>
                <button type="button" onclick="window.appActions.closeQuizSession()"
                  class="py-3 px-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs transition flex items-center justify-center gap-1.5">
                  <i data-lucide="check" class="w-4 h-4"></i> ホームに戻る
                </button>
              </div>
            </div>

            <!-- 演習した全問題の解答・解説振り返りリスト -->
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-3">
              <h3 class="text-base font-black text-slate-900 flex items-center gap-2">
                <i data-lucide="book-open-check" class="w-5 h-5 text-indigo-600"></i> 今回解いた問題の解答・解説一覧
              </h3>
              <div class="space-y-3">
                ${qs.questions.map((qItem, idx) => {
                  const a = qs.answers[qItem.id];
                  const isOk = a?.isCorrect;
                  return `
                    <div class="p-4 rounded-2xl border ${isOk ? 'bg-emerald-50/40 border-emerald-200' : 'bg-rose-50/40 border-rose-200'} space-y-2">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-black text-slate-900">第${idx + 1}問（第${qItem.session}回 問${qItem.questionNumber}）</span>
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${isOk ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}">
                          ${a ? (isOk ? `○ 正解（選択:${a.selectedIdx + 1}）` : `× 不正解（選択:${a.selectedIdx + 1} / 正解:${qItem.correctIndex + 1}）`) : `未解答（正解:${qItem.correctIndex + 1}）`}
                        </span>
                      </div>
                      <p class="text-xs font-bold text-slate-800">${escapeHtml(qItem.question)}</p>
                      <div class="p-3 rounded-xl bg-white border border-slate-200 text-xs text-slate-700 whitespace-pre-line leading-relaxed">
                        ${escapeHtml(qItem.explanation)}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }

      const currentQ = qs.questions[qs.currentIndex];
      const ans = qs.answers[currentQ.id];
      const cat = CATEGORIES.find(c => c.id === currentQ.category) || CATEGORIES[0];
      const sticky = state.studentStickies[currentQ.id];
      const showExplanationBox = (ans !== undefined) || qs.peekExplanation;
      const answeredCountInSession = Object.keys(qs.answers).length;
      const sessionProgressPct = qs.questions.length > 0 ? Math.round(((qs.currentIndex + 1) / qs.questions.length) * 100) : 0;

      return `
        <div class="max-w-2xl mx-auto space-y-4 animate-fadeIn">
          <!-- 上部進行バー -->
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-2">
            <div class="flex items-center justify-between gap-2">
              <button type="button" onclick="window.appActions.closeQuizSession()"
                class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> 中断して戻る（続き保存）
              </button>
              <div class="text-xs font-black text-slate-800 truncate">
                ${escapeHtml(qs.title)} (${qs.currentIndex + 1} / ${qs.questions.length}問目)
              </div>
              <button type="button" onclick="window.appActions.toggleJumpGrid()"
                class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1">
                <i data-lucide="grid" class="w-3.5 h-3.5"></i> 一覧
              </button>
            </div>
            <!-- セッション内進捗バー -->
            <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-rose-500 to-amber-500 transition-all duration-300" style="width: ${sessionProgressPct}%"></div>
            </div>
          </div>

          <!-- キリのいいところ（5問ごと・連勝・累計55問など）での褒め言葉バナー -->
          ${qs.lastPraise ? `
            <div class="bg-gradient-to-r ${qs.lastPraise.colorClass} rounded-2xl p-4 shadow-md animate-fadeIn space-y-1">
              <div class="flex items-center justify-between gap-2">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-black bg-white/20">${qs.lastPraise.badge}</span>
                <span class="text-[11px] font-bold opacity-90">今回 ${answeredCountInSession}問解答済</span>
              </div>
              <div class="text-sm font-black">${qs.lastPraise.title}</div>
              <p class="text-xs opacity-95 leading-relaxed">${qs.lastPraise.message}</p>
            </div>
          ` : ''}

          ${state.showJumpGrid ? `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-600">問題番号ジャンプ（好きな問題から再開できます）</span>
                <button type="button" onclick="window.appActions.finishQuizSession()"
                  class="text-xs font-bold text-rose-600 underline">ここまでの結果を集計する</button>
              </div>
              <div class="grid grid-cols-10 gap-1.5">
                ${qs.questions.map((qItem, i) => {
                  const a = qs.answers[qItem.id];
                  let cls = 'bg-slate-100 text-slate-700';
                  if (a?.isCorrect === true) cls = 'bg-emerald-500 text-white';
                  else if (a?.isCorrect === false) cls = 'bg-rose-500 text-white';
                  if (i === qs.currentIndex) cls += ' ring-2 ring-slate-900';
                  return `<button type="button" onclick="window.appActions.jumpToQuestion(${i})" class="py-1.5 rounded-lg text-xs font-bold ${cls}">${i + 1}</button>`;
                }).join('')}
              </div>
            </div>
          ` : ''}

          <!-- 問題カード本体 -->
          <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="px-2.5 py-1 rounded-xl text-xs font-black bg-slate-900 text-white">第${currentQ.session}回 問${currentQ.questionNumber}</span>
                <span class="px-2.5 py-1 rounded-xl text-xs font-bold ${cat.lightBg} ${cat.text}">${cat.name}</span>
              </div>
              <div class="flex items-center gap-1.5">
                ${renderPersonalAttemptBadge(currentQ.id)}
                <button type="button" onclick="window.appActions.openStickyModal('${currentQ.id}')"
                  class="px-2.5 py-1 rounded-xl text-xs font-bold border ${sticky ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-slate-50 text-slate-600 border-slate-200'} flex items-center gap-1">
                  <i data-lucide="bookmark" class="w-3.5 h-3.5"></i> 付箋
                </button>
              </div>
            </div>

            <div class="text-base font-bold text-slate-900 leading-relaxed whitespace-pre-line">${escapeHtml(currentQ.question)}</div>

            ${currentQ.svgKey && QUESTION_SVGS[currentQ.svgKey] ? `
              <div class="my-2">${QUESTION_SVGS[currentQ.svgKey]}</div>
            ` : ''}

            <!-- 4択ボタン -->
            <div class="space-y-2.5 pt-1">
              ${currentQ.options.map((optText, idx) => {
                let btnCls = 'bg-slate-50 hover:bg-rose-50/60 border-slate-200 text-slate-800';
                let badgeCls = 'bg-white text-slate-700 border-slate-300';
                if (showExplanationBox) {
                  const isThisCorrect = (idx === currentQ.correctIndex) || (currentQ.alsoCorrectIndex === idx);
                  const isSelected = ans && ans.selectedIdx === idx;
                  if (isThisCorrect) {
                    btnCls = 'bg-emerald-50 border-emerald-500 text-emerald-950 font-bold';
                    badgeCls = 'bg-emerald-600 text-white border-emerald-600';
                  } else if (isSelected) {
                    btnCls = 'bg-rose-50 border-rose-500 text-rose-950 font-bold';
                    badgeCls = 'bg-rose-600 text-white border-rose-600';
                  } else {
                    btnCls = 'bg-slate-50 border-slate-200 text-slate-400 opacity-75';
                  }
                }
                return `
                  <button type="button" onclick="window.appActions.answerQuestion(${idx})"
                    ${ans !== undefined ? 'disabled' : ''}
                    class="w-full p-3.5 rounded-2xl border-2 text-left transition flex items-start gap-3 ${btnCls}">
                    <span class="w-6 h-6 rounded-lg border text-xs font-black flex items-center justify-center shrink-0 mt-0.5 ${badgeCls}">
                      ${idx + 1}
                    </span>
                    <span class="text-sm leading-snug">${escapeHtml(optText)}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- 解答前に解説を見たい場合のトグルボタン -->
            ${ans === undefined ? `
              <div class="flex justify-end">
                <button type="button" onclick="window.appActions.togglePeekExplanation()"
                  class="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                  <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                  ${qs.peekExplanation ? '解答・解説を隠す' : '解答・解説を先に確認する'}
                </button>
              </div>
            ` : ''}

            <!-- 解答後の正誤＆詳しい解説ボックス -->
            ${showExplanationBox ? `
              <div class="mt-4 p-4 rounded-2xl border ${ans === undefined ? 'bg-indigo-50/70 border-indigo-200' : ans.isCorrect ? 'bg-emerald-50/70 border-emerald-200' : 'bg-rose-50/70 border-rose-200'} space-y-2.5 animate-fadeIn">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="text-sm font-black ${ans === undefined ? 'text-indigo-800' : ans.isCorrect ? 'text-emerald-700' : 'text-rose-700'} flex items-center gap-1.5">
                    <i data-lucide="${ans === undefined ? 'book-open' : ans.isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-5 h-5"></i>
                    ${ans === undefined
                      ? `正解は（${currentQ.correctIndex + 1}）です`
                      : ans.isCorrect
                        ? '正解！「定着済」に記録されました👏'
                        : `不正解… 正解は（${currentQ.correctIndex + 1}）です（「要復習」に登録されました）`}
                  </div>
                </div>
                <div class="p-3.5 rounded-xl bg-white/90 border border-slate-200/80 text-xs text-slate-800 leading-relaxed whitespace-pre-line">
                  ${escapeHtml(currentQ.explanation)}
                </div>
              </div>
            ` : ''}

            <!-- 前後の問題ナビゲーション -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-3">
              <button type="button" onclick="window.appActions.prevQuestion()"
                ${qs.currentIndex === 0 ? 'disabled' : ''}
                class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 font-bold text-xs">
                前の問題
              </button>
              <button type="button" onclick="window.appActions.nextQuestion()"
                class="px-6 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm">
                ${qs.currentIndex === qs.questions.length - 1 ? '結果と全問解説を見る' : '次の問題へ'}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // H. モーダル群（付箋メモ設定モーダル / 履歴リセット確認モーダル）
    function renderModals() {
      let html = '';

      if (state.stickyModalQId) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-4 animate-fadeIn">
              <div class="flex items-center justify-between">
                <h3 class="text-base font-black text-slate-900">付箋と暗記メモの設定</h3>
                <button type="button" onclick="window.appActions.closeStickyModal()" class="text-slate-400 hover:text-slate-700">✕</button>
              </div>
              <div class="grid grid-cols-3 gap-2">
                ${Object.values(STICKY_COLORS).map(sc => `
                  <button type="button" onclick="window.appActions.setStickyDraftColor('${sc.id}')"
                    class="p-2.5 rounded-xl border text-xs font-bold flex flex-col items-center gap-1 ${state.stickyDraftColor === sc.id ? `${sc.bg} ${sc.text} ${sc.border} ring-2 ring-slate-900` : 'bg-slate-50 text-slate-600 border-slate-200'}">
                    <span class="w-3 h-3 rounded-full ${sc.dot}"></span>
                    <span>${sc.label}</span>
                  </button>
                `).join('')}
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">暗記メモ・ポイント</label>
                <textarea rows="3" oninput="window.appActions.updateInput('stickyDraftMemo', this.value)"
                  placeholder="例：取消処分の返納は5日以内！30日とひっかけ注意"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs">${escapeHtml(state.stickyDraftMemo)}</textarea>
              </div>
              <div class="flex items-center justify-between gap-2 pt-2">
                <button type="button" onclick="window.appActions.removeSticky()"
                  class="px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 font-bold text-xs">
                  付箋を外す
                </button>
                <div class="flex items-center gap-2">
                  <button type="button" onclick="window.appActions.closeStickyModal()"
                    class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">キャンセル</button>
                  <button type="button" onclick="window.appActions.saveSticky()"
                    class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm">保存する</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (state.confirmModal) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-4 animate-fadeIn">
              <h3 class="text-base font-black text-slate-900">${escapeHtml(state.confirmModal.title)}</h3>
              <p class="text-xs text-slate-600 leading-relaxed">${escapeHtml(state.confirmModal.message)}</p>
              <div class="flex items-center justify-end gap-2 pt-2">
                <button type="button" onclick="window.appActions.closeConfirmModal()"
                  class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">キャンセル</button>
                <button type="button" onclick="window.appActions.executeConfirmModal()"
                  class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm">
                  ${escapeHtml(state.confirmModal.confirmLabel)}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      return html;
    }

    // =========================================================
    // 9. メイン render() 関数
    // =========================================================
    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      const allQuestions = buildAllQuestions();
      const stats = computeStudentStats(allQuestions);

      let mainBody = '';
      if (state.quizSession) {
        mainBody = renderQuizRunner();
      } else if (state.activeTab === 'dashboard') {
        mainBody = renderDashboardTab(allQuestions, stats);
      } else if (state.activeTab === 'exam') {
        mainBody = renderExamListTab(allQuestions, stats);
      } else if (state.activeTab === 'stickies') {
        mainBody = renderStickiesTab(allQuestions, stats);
      } else if (state.activeTab === 'analytics') {
        mainBody = renderAnalyticsTab(allQuestions, stats);
      } else if (state.activeTab === 'pdfs') {
        mainBody = renderPdfsTab();
      }

      const contentHtml = `
        <div class="min-h-screen flex flex-col bg-slate-50">
          ${renderStudentHeader(stats)}
          <main class="flex-1 max-w-4xl w-full mx-auto px-4 pt-4 pb-safe-main">
            ${mainBody}
          </main>
          ${renderStudentBottomNav(stats)}
        </div>
      `;

      const toastHtml = state.toastMessage ? `
        <div class="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-slate-900/95 text-white text-xs font-bold shadow-xl flex items-center gap-2 animate-fadeIn">
          <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
          <span>${escapeHtml(state.toastMessage)}</span>
        </div>
      ` : '';

      const activeEl = document.activeElement;
      const activeId = activeEl && activeEl.id ? activeEl.id : null;
      let selStart = null, selEnd = null;
      if (activeId && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
        try {
          selStart = activeEl.selectionStart;
          selEnd = activeEl.selectionEnd;
        } catch (e) {}
      }

      appEl.innerHTML = contentHtml + renderModals() + toastHtml;

      if (activeId) {
        const nextEl = document.getElementById(activeId);
        if (nextEl) {
          try {
            nextEl.focus({ preventScroll: true });
            if (selStart !== null && selEnd !== null && typeof nextEl.setSelectionRange === 'function') {
              nextEl.setSelectionRange(selStart, selEnd);
            }
          } catch (e) {}
        }
      }

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    // 初期ロード＆描画
    loadPersonalData();
    render();
  </script>
</body>
</html>
