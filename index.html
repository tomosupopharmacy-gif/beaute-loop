      "q45_50": "【正解】（1）\n(1)○：フルウェーブ（1つの完全な波）を形成するのに必要な毛髪の長さは、使用するロッドの円周の「3回転分（約2.5〜3回転）」です。\n(2)×：ウェーブの大小は放置タイムではなく「ロッドの太さ」によって決まります。\n(3)×：毛先は根元（新生部）に比べてダメージがあり薬剤が浸透しやすいため、パーマが「かかりやすい」部分です。\n(4)×：トリートメント巻きは「かかりやすい（傷んでいる）部分」の作用をセーブするために用います。",
      "q45_51": "【正解】（4）\n(1)○・(2)○・(3)○：ピボットポイント、カールステムの定義、フラットカールの説明はいずれも正しい記述です。\n(4)×（誤り）：仕上がり時の「ボリューム（立ち上がり）」に関係するのはステムの「角度（エレベーション）」であり、ステムの「方向（ディレクション）」は仕上がり時の「毛流れの方向」に関係します。",
      "q45_52": "【正解】（1）\n(1)○：スカルプチュアカールはストランドの根元から巻き始める「根元巻き方式」のピンカールです。\n(2)×：リフトカールはシェーピングカールの一種です。\n(3)×：メイポールカールは「ストランドカール」に分類されます。\n(4)×：クロッキノールカールは毛先から巻く「毛先巻き方式」です。",
      "q45_53": "【正解】（4）\n色相環の反対側に位置する【A：補色】どうしを混ぜると互いの色みを打ち消し合います。黄色の補色は紫、赤の補色は緑であるため、黄色く退色した髪には【B：紫系】の色素、赤みのある髪には【C：緑系（マット系）】の色素をもつヘアカラーで染めるとナチュラルな色みに仕上がります。",
      "q45_54": "【正解】（3）\n(1)×：眉毛をカットする際は眉頭から眉尻にかけて全体の毛流れと長さを均一に整えます。\n(2)×：眉を描く際は眉尻から眉頭まで一気に描くのではなく、眉山〜眉尻、眉の中間、眉頭の順に1本ずつまたはぼかしながら自然に描きます。\n(3)○：眉山の位置は「黒目の外側の端と目尻の延長線の間（白目のほぼ中央上）」にとるのが基本プロポーションです。\n(4)×：ペンシルで眉毛を1本1本描く技法は「ドローイング」といいます（シェーディングはパウダー等で陰影をつける技法です）。",
      "q45_55": "【正解】（3）\n(1)×：まつ毛の毛周期は約3週間〜4か月程度です。\n(2)×：装着に最適なのはまつ毛の「成長期の終わりから退行期の初め」です。\n(3)○：皮膚への接触や毛穴詰まりを防ぐため、エクステンションは地肌（毛根部）から1〜2mmほど離してまつ毛1本につき1本接着します。\n(4)×：リペアは通常「2〜3週間」で行います。",
      "q44_01": "【正解】（3）\n(1)○：保健所の設置や役割を定める法律は「地域保健法」です。\n(2)○：感染症だけでなく生活習慣病や難病などの疾病予防も含まれます。\n(3)×（誤り）：地域保健法第6条により、保健所の業務には「人口動態統計その他の統計に関する事項」が明確に含まれています。\n(4)○：地域の実情や設置主体（都道府県・政令市等）により具体的業務が異なることがあります。",
      "q44_02": "【正解】（4）\n美容師法第1条（目的）の規定：「この法律は、美容師の【A：資格】を定めるとともに、美容の【B：業務】が適正に行われるように規律し、もって【C：公衆衛生】の向上に資することを目的とする。」したがって（4）が正解です。",
      "q44_03": "【正解】（3）\n(1)○：免許申請書には精神の機能の障害に関する医師の診断書を添付します。\n(2)○：過去に無免許で美容を業とした者には免許が与えられないことがあります。\n(3)×（誤り）：美容師が氏名を変更したときは、「30日以内に美容師名簿の訂正」を申請しなければなりません（免許証の書換え交付は任意申請であり、2か月以内という義務規定はありません）。\n(4)○：再交付後に紛失した免許証を発見したときは5日以内に返納しなければなりません。",
      "q44_04": "【正解】（1）\n(1)○：管理美容師の職務には、美容所という施設の衛生管理だけでなく、そこで行われる美容の業務の衛生管理も含まれます。\n(2)×：管理美容師は専任であり、同一人が複数の美容所の管理美容師を兼ねることはできません。\n(3)×：設置義務は「美容師である従業者」が常時2人以上いる場合です。\n(4)×：講習会を指定するのは厚生労働大臣ではなく「都道府県知事」です。",
      "q44_05": "【正解】（4）\n(1)×：美容所の開設届に添付する診断書は「結核・伝染性皮膚疾患等の有無」に関するものです。\n(2)×：従事する美容師が結核や伝染性皮膚疾患に罹患したときは、30日以内ではなく「速やかに」変更届（医師の診断書添付）を提出します。\n(3)×：施術料金は開設届の届出事項ではないため届出は不要です。\n(4)○：開設届出事項に変更が生じたときは速やかに届け出る義務があり、怠った場合は30万円以下の罰金に処されることがあります。",
      "q44_06": "【正解】（4）\n(1)○・(2)○・(3)○：出張美容の根拠（政令と条例）、婚礼等の参列者への直前の施術、出張美容時の衛生措置義務はすべて正しい記述です。\n(4)×（誤り）：出張美容が認められない場所で美容の業務を行った美容師に対する処分は「業務停止処分（行政処分）」であり、罰金刑が科されることはありません。",
      "q44_07": "【正解】（4）\n(1)○：医師法によりレーザー脱毛等の医療行為を美容師が行うことは禁止されています。\n(2)○：日本政策金融公庫による生活衛生関係営業への融資制度があります。\n(3)○：生衛法に基づき厚生労働大臣が美容業の振興指針を定めています。\n(4)×（誤り）：個人情報保護法は法改正により「5,000人を超える個人情報」という制限が撤廃され、顧客データ数の多少にかかわらず個人情報を取り扱うすべての事業者が規制対象となっています。",
      "q44_08": "【正解】（2）\n(1)○：所得税・法人税は利益（所得）が出ているときに支払う税金です。\n(2)×（誤り）：従業員の給与に対する源泉所得税は、雇用主（事業主）が給与から天引きして預かり、原則として翌月10日までに税務署に納付する義務があります。\n(3)○：固定資産税は赤字でも支払う義務があります。\n(4)○：申告・納税義務を怠ると加算税や延滞税が課されます。",
      "q44_09": "【正解】（3）\n(1)○・(2)○・(4)○：20歳以上60歳未満の自営業者・学生の加入義務、遺族基礎年金、保険料の免除・納付猶予制度はいずれも正しい記述です。\n(3)×（誤り）：国民年金の第1号被保険者（自営業者・学生等）の保険料は、所得の多少にかかわらず「全国一律の定額」です。",
      "q44_10": "【正解】（1）\n（1）「育児休業給付」は雇用保険から支給される給付です。（2）障害補償給付、（3）療養補償給付、（4）遺族補償給付はいずれも「労災保険（労働者災害補償保険）」の給付です。",
      "q44_11": "【正解】（2）\n(1)○・(3)○・(4)○：妊婦の喫煙リスク（低出生体重児・早産）、受動喫煙による小児ぜんそく、たばこ煙の発がん物質は正しい記述です。\n(2)×（誤り）：日本の20歳以上の男性の喫煙者率は上昇しておらず、長期的に「減少（低下）傾向」にあります。",
      "q44_12": "【正解】（4）\n(1)×：2015年の日本の高齢化率（65歳以上人口割合）は「26.6%」であり、15%を大きく超えています。\n(2)×：日本の高齢化率は欧米諸国よりも高く、世界最高水準です。\n(3)×：高齢化率は2015年以降もさらに上昇し続けています。\n(4)○：日本の高齢化の進行スピード（高齢化率が7%から14%に達するまでの倍加年数＝24年など）は、欧米諸国よりもはるかに速いのが特徴です。",
      "q44_13": "【正解】（4）\n(1)○・(2)○・(3)○：心の健康とQOL、うつ病の早期発見・治療、睡眠指針2014の策定は正しい記述です。\n(4)×（誤り）：日本の自殺死亡率は1958年以降一定（不変）ではなく、社会・経済状況等により大きく変動しています。",
      "q44_14": "【正解】（3）\n(1)○・(2)○・(4)○：ダニの死骸・ふんによるアレルギー、暖房普及による通年被害、殺虫剤の注意は正しい記述です。\n(3)×（誤り）：カビ（真菌）の胞子は吸入すると気管支ぜんそくやアレルギー性鼻炎、過敏性肺炎などの「アレルギー反応を引き起こす」代表的なアレルゲンです。",
      "q44_15": "【正解】（1）\n(1)×（誤り）：浮遊粒子状物質（SPM）とは、大気中に浮遊する粒子状物質のうち粒径が1ミリメートル以上ではなく「10マイクロメートル（10μm＝0.01mm）以下」のものをいいます。\n(2)○・(3)○・(4)○：はいずれも浮遊粒子状物質に関する正しい記述です。",
      "q44_16": "【正解】（3）\n(1)×：2分裂で増殖するのは「細菌」です。\n(2)×：DNAとRNAの両方を持つのは細菌等であり、ウイルスは「DNAかRNAのどちらか一方のみ」を持ちます。\n(3)○：ウイルスは生きた宿主細胞内でのみ増殖できます。\n(4)×：ウイルスはしばしば突然変異を起こします。",
      "q44_17": "【正解】（2）\n(1)○・(3)○・(4)○：常在細菌の定着、腸内細菌のビタミン産生、外来病原体の侵入防止は正しい記述です。\n(2)×（誤り）：鼻腔や皮膚に常在する黄色ブドウ球菌は、手指等を介して傷口や食品に入ると化膿症や食中毒の「感染源」となります。",
      "q44_18": "【正解】（1）\n(1)×（誤り）：予防接種の対象疾病や実施方法を定めている法律は、健康増進法ではなく「予防接種法」です。\n(2)○・(3)○・(4)○：定期接種と臨時接種、対象疾病ごとの接種回数・対象年齢の違いはいずれも正しい記述です。",
      "q44_19": "【正解】（3）\n患者や保菌者によって汚染されたタオルや器具等への接触を原因として皮膚に感染するのは、ブドウ球菌等による（3）「伝染性膿痂疹（トビヒ）」です。（1）日本脳炎と（2）マラリアは蚊が媒介し、（4）破傷風は土壌から傷口へ感染します。",
      "q44_20": "【正解】（3）\n(1)×：B型肝炎の潜伏期は約1週間ではなく「約1〜6か月」です。\n(2)×：血液を介して感染するため、レザーやシザーズによる皮膚の傷から感染する危険があります。\n(3)○：B型肝炎の母子感染予防や乳児の感染予防にはワクチン（および免疫グロブリン）の投与が有効であり、現在は定期接種化されています。\n(4)×：感染者が長期間ウイルスを保有し続ける「持続性感染（キャリア化）」が起こることがあります。",
      "q44_21": "【正解】（4）\n(1)×：湿熱の方が乾熱より熱伝導と浸透が良いため、湿熱の方が短時間で消毒できます。\n(2)×：煮沸消毒（沸騰後2分以上）の方が蒸気消毒（80℃超・10分以上）より短時間で消毒できます。\n(3)×：消毒薬による消毒は低温より適度な温度（20℃前後以上）で行った方が有効です。\n(4)○：消毒薬には消毒対象や血液付着の有無によってそれぞれ適した実用濃度があります。",
      "q44_22": "【正解】（3）\n「血液が付着している」器具の法定消毒法は、①次亜塩素酸ナトリウム0.1%以上水溶液に10分間以上浸す（c）、②沸騰後2分間以上煮沸する（d）、③消毒用エタノールに10分間以上浸す、の3種類のみです。aの紫外線照射とbのエタノール清拭は血液付着器具には使用できません。よって正しい組合せは cとd の（3）です。",
      "q44_23": "【正解】（2）\na×：両性界面活性剤は結核菌に効果が「あります」。\nb○：逆性石けんは陰イオン界面活性剤（普通石けんや一部の中性洗剤成分）と混ざると効果が低下します。\nc○：グルコン酸クロルヘキシジンは細菌の芽胞には効果がありません。\nd×：消毒用エタノールは逆性石けんと併用しても効果は低下しません。\nよって正しい組合せは bとc の（2）です。",
      "q44_24": "【正解】（1）\n(1)×（誤り）：普通石けんと反応して殺菌力が失われるため併用できないのは「逆性石けん（陽イオン界面活性剤）」や「両性界面活性剤」であり、次亜塩素酸ナトリウムは石けんと反応して不活化することはありません。\n(2)○・(3)○・(4)○：有機物による効力低下、酸性洗剤との混合による塩素ガス発生、冷暗所保存はいずれも次亜塩素酸ナトリウムの正しい記述です。",
      "q44_25": "【正解】（2）\n【希釈計算】10%逆性石けん原液から0.1%水溶液を作る希釈倍数は 10% ÷ 0.1% ＝「100倍希釈」です。原液1mLを100倍（全量100mL）にするには、100mL － 1mL ＝「水99mL」を加えるため、（2）が正解です。",
      "q44_26": "【正解】（2）\n顔面の中央を縦に通る「正中線上」には、上から（3）鼻根 →（1）鼻背（鼻筋） →（4）鼻尖（鼻先）が並んでいますが、小鼻である（2）「鼻翼（びよく）」は左右一対あり正中線上にはありません。",
      "q44_27": "【正解】（2）\n頸部（首）の側面を斜めに走り、頭を曲げたり回転させたりする頸部の筋は（2）「胸鎖乳突筋」です。（1）咬筋は頭部の咀嚼筋、（3）三角筋は肩の筋、（4）広背筋は背部の筋です。",
      "q44_28": "【正解】（1）\n中枢神経のうち「脳」に含まれるのは脳幹の一部である（1）「延髄」です。（2）胸髄、（3）頸髄、（4）仙髄はいずれも「脊髄」の区分です。",
      "q44_29": "【正解】（2）\n内耳は聴覚器の（1）蝸牛と、平衡感覚器の（3）前庭・（4）半規管の3部からなります。（2）「鼓膜」は外耳道と中耳の境にある膜であり、内耳には含まれません。",
      "q44_30": "【正解】（3）\n血球成分のうち、（3）「血小板」は血管が傷ついたときに凝集して止血し「血液凝固」に働く機能を持っています。（1）酸素の運搬は赤血球、（2）造血作用は赤色骨髄、（4）食作用は白血球（好中球・マクロファージ）の機能です。",
      "q44_31": "【正解】（3）\n(1)○・(2)○・(4)○：皮膚の3層構造、基底細胞から角質細胞への角化、ランゲルハンス細胞の抗原提示機能はいずれも正しい記述です。\n(3)×（誤り）：表皮細胞の約95%を占める角化細胞（ケラチノサイト）は「ケラチン（角質タンパク質）をつくる細胞」です。メラニンをつくる細胞は「色素細胞（メラノサイト）」です。",
      "q44_32": "【正解】（4）\n(1)○・(2)○・(3)○：毛母の色素細胞、毛周期の3期、爪のケラチン成分は正しい記述です。\n(4)×（誤り）：脂腺は体の部位によって分布密度が大きく異なり、頭皮や顔面（額・鼻などのTゾーン）、胸・背中上部には非常に多く分布し、四肢には少なく、手掌（手のひら）や足底にはまったく存在しません。",
      "q44_33": "【正解】（2）\n(1)×：紫外線照射によってつくられ皮膚を黒くするのはエラスチンではなく「メラニン」です。\n(2)○：真皮の大部分を占める膠原線維（コラーゲン）は、弾性線維とともに機械的外力に対する保護の働きをしています。\n(3)×：冷たさを感じる点は温点ではなく「冷点」といいます。\n(4)×：皮膚で体温調節を積極的に行っているのは脂腺ではなく「汗腺（エクリン腺）と皮膚血管（毛細血管）」です。",
      "q44_34": "【正解】（1）\n(1)×（誤り）：思春期に脂腺が発育して皮脂の分泌が多くなるのは、女性ホルモンではなく「男性ホルモン（アンドロゲン）」の影響です。\n(2)○・(3)○・(4)○：糖尿病の易感染性と末梢神経障害（知覚鈍麻）、肝障害による黄疸はいずれも正しい記述です。",
      "q44_35": "【正解】（1）\n(1)○：頭部白癬（シラクモ）は白癬菌（カビ）による感染症で、イヌやネコなどのペットから感染することがあります。\n(2)×：疥癬（ヒゼン）は昆虫のシラミではなくダニの一種である「ヒゼンダニ」の寄生によって起こります。\n(3)×・(4)×：毛包が角質栓で詰まり皮脂が貯留してアクネ菌等で炎症を起こすのは「尋常性痤瘡（ニキビ）」であり、膿が他の皮膚に付いて感染が広がるのはブドウ球菌等による「伝染性膿痂疹（トビヒ）」です（(3)と(4)の説明が入れ替わっています）。",
      "q44_36": "【正解】（1）\n(1)○：メチルポリシロキサン（ジメチコン）は代表的な「シリコーン油」です。\n(2)×：ワセリンは石油から得られる「炭化水素」です。\n(3)×：ホホバ油は植物の種子から得られる液状の「植物性ロウ（ロウ類）」です。\n(4)×：セタノールは「高級アルコール」です。",
      "q44_37": "【正解】（2）\n(1)○・(3)○・(4)○：エマルジョンの定義、両親媒性分子、臨界ミセル濃度以上での乳化作用は正しい記述です。\n(2)×（誤り）：油相（外相）の中に水滴（内相）が分散している乳化型は「W/O型（油中水滴型）」といいます（O/W型＝水中油滴型は水相の中に油滴が分散しているタイプです）。",
      "q44_38": "【正解】（2）\n(1)○：パラベンは防腐剤です。\n(2)×（誤り）：パラフィンは炭化水素系の「油性原料」であり、金属イオン封鎖剤（キレート剤）ではありません（キレート剤はエデト酸塩＝EDTAなどです）。\n(3)○：パラアミノ安息香酸エステルは紫外線吸収剤です。\n(4)○：BHTは酸化防止剤です。",
      "q44_39": "【正解】（1）\nパーマ剤第1剤のアルカリ剤は、pHが高いほど毛髪の膨潤度が【A：大きく】なります。アンモニア水とモノエタノールアミンがpHを大きく上昇させるのに必要な配合量はともに【B：少ない】ですが、アンモニア水は【C：揮発】性が高く作用時間中に徐々に弱まるのに対し、モノエタノールアミンは不揮発性のため毛髪に残留・持続しやすい特徴があります。",
      "q44_40": "【正解】（3）\n(1)○：一時染毛料はタール色素等を毛髪表面に付着させて着色します。\n(2)○：脱色剤（ブリーチ）はメラニン色素を酸化分解します。\n(3)×（誤り）：「酸化染毛剤」は毛髪内部で酸化染料が重合して染着する「永久染毛剤」であり、約2〜3か月持続します（1回のシャンプーで色落ちするのは「一時染毛料」です）。\n(4)○：染料中間体とカップラー（調色剤）により多様な色調に染められます。",
      "q44_41": "【正解】（2）\n(1)○：大正時代には松井須磨子らの新劇女優から「女優髷」が流行しました。\n(2)×（誤り）：「二百三高地髷」は日本髪ではなく、また大正時代ではなく「明治時代（日露戦争期）」に流行した西洋束髪です。\n(3)○：マーセルアイロンでウェーブをつけ耳を隠す「耳隠し」が大正時代に流行しました。\n(4)○：大正末期には断髪（ボブヘア）のモダンガール（モガ）が登場しました。",
      "q44_42": "【正解】（1）\n(1)×（誤り）：来日して日本に「立体裁断（ドレーピング）」の技術とオートクチュールを伝えたのは女優のソフィア・ローレンではなく、フランスのデザイナー「ピエール・カルダン（1958〜1959年）」やクリスチャン・ディオールらです。\n(2)○・(3)○・(4)○：メアリー・クワントのミニスカート、銀座のみゆき族、山本耀司・川久保玲の「黒の衝撃」はいずれも正しい記述です。",
      "q44_43": "【正解】（2）\n(1)○：昼間の正式礼装はモーニングコートです。\n(2)×（誤り）：昼間の略式礼装（準礼装）は「ディレクターズスーツ」です。「メスジャケット」は夏季や熱帯地域での「夜間の略式礼装」として着用される短い白等のジャケットです。\n(3)○：夜の正式礼装は燕尾服です。\n(4)○：夜の略式礼装（準礼装）はタキシードです。",
      "q44_44": "【正解】（4）\n(1)○・(2)○・(3)○：てこの原理、薬指孔側が静刃、2枚の刃の剪断応力はいずれも正しい記述です。\n(4)×（誤り）：シザーズは閉じたときに動刃と静刃の間に裏スキと刃線のソリによる「凸レンズ状のあき（すき間）」が正確につくられているものが、摩擦が少なく交点一点でスムーズに切れる良いシザーズです（あきがないと刃面全体がこすれて切れません）。",
      "q44_45": "【正解】（2）\n(1)○・(3)○・(4)○：プレーンリンシング、ヘアトリートメントの目的、パーマ・カラー後の酸リンスはいずれも正しい記述です。\n(2)×（誤り）：石けんシャンプーは弱アルカリ性で毛髪が膨潤し金属石けん（石けんカス）が付着しやすいため、使用後にはクエン酸などの「弱酸性のリンス剤（酸性リンス）」を用いて中和・収れんさせるのが適しています。",
      "q44_46": "【正解】（4）\n図のソバージュヘアは、根元から毛先まで【A：細かい】ウェーブを付けた髪が裾に向かって三角形・【B：直線的】に広がり、野性的で【C：強い】印象を与えるスタイルです。したがって（4）が正解です。",
      "q44_47": "【正解】（3）\nパネルを頭皮に対して90度より高い角度（アップステム）に引き上げてシェープしてカットすると、上層（トップ）が短く下層（裾）が長くなる（3）「レイヤースタイル」になります。",
      "q44_48": "【正解】（4）\n(1)○・(2)○・(3)○：エンドテーパー、ノーマルテーパー（毛先1/3）、ディープテーパー（根元近くから）の説明は正しいです。\n(4)×（誤り）：パネルの内側の面をテーパーする技法は「インサイドテーパーカット」です。「ポインティングカット」は毛先を不揃いに尖らせて動きをつける技法です。",
      "q44_49": "【正解】（1）\nワインディングのロッドにかかる力の図において、「髪につやと美しいウェーブを持たせるために毛束を引く力（テンション）」を表しているのは、上向きに毛束を引き上げている矢印（1）です。",
      "q44_50": "【正解】（4）\nサイドのスライスを縦に取り、顔周りから後方（バック方向）に向かって強い方向性（毛流れ）をつけるようにロッドを配列して巻くスタイルは（4）「リーゼントスタイル」です。",
      "q44_51": "【正解】（3）\nヘアウェーブの図において、Aのウェーブの谷底（くぼみの中心）は「トロー」、Bの斜面と斜面がぶつかる山の稜線は「リッジ」、Cのウェーブが開いている端は「オープンエンド」、DのウェーブがU字に折り返して閉じている端は「クローズドエンド」です。したがって（3）が正解です。",
      "q44_52": "【正解】（2）\n(1)×：過去の染毛で感作されて抗体ができている場合があるため、パッチテストは「毎回（施術のたびごとに）」行う必要があります。\n(2)○：テスト液は実際に使用する第1剤と第2剤を指定された割合で混合して作ります。\n(3)×：腕の外側ではなく皮膚の柔らかい「腕の内側」に、「10円硬貨大」に薄く塗って自然乾燥させます。\n(4)×：観察は「塗布30分後」と「48時間後」の2回行います。",
      "q44_53": "【正解】（4）\n(1)○・(2)○・(3)○：スクエア、オーバル、スクエアオフの説明は正しいです。\n(4)×（誤り）：先にいくにつれて細くなったアーモンド形をいうのは「ポイント（アーモンド）」です。「ラウンド」はサイドがストレートで先端に緩やかな円みを持たせた形です。",
      "q44_54": "【正解】（1）\n(1)×（誤り）：まつ毛エクステンションのグルー（シアノアクリレートや微量のホルムアルデヒド等）による刺激性接触皮膚炎や、過去に他製品で感作されていた場合のアレルギー性接触皮膚炎は、「初回の施術であっても発症すること」があります。\n(2)○・(3)○・(4)○：はいずれも正しい記述です。",
      "q44_55": "【正解】（2）\n着物各部の図において、Aは袖の横幅である「袖幅」、Bは袖と身頃を縫い合わせた部分の「袖付（そでつけ）」、Cは脇のあき部分である「身八つ口」、Dは背中心から袖先までの長さである「裄（ゆき）」です。よって（2）が正解です。",
      "q43_01": "【正解】（3）\n(1)○・(2)○・(4)○：公衆衛生の向上、美容師の資格と無免許営業の禁止、美容業務の適正な規律はいずれも美容師法に定められています。\n(3)×（誤り）：「美容業の振興を図る方策」について定めているのは美容師法ではなく「生活衛生関係営業の運営の適正化及び振興に関する法律（生衛法）」です。",
      "q43_02": "【正解】（2）\n(1)×：試験に合格しただけでは自動的に交付されず、免許申請を行って美容師名簿に登録される必要があります。\n(2)○：美容師が氏名（または本籍地都道府県名）を変更したときは、30日以内に美容師名簿の訂正を申請しなければなりません。\n(3)×：免許証再交付の申請先は都道府県知事ではなく「厚生労働大臣（指定登録機関）」です。\n(4)×：住所は免許証の記載事項ではないため、住所変更による書換え交付申請は不要です。",
      "q43_03": "【正解】（3）\n美容所の開設届出事項には、(1)構造及び設備の概要、(2)美容師の氏名及び登録番号、(4)美容師以外の従業者の氏名は含まれますが、（3）「美容師の労働時間」は労働契約上の事項であり美容所開設届の届出事項には該当しません。",
      "q43_04": "【正解】（1）\n美容師法では、美容師および【A：美容所の開設者】が講ずべき衛生上必要な措置については、法律・政令・省令だけでなく地域の実情に応じ【B：都道府県等の条例】でも定められることになっています。また、美容師が衛生上必要な措置を講じなかったときは都道府県知事等から【C：業務の停止処分】を受けることがあります。",
      "q43_05": "【正解】（4）\n(1)×：心身の障害（精神機能の障害）により業務を適正に行えない場合は、業務停止処分ではなく「免許取消処分」の対象です。\n(2)×：美容所以外の場所で業を行った場合は「業務停止処分」の対象です（直接の免許取消処分ではありません）。\n(3)×：立入検査を正当な理由なく拒んだ場合は「30万円以下の罰金」の対象であり、閉鎖命令ではありません。\n(4)○：美容師が常時2人以上従事する美容所に管理美容師を置かなかった開設者は、美容所の「閉鎖命令」を受けることがあります。",
      "q43_06": "【正解】（2）\n(1)○・(3)○・(4)○：適正化規程の全廃、生活衛生営業指導センターの目的、標準営業約款の目的は正しい記述です。\n(2)×（誤り）：美容業の「振興指針」は、都道府県知事ではなく「厚生労働大臣」が定め、また組合員のみではなく「業界全体」を対象としています。",
      "q43_07": "【正解】（3）\n(1)○：美容師法では伝染性疾病にかかった美容師の業務停止を定めています。\n(2)○：感染症法では結核等の患者が接客業務等に従事することの制限（就業制限）を定めています。\n(3)×（誤り）：「消費者基本法」は消費者の権利の尊重や自立の支援に関する基本理念を定めた法律であり、従業者の感染症による就業禁止については定めていません。\n(4)○：労働安全衛生法では事業者が伝染性の疾病にかかった労働者の就業を禁止することを定めています。",
      "q43_08": "【正解】（3）\n商品やサービスの提供時に顧客から代金と一緒に直接預かり、後日事業者がまとめて税務署に納める間接税は（3）「消費税」です。（1）所得税、（2）法人税、（4）固定資産税は事業者自身が負担して納める直接税です。",
      "q43_09": "【正解】（2）\n(1)×：法人が経営する美容所は、従業員数にかかわらず厚生年金保険および健康保険の「強制適用事業所」となります（任意選択ではありません）。\n(2)○：健康保険の被保険者期間が継続して2か月以上あった者は、退職後も2年間は「任意継続被保険者」として健康保険に加入し続けることができます。\n(3)×：育児休業期間中の健康保険・厚生年金保険の保険料は、申出により本人負担分・事業主負担分ともに「免除」されます。\n(4)×：20歳以上60歳未満の自営業者や学生は国民年金への加入義務があります。",
      "q43_10": "【正解】（4）\n（1）療養補償給付、（2）休業補償給付、（3）遺族補償給付はいずれも業務上の傷病・死亡に対する「労災保険（労働者災害補償保険）」の給付ですが、（4）「育児休業給付」は「雇用保険」の給付です。",
      "q43_11": "【正解】（3）\n(1)×：保健所は都道府県だけでなく、政令指定都市・中核市・その他の政令で定める市・特別区も設置できます。\n(2)×：美容所の検査や監視指導は保健所の重要な業務です。\n(3)○：保健所には所長をはじめ「医師」が配置されることとなっています。\n(4)×：難病（治療方法が確立していない疾病等）により長期療養を必要とする者の保健も地域保健法に定める保健所の業務です。",
      "q43_12": "【正解】（1）\n(1)○：2015年の日本の出生数は約100.6万人、死亡数は約129万人であり、「出生数は死亡数よりも少ない」自然減の状態です。\n(2)×：2015年の合計特殊出生率は「1.45」であり、2.0には達していません。\n(3)×：高齢化に伴い、悪性新生物（がん）による死亡数は2005年と比べて「増加」しています。\n(4)×：日本の乳児死亡率は出生1,000に対して「約1.9（2前後）」と世界最高水準の低さであり、10ではありません。",
      "q43_13": "【正解】（3）\n(1)○・(2)○・(4)○：健康日本21（第2次）の歩数目標、生活習慣病予防、運動による良質な睡眠は正しい記述です。\n(3)×（誤り）：健康を維持・増進するためには、短時間の激しい運動（無酸素運動）ではなく、ウォーキングなどの「無理のない適度な有酸素運動を継続的に行うこと」が有効です。",
      "q43_14": "【正解】（4）\n(1)○：自然光を室内に取り入れることを採光といいます。\n(2)○：照らされる面の明るさの度合いを照度（単位：ルクス）といいます。\n(3)○：機械換気にはファンで給気する送気式や排気式、併用式があります。\n(4)×（誤り）：液体が蒸発するときに周囲から熱を奪う「気化熱（蒸発熱）」は、打ち水や発汗・冷房（冷却）に利用される原理であり、暖房ではありません。",
      "q43_15": "【正解】（2）\n狭い室内に多くの人がいると、人の呼気（呼吸）に含まれる水蒸気や【A：二酸化炭素】によって室内の空気が汚染されます。また、開放型のガスや石油ストーブの燃焼による暖房は、室内に【B：二酸化炭素ガス】（不完全燃焼時は一酸化炭素も）を排出し、換気不足になると不快感や酸素不足を起こします。",
      "q43_16": "【正解】（1）\n感染症法において、美容師が感染した場合に就業制限の対象となる感染症は、二類感染症である（1）「結核」です。",
      "q43_17": "【正解】（2）\n患者の咳やくしゃみのしぶきによって主として「飛沫感染」するのは（2）「インフルエンザ」です。（1）ポリオ（急性灰白髄炎）は経口感染、（3）エイズは血液・性的接触感染、（4）日本脳炎は蚊媒介感染です。",
      "q43_18": "【正解】（2）\n(1)×：ウイルスは芽胞をつくりません（芽胞をつくるのは破傷風菌や炭疽菌などの一部の細菌です）。\n(2)○：芽胞は厚い殻に包まれた休眠形態であり、100℃の加熱や乾燥、多くの消毒薬に対して極めて強い抵抗性を持っています。\n(3)×：結核菌は芽胞をつくりません。\n(4)×：細菌が盛んに分裂・増殖している通常の状態を「栄養型」といい、環境が悪化したときに休眠状態の「芽胞」をつくります（芽胞が発芽すると栄養型に戻ります）。",
      "q43_19": "【正解】（3）\n(1)○・(2)○・(4)○：学校や事業所等での集団感染、2週間以上続く咳・痰・微熱・寝汗などの初期症状、BCGワクチンによる予防接種は正しい記述です。\n(3)×（誤り）：かつて（戦前〜昭和20年代）は結核死亡率のピークが青年期（若年層）にありましたが、近年の日本における結核患者および死亡率のピークは「高齢者（70歳〜80歳代以上）」にあります。",
      "q43_20": "【正解】（4）\n(1)○：B型肝炎の潜伏期は1〜6か月です。\n(2)○：病原体はB型肝炎ウイルス（HBV）です。\n(3)○：感染源はウイルスを含むヒトの血液や体液です。\n(4)×（誤り）：B型肝炎には有効な「予防ワクチン（B型肝炎ワクチン）があり」、母子感染防止や乳児の定期予防接種、医療従事者への接種が行われています。",
      "q43_21": "【正解】（4）\n(1)○・(2)○・(3)○：消毒前の十分な洗浄、血液付着の有無による区分、刷毛・くしが皮膚に接する器具であることは正しい記述です。\n(4)×（誤り）：美容所における器具・布片の消毒は、美容師法施行規則に定められた法定の消毒方法（理学的・化学的消毒法）の中から選んで実施しなければならず、法定以外の方法を勝手に用いることはできません。",
      "q43_22": "【正解】（4）\na○：血液が付着していないはさみに85μW/cm²以上の紫外線を20分間以上照射するのは正しい法定消毒法です。\nb×：血液が付着したくしに逆性石けんは使用できません（血液付着時は煮沸・エタノール浸漬・0.1%以上次亜塩素酸ナトリウム浸漬の3法のみ）。\nc×：かみそりの次亜塩素酸ナトリウム消毒や血液付着リスクへの対応として、本問ではaとdが確実な正答組合せです。\nd○：血液が付着した蒸しタオルを沸騰後2分間以上煮沸するのは正しい法定消毒法です。\nよって正しい組合せは aとd の（4）です。",
      "q43_23": "【正解】（1）\n(1)×（誤り）：希釈した逆性石けん水溶液や両性界面活性剤等の薬液は、細菌汚染や効力低下を防ぐため、7日ごとではなく「毎日（1日ごとに）」新しいものと取り換えます。\n(2)○・(3)○・(4)○：エタノール清拭の特徴、次亜塩素酸ナトリウムの温度影響、紫外線ランプの寿命（2,000〜3,000時間）はいずれも正しい記述です。",
      "q43_24": "【正解】（2）\n(1)○：両性界面活性剤は一般細菌だけでなく結核菌に対しても殺菌効果があります。\n(2)×（誤り）：両性界面活性剤も、血液や皮脂などの「多量の有機物（汚れ）があると殺菌力が低下」するため、消毒前に十分な洗浄が必要です。\n(3)○：日光に対して比較的安定しています。\n(4)○：普通の石けんと併用すると陽イオン部分の働きが妨げられ消毒力が低下します。",
      "q43_25": "【正解】（1）\na○：希釈倍数（倍）は「溶液全体の量 ÷ 原液（溶質）の量」で求められます。\nb○：薬品の臭いを嗅ぐときは直接鼻を近づけず、手で口をあおいで嗅ぎます。\nc×：メスシリンダーの目盛りは、真横から液面のくぼみの「最も低い部分（メニスカスの底）」を読みます。\nd×：薬品を注ぐときは、液だれでラベルが汚れて読めなくなるのを防ぐため、「ラベルを上（手のひら側）にして持って」注ぎます。\nよって正しい組合せは aとb の（1）です。",
      "q43_26": "【正解】（1）\n自分の意思で腕などの骨格筋（随意筋）を動かすとき、脳や脊髄（中枢神経系）からの指令を骨格筋に伝える末梢神経は（1）「運動神経」です（感覚を中枢へ伝えるのが知覚神経＝感覚神経です）。",
      "q43_27": "【正解】（4）\n交感神経が優位に機能したときは、(1)心臓の心拍数は「増加」し、(2)唾液は「粘性の高い濃厚な唾液が少量」分泌され、(3)気管支は「拡張」し、（4）眼の「瞳孔は散大（拡大）」します。したがって正しい組合せは（4）です。",
      "q43_28": "【正解】（3）\n耳の器官のうち、回転運動を感知する平衡器官は内耳にある（3）「半規管（三半規管）」です。（1）耳小骨と（2）蝸牛は聴覚器、（4）耳管は中耳と咽頭をつなぐ管です。",
      "q43_29": "【正解】（3）\n白血球の一種である「リンパ球（T細胞・B細胞・NK細胞）」の機能は、ウイルスや異物を攻撃したり抗体を作ったりする（3）「免疫反応」です。（1）酸素運搬は赤血球、（2）二酸化炭素運搬は主に血漿（と赤血球）、（4）血液凝固は血小板の機能です。",
      "q43_30": "【正解】（2）\n心臓（右心室）から出てガス交換を行い左心房へ戻る血液の「小循環（肺循環）」の経路に含まれる臓器は（2）「肺」です。（1）脳、（3）肝臓、（4）筋肉はいずれも大循環（体循環）の経路に含まれます。",
      "q43_31": "【正解】（3）\n(1)○・(2)○・(4)○：表皮の4層構造、角化の定義、メラノサイトの働きはいずれも正しい記述です。\n(3)×（誤り）：角質層は外的刺激の強い「手掌（手のひら）や足底で最も厚く」、顔面（特に眼瞼）や手足の屈曲部（内股や肘の内側）では「薄く」なっています（厚いと薄いが逆です）。",
      "q43_32": "【正解】（2）\n(1)○・(3)○・(4)○：含硫タンパク質のケラチン、毛流の規則性、毛幹と毛根の区分は正しい記述です。\n(2)×（誤り）：毛の3層構造は、中心から外に向かって順に「毛髄質（メデュラ） → 毛皮質（コルテックス） → 毛小皮（キューティクル）」です（毛小皮と毛皮質の順番が逆になっています）。",
      "q43_33": "【正解】（2）\n(1)○・(3)○・(4)○：日光紅斑（サンバーン）と水疱、脂肪膜とケラチンの保護、皮脂と汗の役割は正しい記述です。\n(2)×（誤り）：皮膚の表面は皮脂膜に覆われ角質層も角質細胞間脂質で満たされているため、水溶性物質ははじかれやすく、「脂溶性物質（油に溶けやすい物質）のほうが経皮吸収されやすい」性質があります。",
      "q43_34": "【正解】（4）\n(1)○・(2)○・(3)○：内臓疾患と皮膚変化、ふけ症（脂性・乾性）、脂性肌の特徴はいずれも正しい記述です。\n(4)×（誤り）：皮膚の老化は個人の素因（加齢）だけでなく、紫外線（光老化）や乾燥などの「環境の影響」を強く受けます。",
      "q43_35": "【正解】（1）\n(1)○：尋常性毛瘡（カミソリカブレ）は、ひげそり等の小傷からブドウ球菌などの「化膿菌（細菌）」が毛包に感染して起こります。\n(2)×：伝染性膿痂疹（トビヒ）の病原体は真菌ではなく「細菌（ブドウ球菌・レンサ球菌）」です。\n(3)×：疥癬（ヒゼン）の病原体は昆虫のシラミではなくダニの「ヒゼンダニ」です。\n(4)×：円形脱毛症はウイルス感染症ではなく、自己免疫異常やストレス等が原因の非感染性疾患です。",
      "q43_36": "【正解】（3）\n(1)○・(2)○・(4)○：エタノールの有機溶媒作用と収れん作用、イソプロパノールの殺菌防腐作用は正しい記述です。\n(3)×（誤り）：メタノール（メチルアルコール）は視神経障害（失明）など強い毒性を持つため、化粧品基準で配合が「禁止」されています。",
      "q43_37": "【正解】（2）\n(1)○・(3)○・(4)○：炭化水素の定義、油脂の酸敗、スクワランの製法と安定性は正しい記述です。\n(2)×（誤り）：高級脂肪酸と「グリセリン」とのエステルは「油脂（トリグリセリド）」です。「ロウ類」は高級脂肪酸と「高級アルコール」とのエステルです。",
      "q43_38": "【正解】（1）\n(1)×（誤り）：ノニオン（非イオン）界面活性剤は、水に溶かしたときに「イオン化しない（電荷を持たない）」界面活性剤です（親水基が陰イオンになるのはアニオン＝陰イオン界面活性剤です）。\n(2)○・(3)○・(4)○：石けん（陰イオン）、第四級アンモニウム塩（陽イオン）、両性界面活性剤の性質はいずれも正しい記述です。",
      "q43_39": "【正解】（4）\na○：パーマ剤第1剤中の還元剤（チオグリコール酸等）は、シスチン結合に水素を与えて切断します。\nb×：第2剤の酸化剤として、臭素酸ナトリウムよりも「過酸化水素の方が酸化力が強い」です。\nc×：モノエタノールアミンは第1剤において還元剤ではなく「アルカリ剤」として働きます。\nd○：第1剤中のアルカリ剤は毛髪を膨潤させ、ケラチンの「イオン結合（塩結合）」を切断します。\nよって正しい組合せは aとd の（4）です。",
      "q43_40": "【正解】（4）\n(1)×：アンモニア水は「アルカリ剤」です。\n(2)×：パラフェニレンジアミンは酸化染毛剤の「染料中間体（酸化染料）」です。\n(3)×：レゾルシンは酸化染毛剤の「調色剤（カップラー）」です。\n(4)○：チオグリコール酸はパーマ剤第1剤の「還元剤」であり正しい組合せです。",
      "q43_41": "【正解】（4）\n(1)○・(2)○・(3)○：鹿鳴館の影響、まがれいと・イギリス結び（西洋束髪）、束髪が和洋両方に似合ったことは正しい記述です。\n(4)×（誤り）：伝統的な「日本髪」は明治時代に入っても廃止されたわけではなく、島田髷や丸髷・銀杏返しなどが明治・大正時代を通じて広く結われ続けました。",
      "q43_42": "【正解】（1）\n(1)×（誤り）：ワンレングスカットとボディコンシャスな服を組み合わせた「ワンレン・ボディコン」が流行したのは1960年代ではなく、バブル景気期の「1980年代後半〜1990年頃」です。\n(2)○・(3)○・(4)○：みゆき族、ピーコック革命、プレタポルテ（高級既製服）時代の到来はいずれも1960年代の事象です。",
      "q43_43": "【正解】（3）\n(1)×：留袖の模様は裾模様（江戸褄模様）です。\n(2)×：黒留袖は「既婚女性のみ」の第一礼装であり、未婚女性は着用しません。\n(3)○：訪問着は肩から胸・袖・裾にかけて絵羽模様があり、未婚者・既婚者の区別なく準礼装として広く用いられます。\n(4)×：付け下げの模様は裾だけでなく肩や袖にも上向きにあしらわれています（ただし縫い目ではつながらない控えめな模様付けです）。",
      "q43_44": "【正解】（1）\n(1)○：電熱式アイロン等に内蔵された「サーモスタット」は、設定された一定の温度を自動的に保つ働きをします。\n(2)×：ハンドドライヤーは主に「ブロータイプ」であり、タービネートタイプはスタンド式等のドライヤーです。\n(3)×：一般のスタンドドライヤー（家庭用・業務用100V回路）の消費電力は1,000〜1,500W以下です。\n(4)×：ヘアスチーマーは乾熱ではなく「湿熱（水蒸気）」を利用して薬剤の浸透やトリートメント効果を高めます。",
      "q43_45": "【正解】（1）\n(1)×（誤り）：カチオン（陽イオン）界面活性剤は毛髪表面に吸着して「柔軟性（しなやかさ）や帯電防止効果（指通り改善）」を与えるリンス成分であり、傷んだ毛髪内部の「補修作用」に優れているのは加水分解ケラチン・コラーゲン（PPT）などのタンパク質誘導体や脂質成分です。\n(2)○・(3)○・(4)○：はいずれもトリートメントに関する正しい記述です。",
      "q43_46": "【正解】（2）\n(1)×：左サイドの前上がりライン（後ろから前に向かって上がるライン）を切る場合は、ハサミの刃の傾きに合わせて右肘を「下げる（左肘を上げる）」姿勢になります。\n(2)○：右から左へ下がるラインを切る場合は、カットラインの傾きと平行になるよう「左肘を下げる」と正確な角度で切ることができます。\n(3)×：目線の高さを調節する場合は背筋を曲げず、膝の屈伸や椅子の昇降で対応します。\n(4)×：握りこぶし1つ分では近すぎてハサミやコームが操作できないため、腕を軽く曲げた程度の適切な距離をとって立ちます。",
      "q43_47": "【正解】（3）\n(1)×：テストカールは第2剤ではなく「第1剤」がどの程度作用しているかチェックするために行います。\n(2)×：テストカールはかかりにくい部分やかかりやすい部分（トップ・サイド・ネープの中間的な太さのロッドなど複数箇所）で行います。\n(3)○：パーマのウェーブの大小は、使用する「ロッドの太さ（直径）」によって決まります。\n(4)×：タイム不足（作用不足）でウェーブがだれいている場合は、カール径がロッド直径の「2.5倍以上」に大きく広がってしまいます。",
      "q43_48": "【正解】（1）\nメイポールカールは、ストランドの【A：根元】から毛先に向かってスパイラル状に巻かれるため、毛先の【B：ウェーブ幅】は広く、根元の【C：弾力】は弱いフラットなカールになります。また、ベースの周囲を一定の形にスライスしてつくる【D：ストランドカール】に分類されます。",
      "q43_49": "【正解】（4）\nスキップウェーブの基本寸法において、Aのウェーブ幅は「3cm」、Bのクレストから次のループまでのスキップ幅は「1.5cm」、Cの合計幅（A＋B）は「4.5cm」です。したがって（4）が正解です。",
      "q43_50": "【正解】（2）および（1）\n【公式採点注記】（2）「酸化染毛剤は過酸化水素でメラニンを分解しながら発色するため、黒髪を明るい色に染毛することもできる」が本来の正解ですが、（1）の「脱染剤」も過硫酸塩と過酸化水素を含み酸化染料だけでなくメラニン色素も脱色する作用があるため、公式試験では（1）と（2）のいずれも正解として採点されました。（3）ヘアマニキュアは半永久染毛料、（4）一時染毛料は1回のシャンプーで落ちます。",
      "q43_51": "【正解】（2）\n(1)×：キューティクルをやわらかくし乾燥を防ぐ薬剤は「キューティクルリムーバーやキューティクルオイル」です（プッシャーは甘皮を押し上げる金属等の器具です）。\n(2)○：エメリーボードは自爪の長さやカット形状を整える（ファイリングする）ためのやすりです。\n(3)×：爪表面の凹凸を滑らかにするのは「バッファー」です。\n(4)×：足の指の間を開くために装着するのは「トゥセパレーター」です（フットパドルは足裏の角質を削る道具です）。",
      "q43_52": "【正解】（3）\n(1)×：施術中は安全のためコンタクトレンズは必ず外してもらいます。\n(2)×：リペアは通常「2〜3週間」で行います。\n(3)○：衛生面およびグルーの接着力を保つため、アイメイクアップ（マスカラやアイシャドウ等）は落としてから施術します。\n(4)×：過去に発症しなかった物質でも、その後の感作や体調によって新たにかぶれることがあります。",
      "q43_53": "【正解】（2）\nウェディングドレスの基本シルエットの図において、(1)はウエストからドーム状に大きく膨らむベルライン（ボールガウン）、（2）の上半身は体にフィットし縦の切り替え線（プリンセスシーム）に沿って裾へ自然に広がるシルエットが「プリンセスライン」、(3)はミディアム丈、(4)は膝付近までフィットし裾が人魚の尾のように広がるマーメイドラインです。",
      "q43_54": "【正解】（1）\n図のヘアスタイルは、顔の中心線（正中線）を軸として左右が全く同じ形・分量で釣り合っている「左右対称」のスタイルであり、デザインのバランスにおける（1）「シンメトリー」を表しています。",
      "q43_55": "【正解】（3）\n(1)×：炭素鋼は鉄を主成分（98%以上）とし、「炭素」が約0.6〜1.5%程度含まれている鋼です。\n(2)×：刃物用ステンレス鋼にはクロムが「約13%以上」含まれています。\n(3)○：炭素鋼はコバルト鋼などの特殊鋼に比べて加工性（鍛造や研ぎやすさ）がよい特徴があります。\n(4)×：炭素鋼はステンレス鋼に比べてさびやすい（ステンレス鋼の方がさびに強い）性質があります。",
      "q42_01": "【正解】(3) 美容師試験の実施\n・(3) 誤り（都道府県知事等の事務に含まれない）：美容師試験の実施は「厚生労働大臣（指定試験機関）」の事務です。\n・(1) 美容所の閉鎖命令、(2) 管理美容師講習会の指定、(4) 美容所開設届の受理は、いずれも都道府県知事（保健所設置市・特別区では市長・区長）の事務です。",
      "q42_02": "【正解】(4) 美容師が免許証を紛失したときは、住所地の都道府県知事、保健所を設置する市の市長又は特別区の区長に、免許証の再交付を申請することができる。\n・(4) 誤り：美容師免許証の再交付申請先は都道府県知事等ではなく、「厚生労働大臣（指定登録機関である公益財団法人理容師美容師試験研修センター）」です。\n・(1) 免許を付与したとき厚生労働大臣は美容師免許証を交付します。\n・(2) 合格しただけでは業務はできず、美容師名簿に登録されて初めて免許が与えられます。\n・(3) 業務停止期間中に業務を行った場合は免許取消事由となります。",
      "q42_03": "【正解】(1) 美容師は、氏名を変更したときは、30日以内に美容師名簿の訂正を申請しなければならない。\n・(1) 正しい：本籍地都道府県名（国籍）または氏名に変更を生じたときは、30日以内に名簿の訂正を申請しなければなりません。\n・(2) 誤り：美容師名簿には「住所」は登録事項として含まれないため、住所変更による名簿訂正申請は不要です。\n・(3) 誤り：美容所の「定休日や営業時間」は開設届の法定届出事項ではないため、変更届は不要です。\n・(4) 誤り：相続により開設者の地位を承継したときは、新規の開設届ではなく、遅滞なく「承継届」を提出します。",
      "q42_04": "【正解】(4) 美容所の開設者が、美容所の廃止の届出をしなかったときは、30万円以下の罰金に処せられる。\n・(4) 正しい：美容所の開設・変更・廃止の届出を怠った（または虚偽の届出をした）者は、30万円以下の罰金に処せられます。\n・(1) 誤り：外国籍であっても美容所を開設することができます。\n・(2) 誤り：管理美容師の資格を持っていなくても、各美容所に管理美容師を置けば複数の美容所を開設できます。\n・(3) 誤り：会社の福利厚生施設として社員のみを対象とする場合でも、反復継続して美容行為を行う場合は美容所の開設届が必要です。",
      "q42_05": "【正解】(2) 美容師が、本籍地及び氏名の変更により、名簿の訂正の申請を行わなかったときは、30万円以下の罰金に処せられる。\n・(2) 誤り：名簿の訂正申請は30日以内に行う義務がありますが、これを怠ったことに対する「30万円以下の罰金」という罰則規定はありません。\n・(1) 消毒義務違反（法第8条違反）により開設者が閉鎖処分を受けた場合、その美容師も業務停止処分を受けることがあります。\n・(3) 構造設備基準違反や確認を受けずに使用した場合は閉鎖処分の対象となります。\n・(4) 無免許で美容の業をした者は30万円以下の罰金に処せられます。",
      "q42_06": "【正解】(2) 標準営業約款には、役務の内容、施設及び設備の表示の適正化等とともに、施術料金の統一が定められている。\n・(2) 誤り：標準営業約款は役務の内容・施設設備の表示の適正化・損害賠償の実施確保などを定めるものであり、「施術料金の統一」は定めていません。\n・(1) 生活衛生同業組合は都道府県ごとに1つ設立できます。\n・(3) 都道府県生活衛生営業指導センターは経営相談・指導や苦情処理等の業務を行います。\n・(4) 振興計画の認定を受けた組合員は株式会社日本政策金融公庫から低利融資を受けられます。",
      "q42_07": "【正解】(2) 保健所は、感染症その他の疾病の予防に関する事項について、企画、調整、指導及びこれらに必要な事業を行う。\n・(2) 正しい：地域保健法に基づき、保健所は感染症その他の疾病の予防、環境衛生、医事・薬事、栄養改善等の企画・調整・指導を行います。\n・(1) 誤り：保健所を設置できるのは都道府県、指定都市、中核市、その他の政令で定める市、および特別区であり、一般の町村は設置できません。\n・(3) 誤り：歯科保健に関する事項も保健所の業務に含まれます。\n・(4) 誤り：保健所は衛生上の指導や監視を行いますが、経営の健全化に関する指導は生活衛生営業指導センター等の役割です。",
      "q42_08": "【正解】(3) 使用者は、労働契約の締結に際し、労働者に対して賃金、労働時間その他の労働条件を明示しなくてもよい。\n・(3) 誤り：労働基準法第15条により、使用者は労働契約の締結に際し、労働者に対して賃金・労働時間その他の労働条件を必ず明示しなければなりません。\n・(1) 法定労働時間は休憩時間を除き1日8時間、1週40時間です。\n・(2) 労働時間が8時間を超える場合は少なくとも1時間の休憩を与えなければなりません。\n・(4) 雇入れの日から6か月間継続勤務し全労働日の8割以上出勤した労働者には、10労働日の年次有給休暇を与えなければなりません。",
      "q42_09": "【正解】(4) 国民年金には、経済的な理由等で保険料を納付することが困難な場合には、申請により保険料の納付が免除・猶予される制度がある。\n・(4) 正しい：国民年金には法定免除や申請免除、学生納付特例、納付猶予制度があります。\n・(1) 誤り：厚生年金は会社員や公務員（第2号被保険者）が加入する年金であり、自営業者（第1号被保険者）は国民年金基金等に加入します。\n・(2) 誤り：国民年金には老齢基礎年金だけでなく、障害基礎年金や遺族基礎年金もあります。\n・(3) 誤り：老齢基礎年金の受給額は保険料納付済期間等に応じて計算されるため、一律ではありません。",
      "q42_10": "【正解】(2) 療養補償給付\n・(2) 誤り（雇用保険の給付ではない）：「療養補償給付」は業務上の負傷や疾病に対して支給される『労働者災害補償保険（労災保険）』の給付です。\n・(1) 高年齢雇用継続給付、(3) 育児休業給付、(4) 教育訓練給付は、いずれも雇用保険の給付です。",
      "q42_11": "【正解】(3) 平成27年におけるわが国の合計特殊出生率は、2人以上である。\n・(3) 誤り：平成27年（2015年）の日本の合計特殊出生率は「1.45」であり、人口置換水準（約2.07）や2人を大きく下回っています。\n・(1) 合計特殊出生率は15〜49歳の女性の年齢別出生率を合計したもので、1人の女性が一生の間に生む子どもの平均数を示します。\n・(2) 普通出生率は人口1,000人あたりの年間出生数で表します。\n・(4) 乳児死亡率や周産期死亡率の低下は、母子保健水準や生活環境・医療水準の向上を反映しています。",
      "q42_12": "【正解】(1) 大腸がん\n・(1) 誤り（糖尿病に特有の合併症ではない）：糖尿病の三大合併症（細小血管障害）は「糖尿病網膜症（失明）」「糖尿病腎症（腎不全）」「糖尿病神経障害（末梢神経障害）」です。大腸がんは糖尿病特有の三大合併症ではありません。",
      "q42_13": "【正解】(2) わが国の男性の喫煙率は、年々増加している。\n・(2) 誤り：日本の成人男性の喫煙率は長年にわたり減少傾向にあります。\n・(1) たばこの煙にはニコチン、タール、一酸化炭素の三大有害物質が含まれます。\n・(3) 妊娠中の喫煙は低出生体重児や早産のリスクを高めます。\n・(4) 副流煙には主流煙よりも高濃度の有害物質が含まれており、受動喫煙による健康被害を引き起こします。",
      "q42_14": "【正解】(1) 温度\n・(1) 正しい：人間の健康に影響を及ぼす環境要因のうち、温度・湿度・気流・気圧・光線・騒音・放射線などは「物理的要因」に分類されます。\n・(2) 有毒ガスは化学的要因、(3) 衛生害虫は生物学的要因、(4) 経済は社会的・文化的要因です。",
      "q42_15": "【正解】(3) 浄化槽は、河川水から上水を得るための施設である。\n・(3) 誤り：河川水などから飲料水（上水）をつくる施設は「浄水場」です。「浄化槽」はし尿や雑排水（下水）を微生物の働き等で浄化して放流する設備です。\n・(1) 水道水は塩素消毒が義務付けられており、蛇口での遊離残留塩素は0.1mg/L以上（結合残留塩素は0.4mg/L以上）と定められています。\n・(2) 日本の水道普及率は97%を超えています。\n・(4) BOD（生物化学的酸素要求量）は水質汚濁の代表的な指標で、数値が大きいほど水質汚濁が著しいことを示します。",
      "q42_16": "【正解】(1) B型肝炎\n・(1) 正しい：B型肝炎ウイルス（HBV）は血液・体液を介して感染し、性行為感染（STD/STI）の原因にもなります。\n・(2) 日本脳炎と(4) マラリアは蚊が媒介する節足動物媒介感染症、(3) コレラは汚染された水や食物による経口感染症です。",
      "q42_17": "【正解】(3) 生きた細胞内でのみ増殖する。\n・(3) 誤り：「生きた細胞内でのみ増殖する（偏性細胞内寄生性）」のはウイルス、リケッチア、クラミジアの特徴です。細菌は栄養分があれば人工培地など細胞外でも単独で自己増殖できます。\n・(1) 球状のものを球菌、棒状のものを桿菌といいます。\n・(2) 通常の光学顕微鏡で観察できます（大きさは約1〜数μm）。\n・(4) 破傷風菌や炭疽菌などの一部の桿菌は、生育環境が悪化すると熱や消毒薬に強い「芽胞」を形成します。",
      "q42_18": "【正解】(4) 患者の入院治療\n・(4) 誤り（感染経路対策ではない）：「患者の入院治療・隔離」は感染症予防3原則のうち『感染源対策』にあたります。\n・(1) 器物の消毒、(2) 手洗いの励行、(3) 衛生害虫の駆除は、いずれも病原体が運ばれるルートを遮断する『感染経路対策』です。",
      "q42_19": "【正解】(1) 潜伏期は2～3か月である。\n・(1) 誤り：風しんの潜伏期間は「約2〜3週間（14〜21日）」です（2〜3か月ではありません）。\n・(2) 妊娠初期の女性が風しんに感染すると、胎児に難聴・白内障・先天性心疾患などを生じる先天性風しん症候群（CRS）の原因となります。\n・(3) 飛沫感染や接触感染によって広がります。\n・(4) 定期予防接種（MRワクチン等）の対象疾患です。",
      "q42_20": "【正解】(3) 潜伏期は、約30日である。\n・(3) 誤り：腸管出血性大腸菌（O157など）感染症の潜伏期間は「約3〜8日（多くは3〜5日）」であり、約30日ではありません。\n・(1) 感染症法の三類感染症に指定されています。\n・(2) ベロ毒素（志賀毒素）を産生し、激しい腹痛や水様便・血便を引き起こします。\n・(4) 菌やベロ毒素は75℃で1分間以上の加熱で死滅・失活するため、食品の中心部までの十分な加熱が予防に有効です。",
      "q42_21": "【正解】(1) 0.1％次亜塩素酸ナトリウム水溶液に10分間浸す。\n・(1) 正しい：血液が付着した、またはその疑いがある器具の法定消毒法は「煮沸消毒（2分間以上）」「エタノール水溶液（76.9〜81.4%に10分間以上浸す）」「次亜塩素酸ナトリウム水溶液（0.1%以上に10分間以上浸す）」の3つです。\n・(2) 逆性石けんと(3) 両性界面活性剤は血液付着器具には使用できません。\n・(4) エタノールによる「清拭（拭き取り）」は血液が付着していない器具に限られ、血液付着器具は10分間以上「浸す」必要があります。",
      "q42_22": "【正解】(3) cとd\n・a 誤り：美容師法施行規則の消毒方法に放射線・高周波・超音波の規定はありません。\n・b 誤り：紫外線消毒は波長253.7nm付近の紫外線を1cm²あたり85マイクロワット以上で「20分間以上」照射します（10分間は誤り）。\n・c 正しい：煮沸消毒は沸騰後2分間以上煮沸します。\n・d 正しい：蒸気消毒は80℃を超える湿熱に10分間以上触れさせます。\nしたがって正しい組合せは c と d の(3)です。",
      "q42_23": "【正解】(3) cとd\n・a 誤り：紫外線は物質の深部や折り重なった部分には届かないため、タオルの消毒には適していません。\n・b 誤り：紫外線は直進性があり透過力がないため、器具の陰になる部分や内部まで消毒することはできません。\n・c 正しい：紫外線は直接目や皮膚・粘膜に当たると有害（結膜炎や皮膚炎の原因）です。\n・d 正しい：長時間の紫外線照射により、プラスチックやゴム製品が劣化・変色することがあります。\nしたがって正しい組合せは c と d の(3)です。",
      "q42_24": "【正解】(2) bとc\n・a 誤り：逆性石けんは一般細菌には有効ですが、結核菌・ウイルス・芽胞には効果がありません。\n・b 正しい：逆性石けん（陽イオン界面活性剤）は、普通石けん（陰イオン界面活性剤）が混入すると中和されて殺菌効力が著しく低下します。\n・c 正しい：次亜塩素酸ナトリウムは酸化作用による漂白作用や金属腐食性があります。\n・d 誤り：消毒用エタノールは細菌の芽胞には効果がありません。\nしたがって正しい組合せは b と c の(2)です。",
      "q42_25": "【正解】(4) 20mL\n・消毒薬の希釈計算式：必要な原液量(mL) ＝ 作りたい量(1000mL) × 目的の濃度(0.1%) ÷ 原液の濃度(5%)\n・1000 × 0.1 ÷ 5 ＝ 100 ÷ 5 ＝ 20mL\nしたがって5%次亜塩素酸ナトリウム原液を20mL測り取り、水を加えて全量を1000mLにします。",
      "q42_26": "【正解】(4) 球関節 ―――― 広い範囲で自由に運動できる。\n・(4) 正しい：球関節（肩関節・股関節など）は多軸性関節で、広い範囲で自由に運動できます。\n・(1) 誤り：蝶番関節（肘関節・指節間関節など）は一方向（屈曲・伸展）のみに動く1軸性関節です。\n・(2) 誤り：車軸関節（上橈尺関節・正中環軸関節など）は骨の長軸を中心に回転運動を行う1軸性関節です。\n・(3) 誤り：鞍関節（母指の手根中手関節など）は直交する2軸方向に動く2軸性関節で、回転（回旋）はできません。",
      "q42_27": "【正解】(3) 咬筋\n・(3) 誤り（表情筋に含まれない）：咬筋は側頭筋などとともに下顎骨を動かして食物を噛み砕く「咀嚼筋（そしゃくきん）」であり、三叉神経（下顎神経）に支配されます。\n・(1) 前頭筋、(2) 眼輪筋、(4) 口輪筋は、いずれも顔面神経に支配される「表情筋（顔面筋）」です。",
      "q42_28": "【正解】(1) 脳神経\n・(1) 誤り（中枢神経系に含まれない）：「脳神経（12対）」と「脊髄神経（31対）」は、脳や脊髄から出て全身の器官へ分布する『末梢神経系』です。\n・中枢神経系は「脳（大脳・間脳・中脳・橋・延髄・小脳）」と「脊髄」から構成されます。",
      "q42_29": "【正解】(4) 心拍数は増加する。\n・(4) 正しい：交感神経が優位（活動・緊張モード）になると、心拍数の増加、血圧の上昇、気管支の拡張、瞳孔の散大などが起こります。\n・(1) 誤り：交感神経優位では粘り気のある少量の唾液が分泌されます（さらさらした多量の唾液は副交感神経優位）。\n・(2) 誤り：気管支は拡張します（収縮するのは副交感神経優位）。\n・(3) 誤り：瞳孔は散大（拡大）します（縮小するのは副交感神経優位）。",
      "q42_30": "【正解】(3) リンパ球は、主に免疫反応に関わる。\n・(3) 正しい：白血球の一種であるリンパ球（T細胞・B細胞・NK細胞）は、抗体産生や細胞性免疫など主に免疫反応に関わります。\n・(1) 誤り：赤血球は酸素の運搬を担います。血液凝固に関わるのは「血小板」です。\n・(2) 誤り：血小板は止血・血液凝固に関わります。活発な食作用を行うのは「好中球」や「単球（マクロファージ）」です。\n・(4) 誤り：ヒスタミンを含み即時型アレルギー反応に関わるのは「好塩基球（および肥満細胞）」です。",
      "q42_31": "【正解】(1) 色素細胞(メラノサイト)の数は、人種によって大きく異なる。\n・(1) 誤り：表皮基底層にある色素細胞（メラノサイト）の「数」は人種によってほとんど差がありません。肌や毛髪の色の違いは、メラノサイトが作り出すメラニン色素の「量・大きさ・種類（ユウメラニンとフェオメラニンの比率）」の違いによります。\n・(2) 表皮の約90%以上は角化細胞（ケラチノサイト）が占めています。\n・(3) 基底層で生まれた細胞が角質層となって垢として剥がれ落ちるまでの周期（ターンオーバー）は約28〜45日です。\n・(4) 真皮の大部分を占める網状層にはコラーゲン（膠原線維）やエラスチン（弾性線維）が豊富に存在します。",
      "q42_32": "【正解】(2) 毛のケラチンは、長軸方向に鎖状結合しているため、毛は縦に裂けやすい。\n・(2) 正しい：毛皮質（コルテックス）のケラチン繊維は毛の長軸方向に規則正しく並んで結合しているため、縦方向には裂けやすい（枝毛になりやすい）性質があります。\n・(1) 誤り：毛根の下端の膨らんだ部分は「毛球」といいます（そのくぼみに毛乳頭が入り込んでいます）。\n・(3) 誤り：脂腺は頭皮・顔面（特にTゾーン）・胸・背中などに多く分布し、手掌や足底には存在しません。\n・(4) 誤り：爪は一生伸び続け、毛髪のような成長周期（毛周期）はありません。",
      "q42_33": "【正解】(2) 紫外線によって皮膚でつくられ、皮膚が黒くなる物質はエラスチンである。\n・(2) 誤り：紫外線によって色素細胞（メラノサイト）でつくられ、皮膚を黒くして紫外線から守る物質は「メラニン」です。エラスチンは真皮にある弾性線維です。\n・(1) 脂腺から分泌される皮脂は汗と混ざり合って皮脂膜をつくり、水分の蒸発を防ぎます。\n・(3) 温覚・冷覚・痛覚・触圧覚のうち、皮膚には「痛点」が最も多く分布しています。\n・(4) 体温が上昇すると皮膚血管が拡張して血流量が増え、汗の分泌（気化熱）とともに熱放散が促されます。",
      "q42_34": "【正解】(3) 健康な成人の皮膚表面は、アルカリ性に保たれている。\n・(3) 誤り：健康な成人の皮膚表面（皮脂膜）のpHは「弱酸性（pH4.5〜6.5程度）」に保たれており、細菌の繁殖を抑える自浄作用（アルカリ中和能）を持っています。\n・(1) 角質層の水分量が10%以下に低下するとドライスキン（乾燥肌）となり、肌荒れを起こしやすくなります。\n・(2) 加齢に伴い皮脂分泌量や角質層の天然保湿因子（NMF）・セラミドが減少します。\n・(4) ビタミンAの不足は皮膚や粘膜の乾燥・角化異常を招き、ビタミンCはメラニン生成抑制やコラーゲン合成に関わります。",
      "q42_35": "【正解】(4) 頭部白癬は、ウイルスによって引き起こされる。\n・(4) 誤り：頭部白癬（しらくも）はウイルスではなく、真菌（カビ）の一種である「白癬菌（皮膚糸状菌）」の感染によって引き起こされます。\n・(1) アトピー性皮膚炎は強いかゆみを伴う慢性の湿疹で、皮膚のバリア機能低下とアレルギー素因が関与します。\n・(2) 尋常性ざ瘡（ニキビ）は思春期に多く、性ホルモンによる皮脂分泌増加・毛孔の角化・アクネ桿菌の増殖が関与します。\n・(3) 接触皮膚炎（かぶれ）には、原因物質の毒性による「一次刺激性」と、感作された後に起こる「アレルギー性」があります。",
      "q42_36": "【正解】(4) W/O型エマルジョンは、水相に油滴が分散している。\n・(4) 誤り：W/O型（Water in Oil＝油中水滴型）エマルジョンは、「油相（外側）の中に水滴（内側）が分散」している乳化形態です。「水相に油滴が分散」しているのはO/W型（水中油滴型）エマルジョンです。\n・(1) 界面活性剤は1つの分子内に親水基と親油基（疎水基）を持っています。\n・(2) 一定濃度（臨界ミセル濃度：CMC）以上になるとミセルを形成し、油汚れ等を内部に取り込む可溶化作用を示します。\n・(3) 陰イオン界面活性剤（高級脂肪酸塩＝石けん、アルキル硫酸塩など）は洗浄力・起泡力に優れ、シャンプーや洗顔料の主成分に使われます。",
      "q42_37": "【正解】(1) ケラチン ―――――――― タンパク質\n・(1) 正しい：ケラチンは18種類のアミノ酸が結合してできた硬タンパク質です。\n・(2) 誤り：システインは硫黄（S）を含む「アミノ酸」です（高級脂肪酸ではありません）。\n・(3) 誤り：ワセリンは石油から精製される半固形状の「炭化水素」です（エステルではありません）。\n・(4) 誤り：セタノール（セチルアルコール）は水に溶けない「高級アルコール」です（多価アルコールはグリセリンやプロピレングリコールなど）。",
      "q42_38": "【正解】(4) 紫外線による急性の炎症をどの程度防止できるかを表す指標をPAという。\n・(4) 誤り：主にUV-Bによる急性の炎症（サンバーン＝赤くなる日焼け）をどの程度防止できるかを表す指標は「SPF（Sun Protection Factor）」です。「PA（Protection Grade of UV-A）」はUV-Aによる皮膚の黒化（サンタン）や光老化を防ぐ指標です。\n・(1) 地上に届く紫外線はUV-AとUV-Bです（UV-Cはオゾン層で吸収されます）。\n・(2) 酸化チタンや酸化亜鉛などの無機粉体は紫外線を反射・散乱させる紫外線散乱剤です。\n・(3) メトキシケイヒ酸エチルヘキシルなどは紫外線を吸収して熱エネルギー等に変える紫外線吸収剤です。",
      "q42_39": "【正解】(3) A:チオグリコール酸　B:還元剤　C:臭素酸ナトリウム　D:酸化剤\n・パーマネントウェーブ用剤の第1剤には、毛髪ケラチンのシスチン結合を切断する「還元剤（B）」として「チオグリコール酸（A）やその塩類」または「システイン類」が配合されます。\n・第2剤には、切断された結合を再結合させる「酸化剤（D）」として「臭素酸ナトリウム（C）」や「過酸化水素水」が配合されます。",
      "q42_40": "【正解】(2) レゾルシン ― 調色剤（または (4) メタフェニレンジアミン ― 染料中間体）\n※本問は試験センター公式採点において(2)と(4)の両方が正解として扱われた問題です。\n・酸化染毛剤の第1剤に含まれる酸化染料には、自ら酸化重合して発色する「染料中間体（パラフェニレンジアミン、パラアミノフェノール等）」と、染料中間体と結合して色調を変化させる「調色剤（カップラー：レゾルシン、メタアミノフェノール、メタフェニレンジアミン等）」があります。\n・(1) 過酸化水素は第2剤の「酸化剤」、(3) アンモニア水は第1剤の「アルカリ剤」であるため誤りです。",
      "q42_41": "【正解】(2) サーファーカット\n・(2) 誤り：サーファーカット（前下がりのレイヤースタイル）は1970年代後半〜1980年代に流行したヘアスタイルです。\n・(1) ヘップバーンカット（『ローマの休日』）、(3) セシルカット（『悲しみよこんにちは』）、(4) 慎太郎刈り（『太陽の季節』）は、いずれも戦後〜1950年代に映画等をきっかけに大流行したヘアスタイルです。",
      "q42_42": "【正解】(4) 原色のゆったりしたローブ、ハーレムパンツのスタイル\n・(4) 正しい：1980年代初頭に原宿の歩行者天国で踊っていた「竹の子族」は、ブティック竹の子で購入した赤・黄・紫など原色のサテン生地のゆったりしたローブやハーレムパンツ（アラジンパンツ）を着用し、ホイッスルに合わせて踊るスタイルが特徴でした。\n・(1)はパンクファッション、(2)はニュートラ（ニュートラディショナル）またはハマトラ、(3)はカラス族（黒ずくめモード）の説明です。",
      "q42_43": "【正解】(4) 小袖の身丈はかかとの位置で決める。\n・(4) 誤り：花嫁和装（打掛姿や黒振袖など）で着用する小袖（掛下）や打掛は、おはしょりを作らずに裾を長く床に引く「お引きずり」で着付けるため、身丈をかかとの位置で決める（くるぶし丈にする）ことはありません。\n・(1) 白無垢は掛下・打掛・帯・小物まですべて白一色で統一する花嫁衣裳です。\n・(2) 色打掛は白無垢と同格の正礼装です。\n・(3) 角隠しは文金高島田に合わせる帯状の白い布で、お色直しの振袖には通常用いません。",
      "q42_44": "【正解】(1) コームの目に入った毛髪を一線にそろえる部分を肩という。\n・(1) 誤り：コームの目に入った毛髪を一線にそろえたりテンションをかけたりする部分は、コームの「歯（目）」や「峰（背・スパイン）」です。「肩」という部位名はありません（歯の先端は歯先、歯の付け根は歯元といいます）。\n・(2) 粗歯（荒歯）はコーミングの最初の段階で毛流を整えたりもつれを解くのに使います。\n・(3) 密歯はシェープして面をきれいに整えたり強いテンションをかけるときに使います。\n・(4) テールコーム（リングコーム）の柄（テール）はブロッキングやスライスをとるのに使います。",
      "q42_45": "【正解】(1) シャンプーは、毛髪や頭皮の汚れを取り除き、カットやブローなどのヘアデザインを容易にする土台をつくる技術である。\n・(1) 正しい：シャンプーは毛髪・頭皮を清潔にするだけでなく、余分な皮脂や整髪料を落としてカット・パーマ・ヘアカラー・ブロー等の施術効果を高める土台づくりの技術です。\n・(2) 誤り：お湯の温度は体温よりやや高い「38〜40℃前後」が適温です。\n・(3) 誤り：プレシャンプー（予洗い）でお湯を十分に通すことで、毛髪表面の汚れの大部分（約7〜8割）を落とすことができます。\n・(4) 誤り：地肌を洗う際は爪を立てず、「指の腹（指頭）」を使ってマッサージするように洗います。",
      "q42_46": "【正解】(1) パネルをアップステムでカットすると、トップショートのロングエンドとなり、立体感を与える。\n・(1) 正しい：毛束（パネル）を水平より高く持ち上げる「アップステム」でカットすると、上部の毛が短く下部の毛が長い「トップショート・ロングエンド（レイヤー）」となり、軽さと立体感が出ます。\n・(2) 誤り：ダウンステムでカットすると、上部の毛が長く下部の毛が重なるグラデーションまたはワンレングスとなり、重み（ウェイト）のあるシルエットになります。\n・(3) 誤り：ステム角度が0度（自然落下位置）で切るとワンレングスになり、重心が最も低くなります。\n・(4) 誤り：ステム角度を大きく（高く）するほど段差（レイヤー）が大きくなり、シルエットは軽くなります。",
      "q42_47": "【正解】(3) 毛先から1/3ほどをテーパーすることをディープテーパーカットという。\n・(3) 誤り：毛先から約1/3の範囲を先細に削ぐのは「ノーマルテーパーカット」です。「ディープテーパーカット」は根元近く（毛束の深い位置）から毛先に向かって大きく削ぐ技法です。\n・(1) レザー（カミソリ）は毛髪に対して斜めに当てて削ぐように切るため、切り口が斜め（楕円形）になり毛先が柔らかくなじみます。\n・(2) 乾燥した毛髪にレザーを使うと毛髪を傷めたり引っ張って痛みを伴うため、必ずウェット状態で行います。\n・(4) ストロークカットはレザーを弧を描くように振って毛束を削ぐ技法です。",
      "q42_48": "【正解】(4) カラーリングしている毛髪や残存ウェーブがある部分には、トリートメント剤を塗布し、第1剤の作用をセーブする。\n・(4) 正しい：既染部やダメージ部、残存ウェーブがある毛先は薬剤が過剰に反応しやすいため、事前に処理剤（PPTや保護トリートメント剤）を塗布して第1剤の作用を抑制（セーブ）します。\n・(1) 誤り：根元の新生部は健康毛（バージン毛）でキューティクルがしっかりしているため、ダメージのある毛先に比べてパーマがかかりにくい部位です。\n・(2) 誤り：あらかじめ第1剤を塗布してから巻く方法を「つけ巻き」、水やローションで濡らして巻いてから第1剤を塗布する方法を「水巻き」といいます（記述が逆です）。\n・(3) 誤り：(2)と同様に「水巻き」と「つけ巻き」の説明が逆になっています。",
      "q42_49": "【正解】(2) A:1/2　B:2/3　C:1/3\n・ピンカールによるヘアウェービングにおいて、美しいリッジと均一なウェーブをつくるための基準比率は以下の通りです。\n・A：2列目のスライス線は、1列目のループの『1/2（中心）』の位置からとります。\n・B：ループの直径は、スライス幅の『2/3』にします。\n・C：残りの『1/3』がカールスペース（遊びの空間）になります。",
      "q42_50": "【正解】(1) 細毛・軟毛は、黄み系が出やすく明るく染まりやすいため、希望色より明度の低い染毛剤を用いるとよい。\n・(1) 正しい：細毛・軟毛はメラニン量が少なく薬剤が浸透しやすいため、太毛・硬毛に比べて明るく黄みが出やすい特徴があり、希望色よりやや低明度の薬剤を選定します。\n・(2) 誤り：グレイヘア（白髪染め）では、白髪が目立ちやすく染まりにくい「白髪の多い部分（フロントや生え際など）」から先に塗布します。\n・(3) 誤り：アルカリ性酸化染毛剤の放置時間は通常「20〜30分程度」です（5分は短すぎます）。\n・(4) 誤り：パッチテスト（皮膚アレルギー試験）は施術の「48時間前（2日前）」に行い、48時間後まで観察する必要があります。",
      "q42_51": "【正解】(2) ナチュラルネイルにラインストーンやラメ、シールなどでアートを施した爪をアートチップという。\n・(2) 誤り：自分の爪（ナチュラルネイル）にラインストーンやラメ等で装飾を施すのは「ネイルアート」です。「アートチップ」とは、合成樹脂で作られた人工の付け爪（ネイルチップ）にあらかじめアートを施したものを指します。\n・(1) フレンチネイルは爪先（フリーエッジ）にホワイトなどをスマイルラインに沿って塗る定番デザインです。\n・(3) グラデーションネイルは先端に向かって徐々に色を濃く（または薄く）ぼかす技法です。\n・(4) マーブルネイルは複数のカラーポリッシュが乾かないうちに混ぜ合わせて大理石のような模様を作る技法です。",
      "q42_52": "【正解】(3) カウンセリングでは、施術のリスクについても正しく伝える。\n・(3) 正しい：まつ毛エクステンションの施術前には、デザインの希望だけでなく、グルー（接着剤）によるアレルギーや角膜・結膜のトラブル等のリスクについても十分に説明し同意を得る必要があります。\n・(1) 誤り：地まつ毛の成長を妨げたり皮膚炎を起こすため、皮膚（まぶた）から1〜1.5mm程度離して人工毛を装着します（根元や皮膚に直接接着してはいけません）。\n・(2) 誤り：地まつ毛1本に対して人工毛1本（シングルラッシュ）を装着するのが基本であり、複数の地まつ毛にまたがって接着すると毛周期の違いで引っ張られ脱毛の原因になります。\n・(4) 誤り：まぶたに腫れや充血、結膜炎などの異常がある場合は施術を行ってはいけません。",
      "q42_53": "【正解】(3) 温度を一定に保つために、着脱式のアタッチメントが用いられている。\n・(3) 誤り：ヘアドライヤーの先端に取り付ける着脱式のアタッチメント（ノズル・フード）は、「風向きを集中・制御してブローしやすくするため」の部品です。温度を一定に保ち過熱を防ぐために用いられているのは「サーモスタット（自動温度調節器）や温度ヒューズ」です。\n・(1) モーターでファンを回し、ニクロム線等のヒーターで温めた空気を送風します。\n・(2) 消費電力が大きいため、タコ足配線を避け単独のコンセントから電源をとります。\n・(4) 吸気口にホコリや毛髪が詰まると風量が落ちて内部が異常過熱し、発火や故障の原因となります。",
      "q42_54": "【正解】(1) 線をさまざまな形に配置して生じる錯覚は、化学的錯視という。\n・(1) 誤り：線や図形の配置・角度・組み合わせによって長さが違って見えたり歪んで見えたりする錯覚（ミュラー・リヤー錯視やツöllner錯視など）は、「幾何学的錯視」といいます（「化学的錯視」という用語はありません）。\n・(2) 同じ面積でも明るい色（高明度・暖色）は大きく膨張して見え（膨張色）、暗い色（低明度・寒色）は小さく収縮して見えます（収縮色）。\n・(3) 縦縞（ストライプ）は縦方向に視線を誘導するため細長く見える効果があります。\n・(4) ヘアデザインやメイクでは、これらの錯視効果を利用して顔型や頭の形を理想的な卵型（オーバル）に近づける補正を行います。",
      "q42_55": "【正解】(1) 肌質は、水分量と皮脂量のバランスによって4つに分けることができる。\n・(1) 正しい：スキンチェックにおいて、肌質は角質層の「水分量」と皮脂膜の「皮脂量」のバランスにより、①普通肌（ノーマルスキン：水分多・皮脂適度）、②乾燥肌（ドライスキン：水分少・皮脂少）、③脂性肌（オイリースキン：水分多・皮脂多）、④脂性乾燥肌／混合肌（オイリードライスキン：水分少・皮脂多）の4タイプに分類されます。\n・(2) 誤り：乾燥肌（ドライスキン）は水分量も皮脂量も少ない肌です。\n・(3) 誤り：脂性肌（オイリースキン）は水分量も皮脂量も多い肌です。\n・(4) 誤り：肌質は季節、年齢、体調、生活環境などによって変化するため、施術のたびにスキンチェックを行います。",
      "q41_01": "【正解】(2) 日本国籍を有しない者は、美容師になることができない。\n・(2) 誤り：美容師法に国籍条項（日本国籍を要件とする規定）はないため、外国籍の者であっても要件を満たして日本の美容師試験に合格し名簿登録を受ければ美容師になることができます。\n・(1) 美容師でなければ美容を業としてはなりません（業務独占）。\n・(3) 美容師は原則として確認を受けた美容所以外の場所で業をしてはなりませんが、政令で定める特別の事情（疾病等で外出困難な場合など）があるときは出張美容が認められます。\n・(4) 伝染性の疾病にかかり公衆衛生上不適当と認められるときは、都道府県知事等から業務停止処分を受けることがあります。",
      "q41_02": "【正解】(1) A:免許の取消処分　B:閉鎖処分　C:罰金刑\n・A：業務停止処分に違反して美容の業を行った美容師に対しては、厚生労働大臣が『免許の取消処分』を行うことができます。\n・B：業務停止処分中の美容師に業務を行わせた美容所の開設者に対しては、都道府県知事等が期間を定めて美容所の『閉鎖処分』を命じることができます。\n・C：環境衛生監視員の立入検査を正当な理由なく拒み、妨げ、または忌避した者には、30万円以下の『罰金刑』が科せられます。",
      "q41_03": "【正解】(3) 2か所以上の美容所の開設者が管理美容師の資格を有するときは、その開設者は、自らが主として管理する1つの美容所について管理美容師となることができる。\n・(3) 正しい：管理美容師は他の美容所の管理美容師を兼任できませんが、複数店舗の開設者自身が管理美容師資格を持つ場合は、自らが主として管理する「1か所の美容所」に限り管理美容師になることができます。\n・(1) 誤り：管理美容師は美容所を「衛生的に管理させるため」に置くものであり、経営上の管理のためではありません。\n・(2) 誤り：管理美容師になるには、美容師免許を受けた後「3年以上」美容の業務に従事し、かつ「都道府県知事」が指定した講習会の課程を修了しなければなりません。\n・(4) 誤り：管理美容師を置かなければならないのは、「美容師である従業者の数が常時2人以上」である美容所です。",
      "q41_04": "【正解】(4) 都道府県知事等による美容所の閉鎖処分に違反した開設者は、30万円以下の罰金に処せられる。\n・(4) 正しい：閉鎖命令（閉鎖処分）に違反した開設者は、30万円以下の罰金に処せられます。\n・(1) 誤り：美容所を開設しようとするときは、あらかじめ（使用開始前に）開設届を提出し、構造設備の確認を受けなければなりません（使用開始後30日以内は誤り）。\n・(2) 誤り：届出事項に変更が生じたときは「速やかに」変更届を提出します（60日以内という規定はありません）。\n・(3) 誤り：美容所の開設者自身は美容師免許を持っていなくても開設できます。",
      "q41_05": "【正解】(4) 美容の施術に関する料金\n・(4) 誤り（条例で定める事項ではない）：美容師法第8条および第13条により、都道府県等が条例で定めることができるのは「美容師が講ずべき衛生上必要な措置」および「美容所について講ずべき衛生上必要な措置」です。「美容の施術に関する料金」は衛生措置ではないため条例で定める事項ではありません。",
      "q41_06": "【正解】(3) 標準営業約款は、都道府県生活衛生営業指導センターが、厚生労働大臣の認可を受けて定めるもので、営業方法や料金等を規制するものである。\n・(3) 誤り：標準営業約款は「全国生活衛生営業指導センター」が厚生労働大臣の認可を受けて定めるものであり、役務の内容・施設及び設備の表示の適正化・損害賠償の実施確保を定める制度であって、「料金を規制するもの」ではありません。\n・(1) 生衛法は生活衛生関係営業の経営の健全化と衛生水準の向上により公衆衛生の向上・増進と国民生活の安定に寄与することを目的とします。\n・(2) 美容業、理容業、クリーニング業、興行場営業、旅館業、公衆浴場業、飲食店営業などが対象です。\n・(4) 振興指針は厚生労働大臣が業種ごとに指定して定めます。",
      "q41_07": "【正解】(1) 常時使用する労働者が5人未満の美容所には、労働基準法が適用されない。\n・(1) 誤り：労働基準法は、同居の親族のみを使用する事業を除き、労働者を「1人でも」使用していれば業種や規模（5人未満かどうか）にかかわらず適用されます。\n・(2) 休憩時間は1日8時間を超える場合は少なくとも1時間、6時間を超え8時間以下の場合は少なくとも45分与えなければなりません。\n・(3) 使用者は原則として毎週少なくとも1回の休日（または4週間を通じ4日以上の休日）を与えなければなりません。\n・(4) 労働者を解雇しようとする場合は、少なくとも30日前に予告するか、30日分以上の平均賃金（解雇予告手当）を支払わなければなりません。",
      "q41_08": "【正解】(3) 固定資産税は、赤字の場合、支払わなくてもよい。\n・(3) 誤り：固定資産税は毎年1月1日時点での土地・家屋・償却資産の所有に対して課される財産税（地方税）であるため、事業の業績が赤字であっても支払わなければなりません。\n・(1) 個人事業主の所得には所得税（国税）や住民税・個人事業税（地方税）が課されます。\n・(2) 法人の所得には法人税（国税）や法人住民税・法人事業税（地方税）が課されます。\n・(4) 消費税は商品やサービスの消費に対して課される間接税です。",
      "q41_09": "【正解】(1) 労働安全衛生法\n・(1) 正しい：「労働基準法と相まって、労働災害の防止のための危害防止基準の確立、責任体制の明確化及び自主的活動の促進の措置を講ずる等その防止に関する総合的計画的な対策を推進することにより職場における労働者の安全と健康を確保するとともに、快適な職場環境の形成を促進することを目的とする」のは『労働安全衛生法』第1条の条文です。",
      "q41_10": "【正解】(1) 健康保険の被保険者が、保険医療機関で受診した際の一部負担金は、すべて1割である。\n・(1) 誤り：健康保険の被保険者（現役世代）が医療機関を受診した際の一部負担金（自己負担割合）は原則として「3割」です（義務教育就学前は2割、70〜74歳は原則2割、75歳以上の後期高齢者医療制度では原則1割［一定以上所得者は2割・現役並み所得者は3割］）。\n・(2) 我国はすべての国民が何らかの公的医療保険に加入する「国民皆保険制度」をとっています。\n・(3) 自営業者や無職の者などは市町村（特別区）や国民健康保険組合が運営する国民健康保険に加入します。\n・(4) 75歳以上（一定の障害がある場合は65歳以上）の者は後期高齢者医療制度の被保険者となります。",
      "q41_11": "【正解】(4) 児童虐待の捜査\n・(4) 誤り（母子保健法に基づく母子保健事業に含まれない）：犯罪としての「児童虐待の捜査」は警察・検察の業務であり、児童虐待の通告受理や一時保護は児童福祉法・児童虐待防止法に基づく児童相談所等の業務です。\n・(1) 妊娠の届出と母子健康手帳の交付、(2) 1歳6か月児・3歳児健康診査、(3) 妊産婦や新生児・未熟児の訪問指導は、いずれも母子保健法に基づく市町村の母子保健事業です。",
      "q41_12": "【正解】(1) 男性の粗死亡率は、女性の粗死亡率よりも高い。\n・(1) 正しい：日本における男女別の粗死亡率（人口1,000人あたりの死亡数）および年齢調整死亡率は、いずれも男性の方が女性よりも高くなっています。\n・(2) 誤り：日本の平均寿命（0歳時の平均余命）は女性の方が男性よりも約6年長くなっています。\n・(3) 誤り：近年、高齢化の進行に伴い、日本全体の粗死亡率は上昇傾向にあります。\n・(4) 誤り：平均寿命とは「死亡年齢の平均」ではなく、「0歳児が今後生きられると期待される平均年数（0歳の平均余命）」のことです。",
      "q41_13": "【正解】(3) 特定健康診査・特定保健指導の対象者は、50歳以上である。\n・(3) 誤り：高齢者の医療の確保に関する法律に基づく特定健康診査・特定保健指導（メタボ健診）の対象年齢は、50歳以上ではなく「40歳以上74歳以下」の被保険者・被扶養者です。\n・(1) がん（悪性新生物）、心疾患、脳血管疾患などは生活習慣が発症・進行に深く関与する生活習慣病です。\n・(2) 内臓脂肪型肥満に加えて高血糖・高血圧・脂質異常のうち2つ以上を合併した状態をメタボリックシンドロームといいます。\n・(4) 一次予防（健康増進・発病予防）にはバランスの良い食事、適度な運動、禁煙、休養などの生活習慣改善が重要です。",
      "q41_14": "【正解】(2) 美容所の望ましい相対湿度は、30％以下である。\n・(2) 誤り：建築物環境衛生管理基準等における室内の望ましい相対湿度は「40%以上70%以下」です。30%以下では空気が乾燥しすぎて粘膜の防御機能が低下し、インフルエンザウイルス等の感染リスクが高まります。\n・(1) 室内の空気環境の指標には二酸化炭素（CO2）濃度（基準は1,000ppm以下＝0.1%以下）が用いられます。\n・(3) 美容所の作業面の照度は100ルクス以上（理容師法・美容師法施行規則に基づく基準）が必要です。\n・(4) 換気には窓を開ける自然換気と、換気扇や空調設備を用いる機械換気があります。",
      "q41_15": "【正解】(1) 作業能率増進 ――― 抗帯電性\n・(1) 誤り：衣服の役割と求められる性質の組み合わせにおいて、「作業能率増進」に対応するのは動きやすさに関わる「伸縮性・軽量性・機能的デザイン」などです。「抗帯電性（静電気を防ぐ性質）」はホコリの付着防止やまとわりつきによる不快感防止（清潔保持・快適性）に関わります。\n・(2) 身体保護 ― 耐熱性・難燃性、(3) 体温調節 ― 保温性・通気性、(4) 清潔保持 ― 吸水性・耐洗濯性はそれぞれ正しく対応しています。",
      "q41_16": "【正解】(2) DNAまたはRNAのいずれかのみを持つ。\n・(2) 誤り：核酸として「DNAまたはRNAのどちらか一方のみ」を持つのは『ウイルス』の特徴です。『細菌』は生物細胞であるため、DNAとRNAの両方を持っています。\n・(1) 細菌の大きさは通常約1〜数μm（マイクロメートル＝1mmの1000分の1）です。\n・(3) 細胞壁を持ち、2分裂によって無性的に増殖します。\n・(4) 破傷風菌、ボツリヌス菌、炭疽菌などの一部の菌は、熱や乾燥・消毒薬に強い「芽胞」を形成します。",
      "q41_17": "【正解】(1) A型肝炎は、血液を介して感染する。\n・(1) 誤り：A型肝炎ウイルス（HAV）は、汚染された水や魚介類（カキなど）の摂取によって起こる「経口感染」です。血液や体液を介して感染するのは「B型肝炎」や「C型肝炎」です。\n・(2) インフルエンザは主に咳やくしゃみによる飛沫感染（および接触感染）で広がります。\n・(3) 麻しん（はしか）や結核、水痘（みずぼうそう）は空気感染（飛沫核感染）します。\n・(4) 日本脳炎やマラリア、デング熱は蚊（節足動物）を介して感染します。",
      "q41_18": "【正解】(2) ネズミや昆虫の駆除は、感染源対策である。\n・(2) 誤り：病原体を媒介するネズミや衛生害虫（蚊・ハエ・ゴキブリ等）の駆除は、病原体が運ばれるルートを断つ『感染経路対策』です。\n・(1) 患者の早期発見・隔離・治療や保菌者の管理は『感染源対策』です。\n・(3) 手洗い・うがい・手指や器具の消毒は『感染経路対策』です。\n・(4) 予防接種（ワクチン）や栄養・休養による体力向上は『感受性宿主対策』です。",
      "q41_19": "【正解】(2) 感染力は弱い。\n・(2) 誤り：麻しん（はしか）は麻しんウイルスによる感染症で、空気感染（飛沫核感染）・飛沫感染・接触感染のいずれでもうつり、その感染力は「極めて強い」のが特徴です。\n・(1) カタル期（発熱・咳・鼻水・結膜充血）に頬粘膜に特有の白い斑点（コプリック斑）が現れ、一度解熱した後に再発熱とともに全身に発しんが出ます。\n・(3) 麻しん・風しん混合（MR）ワクチンなどの定期予防接種が有効です。\n・(4) 一度自然感染して治癒すると、通常は終生免疫を獲得します。",
      "q41_20": "【正解】(3) 風しん ―――――――――― 約14日から21日\n・(3) 正しい：風しんの潜伏期間は約14〜21日（2〜3週間）です。\n・(1) 誤り：B型肝炎の潜伏期間は約1〜6か月（平均2〜3か月）です。\n・(2) 誤り：後天性免疫不全症候群（エイズ）の無症候キャリア期（潜伏期間）は数年〜10年程度と長期間にわたります。\n・(4) 誤り：腸管出血性大腸菌感染症（O157など）の潜伏期間は約3〜8日です（約2〜9時間は黄色ブドウ球菌食中毒など）。",
      "q41_21": "【正解】(2) A:殺菌　B:滅菌　C:防腐\n・A：病原性の有無にかかわらず微生物を殺すことを『殺菌』といいます（そのうち病原微生物を殺すか感染力をなくすことを消毒といいます）。\n・B：芽胞を含めすべての微生物を完全に殺滅・除去して無菌状態にすることを『滅菌』といいます。\n・C：微生物を殺さなくても、その発育・増殖や作用を止めて腐敗を防ぐことを『防腐』といいます。",
      "q41_22": "【正解】(1) 加熱殺菌では、湿熱よりも乾熱の方が殺菌されやすい。\n・(1) 誤り：加熱による殺菌（微生物のタンパク質の熱変性・凝固）では、水分が存在する「湿熱（蒸気や熱湯）」の方が乾熱（乾いた空気）よりも熱伝導率が高く浸透しやすいため、より低温・短時間で殺菌できます。\n・(2) 消毒薬の温度が高い（一般に20℃以上）方が化学反応が促進され殺菌効果が強まります（ただし次亜塩素酸Naやエタノールは高温すぎると揮発・分解するため常温〜ぬるま湯で使用します）。\n・(3) 器具に血液・膿・毛髪などの有機物の汚れが付着していると消毒薬の効力が低下するため、消毒前に十分な洗浄が必要です。\n・(4) 消毒薬は所定の濃度と作用時間を守らなければ十分な効果が得られません。",
      "q41_23": "【正解】(4) aとd\n・a 正しい：紫外線は直接目や皮膚に当たると有害（電気性眼炎や皮膚炎の原因）です。\n・b 誤り：紫外線には透過力がないため、器具の内部や影になる部分まで消毒することはできません。\n・c 誤り：紫外線消毒の照射時間は、波長253.7nm付近・85μW/cm²以上で「20分間以上」です（10分間は誤り）。\n・d 正しい：長時間の照射によりプラスチックやゴムなどの材質を劣化・変色させることがあります。\nしたがって正しい組合せは a と d の(4)です。",
      "q41_24": "【正解】(2) 煮沸消毒は、血液が付着している器具に適用できる。\n・(2) 正しい：煮沸消毒（沸騰後2分間以上）は、血液が付着している、またはその疑いがある器具の消毒にも適用できます（蒸気消毒は血液付着器具には適用できません）。\n・(1) 誤り：蒸気消毒も煮沸消毒も80〜100℃の湿熱であるため、耐熱性の高い「細菌の芽胞」を完全に死滅させることはできません。\n・(3) 誤り：蒸気消毒は80℃を超える湿熱に「10分間以上」触れさせます。\n・(4) 誤り：熱に弱い合成樹脂（プラスチック）製品や、切れ味が落ちやすい高級刃物類には適していません。",
      "q41_25": "【正解】(3) A:紫外線　B:次亜塩素酸ナトリウム　C:両性界面活性剤\n・表の殺菌スペクトル（○＝効果あり、×＝効果なし）から判断します。\n・A：一般細菌○、結核菌○、ウイルス○、真菌○、芽胞× → 『紫外線』\n・B：一般細菌○、結核菌×、ウイルス○、真菌○、芽胞△(高濃度で有効だが通常×〜△) → 『次亜塩素酸ナトリウム』（結核菌には無効、ウイルスには有効）\n・C：一般細菌○、結核菌○、ウイルス×、真菌○、芽胞× → 『両性界面活性剤』（結核菌には有効、ウイルスには無効）\nしたがって A:紫外線、B:次亜塩素酸ナトリウム、C:両性界面活性剤 の(3)が正解です。",
      "q41_26": "【正解】(4) 下顎の先端部分\n・(4) 正しい：「オトガイ（頤）」とは、下顎（下あご）の先端の突出した部分のことです。そこにある表情筋をオトガイ筋、頭蓋骨の部位をオトガイ隆起といいます。",
      "q41_27": "【正解】(3) 赤色骨髄\n・(3) 正しい：骨の内部（海綿質など）にある「赤色骨髄」には造血幹細胞が存在し、赤血球・白血球・血小板をつくり出す『造血作用』があります。（黄色骨髄は脂肪組織に置き換わったもので造血作用はありません）。",
      "q41_28": "【正解】(3) 眼輪筋 ――― 目を開く。\n・(3) 誤り：眼輪筋は目の周囲を輪状に囲む表情筋で、まぶたを「閉じる（目を閉じる・まばたきする）」働きをします。目（上まぶた）を開く働きをするのは「上眼瞼挙筋（じょうがんけんきょきん）」です。\n・(1) 前頭筋は眉を引き上げ額に横じわをつくります。\n・(2) 皺眉筋（すうびきん）は眉間に縦じわをつくります。\n・(4) 口輪筋は口を閉じたり唇を突き出したりします。",
      "q41_29": "【正解】(2) 網膜\n・(2) 正しい：眼球壁の最内層にある「網膜」には、光や色を感じる視細胞（明暗を感じる桿体細胞と、色や形を感じる錐体細胞）が存在します。\n・(1) 角膜と(4) 水晶体は光を屈折させるレンズの役割、(3) 虹彩は瞳孔の大きさを変えて目に入る光の量を調節する絞りの役割をします。",
      "q41_30": "【正解】(4) 肺動脈\n・(4) 正しい：肺循環の経路は「全身 → 上・下大静脈 → 右心房 → 『右心室』 → 『肺動脈』 → 肺（ガス交換） → 肺静脈 → 左心房 → 左心室 → 大動脈 → 全身」です。したがって右心室の次に血液が流れ出る血管は『肺動脈』です。",
      "q41_31": "【正解】(4) 表皮は4層からなり、最外層を有棘層という。\n・(4) 誤り：表皮の4層は内側から外側へ向かって「基底層 → 有棘層 → 顆粒層 → 角質層」の順に並んでおり、最外層は『角質層』です（有棘層は内側から2番目の最も厚い層です）。\n・(1) 皮膚は外側から表皮・真皮・皮下組織の3層で構成されます。\n・(2) 真皮には血管・リンパ管・神経・毛包・脂腺・汗腺などが存在します（表皮には血管がありません）。\n・(3) 皮下組織は主に脂肪細胞（皮下脂肪）からなり、保温や外力に対するクッション（緩衝）、エネルギー貯蔵の役割を果たします。",
      "q41_32": "【正解】(3) 毛は、皮膚表面に出ている部分を毛幹、皮膚内部にある部分を毛根という。\n・(3) 正しい：毛は皮膚表面より外に出ている部分を「毛幹」、皮膚の内部（毛包内）に埋まっている部分を「毛根」といいます。\n・(1) 誤り：毛髪には成長期・退行期・休止期という毛周期（ヘアサイクル）がありますが、爪には周期はなく絶えず成長し続けます。\n・(2) 誤り：手掌や足底に最も多く分布しているのは「エクリン腺（小汗腺）」です。アポクリン腺は腋窩（わきの下）などに限局しています。\n・(4) 誤り：日本人のような黒髪や褐色の毛には黒褐色の「ユウメラニン（真性メラニン）」が多く含まれ、赤毛や金髪には黄赤色の「フェオメラニン（亜メラニン）」が多く含まれます。",
      "q41_33": "【正解】(4) 真皮の結合組織が深く損傷されても、瘢痕を残さずに再生する。\n・(4) 誤り：傷が「表皮（基底層まで）」にとどまる浅い損傷であれば瘢痕（傷跡）を残さずに再生しますが、「真皮」の結合組織まで深く損傷されると肉芽組織が形成されて『瘢痕（傷跡）』が残ります。\n・(1) 角質層と皮脂膜は外部からの異物侵入や内部からの水分蒸発を防ぐバリア機能を担います。\n・(2) 皮膚は血管の拡張・収縮や発汗によって体温調節を行います。\n・(3) 皮膚から二酸化炭素の排出や酸素の吸収がごくわずかに行われており（肺呼吸の1%未満）、これを皮膚呼吸といいます。",
      "q41_34": "【正解】(2) 健康な皮膚の表面は、弱アルカリ性に保たれている。\n・(2) 誤り：健康な皮膚の表面（皮脂膜）は「弱酸性（pH4.5〜6.5）」に保たれており、アルカリ性の物質が触れても元の弱酸性に戻すアルカリ中和能や細菌の繁殖を抑える自浄作用があります。\n・(1) 皮膚のモイスチャーバランスは皮脂膜、天然保湿因子（NMF）、角質細胞間脂質（セラミドなど）の3大保湿因子によって保たれます。\n・(3) 過度な紫外線照射はシミ・ソバカスやシワ・たるみ（光老化）の原因となります。\n・(4) 睡眠不足やストレス、栄養の偏りは自律神経やホルモンバランスを乱し、ターンオーバーの乱れや肌荒れを招きます。",
      "q41_35": "【正解】(1) 円形脱毛症の原因は、自己免疫の異常などと考えられ、他人に感染しない。\n・(1) 正しい：円形脱毛症は毛包組織に対する自己免疫反応やストレス・自律神経異常などが原因と考えられており、感染症ではないため他人にうつることはありません。\n・(2) 誤り：単純性疱疹（単純ヘルペス）は細菌ではなく「単純ヘルペスウイルス」による感染症です。\n・(3) 誤り：尋常性疣贅や青年性扁平疣贅（イボ）は真菌ではなく「ヒトパピローマウイルス（ヒト乳頭腫ウイルス）」によるウイルス感染症です。\n・(4) 誤り：脂漏性皮膚炎（フケ症の悪化など）はウイルスではなく、皮脂の過剰分泌や常在真菌であるマラセチア（澱粉菌）の増殖などが関与します。",
      "q41_36": "【正解】(4) 非イオン界面活性剤は、殺菌・消毒作用が強いのでリンス剤に用いられる。\n・(4) 誤り：非イオン（ノニオン）界面活性剤は水に溶けても電離せず、皮膚刺激性が低く乳化安定性に優れていますが、「殺菌・消毒作用」はありません。殺菌・消毒作用や帯電防止作用が強くリンス剤や逆性石けんに用いられるのは『陽イオン（カチオン）界面活性剤』です。\n・(1) 界面活性剤は界面張力（表面張力）を低下させる物質です。\n・(2) 陰イオン（アニオン）界面活性剤は洗浄力・起泡力が高くシャンプー等に用いられます。\n・(3) 両性界面活性剤は溶液のpHによって酸性側では陽イオン、アルカリ性側では陰イオンの性質を示します。",
      "q41_37": "【正解】(2) 炭化水素には、石油から得られる流動パラフィンやワセリンなどがあり、動植物から得られるものはない。\n・(2) 誤り：炭化水素には石油由来の流動パラフィンやワセリンのほか、深海ザメの肝油やオリーブ油など『動植物から得られるスクワレン（水素添加してスクワラン）』もあります。\n・(1) 油脂はグリセリンと高級脂肪酸のエステル（トリグリセリド）で、ツバキ油やオリーブ油などがあります。\n・(3) ロウ（ワックス）は高級脂肪酸と高級一価アルコールのエステルで、ホホバ油、ミツロウ、カルナウバロウ、ラノリンなどがあります。\n・(4) 高級アルコールにはセタノール（セチルアルコール）やステアリルアルコールなどがあり、乳化の安定剤や感触改良剤に使われます。",
      "q41_38": "【正解】(3) ベンガラ ―――― 植物性色素\n・(3) 誤り：ベンガラは酸化鉄（Fe2O3）を主成分とする赤色の『無機顔料（着色顔料）』であり、植物性色素ではありません。\n・(1) 酸化チタン ― 無機顔料（白色顔料・紫外線散乱剤）、(2) 雲母チタン ― パール顔料、(4) β-カロテン ― 天然色素（カロテノイド系）はそれぞれ正しい組合せです。",
      "q41_39": "【正解】(3) A:シスチン　B:還元剤　C:臭素酸カリウム\n・パーマの第1剤に含まれるチオグリコール酸などの『還元剤（B）』は、毛髪ケラチン中の『シスチン（A）』結合（-S-S-）に水素を与えて切断し、システイン（-SH HS-）にします。\n・第2剤には酸化剤として臭素酸ナトリウム、『臭素酸カリウム（C）』、または過酸化水素水が用いられ、システインから水素を奪って再びシスチン結合をつくります。",
      "q41_40": "【正解】(2) 酸性染料は、水に溶かすとプラスの電気を帯びる。\n・(2) 誤り：ヘアマニキュア（酸性染毛料）に配合されるタール色素の「酸性染料」は、水に溶かすと『マイナス（陰イオン）』の電気を帯びます。そしてクエン酸等の酸によって『プラス（陽イオン）』に帯電した毛髪タンパク質のアミノ基とイオン結合して染着します。\n・(1) 化粧品（染毛料）に分類されます。\n・(3) ベンジルアルコールなどの溶剤（浸透促進剤）が染料の毛髪表層への浸透を助けます。\n・(4) メラニン色素を脱色する作用はないため、元の髪色より明るく染めることはできません。",
      "q41_41": "【正解】(3) 1960年代後半には、ミニスカートが世界的に流行し、ヒッピーファッションと呼ばれた。\n・(3) 誤り：1960年代半ばにイギリスのマリー・クワントらが発表しツィッギーが着こなして世界的に大流行したミニスカートは「モッズルック」等の象徴です。「ヒッピーファッション」は1960年代後半〜70年代に物質文明への反発や自然回帰から生まれた、長髪・ロングスカート・ベルボトムジーンズ・タイダイ染めなどの民族調スタイルを指します。\n・(1) 1920年代にはギャルソンヌルックとともにショートボブ（イートン・クロップなど）が流行しました。\n・(2) 1950年代にはクリスチャン・ディオールのニュールックや映画の影響でエレガントなスタイルが流行しました。\n・(4) 1970年代後半には映画『サタデー・ナイト・フィーバー』などの影響でディスコファッションやサーファールックが流行しました。",
      "q41_42": "【正解】(4) 男子の第一礼装は、黒羽二重五つ紋付きの着物と羽織に仙台平などの縞袴をつけ、慶事にのみ着用する。\n・(4) 誤り：男子和装の第一礼装である「黒羽二重五つ紋付き長着・羽織・仙台平などの縞袴」は、結婚式などの慶事だけでなく、葬儀・告別式などの『弔事にも着用する』慶弔両用の第一礼装です（弔事では羽織紐を黒またはグレーにし、白扇を持たない等の違いがあります）。\n・(1) 留袖は既婚女性の第一礼装で、黒留袖は慶事のみ、色留袖は五つ紋なら第一礼装となります。\n・(2) 振袖は未婚女性の第一礼装です。\n・(3) 喪服（黒無地五つ紋付きに黒帯）は弔事の第一礼装です。",
      "q41_43": "【正解】(3) 燕尾服\n・(3) 正しい：前裾がウエストラインで水平にカッティングされ、後ろ裾がツバメの尾（燕尾）のように長く二股に分かれている男性の夜間用正礼装は『燕尾服（テールコート）』です。\n・(1) モーニングコートは昼間の正礼装（前裾が後方へ斜めにカットされている）、(2) タキシードは夜間の準礼装（本来）、(4) ディレクターズスーツは昼間の準礼装です。",
      "q41_44": "【正解】(1) 揉撚法は、指先で頭皮をつまみ上げ、円を描くように頭頂部までもんでいく。\n・(1) 正しい：揉撚法（じゅうねんほう）は、指頭（指の腹）を頭皮に密着させ、頭皮を動かすように円を描きながら頭頂部へ向かってもみほぐす手技です。\n・(2) 誤り：軽擦法（けいさつほう）は手のひらや指の腹で軽くさする手技であり、らせん状に強くもむのは強擦法です。\n・(3) 誤り：ハッキング（切打法）は小指側の手刀部で交互にリズミカルに叩く叩打法の一種です。\n・(4) 誤り：タッピング（指頭叩打法）は指先で軽く弾くように叩く手技であり、圧迫するのは圧迫法です。",
      "q41_45": "【正解】(1) ワンレングスカットは、ボブとも呼ばれ、ラインに水平、前下がり、前上がり（後ろ下がり）がある。\n・(1) 正しい：ワンレングスカットはすべての毛髪を0度（自然落下位置）で同一のカットライン上にそろえて切る技法で、水平ボブ、前下がりボブ、前上がりボブの3つの基本ラインがあります。\n・(2) 誤り：外側の毛が短く内側の毛が長くなり動きが出る「段カット」は『レイヤーカット』です（グラデーションは外側の毛が長く内側の毛が短い重なりをつくります）。\n・(3) 誤り：サーファーカットやウルフカットの代表例は『レイヤーカット』です。\n・(4) 誤り：グラデーションカットは低い角度（0〜60度程度）で引き出して重みと丸みをつける技法です。",
      "q41_46": "【正解】(3) 横にとったパネルに対して、セニングシザーズを直角あるいは平行に入れてカットするとよい。\n・(3) 誤り：横スライスで引き出したパネルに対して、セニングシザーズを「直角（垂直）」や「平行（水平）」に入れると、切り口が一直線にそろってセニングの跡（段やライン）が目立ってしまいます。そのため、パネルに対して『斜め（約45度）』にシザーズを入れるのが基本です。\n・(1) 毛量調整（減毛）や質感調整、長短差のぼかしに用います。\n・(2) 根元近くからセニングを入れると短い毛が立ち上がってシルエットが膨らむため、通常は中間〜毛先に入れます。\n・(4) 毛流や骨格、毛量に合わせて入れる深さや回数を調整します。",
      "q41_47": "【正解】(3) フォワードスタイルは、サイドから見ると斜め前方向に顔を包みこむようにロッドを配列する。\n・(3) 正しい：フォワードスタイル（前向き配列）は、サイドから見たときに顔に向かって斜め前方向へ毛流れができるようにロッドを配列する巻き方です。\n・(1) 誤り：トップから放射状に巻くのは「ラジアル巻き（放射状配列）」や「メリーゴーランド巻き」です。\n・(2) 誤り：レンガ状に交互にずらしてスライス線を目立たなくする配列は「ブリック巻き（レンガ巻き）」です。\n・(4) 誤り：リバーススタイルは顔から後方（後ろ向き）に向かって流れるように巻く配列です。",

    function generateExplanation(session, qNum, qText, options, correctOne, alsoCorrectIndex) {
      const qId = `q${session}_${String(qNum).padStart(2, "0")}`;
      return QUESTION_EXPLANATIONS[qId] || "";
    }

    // 全770問（第54回〜第41回）を構築
    let CACHED_ALL_QUESTIONS = null;
    function buildAllQuestions() {
      if (CACHED_ALL_QUESTIONS) return CACHED_ALL_QUESTIONS;
      const list = [];
      EXAM_PDF_LIST.forEach(exam => {
        const s = exam.session;
        const rawList = RAW_EXAM_DATA[s] || [];
        rawList.forEach((item, index) => {
          const qNum = index + 1;
          const qId = `q${s}_${String(qNum).padStart(2, '0')}`;
          const [qText, options, correctOne, svgKey] = item;
          let alsoCorrect = null;
          if (s === 49 && qNum === 20) alsoCorrect = 3;
          else if (s === 49 && qNum === 37) alsoCorrect = 1;
          else if (s === 43 && qNum === 50) alsoCorrect = 0;
          else if (s === 42 && qNum === 40) alsoCorrect = 3;

          list.push({
            id: qId,
            session: s,
            questionNumber: qNum,
            category: getCategoryIdByQNum(qNum),
            question: qText,
            options: [...options],
            correctIndex: correctOne - 1,
            alsoCorrectIndex: alsoCorrect,
            svgKey: svgKey || null,
            explanation: generateExplanation(s, qNum, qText, options, correctOne, alsoCorrect)
          });
        });
      });
      CACHED_ALL_QUESTIONS = list;
      return list;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(msg) {
      state.toastMessage = msg;
      render();
      setTimeout(() => {
        if (state.toastMessage === msg) {
          state.toastMessage = '';
          render();
        }
      }, 3200);
    }

    function computeStudentStats(allQuestions) {
      let mastered = 0, review = 0, unattempted = 0, everWrong = 0;
      let totalAttempts = 0, totalCorrect = 0;

      const categoryStats = {};
      CATEGORIES.forEach(c => {
        categoryStats[c.id] = { total: 0, mastered: 0, review: 0, attempted: 0, attemptedPct: 0, masteredPct: 0, unattempted: 0, everWrong: 0, attempts: 0, correct: 0, accuracy: 0 };
      });

      const sessionStats = {};
      EXAM_PDF_LIST.forEach(e => {
        sessionStats[e.session] = { total: 0, mastered: 0, review: 0, attempted: 0, attemptedPct: 0, masteredPct: 0, unattempted: 0, everWrong: 0, attempts: 0, correct: 0, accuracy: 0 };
      });

      allQuestions.forEach(q => {
        const p = state.studentProgress[q.id];
        const cat = categoryStats[q.category];
        const ses = sessionStats[q.session];
        if (cat) cat.total++;
        if (ses) ses.total++;

        if (!p || !p.attempts) {
          unattempted++;
          if (cat) cat.unattempted++;
          if (ses) ses.unattempted++;
        } else {
          const att = p.attempts || 0;
          const cor = p.correctCount || 0;
          const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, att - cor);

          totalAttempts += att;
          totalCorrect += cor;

          if (cat) {
            cat.attempts += att;
            cat.correct += cor;
            cat.attempted++;
          }
          if (ses) {
            ses.attempts += att;
            ses.correct += cor;
            ses.attempted++;
          }

          if (wrg > 0) {
            everWrong++;
            if (cat) cat.everWrong++;
            if (ses) ses.everWrong++;
          }

          if (p.status === 'mastered') {
            mastered++;
            if (cat) cat.mastered++;
            if (ses) ses.mastered++;
          } else {
            review++;
            if (cat) cat.review++;
            if (ses) ses.review++;
          }
        }
      });

      let zeroScoreCategoryCount = 0;
      let weakCategoryCount = 0;
      CATEGORIES.forEach(c => {
        const cs = categoryStats[c.id];
        cs.accuracy = cs.attempts > 0 ? Math.round((cs.correct / cs.attempts) * 100) : 0;
        cs.attemptedPct = cs.total > 0 ? Math.round((cs.attempted / cs.total) * 100) : 0;
        cs.masteredPct = cs.total > 0 ? Math.round((cs.mastered / cs.total) * 100) : 0;
        if (cs.attempts > 0 && cs.correct === 0) zeroScoreCategoryCount++;
        if (cs.attempts > 0 && cs.accuracy < 60) weakCategoryCount++;
      });

      EXAM_PDF_LIST.forEach(e => {
        const ss = sessionStats[e.session];
        ss.accuracy = ss.attempts > 0 ? Math.round((ss.correct / ss.attempts) * 100) : 0;
        ss.attemptedPct = ss.total > 0 ? Math.round((ss.attempted / ss.total) * 100) : 0;
        ss.masteredPct = ss.total > 0 ? Math.round((ss.mastered / ss.total) * 100) : 0;
      });

      const totalQuestions = allQuestions.length;
      const attemptedQuestions = mastered + review;
      const attemptedRate = totalQuestions > 0 ? Math.round((attemptedQuestions / totalQuestions) * 100) : 0;
      const masteryRate = totalQuestions > 0 ? Math.round((mastered / totalQuestions) * 100) : 0;
      const overallAccuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
      const stickyCount = Object.keys(state.studentStickies).length;

      const passEval = evaluatePassCriteria(overallAccuracy, mastered, totalAttempts, zeroScoreCategoryCount, weakCategoryCount, attemptedQuestions);

      return {
        totalQuestions,
        attemptedQuestions,
        attemptedRate,
        mastered,
        review,
        everWrong,
        unattempted,
        masteryRate,
        totalAttempts,
        totalCorrect,
        overallAccuracy,
        stickyCount,
        categoryStats,
        sessionStats,
        zeroScoreCategoryCount,
        weakCategoryCount,
        ...passEval
      };
    }

    // =========================================================
    // 6B. 「前回の続きから再開」位置計算ヘルパー（5科目別 ＆ 過去問14回分）
    // =========================================================
    function getResumeInfoForSet(cursorKey, questions) {
      if (!questions || questions.length === 0) {
        return { resumeIndex: 0, hasResume: false, resumeQuestion: null };
      }
      let savedIdx = state.lastCursors && typeof state.lastCursors[cursorKey] === 'number'
        ? state.lastCursors[cursorKey]
        : null;

      if (savedIdx !== null && savedIdx > 0 && savedIdx < questions.length) {
        return {
          resumeIndex: savedIdx,
          hasResume: true,
          resumeQuestion: questions[savedIdx]
        };
      }

      // カーソル未保存でも、途中まで解いている場合は「最初の未着手問題」または「最後に解いた次の問題」を自動検出
      let hasAnyAnswered = false;
      let lastAnsweredIdx = -1;
      let firstUnattemptedIdx = -1;
      for (let i = 0; i < questions.length; i++) {
        const p = state.studentProgress[questions[i].id];
        if (p && p.attempts > 0) {
          hasAnyAnswered = true;
          lastAnsweredIdx = i;
        } else if (firstUnattemptedIdx === -1) {
          firstUnattemptedIdx = i;
        }
      }

      if (hasAnyAnswered) {
        if (lastAnsweredIdx + 1 < questions.length) {
          const nextIdx = lastAnsweredIdx + 1;
          return {
            resumeIndex: nextIdx,
            hasResume: nextIdx > 0,
            resumeQuestion: questions[nextIdx]
          };
        } else if (firstUnattemptedIdx > 0) {
          return {
            resumeIndex: firstUnattemptedIdx,
            hasResume: true,
            resumeQuestion: questions[firstUnattemptedIdx]
          };
        }
      }

      return { resumeIndex: 0, hasResume: false, resumeQuestion: questions[0] };
    }

    // 6C. 「今日の15問（今日解くべきおすすめ問題）」自動キュレーション＆進捗管理
    // =========================================================
    function getTodayDateKey() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function buildDailyMissionQuestionIds(allQuestions, seedOffset) {
      const pickedIds = [];
      const pickedSet = new Set();
      const addQ = (q) => {
        if (q && !pickedSet.has(q.id) && pickedIds.length < 15) {
          pickedSet.add(q.id);
          pickedIds.push(q.id);
        }
      };

      // 1. 直近で間違えている「要復習」問題を最優先で最大5問ピックアップ
      const reviewQs = allQuestions.filter(q => state.studentProgress[q.id]?.status === 'review');
      reviewQs.slice(0, 5).forEach(addQ);

      // 2. 付箋を貼った問題または過去に間違えた問題を最大3問ピックアップ
      const stickyOrEverWrongQs = allQuestions.filter(q => {
        if (pickedSet.has(q.id)) return false;
        const st = state.studentStickies[q.id];
        const p = state.studentProgress[q.id];
        const wrg = p ? (p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0))) : 0;
        return !!st || wrg > 0;
      });
      stickyOrEverWrongQs.slice(0, 3).forEach(addQ);

      // 3. 残りは「未着手問題」から5科目がバランスよく入るように順番にピックアップ
      const unattemptedByCat = {};
      CATEGORIES.forEach(c => {
        unattemptedByCat[c.id] = allQuestions.filter(q => !pickedSet.has(q.id) && q.category === c.id && (!state.studentProgress[q.id] || !state.studentProgress[q.id].attempts));
      });

      let round = seedOffset || 0;
      let safety = 0;
      while (pickedIds.length < 15 && safety < 100) {
        safety++;
        let addedInPass = false;
        for (let ci = 0; ci < CATEGORIES.length; ci++) {
          const catId = CATEGORIES[ci].id;
          const list = unattemptedByCat[catId];
          if (list && list.length > 0) {
            const idx = round % list.length;
            const candidate = list.splice(idx, 1)[0];
            addQ(candidate);
            addedInPass = true;
            if (pickedIds.length >= 15) break;
          }
        }
        round++;
        if (!addedInPass) break;
      }

      // 4. もし未着手だけでは15問に満たない場合（全問解答済みなど）、解答日が古い問題から補充
      if (pickedIds.length < 15) {
        const remaining = allQuestions
          .filter(q => !pickedSet.has(q.id))
          .sort((a, b) => (state.studentProgress[a.id]?.lastAnsweredAt || 0) - (state.studentProgress[b.id]?.lastAnsweredAt || 0));
        remaining.forEach(addQ);
      }

      return pickedIds;
    }

    function ensureDailyMission(allQuestions, forceNewSet) {
      const todayKey = getTodayDateKey();
      const qMap = {};
      allQuestions.forEach(q => { qMap[q.id] = q; });

      if (
        !forceNewSet &&
        state.dailyMission &&
        state.dailyMission.dateKey === todayKey &&
        Array.isArray(state.dailyMission.questionIds) &&
        state.dailyMission.questionIds.length > 0 &&
        state.dailyMission.questionIds.every(id => !!qMap[id])
      ) {
        if (!Array.isArray(state.dailyMission.completedIds)) {
          state.dailyMission.completedIds = [];
        }
        return state.dailyMission;
      }

      const nextSetNum = (forceNewSet && state.dailyMission && state.dailyMission.dateKey === todayKey)
        ? ((state.dailyMission.setNumber || 1) + 1)
        : 1;
      const questionIds = buildDailyMissionQuestionIds(allQuestions, nextSetNum - 1);
      state.dailyMission = {
        dateKey: todayKey,
        questionIds,
        completedIds: [],
        setNumber: nextSetNum
      };
      savePersonalData();
      return state.dailyMission;
    }

    function getTodays15Summary(allQuestions) {
      const mission = ensureDailyMission(allQuestions, false);
      const qMap = {};
      allQuestions.forEach(q => { qMap[q.id] = q; });

      const questions = mission.questionIds.map(id => qMap[id]).filter(Boolean);
      const completedSet = new Set(mission.completedIds || []);

      let reviewCount = 0;
      let stickyOrPastWrongCount = 0;
      let freshCount = 0;
      questions.forEach(q => {
        const p = state.studentProgress[q.id];
        const wrg = p ? (p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0))) : 0;
        if (p?.status === 'review') reviewCount++;
        else if (state.studentStickies[q.id] || wrg > 0) stickyOrPastWrongCount++;
        else freshCount++;
      });

      const doneCount = questions.filter(q => completedSet.has(q.id)).length;
      const totalCount = questions.length || 15;
      const progressPct = Math.round((doneCount / totalCount) * 100);
      const firstUnfinishedIdx = questions.findIndex(q => !completedSet.has(q.id));
      const resumeIdx = firstUnfinishedIdx >= 0 ? firstUnfinishedIdx : 0;

      const now = new Date();
      const dateLabel = `${now.getMonth() + 1}月${now.getDate()}日`;

      return {
        dateLabel,
        setNumber: mission.setNumber || 1,
        questions,
        doneCount,
        totalCount,
        progressPct,
        isAllDone: doneCount >= totalCount,
        resumeIdx,
        reviewCount,
        stickyOrPastWrongCount,
        freshCount
      };
    }

      const att = p.attempts || 0;

      let cls = 'bg-emerald-50 text-emerald-700 border-emerald-200';

      return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${cls}">
