      47: [
        ["保健所に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「保健所は、現在、その設置や役割が [ A ] に定められており、都道府県や [ B ] に設置され、これら自治体には美容所に対し [ C ] を行う環境衛生監視員が配置されている。」",["A:地域保健法 ― B:保健所設置市又は東京都の特別区 ― C:立入検査","A:保健所法 ― B:すべての市町村 ― C:立入検査","A:保健所法 ― B:保健所設置市又は東京都の特別区 ― C:経営指導","A:地域保健法 ― B:すべての市町村 ― C:経営指導"],1],
        ["美容師名簿の登録に関する次の記述のうち、正しいものはどれか。",["名簿を備えて美容師の免許に関する事項を登録する事務は、都道府県知事が行う。","美容師が氏名を変更したときは、2か月以内に名簿の訂正を申請しなければならない。","美容師が管理美容師資格認定講習会の課程を修了したときは、30日以内に名簿の登録事項の追加を申請しなければならない。","美容師が死亡したときは、戸籍法による届出義務者は、30日以内に名簿の登録の消除を申請しなければならない。"],4],
        ["管理美容師に関する次の文章の [ ] に入る数値の組合せのうち、正しいものはどれか。「美容師である従業者が常時 [ A ] 人以上の美容所の開設者は、美容所ごとに管理美容師を置かなければならない。美容師の免許を受け [ B ] 年以上美容の業務に従事し、管理美容師資格認定講習会の課程を修了した開設者は、自ら主として管理する [ C ] か所の美容所の管理美容師となることができる。」",["A:1 ― B:3 ― C:2","A:1 ― B:5 ― C:1","A:2 ― B:3 ― C:1","A:2 ― B:5 ― C:2"],3],
        ["美容所の開設に関する次の記述のうち、誤っているものはどれか。",["国内に住民票がある外国人は、美容所の開設者になれる場合がある。","美容所の開設者が講ずべき衛生上必要な措置については、都道府県等の条例でも定められている。","美容所の開設者が講ずべき衛生上必要な措置を怠ったときは、そのことにより30万円以下の罰金に処せられる。","施術者全員が理容師及び美容師双方の資格を有するときは、同一の場所で理容所及び美容所の重複開設が認められる場合がある。"],3],
        ["美容所の開設者が行う届出に関する次の記述のうち、正しいものはどれか。",["美容所の開設者は、美容所の名称のみを変更した場合には、届出をする必要はない。","管理美容師を設置すべき美容所の開設者は、開設時に管理美容師の氏名と住所を届け出なければならない。","美容所の開設者は、届出事項に変更が生じた場合には、30日以内に届け出なければならない。","美容所の開設者が開設の届出を怠った場合、閉鎖処分となることがある。"],2],
        ["次のうち、そのことにより罰金に処せられることがある場合として正しいものの組合せはどれか。\na 美容師の免許を受けず美容を業とした場合\nb 美容師が業務停止処分に違反した場合\nc 管理美容師を設置すべき美容所の開設者が管理美容師を設置しない場合\nd 美容所の開設者が構造設備についての検査確認前に美容所を使用した場合",["aとb","bとc","cとd","aとd"],4],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「生活衛生関係営業の振興を図るため、[ A ] が業種ごとに振興指針を定め、この指針に基づいて [ B ] が振興計画を定める仕組みが設けられている。また、サービスの内容を適正に表示すること等により利用者又は消費者の選択の利便を図るため、全国生活衛生営業指導センターは、[ C ] を定めることができる。」",["A:厚生労働大臣 ― B:生活衛生同業組合 ― C:標準営業約款","A:都道府県知事 ― B:生活衛生同業組合 ― C:標準営業約款","A:都道府県知事 ― B:生活衛生同業組合 ― C:適正化規程","A:厚生労働大臣 ― B:都道府県知事 ― C:適正化規程"],1],
        ["美容所の経営についての税金に関する次の記述のうち、誤っているものはどれか。",["所得税や法人税は、利益が出ているときに納める税金である。","雇用主は、従業員の給与から源泉所得税を預かり、原則翌月10日までに税務署に納める。","固定資産税は、経営がうまくいかず損失が出ている場合には、納付が免除される税金である。","申告納税しなければならない者が申告や納税義務を怠った場合には、罰則として追加の税が課されることになっている。"],3],
        ["労働基準法に関する次の記述のうち、誤っているものはどれか。",["労働条件の最低基準を定めている。","同居の親族以外で、使用している従業員が5人未満の美容所には適用されない。","使用者は、技能の習得を目的とする者であることを理由として、労働者を酷使してはならない。","雇用契約を結ぶときは、労働者に賃金等の労働条件を明示しなければならない。"],2],
        ["介護保険制度に関する次の記述のうち、正しいものの組合せはどれか。\na 介護保険の運営主体(保険者)は、都道府県である。\nb 介護保険の被保険者は、20歳以上のすべての国民である。\nc 介護保険の給付には、介護給付のほかに予防給付もある。\nd 介護給付を受けるには、要介護状態について認定を受けなければならない。",["aとb","bとc","cとd","aとd"],3],
        ["わが国の2015年の統計指標に関する次の組合せのうち、Aの数値がBの数値より大きいものはどれか。",["A:肺炎死亡者数 ― B:心疾患死亡者数","A:男性の平均寿命 ― B:女性の平均寿命","A:女性の粗死亡率 ― B:男性の粗死亡率","A:死亡数 ― B:出生数"],4],
        ["生活習慣病に関する次の記述のうち、誤っているものはどれか。",["脳血管疾患の死亡率は、2000年以降減少傾向にある。","悪性新生物の年齢調整死亡率は、増加傾向にある。","虚血性心疾患の患者数や死亡者数は、40歳代以降で加齢とともに急速に増える傾向がある。","2型糖尿病は、肥満や運動、食事などの生活習慣の改善によって予防できる場合がある。"],2],
        ["次のうち、わが国の2015年の65歳以上人口はどれか。",["約1200万人","約2300万人","約3400万人","約5500万人"],3],
        ["カビとダニに関する次の記述のうち、誤っているものはどれか。",["室内の天井や壁に発生している黒カビは、アレルギー反応を引き起こすことはない。","カビの発育は、酸素や湿度、温度、栄養によって影響を受ける。","ダニのなかには、人の皮膚から落下するフケや垢を栄養とするものがいる。","ダニの死骸やふんを吸い込んで、アレルギー反応を引き起こすことがある。"],1],
        ["下水道と浄化槽に関する次の記述のうち、誤っているものはどれか。",["下水道の整備により、日常生活の快適性や公衆衛生の向上が期待できる。","下水処理を終えて川や海に放流される水の水質は、法律により規制されている。","下水道が整備されていない地域では、浄化槽が広く使用されている。","浄化槽の設置や保守点検に関係する法律は、定められていない。"],4],
        ["次の感染症のうち、美容師が感染している場合、感染症法に基づき、美容の業務に従事できないものの正しい組合せはどれか。\na 後天性免疫不全症候群(エイズ)\nb 結核\nc エボラ出血熱\nd 梅毒",["aとb","bとc","cとd","aとd"],2],
        ["予防接種法に基づく予防接種に関する次の記述のうち、誤っているものはどれか。",["予防接種を受けるように努めなければならないという努力義務は、これを受けなければならないという義務に改められている。","定期に行われるものや臨時に行われるもの、希望者が任意に受けるものがある。","予防接種には、感染症に対する個人や集団の抵抗力を高める効果がある。","定期予防接種の対象疾病にはA類疾病、B類疾病があり、救済の内容などに違いがある。"],1],
        ["感染症と病原体に関する次の組合せのうち、正しいものはどれか。",["ペスト ― 細菌","破傷風 ― 原虫","ジフテリア ― ウイルス","デング熱 ― 蠕虫"],1],
        ["次の感染症のうち、胎内感染することがあるものはどれか。",["腸管出血性大腸菌感染症","百日せき","風しん","コレラ"],3],
        ["次の対策のうち、感染症予防の3原則に含まれないものはどれか。",["感染源に関する対策","感染経路に関する対策","宿主の感受性対策","個人予防対策"],4],
        ["紫外線消毒に関する次の記述のうち、誤っているものはどれか。",["タオルやケープなどの布片類の消毒に適している。","物体の表面にしか作用しないので、深部や陰の部分は消毒できない。","目や皮膚に直接照射すると害がある。","プラスチックの一部には劣化するものがある。"],1],
        ["美容所で行う蒸気消毒に関する次の記述のうち、正しいものはどれか。",["かみそりの消毒に適用できる。","消毒に要する時間は、煮沸消毒より短い。","タオル蒸し器内の圧力は、大気圧と同じである。","細菌の芽胞を不活化できる。"],3],
        ["消毒薬水溶液の特徴に関する次の記述のうち、正しいものはどれか。",["エタノール水溶液は、無色透明で揮発性がある。","次亜塩素酸ナトリウム水溶液は、無色透明で引火性がある。","両性界面活性剤水溶液は、赤桃色で振ると泡立つ。","逆性石けん水溶液は、無色透明で一般の石けんと併用すると消毒力が高まる。"],1],
        ["消毒薬水溶液の調製に関する次の記述のうち、正しいものはどれか。",["5%次亜塩素酸ナトリウムを50倍希釈して、0.01%水溶液を調製する。","10%逆性石けんを100倍希釈して、0.1%水溶液を調製する。","20%グルコン酸クロルヘキシジンを200倍希釈して、0.05%水溶液を調製する。","15%両性界面活性剤を150倍希釈して、1%水溶液を調製する。"],2],
        ["血液が付着しているくしの消毒方法に関する次の記述のうち、正しいものの組合せはどれか。\na 80℃を超える蒸気に10分間以上触れさせる。\nb 0.1%以上の次亜塩素酸ナトリウムに10分間以上浸す。\nc 消毒用エタノールに10分間以上浸す。\nd 1cm²当たり85マイクロワット以上の紫外線を20分間以上照射する。",["aとb","bとc","cとd","aとd"],2],
        ["次の関節のうち、最も自由に運動できる形態のものはどれか。",["蝶番関節","鞍関節","車軸関節","球関節"],4],
        ["次の筋のうち、表情筋に含まれないものはどれか。",["眼輪筋","口輪筋","前頭筋","側頭筋"],4],
        ["次のうち、交感神経が優位に機能するときに起こる変化はどれか。",["アドレナリン分泌低下","瞳孔散大","心筋収縮力低下","消化管機能亢進"],2],
        ["次の眼の部分のうち、網膜にあるものはどれか。",["虹彩","中心窩","硝子体","毛様体"],2],
        ["次のうち、血液の小循環の経路に含まれるものはどれか。",["右心室","左心室","脳の毛細血管","門脈"],1],
        ["皮膚に関する次の記述のうち、誤っているものはどれか。",["頭の皮膚は厚くて強く、ゴムのようなかたさと弾力を持っている。","体幹の皮膚は、腹側よりも背側の方が厚い。","顔の皮膚は、全体的に厚さが均一である。","耳を覆う皮膚の皮下組織は少なく、皮下脂肪はほとんどない。"],3],
        ["皮膚付属器官に関する次の記述のうち、正しいものはどれか。",["毛根の下端のフラスコ状に膨らんだ部分を毛幹という。","脂腺は、手掌や足底に最も多く分布する。","汗腺には、エクリン腺とアポクリン腺がある。","爪の主な成分は、エラスチンである。"],3],
        ["皮膚と皮膚付属器官の生理機能に関する次の記述のうち、誤っているものはどれか。",["皮膚に冷たい刺激を与えると、立毛筋が収縮して、いわゆる鳥肌反応(立毛筋反射)が起こることがある。","脂腺の発育は、女性ホルモンの刺激によって行われる。","温度と関係なく精神的な感動によって手掌や足底、腋窩から急激に汗が出ることがある。","皮膚の表面にある脂肪膜は弱酸性で、細菌の増殖を抑制する。"],2],
        ["皮膚と皮膚付属器官の保健に関する次の記述のうち、誤っているものはどれか。",["肝臓障害によって胆汁色素が皮膚に沈着すると、皮膚は紫色を帯びる。","更年期の女性では、フケの増加やひげの発育、四肢の硬毛の発育がみられることがある。","尋常性痤瘡(ニキビ)のなかには、便秘により悪化するものがある。","UVAは真皮にまで達し、しわやたるみを招く。"],1],
        ["皮膚の疾患と病原体に関する次の組合せのうち、正しいものはどれか。",["伝染性軟属腫(ミズイボ) ― 細菌","伝染性膿痂疹(トビヒ) ― ヒゼンダニ","帯状疱疹 ― 真菌","尋常性疣贅 ― ウイルス"],4],
        ["香粧品の水性原料である水とエタノールに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「多くの化粧水のように物質が均一に溶け合って液体となった溶液において、物質を溶かしている液体を溶媒といい、溶けている物質を [ A ] という。水のような炭素を含まない溶媒を [ B ] 溶媒という。エタノールは水に溶けない物質を溶かす溶媒としての働きだけでなく、蒸発する際に皮膚の熱を奪って冷感を与えて皮膚組織を引き締める [ C ] 作用も持っている。」",["A:溶剤 ― B:無機 ― C:保湿","A:溶剤 ― B:有機 ― C:収れん","A:溶質 ― B:有機 ― C:保湿","A:溶質 ― B:無機 ― C:収れん"],4],
        ["油性原料に関する次の組合せのうち、誤っているものはどれか。",["油脂 ― オリーブ油","ロウ類 ― ホホバ油","炭化水素 ― マイクロクリスタリンワックス","シリコーン油 ― ワセリン"],4],
        ["界面活性剤に関する次の記述のうち、正しいものはどれか。",["石けんは、陽イオン界面活性剤(カチオン界面活性剤)に分類され、洗浄力に優れている。","第四級アンモニウム塩は、陰イオン界面活性剤(アニオン界面活性剤)に分類され、ヘアリンス剤に用いられる。","レシチンは、両性界面活性剤に分類され、大豆や卵黄などから得ることができる。","ラノリンは、非イオン界面活性剤(ノニオン界面活性剤)に分類され、クリームや乳液などの乳化剤として用いられる。"],3],
        ["酸化・還元に関する次の記述のうち、誤っているものはどれか。",["過酸化水素は、染毛剤中で還元剤として作用する。","パーマ剤第1剤中のチオグリコール酸は、還元剤として用いられ、シスチン結合に水素を与える。","パーマ剤第2剤中の臭素酸ナトリウムは、毛髪内のシスチン結合を酸化により再結合させる。","抗酸化剤は、香粧品の自動酸化を防ぐ。"],1],
        ["ヘアカラー製品に関する次の記述のうち、誤っているものはどれか。",["パラフェニレンジアミンは、毛髪内部まで浸透し、重合により発色する。","脱色剤は、毛髪内部のメラニン色素を酸化して分解する。","酸化染料は、ヘアマニキュアに配合される。","染料中間体をカップラーとともに用いると、さまざまな色調に発色する。"],3],
        ["昭和時代に流行した髪型に関する次の記述のうち、誤っているものはどれか。",["セシールカットとは、髪全体を極端に短くしたボーイッシュな髪型である。","サーファーカットとは、肩よりやや長めのセミロングのレイヤードヘアである。","ソバージュとは、根元から毛先まで細かくパーマをかけてウェーブをつけた髪型である。","ヘップバーンスタイルとは、後頭部で束ねた毛束を子馬のしっぽのように垂らした髪型である。"],4],
        ["次のうち、1960年代から1970年代にかけて流行した若者男性のヘアスタイルに該当しないものはどれか。",["GI刈","ロングヘア","マッシュルームカット","アフロヘア"],1],
        ["1960年代の服装に関する次の記述のうち、誤っているものはどれか。",["高田賢三が、アメリカのアイビースタイルをアメトラ(アメリカン・トラディショナル)ファッションとして定着させた。","東京・銀座で西銀座族やみゆき族と名付けられた若者たちのファッションが話題となった。","パリのオートクチュールデザイナーが作りはじめた高級既製服が日本でも販売されるようになった。","アンドレ・クレージュがミニスカートをパリ・コレクションで取り上げ、話題となった。"],1],
        ["美容技術における作業姿勢に関する次の記述のうち、誤っているものはどれか。",["立位作業を行うときは、技術者の重心から下した垂線が両足に囲まれた領域内にあると姿勢が安定する。","技術を施す箇所に正対して作業することが、正しい姿勢の基本である。","パーマネントウェーブ技術でロッドを巻くときは、頭部が技術者の目の高さとなるようにする。","肩の関節を固定させて手を動かす作業を行うときは、肘に余裕を持たせて手先を動かすとよい。"],4],
        ["シザーズに関する次の記述のうち、正しいものはどれか。",["母指で操作する方の刃を静刃という。","ティッシュペーパーをゆっくりと切ってみたときに、すべるものがよい。","交点での接触圧が開くときより閉じるときに強いものがよい。","動刃と静刃の間に凸レンズ状のあきが正確につくられているものがよい。"],4],
        ["ヘアアイロンに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「ヘアアイロンは、[ A ] と物理的な力によって毛髪の構造に変化を与える。ロッドの素材には、ステンレスやセラミックの他、ヘアローションなどが焦げつかないように表面に [ B ] 加工を施したものなどがある。電熱式ヘアアイロンでは、ニクロム線と [ C ] との接続部分は壊れやすく、絶縁体が不良になると感電の危険がある。」",["A:熱 ― B:アクリル樹脂 ― C:プラグ","A:光 ― B:フッ素樹脂 ― C:プラグ","A:光 ― B:アクリル樹脂 ― C:コード","A:熱 ― B:フッ素樹脂 ― C:コード"],4],
        ["次のスキャルプトリートメントの方法のうち、化学的方法に分類されるものはどれか。",["ブラッシングによる方法","スキャルプマッサージによる方法","ヘアトニックを用いる方法","ヘアスチーマーの湿熱を用いる方法"],3],
        ["デザインの比率に関する次の記述のうち、誤っているものはどれか。",["パルテノン神殿など歴史的な建造物の中に、最も安定した比率とされる黄金比を見ることができる。","人間のプロポーションでは、身体に対して頭が相対的に大きいと全体的に大人っぽい成熟した印象を与える。","アンバランスなデザインは、緊張感を生み出す。","レオナルド・ダ・ヴィンチは、人体のプロポーションのカノン(基準)を描いた。"],2],
        ["シザーズによるカット技法に関する次の記述のうち、正しいものはどれか。",["ブラントカットとは、カッティングされたラインを修整する技法である。","ポインティングカットとは、毛髪を直線でブツ切りにする技法である。","スライドカットとは、毛先を穂先のような状態にする技法である。","トリミングカットとは、毛量を減らして調整する技法である。"],3],
        ["パーマネントウェーブ技術に関する次の記述のうち、正しいものはどれか。",["吸水性毛は薬剤をはじき、パーマがかかりにくい。","施術前のシャンプーは、刺激が少なく適度に洗浄力のあるシャンプー剤がよい。","パーマがかかりすぎるおそれのある毛髪の場合は、つけ巻きをするとよい。","テストカール時の適正カールの直径は、ロッドの直径の1.5倍である。"],2],
        ["次のストランドカールのベースの種類のうち、ステムをオーバーラップさせやすいものはどれか。",["スクエアベース","オブロングベース","パラレログラムベース","トライアンギュラーベース"],4],
        ["酸化染毛剤に関する次の記述のうち、誤っているものはどれか。",["カラーチェックは、1か所で行う。","頭髪全体を明るくする場合は、細かいブロックに分けて、ネープから塗布する。","おしゃれ染の場合は、先に中間部と毛先に塗布し、希望色に近づいたら根元部分に塗布する。","白髪は染まりにくいので、多い部分から塗布し、放置時間を長めにする。"],1],
        ["アーティフィシャルネイルに関する次の記述のうち、誤っているものはどれか。",["チップとは、チップを装着し、弱い爪の補強や修復を行うテクニックである。","チップオーバーレイとは、チップを装着した上にジェル等で補強するテクニックである。","スカルプチュアとは、人工爪の土台となるフォームを使用し、ジェル等で長さを出すテクニックである。","ナチュラルネイルオーバーレイとは、爪の上をジェル等で覆い、補強や修復などを行うテクニックである。"],1],
        ["まつ毛エクステンションの注意事項に関する次の記述のうち、正しいものはどれか。",["まつ毛エクステンションの施術中に体に何らかの違和感を生じた場合は、直ちに施術者が塗り薬などで対処する。","グルーは硬化するまでに時間がかかるため、施術後、最低でも5〜6時間は洗顔・入浴など高温・多湿の環境は避ける。","個人差はあるが、おおむね5〜6週間でリペアが必要になる。","再来時のカウンセリングは必要ない。"],2],
        ["下図は、日本髪を表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:前髷 ― B:髱 ― C:鬢","A:前髪 ― B:髱 ― C:鬢","A:前髷 ― B:鬢 ― C:髱","A:前髪 ― B:鬢 ― C:髱"],4,"nihongami_47_55"]
      ],
      46: [
        ["美容師法に関する次の記述のうち、誤っているものはどれか。",["公衆衛生の向上に資することで国民全体の利益を図っている。","美容の業務が適正に行われるように規律している。","美容業の経営の健全化を促進することにより、美容業の振興を図っている。","美容師の資格を定め、美容師の免許を受けた者でなければ美容を業としてはならないとしている。"],3],
        ["美容師の免許に関する次の記述のうち、正しいものはどれか。",["美容師が住所を変更したときは、速やかに美容師名簿の訂正を申請しなければならない。","美容師が氏名を変更したときは、30日以内に美容師名簿の訂正を申請しなければならない。","美容師が免許取消処分を受けたときは、速やかに住所地の都道府県知事に免許証(免許証明書)を返納しなければならない。","美容師が業務停止処分を受けたときは、速やかに厚生労働大臣に免許証(免許証明書)を返納しなければならない。"],2],
        ["次のうち、美容師の免許取消処分の対象となるものはどれか。",["伝染性の疾病にかかり、その就業が公衆衛生上不適当と認められる場合","美容師法等で定める衛生上必要な措置を講じなかった場合","法の規定による業務の停止処分に違反して、美容の業をした場合","美容師法の政令又は都道府県等の条例で定める特別の事情がないにもかかわらず、美容所以外の場所で美容の業をした場合"],3],
        ["管理美容師に関する次の記述のうち、正しいものの組合せはどれか。\na 管理美容師は、美容師である従業者が常時2人以上の美容所に設置しなければならない。\nb 同一人が複数の美容所の管理美容師となることはできない。\nc 管理美容師は、美容所の施設を衛生的に管理するものであり、美容の業務を衛生的に管理することまでは求められていない。\nd 管理美容師は、美容師の免許を受けた後2年以上美容の業務に従事し、厚生労働大臣の指定する講習会の課程を修了した者でなければならない。",["aとb","bとc","cとd","aとd"],1],
        ["美容所の開設に関する次の記述のうち、正しいものはどれか。",["美容所の開設者は、美容師の免許を有する者でなければならない。","美容所を開設する者は、使用開始後に届出を行い、構造設備の検査確認を受けなければならない。","会社が従業員の福利厚生のために設ける美容所については、開設の届出は不要である。","美容所の開設者の地位を承継する相続人は、その旨を都道府県知事等に届け出なければならない。"],4],
        ["次のうち、美容所の閉鎖命令の対象となるものはどれか。",["開設者が、美容師でない者に美容の業務を行わせた場合","開設者が、構造設備の変更届を怠った場合","従事する美容師が、精神の機能の障害により業務を適正に行うことができない場合","従事する美容師が、環境衛生監視員による立入検査を妨げた場合"],1],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に関する次の記述のうち、正しいものはどれか。",["厚生労働大臣は、衛生上の規制措置のための適正化規程を定めることができる。","生活衛生同業組合は、営業に関する技能の改善向上についても事業としている。","都道府県知事は、振興指針を定めることができる。","全国生活衛生営業指導センターが定める標準営業約款では、営業日の統一についても定めている。"],2],
        ["会計に関する次の記述のうち、誤っているものはどれか。",["損益計算書では、一定の期間における利益や費用がどのような状況になっているのかを把握することができる。","損益計算書において、利益は「利益＝収益(売上)－費用(コスト)」により求められる。","貸借対照表では、一時点においてどれだけの資産があるのか、借金はどれだけあるのかなどの状況を把握することができる。","貸借対照表において、1年以内に返済しなければならない借金は固定負債に分類される。"],4],
        ["医療保険制度に関する次の記述のうち、正しいものはどれか。",["国民健康保険の保険者は、国民健康保険組合と全国健康保険協会である。","国民健康保険の保険料は、保険者にかかわらず全国一律である。","健康保険の保険料には、被保険者負担はない。","健康保険においては、育児休業中の保険料が免除される制度がある。"],4],
        ["労働保険に関する次の記述のうち、誤っているものはどれか。",["雇用保険の保険料には、被保険者負担と事業主負担がある。","雇用保険の基本手当は、自己都合で退職し失業した場合には支給されない。","労働者災害補償保険の適用事業に雇用される者は、国籍や身分、年齢などにかかわらず適用労働者となる。","労働者災害補償保険は、通勤途上の事故に対しても適用されることがある。"],2],
        ["わが国の死亡に関する次の記述のうち、正しいものはどれか。",["年齢別死亡率は、一般的に思春期のころ最も低くなる。","年齢調整死亡率は、人口1,000人に対して1年間に死亡した人の数である。","がんによる死亡数は、減少傾向にある。","粗死亡率は、低下傾向にある。"],1],
        ["2015年のわが国の平均寿命に関する次の記述のうち、正しいものはどれか。",["平均寿命の伸長は、公衆衛生の向上発展とは無関係である。","男女とも80年以上である。","男女とも世界第1位である。","男女の差は、3年以下である。"],2],
        ["次の疾病のうち、生活習慣病に該当しないものはどれか。",["がん","脳卒中","肺炎","心臓病"],3],
        ["一酸化炭素に関する次の記述のうち、誤っているものはどれか。",["不完全燃焼により生じる。","不快な臭いがする。","赤血球のヘモグロビンと結合する。","空気中の濃度が高くなると、頭痛、めまい、吐き気などを起こし、死に至る場合もある。"],2],
        ["採光と照明に関する次の記述のうち、誤っているものはどれか。",["自然光には、直射日光と、雲を通してくる光や北の窓からの光などの天空光がある。","一般に日常生活に不自由のない明るさは、10ルクス程度である。","照明には、作業場所だけを明るくする局所照明と部屋全体を明るくする全般照明がある。","直接照明は、照明効率は高いが、コントラストが強かったり影をつくったりして、眼精疲労を起こすことがある。"],2],
        ["感染症とその病原体の身体への侵入・媒介経路に関する次の組合せのうち、誤っているものはどれか。",["百日せき ― 気道","腸管出血性大腸菌感染症 ― 飲食物","C型肝炎 ― 動物・節足動物","後天性免疫不全症候群(エイズ) ― 直接接触・傷口"],3],
        ["細菌に関する次の記述のうち、正しいものはどれか。",["細菌の成分の約80%は、タンパク質である。","細菌の芽胞は、熱や乾燥に弱い。","細菌のなかには、酸素があると発育、増殖できないものがある。","細菌は、生きた細胞内でないと発育、増殖できない。"],3],
        ["細菌の変異に関する次の記述のうち、誤っているものはどれか。",["変異には、細菌が新たな性質を獲得する場合と本来持っていた性質を失う場合がある。","変異によって、細菌の病原性が低下することがある。","変異によって、化学療法剤や消毒剤に対する耐性を獲得することがある。","変異によって、細菌の形態が変化することはない。"],4],
        ["感染と発病に関する次の記述のうち、誤っているものはどれか。",["病原体が体内に侵入しても、発育、増殖することができず、体外に排出されてしまう状態のことも感染という。","健康な人であれば、通常、感染を起こさないような病原性が低い病原体によって感染、発病する感染症を日和見感染症という。","感染していても発病していない状態を不顕性感染という。","病原体が体内に侵入してから最初に症状があらわれるまでの期間を潜伏期という。"],1],
        ["結核に関する次の記述のうち、正しいものの組合せはどれか。\na 2015年のわが国の新登録患者数は、約100人である。\nb 感染経路は、主として飛沫核感染である。\nc 患者の早期発見のため、定期の健康診断が行われている。\nd 肺以外の臓器は侵されない。",["aとb","bとc","cとd","aとd"],2],
        ["次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「微生物を殺すことの総称は、[ A ] である。微生物のなかでも、病原微生物を殺すか除去して感染力をなくすことを [ B ] という。また、[ C ] とは、あらゆる微生物を殺すか除去して微生物の存在をなくすことをいう。」",["A:殺菌 ― B:防腐 ― C:滅菌","A:滅菌 ― B:消毒 ― C:殺菌","A:殺菌 ― B:消毒 ― C:滅菌","A:滅菌 ― B:防腐 ― C:殺菌"],3],
        ["美容師法施行規則に定められている消毒法に関する次の記述のうち、正しいものの組合せはどれか。\na 血液が付着していないブラシは、逆性石けんが0.1%以上である水溶液中に10分間以上浸す。\nb 血液が付着したはさみは、1cm²あたり85マイクロワット以上の紫外線を20分間以上照射する。\nc 血液が付着していないかみそりは、エタノールが76.9〜81.4%の水溶液を含ませた綿もしくはガーゼで表面を拭く。\nd 血液が付着したくしは、次亜塩素酸ナトリウムが0.1%以上である水溶液中に10分間以上浸す。",["aとb","bとc","cとd","aとd"],4],
        ["消毒・殺菌に関する次の記述のうち、誤っているものはどれか。",["同じ時間と温度であれば、湿熱は乾熱より効果が高い。","消毒薬水溶液の温度は低いほど効果がある。","消毒薬には、消毒しようとする対象によって適した濃度がある。","蒸気消毒は、煮沸消毒より長く時間がかかる。"],2],
        ["消毒用エタノールに関する次の記述のうち、誤っているものはどれか。",["逆性石けんと併用すると効果が低下する。","細菌の芽胞には効果がない。","揮発性が強いので、濃度が変化しやすい。","引火性があるので、保管や取扱い時に火気を避ける。"],1],

        ["皮膚の構造に関する次の記述のうち、正しいものはどれか。",["表皮は、基底層、有棘層、顆粒層、角質層の4つの層からなる。","角化細胞(ケラチノサイト)は、表皮内に侵入した抗原物質(アレルゲン)を取り込む性質がある。","ランゲルハンス細胞は、約1か月かけて基底細胞から角質細胞に分化する。","色素細胞(メラノサイト)の数は、同一部位で比較すると人種によって大きく異なる。"],1],
        ["皮膚付属器官の構造に関する次の記述のうち、誤っているものはどれか。",["すべての毛に毛髄質はある。","毛は、皮膚表面に出ている部分を毛幹、皮膚の内部にある部分を毛根という。","毛は、毛母でつくられる。","毛は、ケラチンという硫黄を含んだタンパク質でできている。"],1],
        ["皮膚と皮膚付属器官の生理機能に関する次の記述のうち、誤っているものはどれか。",["ヒトでは、皮膚呼吸はほとんど行われない。","皮膚表面の脂肪膜と角質層のケラチンは、化学的刺激に対する保護の働きをしている。","皮膚表面の脂肪膜は、pHは7ぐらいなので、細菌の発育を抑制しない。","温度と関係なく精神的な感動によって手掌や足底、腋窩から急激に汗が出ることを精神性発汗という。"],3],
        ["皮膚と皮膚付属器官の保健に関する次の記述のうち、誤っているものはどれか。",["抗しわ療法として、ボツリヌス毒素による筋弛緩作用を利用することがある。","尋常性痤瘡(ニキビ)、蕁麻疹、湿疹のなかには、便秘により悪化するものもある。","男性ホルモンの増加は、脂腺の発育を促し、尋常性痤瘡や脂漏を引き起こす。","UVAは真皮にまで達し、色素細胞の働きを弱める。"],4],
        ["皮膚疾患に関する次の記述のうち、正しいものはどれか。",["脂漏性皮膚炎は、フケ症やあぶら症の人に多い皮膚炎で、紅斑や落屑がみられる。","手には、足のように白癬菌による病変は生じない。","化粧品によるアレルギー性の接触皮膚炎(カブレ)は、薄めれば発症しない。","尋常性疣贅は、真菌によってできる。"],1],
        ["溶媒に関する次の記述のうち、正しいものはどれか。",["水は、有機溶媒である。","メタノールは、化粧水の溶媒として用いられる。","イソプロパノールには、殺菌力がない。","アセトンは、エナメルリムーバーに用いられる。"],4],

        ["香粧品に含まれる成分とその配合目的に関する次の組合せのうち、誤っているものはどれか。",["パラアミノ安息香酸エステル ― 紫外線吸収剤","パラオキシ安息香酸エステル(パラベン) ― 防腐剤","パラフィン ― 水性原料","パラフェノールスルホン酸亜鉛 ― 収れん剤"],3],
        ["パーマ剤に含まれる成分とその配合目的に関する次の記述のうち、誤っているものはどれか。",["システインは第2剤に含まれ、酸化剤として働く。","臭素酸ナトリウムは第2剤に含まれ、酸化剤として働く。","チオグリコール酸は第1剤に含まれ、還元剤として働く。","モノエタノールアミンは第1剤に含まれ、アルカリ剤として働く。"],1],
        ["ヘアカラー製品に関する次の記述のうち、正しいものの組合せはどれか。\na 酸性染毛料は、医薬部外品に分類される。\nb 脱染剤には、強い酸化剤である過硫酸塩が用いられる。\nc 酸化染毛剤第2剤中の過酸化水素から放出される酸素により、メラニン色素の分解が起こる。\nd パラフェニレンジアミンは、もともと色を有する直接染料である。",["aとb","bとc","cとd","aとd"],2],
        ["明治時代の女性の髪型に関する次の記述のうち、誤っているものはどれか。",["洋服を着る人はごく一部で、和装に束髪という組合せが発達した。","束髪は、日本髪よりも衛生的で手入れがしやすく、日常生活に便利であった。","束髪は、上流階級や知識層の女性にまず受け入れられ、さらに働く女性に普及していった。","日本髪は、日常的には結われなくなった。"],4],

        ["下図は、頭部の基準となるポイントを表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:ゴールデンポイント ― B:トップポイント ― C:イヤーポイント","A:トップポイント ― B:ゴールデンポイント ― C:イヤーポイント","A:ゴールデンポイント ― B:トップポイント ― C:ネープポイント","A:トップポイント ― B:ゴールデンポイント ― C:ネープポイント"],2,"head_46_44"],
        ["下図は、シザーズが応用しているてこの原理での力学的な点を表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:作用点 ― B:支点 ― C:力点","A:力点 ― B:交点 ― C:作用点","A:力点 ― B:支点 ― C:作用点","A:作用点 ― B:交点 ― C:力点"],1,"scissors_46_45"],

        ["ヘアデザインに関する次の記述のうち、誤っているものはどれか。",["幾何学的錯視は大きく分類すると、距離・大きさに関する錯視と角度・方向に関する錯視の2つに分けられる。","ドンディスによる形の3つの基本形は、正方形・円・正五角形である。","面を構成する要素として、形・大きさ・テクスチャーがある。","ヘアスタイルにおけるテクスチャーは、ストレートかウェーブもしくはラフな表面の仕上り感である。"],2],

        ["パーマネントウェーブ技術に関する次の記述のうち、正しいものはどれか。",["中間リンスは、役割を終えた第2剤を洗い流すために行う。","ロッドアウト後のプレーンリンスは、ぬるま湯で手早く簡単にすませる。","アフターリンスの目的の1つには、酸性成分を中和し毛髪を膨潤させるということがある。","アフターリンスの目的の1つには、施術中に脱脂した油分をヘアトリートメントで補うということがある。"],4],
        ["次のピンカールのうち、ストランドの根元から巻きはじめ、根元に強いカールがあらわれるものはどれか。",["スカルプチュアカール","リフトカール","メイポールカール","クロッキノールカール"],1],
        ["色の基本に関する次の記述のうち、誤っているものはどれか。",["プライマリーカラー(色の三原色)とは、赤、黄、青の3色である。","明度は色の明るさのことで、彩度は色の鮮やかさのことである。","明度と彩度が組み合わさった調子を色のトーンという。","プライマリーカラーを2色ずつ混合したものをカラーサークル(色相環)という。"],4],
        ["マニキュア技術に関する次の記述のうち、正しいものはどれか。",["爪が長い場合は、キューティクルニッパーで爪をカットした後、ファイリングを行う。","ファイリングは、ストレスポイントからセンターに向け、往復しながら行う。","はみ出したカラーエナメルは、コットンスティックにエナメルリムーバーを含ませて拭き取る。","ベースコート、カラーエナメルの順に塗布した後に油分処理をし、仕上げにトップコートを塗布する。"],3],
        ["アイブロウメイクアップに関する次の記述のうち、正しいものはどれか。",["芯のかたいアイブロウペンシルを用いて、1本1本の眉毛を植えこむように描くとよい。","眉山は、黒目の中央と外側の延長線の間が基本である。","ドローイングは、アイシャドーで眉毛の部分に陰を付け、自然な仕上がりにすることである。","アーチ形の眉は、眉頭から眉尻にかけて直線的に描くとよい。"],1],
        ["まつ毛エクステンションに関する次の記述のうち、正しいものはどれか。",["エクステンションは、まつ毛の成長期初期の装着が最適である。","エクステンションは、地肌から3mm以上離して接着する。","エクステンションは、通常2〜3週間持つ。","エクステンションを装着しやすいように、眼鏡の代わりにコンタクトレンズの使用を勧める。"],3],

      45: [
        ["次のうち、都道府県知事、保健所設置市の市長又は特別区の区長が行う事務に含まれないものはどれか。",["美容所の開設届の受理","美容所の構造設備の検査確認","美容所について講じなければならない衛生措置の実施状況の立入検査","美容師免許証の交付"],4],
        ["美容師の免許及び業務に関する次の記述のうち、誤っているものはどれか。",["美容師試験に合格しても、美容師名簿に登録されなければ美容師の免許は与えられない。","美容師が美容の業を行う場合の衛生上必要な措置については、美容所が所在する都道府県等の条例にも従う必要がある。","外国の美容師の資格を持っている者は、日本の美容師の免許がなくても日本国内で美容を業とすることができる。","染毛は、理容師か美容師でなければ業として行うことはできない。"],3],
        ["美容師の免許に関する次の記述のうち、正しいものはどれか。",["美容師試験に合格しても、かつて無免許で美容の業を行った者には美容師の免許が与えられないことがある。","免許の申請にあたっては、添付書類として結核及び伝染性皮膚疾患の有無に関する医師の診断書が必要である。","免許を受けた者は、10年ごとに更新の手続きを行わなければならない。","免許証を紛失した場合には、住所地の都道府県知事に免許証の再交付を申請しなければならない。"],1],
        ["次のうち、美容師の業務停止処分の対象として誤っているものはどれか。",["美容師法の政令又は都道府県等の条例で定める特別の事情がないにもかかわらず、美容所以外の場所で美容の業をした場合","免許証を破り、汚し、又は紛失した場合","美容師法等で定める衛生上必要な措置を講じなかった場合","伝染性の疾病にかかり、その就業が公衆衛生上不適当と認められる場合"],2],
        ["美容所に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「美容所の開設にあたっては、事前に [ A ] が必要とされ、美容所の [ B ] について検査確認を受けた後でなければ使用してはならず、これに反した場合には、[ C ] となることがある。」",["A:許可 ― B:器具機材 ― C:罰金刑","A:許可 ― B:構造設備 ― C:閉鎖処分","A:届出 ― B:器具機材 ― C:閉鎖処分","A:届出 ― B:構造設備 ― C:罰金刑"],4],
        ["次のうち、美容所の開設者が美容師法に基づく変更の届出を行う必要がないものはどれか。",["管理美容師が変更となった場合","美容師が退職した場合","美容師を新たに雇用した場合","美容所の営業日が変更となった場合"],4],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に関する次の記述のうち、正しいものはどれか。",["美容業については、1つの都道府県に複数の生活衛生同業組合を設立することができる。","生活衛生同業組合は、施術料金を統一するための標準営業約款を定めることができる。","生活衛生同業組合は、組合員に対する設備改善の資金のあっせんを行うことができる。","生活衛生同業組合は、営利を目的として設立された組織である。"],3],
        ["労働安全衛生法に関する次の記述のうち、誤っているものはどれか。",["小規模な事業者には、労働者に対する医師による健康診断の実施は義務付けられていない。","事業者には、特定の伝染性の疾病にかかった者の就業を禁止することが義務付けられている。","事業者には、労働者の健康に配慮して、労働者の従事する作業を適切に管理する努力が求められている。","事業者には、労働者に対する健康教育、健康相談など健康の保持増進のための措置を実施する努力が求められている。"],1],
        ["国民年金制度に関する次の記述のうち、誤っているものはどれか。",["老齢基礎年金の給付額は、保険料を納付した期間によって異なる。","障害基礎年金の給付額は、障害の程度にかかわらず、すべて同額である。","国民年金の保険料に上乗せした付加保険料を納付することで、付加年金が支給される制度が設けられている。","所得が低いなど、保険料を納めることが困難な場合に保険料の免除や納付猶予となる制度が設けられている。"],2],
        ["医療保険に関する次の記述のうち、誤っているものはどれか。",["健康保険における保険者(運営主体)は、全国健康保険協会と健康保険組合である。","75歳未満の美容所の従業者で健康保険などの被用者保険に加入していない者は、国民健康保険の対象となる。","医療保険の療養の給付における一部負担金は、年齢にかかわらず、すべてかかった医療費の3割である。","健康保険の出産育児一時金は、被保険者や一定要件に該当する扶養家族が出産したときに支給される。"],3],
        ["出生と死亡に関する次の統計指標のうち、2015年の数値が1980年より増加しているものはどれか。",["出生率","合計特殊出生率","乳児死亡率","粗死亡率"],4],
        ["わが国の平均寿命と死亡率に関する次の記述のうち、正しいものはどれか。",["平均寿命が男女とも50歳を超えたのは、1935年である。","平均寿命は、2015年には男性87.05歳、女性80.79歳となった。","1981年以降は、主要死因別死亡率の第1位は、がんである。","近年、がんの部位別年齢調整死亡率の第1位は、男女ともに肺がんである。"],3],
        ["喫煙や飲酒に関する次の記述のうち、誤っているものはどれか。",["喫煙者では、肺がん、膀胱がんなどのほか、心疾患の危険性も増す。","わが国の女性の喫煙者率は、他の先進諸国に比べて高率である。","わが国のアルコール消費量は、増加傾向を示していたが、平成に入るとやがて減少傾向に転じた。","飲酒に起因する問題には、アルコール依存症、肝疾患などの健康問題や労働災害、犯罪などの社会問題が含まれる。"],2],
        ["次の文章の [ ] 内に入る数値の組合せのうち、正しいものはどれか。「理容所及び美容所における衛生管理要領では、美容所の温度は [ A ] ℃が望ましいとされ、湿度は相対湿度 [ B ] %が望ましいとされている。」",["A:10〜15 ― B:10〜30","A:10〜15 ― B:40〜70","A:17〜28 ― B:10〜30","A:17〜28 ― B:40〜70"],4],
        ["アタマジラミに関する次の記述のうち、誤っているものはどれか。",["幼虫は吸血しない。","毛髪に卵を産む。","タオルや帽子を介して感染することがある。","主として保育園児や幼稚園児、低学年児童に発生する。"],1],
        ["感染症と感染経路に関する次の記述のうち、誤っているものはどれか。",["百日せきは、蚊を介して感染する。","結核は、飛沫核を介して感染する。","B型肝炎は、血液を介して感染する。","コレラは、食物や水を介して感染する。"],1],
        ["微生物に関する次の記述のうち、正しいものの組合せはどれか。\na 細菌のなかには、酸素があると発育できないものがある。\nb ウイルスは、タンパク質の殻の中にDNAとRNAの両方の核酸をもっている。\nc 芽胞をもつ細菌は、熱や乾燥に対する抵抗力がない。\nd ウイルスは、しばしば変異を起こす。",["aとb","bとc","cとd","aとd"],4],
        ["感染と発病に関する次の記述のうち、誤っているものはどれか。",["感染とは、病原体が人体の組織に侵入して増殖することである。","病原体が人体に付着すると必ず感染する。","発病とは、感染した人体の組織や臓器に病的な変化が起きることである。","感染しても発病しないこともある。"],2],
        ["予防接種法に基づく予防接種に関する次の記述のうち、誤っているものはどれか。",["感染症に対する免疫をつけたり、免疫を強くしたりするためにワクチンを接種することをいう。","自らが感染症にかかりにくくなるだけではなく、社会全体で流行を防ぐ効果もある。","対象疾病が異なっても、接種対象年齢及び接種回数は同じである。","定期に行うものと臨時に行うものがある。"],3],
        ["麻しんに関する次の記述のうち、誤っているものはどれか。",["別名、はしかともいう。","潜伏期は2〜3日である。","病原体はウイルスである。","発疹をともなう感染症である。"],2],
        ["美容所における衛生管理に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「微生物を殺すことの総称は [ A ] である。生きている微生物が存在しない状態にすることを [ B ] という。微生物の中でも病原微生物を死滅させるか、発育や増殖を止めて感染力をなくすことを [ C ] という。美容所で求められるのは [ C ] である。」",["A:滅菌 ― B:消毒 ― C:殺菌","A:殺菌 ― B:消毒 ― C:滅菌","A:滅菌 ― B:殺菌 ― C:消毒","A:殺菌 ― B:滅菌 ― C:消毒"],4],
        ["紫外線消毒に関する次の記述のうち、誤っているものはどれか。",["紫外線消毒器に入れる器具は、互いに重なり合わないように配置する。","紫外線は、目や皮膚に直接照射しても害はない。","血液が付着した器具の消毒には適していない。","紫外線灯は、使用にともない出力が低下するので、定期的な交換が必要である。"],2],
        ["消毒薬に関する次の記述のうち、誤っているものはどれか。",["次亜塩素酸ナトリウムは、有機物の汚れがあると効力が低下する。","逆性石けんは、結核菌に対して効力がある。","両性界面活性剤は、普通の石けんと併用すると効力が低下する。","消毒用エタノールは、細菌の芽胞には効力がない。"],2],
        ["次のうち、5%次亜塩素酸ナトリウム2mLを希釈して、次亜塩素酸ナトリウム水溶液1,000mLを調製した場合の濃度はどれか。",["0.01%","0.05%","0.1%","2.5%"],1],
        ["美容所における器具・布片の取扱いに関する次の記述のうち、正しいものの組合せはどれか。\na 血液の付着していないかみそりの消毒は、エタノール水溶液を含ませた綿で表面を拭く。\nb ヘアドライヤーは、皮膚に接する器具にあたる。\nc 皮膚に接する器具は、十分に洗浄してから消毒する。\nd タオルの消毒は、80℃を超える蒸気に10分間以上触れさせる。",["aとb","bとc","cとd","aとd"],3],
        ["次のうち、正中線上にあるものはどれか。",["鼻唇溝","人中","鼻翼","口角"],2],
        ["次の神経のうち、心臓の収縮力を増強するときに直接はたらくものはどれか。",["運動神経","知覚神経","交感神経","副交感神経"],3],
        ["次のうち、内耳にある平衡器官に該当しないものはどれか。",["鼓膜","半規管","卵形嚢","球形嚢"],1],
        ["次のうち、ヘモグロビンが含まれるものはどれか。",["血小板","リンパ球","単球","赤血球"],4],
        ["次のうち、呼吸運動を引き起こす筋に該当しないものはどれか。",["内肋間筋","外肋間筋","咬筋","横隔膜"],3],
        ["皮膚の構造に関する次の記述のうち、正しいものはどれか。",["皮膚は、表面より真皮、表皮、皮下組織の3つの層からできている。","角化細胞(ケラチノサイト)は、真皮の細胞の95%を占める。","基底細胞は、分裂して皮膚表面に移動し、最終的に角質細胞に変化する。","色素細胞(メラノサイト)は、リンパ球に抗原情報を提示する細胞である。"],3],
        ["皮膚付属器官に関する次の記述のうち、誤っているものはどれか。",["眉毛や鼻毛、耳毛は、高齢になるとその成長期が長くなる。","健康な成人では、頭毛の85〜90%が休止期である。","上肢の毛の成長期は、6か月以下である。","毛の成長速度は、月経の周期に影響されない。"],2],
        ["皮膚の生理機能に関する次の記述のうち、誤っているものはどれか。",["紫外線によって、エラスチンが大量につくられ、皮膚の色が黒くなる。","皮膚には、痛点、触点、温点、冷点が分布している。","皮膚表面の脂肪膜は、弱酸性で細菌などの発育を抑制する。","皮脂は、皮膚表面に出て、皮膚や毛から水分が蒸発するのを防いでいる。"],1],
        ["皮膚の保健に関する次の記述のうち、誤っているものはどれか。",["皮膚の老化は、個人の素因によるもので、環境の影響は受けない。","抗しわ療法に、ボツリヌス毒素を用いることがある。","肝臓障害により、血中に胆汁色素が増加して皮膚に沈着すると、皮膚が黄色くなる。","糖尿病で体の免疫力が低下し、皮膚の抵抗力が弱くなると、細菌や真菌による感染が起こりやすくなる。"],1],
        ["皮膚の疾患に関する次の記述のうち、誤っているものはどれか。",["接触皮膚炎(カブレ)は、様々な種類の化学物質や薬物などが皮膚に接触して起きる皮膚の炎症である。","アレルギー性接触皮膚炎の原因物質の特定には、パッチテストが有効である。","進行性指掌角皮症は、指から手掌にかけての皮膚が乾燥し、角質層が厚くなって亀裂を生じ、進行すると指紋がなくなることもある疾患である。","尋常性痤瘡(ニキビ)は、脂腺の多い箇所の毛包にウイルスが増殖して起きる疾患である。"],4],
        ["香粧品に配合される油性原料に関する次の記述のうち、誤っているものはどれか。",["高級アルコールは、炭素数の多いアルコールである。","炭化水素は、クリームや口紅などに配合される。","炭化水素は、石油から得られるもので、動植物からは得られない。","ロウ類は、高級アルコールと高級脂肪酸とのエステルである。"],3],
        ["界面活性剤に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「界面活性剤の作用の一つに洗浄作用がある。この作用を示すものに石けんがあるが、これは [ A ] 界面活性剤である。また、油性原料を溶解した油相と水溶性原料を溶解した水相とを混合し、乳濁液(エマルジョン)を形成させる作用を [ B ] といい、非イオン(ノニオン)界面活性剤がよく用いられる。その他、ヘアリンス剤に用いられ、毛髪に対して帯電防止効果がある界面活性剤として、塩化アルキルトリメチルアンモニウムなどの [ C ] アンモニウム塩が挙げられる。」",["A:陽イオン(カチオン) ― B:可溶化 ― C:第四級","A:陽イオン(カチオン) ― B:乳化 ― C:第一級","A:陰イオン(アニオン) ― B:可溶化 ― C:第一級","A:陰イオン(アニオン) ― B:乳化 ― C:第四級"],4],
        ["香粧品に用いられる成分とその配合目的に関する次の記述のうち、正しいものはどれか。",["パラオキシ安息香酸エステル(パラベン)は、防腐剤である。","エチレンジアミン四酢酸(エデト酸、EDTA)は、紫外線吸収剤である。","グリセリンは、酸化防止剤である。","アルキル硫酸ナトリウムは、還元剤である。"],1],
        ["次のうち、パーマ剤第1剤に配合される成分に該当しないものはどれか。",["システイン","臭素酸ナトリウム","モノエタノールアミン","チオグリコール酸"],2],
        ["サンケア製品に関する次の記述のうち、誤っているものはどれか。",["サンタン製品は、UV-Aを透過させる。","SPF値は、UV-Bを防御する程度を示す値である。","酸化チタンは、紫外線を散乱させる。","サンスクリーン製品は、UV-Bのみを防御する。"],4],
        ["大正時代の服装に関する次の記述のうち、誤っているものはどれか。",["都会の男性会社員の間で背広上下が普及した。","女性の車掌(バスガール)が登場し、洋装の制服が採用された。","女学生の制服として、セーラー服とスカートが考案された。","軍服をモデルに国民服がつくられた。"],4],
        ["昭和時代に流行した髪型に関する次の記述のうち、誤っているものはどれか。",["ウルフカットは、襟足を長めにして段々に削いでいくため段カットともよばれた。","セシールカットは、映画「ローマの休日」のヒロインの髪型である。","ソバージュは、髪全体に細かくパーマをかけてウェーブをつけた髪型である。","聖子ちゃんカットは、前髪は目に掛かるか掛からないほどにし、サイドは後ろへ流す髪型である。"],2],
        ["下図のうち、和装の礼装や準礼装に該当しないものはどれか。",["小紋","訪問着","留袖","振袖"],1],
        ["次のうち、モーターと発熱器の両方を内蔵する美容用具はどれか。",["クリッパー","ワッフルアイロン","ヘアドライヤー","ホットカーラー"],3],
        ["ヘアカッティング用のレザーに関する次の記述のうち、誤っているものはどれか。",["本レザーの刃線の形態は、内曲線状である。","替刃のレザーの刃は、直線状である。","カバーのついた替刃のレザーは、本レザーと比較すると横滑りしないので安全性が高い。","背と切れ刃が平行であり、ねじれがないものがよい。"],1],
        ["シャンプーイングに関する次の記述のうち、正しいものはどれか。",["お湯の温度は、45〜48℃が適温である。","毛髪を強くこすり合わせてシャンプーすると、キューティクルを傷める。","パーマネントウェーブやヘアカラー施術前にシャンプーを行う場合は、頭皮を強くこすり、汚れを落とす。","毛髪の汚れがひどい場合は、一度に多量のシャンプー剤を使用するとよい。"],2],
        ["幾何学的錯視に関する次の文章に該当する錯視として、正しいものはどれか。「ヘアスタイルのボリュームが小さい場合と比較すると、ボリュームの大きいヘアスタイルに囲まれた顔は小さく感じる。」",["分割距離錯視","枠組み効果","ポンゾ錯視","大きさの対比現象"],4],
        ["ヘアカッティングに関する次の記述のうち、正しいものはどれか。",["ワンレングスカットは、頭皮に対してパネルを直角に引き出し、全体をほぼ同じ長さに切るカット技法である。","グラデーションカットは、パネルをダウンステムでシェープした場合、最も長い毛髪の部分がボリュームの頂点となる。","レイヤーカットは、頭部の形がそのままヘアスタイルのシルエットとなる。","セイムレングスカットは、毛髪が自然に落ちる位置にパネルをシェープし、毛髪を同一線上で切るカット技法である。"],2],
        ["セニングカットに関する次の記述のうち、誤っているものはどれか。",["セニングカットとは、毛髪上でシザーズを開閉しながらすべらすことで毛量調整する技法である。","デザインの構成上表面にあたる部分や分け目の部分は、セニングしすぎないようにする。","レイヤー状に毛量調整すると、フラット感を与えながら量感を減らすことができる。","グラデーション状に毛量調整すると、丸みを出しながら量感を減らすことができる。"],1],
        ["パーマネントウェービングに関する次の記述のうち、正しいものはどれか。",["フルウェーブを形成するのに必要な毛髪の長さは、使用するロッドの3回転分である。","ウェーブの大小は、第1剤塗布後の放置タイムによって決まる。","毛先は根元に比べ、パーマがかかりにくい。","かかりにくい部分には、トリートメント巻きを用いるとよい。"],1],
        ["カールステムに関する次の記述のうち、誤っているものはどれか。",["ステムの方向と角度を一つに結び付けるところをピボットポイントという。","カールステムは、ベースからピボットポイントまでの部分をいう。","ステムの角度が0度に近いとフラットカールになる。","ステムの方向は、仕上がり時のボリュームに関係する。"],4],
        ["ピンカールに関する次の組合せのうち、正しいものはどれか。",["スカルプチュアカール ― 根元巻き方式","リフトカール ― ストランドカール","メイポールカール ― シェーピングカール","クロッキノールカール ― 中巻き方式"],1],
        ["ヘアカラーの色選びに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「[ A ] どうしを混ぜると互いの色みを消し合うので、黄色く退色した毛髪の色を消してナチュラルな毛髪の色に仕上げたいときは [ B ] の色素をもつヘアカラーで染め、赤みのある毛髪の色を消してナチュラルな毛髪の色に仕上げたいときは [ C ] の色素をもつヘアカラーで染めるのがよい。」",["A:プライマリーカラー ― B:赤色 ― C:青色","A:補色 ― B:緑系 ― C:オレンジ系","A:プライマリーカラー ― B:青色 ― C:黄色","A:補色 ― B:紫系 ― C:緑系"],4],
        ["アイブロウメイクアップに関する次の記述のうち、正しいものはどれか。",["眉毛は、眉頭に近い部分を短く、眉尻に近くなるにしたがって長くカットするとよい。","眉尻から眉頭までを一気に描くのが基本である。","眉山の位置は、黒目の外側と目尻の延長線の間とするのが基本的なプロポーションである。","アイブロウペンシルで眉毛を1本1本描くことをシェーディングという。"],3],
        ["まつ毛エクステンションに関する次の記述のうち、正しいものはどれか。",["まつ毛の毛周期は、1〜2年である。","エクステンションの装着は、まつ毛の成長期初期が最適である。","エクステンションは、地肌から1〜2mmほど離してまつ毛に接着する。","リペアは、通常6〜7週間で行う。"],3]

      44: [
        ["保健所に関する次の記述のうち、誤っているものはどれか。",["保健所の設置や役割などを定める法律は、地域保健法である。","保健所の業務には、感染症以外の疾病の予防に関する事項が含まれる。","保健所の業務には、人口動態統計などの統計に関する事項は含まれない。","保健所の業務は、基本的に全国共通であるが、具体的な業務内容については、地域の実情や設置主体によって異なることがある。"],3],
        ["次の美容師法の制定目的に関する規定の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「この法律は、美容師の [ A ] を定めるとともに、美容の [ B ] が適正に行われるように規律し、もって [ C ] の向上に資することを目的とする。」",["A:責務 ― B:業務 ― C:国民生活","A:責務 ― B:経営 ― C:公衆衛生","A:資格 ― B:経営 ― C:国民生活","A:資格 ― B:業務 ― C:公衆衛生"],4],
        ["美容師の免許に関する次の記述のうち、誤っているものはどれか。",["免許を申請するときは、美容師免許申請書に精神の機能の障害に関する医師の診断書を添付しなければならない。","免許を申請した場合に、かつて無免許で美容を業とした者には免許が与えられないことがある。","美容師が氏名を変更したときは、2か月以内に免許証の書換え交付を申請しなければならない。","美容師が免許証を紛失し再交付を受けたのち、紛失した免許証を発見したときは、その免許証を5日以内に返納しなければならない。"],3],
        ["管理美容師に関する次の記述のうち、正しいものはどれか。",["管理美容師の職務には、美容所という施設の衛生管理のみならず、美容所での美容の業務についても衛生的に管理することが含まれる。","同一人が同時に複数の美容所の管理美容師となることができる。","美容所の開設者は、美容師の数に関わりなく従業者が2人以上の場合には、管理美容師を置かなければならない。","管理美容師は、美容師の免許を受けた後3年以上美容の業務に従事し、かつ、厚生労働大臣の指定する講習会の課程を修了した者でなければならない。"],1],
        ["美容所の開設者の行う届出に関する次の記述のうち、正しいものはどれか。",["開設届には、記載したすべての美容師について精神の機能の障害に関する医師の診断書を添付しなければならない。","美容師が結核や伝染性の皮膚疾患にり患したときは、30日以内に医師の診断書を添付して届け出なければならない。","施術料金を変更したときは、すみやかに届け出なければならない。","開設の届出事項に変更が生じたときは、すみやかに届け出なければならず、これを怠った場合には、30万円以下の罰金に処されることがある。"],4],
        ["出張美容に関する次の記述のうち、誤っているものはどれか。",["特別の事情があるとして出張美容が認められる場合については、美容師法の政令と都道府県等の条例で定めている。","婚礼その他の儀式に参列する者に対してその儀式の直前に美容を行う場合は、出張美容が認められている。","出張美容を行う美容師に対しても、衛生上必要な措置を講ずることが求められる。","出張美容が認められない場所で美容の業務を行った美容師に対しては、そのことにより、罰金が科されることがある。"],4],
        ["美容業の運営や衛生に関連する法律に関する次の記述のうち、誤っているものはどれか。",["医師法により、美容師がレーザー脱毛などの医療行為を業として行うことは禁じられている。","株式会社日本政策金融公庫法に基づき、美容業等の生活衛生関係営業に対する融資制度が設けられている。","生活衛生関係営業の運営の適正化及び振興に関する法律に基づき、美容業の振興を図るための振興指針が厚生労働大臣により定められている。","個人情報の保護に関する法律により、顧客データ数の多い事業者に限定して個人情報の取扱いが規制されている。"],4],
        ["税金に関する次の記述のうち、誤っているものはどれか。",["所得税や法人税は、利益が出ているときに支払う税金である。","従業員の給与からの源泉所得税は、従業員が税務署に支払うものであり、雇用主が預かることはない。","固定資産税は、経営がうまくいかず赤字の場合でも、支払わなければならない税金である。","申告納税しなければならない者が申告や納税義務を怠った場合には、罰則として追加の税が課されることになっている。"],2],
        ["国民年金制度に関する次の記述のうち、誤っているものはどれか。",["20歳以上60歳未満の自営業者や学生は、国民年金に加入する義務がある。","遺族基礎年金は、国民年金の被保険者などが死亡した場合に、一定の要件に該当する遺族に支給される。","国民年金の第1号被保険者(自営業者等)の保険料は、所得が高いほど高額となる。","所得が低いなど、保険料を納めることが困難な場合に保険料の免除や納付猶予となる制度が設けられている。"],3],
        ["次の給付のうち、雇用保険の給付はどれか。",["育児休業給付","障害補償給付","療養補償給付","遺族補償給付"],1],
        ["喫煙に関する次の記述のうち、誤っているものはどれか。",["妊婦が喫煙した場合、低出生体重児、早産などの危険性が高くなる。","「2016年全国たばこ喫煙者率調査」によると、わが国の20歳以上の男性の喫煙者率は年々上昇傾向にある。","受動喫煙で小児ぜんそくの危険性が高くなる。","たばこの煙は発がん物質や発がん促進物質を含んでいる。"],2],
        ["わが国の人口の高齢化に関する次の記述のうち、正しいものはどれか。",["2015年の総人口に占める65歳以上の人口割合は、15%以下である。","2015年の総人口に占める65歳以上の人口割合は、欧米諸国よりも低い。","総人口に占める65歳以上の人口割合は、2015年がピークである。","人口の高齢化のスピードは、欧米諸国よりも速い。"],4],
        ["心の健康に関する次の記述のうち、誤っているものはどれか。",["心の健康は身体状況や生活の質に大きく影響する。","うつ病は早期発見、適切な治療が重要である。","厚生労働省により「健康づくりのための睡眠指針2014」が策定されている。","自殺による人口10万人あたりの死亡率は、1958年以降現在まで不変である。"],4],
        ["ダニやカビなどに関する次の記述のうち、誤っているものはどれか。",["ハウスダストの中に含まれているダニの死骸やふんが人のアレルギー反応を引き起こすことがある。","カビや害虫による被害は、一般的には夏に多いが、暖房の普及とともに、一年中見られるようになった。","カビが人のアレルギー反応を引き起こすことはない。","害虫などの駆除に用いる薬剤は、人に有害なこともあるので、使用方法に注意を要する。"],3],
        ["浮遊粒子状物質に関する次の記述のうち、誤っているものはどれか。",["浮遊粒子状物質とは、大気中に浮遊する粒子状物質であって、その粒径が1ミリメートル以上のものをいう。","大気中の浮遊粒子状物質に関する環境基準が定められている。","その量とともに、成分や大きさも健康に関係がある。","その成分は、粉じん、アスベスト、病原体などさまざまである。"],1],
        ["ウイルスに関する次の記述のうち、正しいものはどれか。",["増殖は2分裂で行われる。","DNAとRNAの両方の核酸をもっている。","生きた細胞内でのみ増殖する。","変異を起こすことはない。"],3],
        ["常在細菌叢に関する次の記述のうち、誤っているものはどれか。",["人体の皮膚や粘膜などには一定の細菌が定着している。","鼻腔に存在するブドウ球菌は感染源となることはない。","ビタミンなど人体に必要な物質を産生する腸内細菌もある。","常在細菌には、病原体が人体へ侵入することを防ぐはたらきもある。"],2],
        ["予防接種に関する次の記述のうち、誤っているものはどれか。",["対象疾病や実施方法は健康増進法によって定められている。","法に基づく予防接種には、定期に行うものと臨時に行うものがある。","対象疾病により接種回数は異なる。","対象疾病により接種対象年齢は異なる。"],1],
        ["次の感染症のうち、患者や病原体保有者によって汚染されたタオルなどへの接触を原因として感染するものはどれか。",["日本脳炎","マラリア","伝染性膿痂疹(トビヒ)","破傷風"],3],
        ["B型肝炎に関する次の記述のうち、正しいものはどれか。",["約1週間の潜伏期を経て発病する。","レザーやシザーズによる皮膚の傷からは感染しない。","母子感染予防に新生児へのワクチン投与は有効である。","持続性感染は起こらない。"],3],
        ["消毒に関する次の記述のうち、正しいものはどれか。",["乾熱は、湿熱より短時間で消毒できる。","蒸気は、煮沸より短時間で消毒できる。","消毒薬による消毒は、低温で行った方が有効である。","消毒薬には、消毒しようとする対象によって適した濃度がある。"],4],
        ["美容所で行う血液が付着している器具の消毒に関する次の記述のうち、正しいものの組合せはどれか。\na 1cm²あたり85マイクロワット以上の紫外線を20分間以上照射する。\nb 消毒用エタノールを含ませたガーゼで表面を拭く。\nc 0.1%以上の次亜塩素酸ナトリウム水溶液に10分間以上浸す。\nd 沸騰後2分間以上煮沸する。",["aとb","bとc","cとd","aとd"],3],
        ["化学的消毒法に関する次の記述のうち、正しいものの組合せはどれか。\na 両性界面活性剤は、結核菌に効果がない。\nb 逆性石けんは、中性洗剤と併用すると効果が低下する。\nc グルコン酸クロルヘキシジン(クロロヘキシジングルコン酸塩)は、細菌の芽胞に効果がない。\nd 消毒用エタノールは、逆性石けんと併用すると効果が低下する。",["aとb","bとc","cとd","aとd"],2],
        ["次亜塩素酸ナトリウムに関する次の記述のうち、誤っているものはどれか。",["石けんと反応するので、併用できない。","有機物の汚れがあると、効力が低下する。","酸性の洗剤と混ぜると、有毒な塩素ガスを発生する。","日光にさらすと分解するので、冷暗所に保存する。"],1],
        ["10%逆性石けん液から0.1%逆性石けん水溶液を調製する方法に関する次の記述のうち、正しいものはどれか。",["10%逆性石けん液1mLに、水499mLを加える。","10%逆性石けん液1mLに、水99mLを加える。","10%逆性石けん液1mLに、水49mLを加える。","10%逆性石けん液1mLに、水9mLを加える。"],2],
        ["次のうち、正中線上にないものはどれか。",["鼻背","鼻翼","鼻根","鼻尖"],2],
        ["次のうち、頸部の筋はどれか。",["咬筋","胸鎖乳突筋","三角筋","広背筋"],2],
        ["次のうち、脳に含まれるものはどれか。",["延髄","胸髄","頸髄","仙髄"],1],

        ["次のうち、血小板の機能はどれか。",["酸素の運搬","造血作用","血液凝固","食作用"],3],
        ["皮膚の構造に関する次の記述のうち、誤っているものはどれか。",["皮膚は、表面より表皮、真皮、皮下組織の3層からなる。","表皮最下層の基底細胞が表層に移動し、角質細胞になる。","角化細胞(ケラチノサイト)は、メラニンをつくる細胞であり、表皮の細胞の約95%を占める。","表皮内には、ランゲルハンス細胞という抗原物質(アレルゲン)を取り込み、リンパ球に抗原情報を提示する細胞がある。"],3],
        ["皮膚付属器官の構造に関する次の記述のうち、誤っているものはどれか。",["毛母の部分には、色素細胞が多数存在する。","毛は、成長期、退行期、休止期を繰り返す。","爪は、表皮の角質層が変形したもので、その成分はケラチンである。","脂腺は、体の部位に関係なく同じ密度で分布している。"],4],
        ["皮膚と皮膚付属器官の生理機能に関する次の記述のうち、正しいものはどれか。",["紫外線の照射によって、エラスチンが大量につくられ、皮膚の色が黒くなる。","膠原線維は、機械的外力に対する保護のはたらきをしている。","痛みを感じる点を痛点といい、冷たさを感じる点を温点という。","人間の皮膚で体温の調節作用を積極的に行っているのは脂腺と汗腺である。"],2],
        ["皮膚と皮膚付属器官の保健に関する次の記述のうち、誤っているものはどれか。",["思春期になると、女性ホルモンの影響で脂腺が発育して皮脂の分泌が多くなる。","糖尿病で体の免疫が低下し、皮膚の抵抗力が弱くなると化膿菌や真菌による感染が起こりやすくなる。","糖尿病では神経障害により知覚鈍麻になることがある。","肝臓に障害が起きて血中に胆汁色素が増加して皮膚に沈着すると黄疸になる。"],1],
        ["皮膚疾患に関する次の記述のうち、正しいものはどれか。",["頭部白癬(シラクモ)は、白癬菌による感染症でペットから感染することがある。","疥癬(ヒゼン)は、虱という昆虫の寄生によって起こる。","伝染性膿痂疹(トビヒ)は、毛包が角質の栓で詰まったものであり、毛包内に皮脂が貯留し、細菌に感染することによって起こる。","尋常性痤瘡(ニキビ)は、膿がほかの部分の皮膚に付いて感染が広がる。"],1],
        ["香粧品原料とその分類に関する次の組合せのうち、正しいものはどれか。",["メチルポリシロキサン ― シリコーン油","ワセリン ― 植物性ロウ","ホホバ油 ― 鉱物油","セタノール ― 高級脂肪酸"],1],
        ["界面活性剤の乳化作用に関する次の記述のうち、誤っているものはどれか。",["水相と油相とが乳化状態にあるものをエマルジョンという。","油相に水滴が分散している乳化型(タイプ)をO/W型という。","界面活性剤は分子内に親油基(疎水基)と親水基を持ち、乳化作用を示す。","界面活性剤がミセルを形成する濃度以上になると、乳化作用が発揮される。"],2],
        ["香粧品に用いられる成分とその配合目的に関する次の組合せのうち、誤っているものはどれか。",["パラオキシ安息香酸エステル(パラベン) ― 防腐剤","パラフィン ― 金属イオン封鎖剤(キレート剤)","パラアミノ安息香酸エステル ― 紫外線吸収剤","ジブチルヒドロキシトルエン(BHT) ― 酸化防止剤"],2],
        ["パーマ剤第1剤に使用されるアルカリ剤に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「アルカリ剤は毛髪を膨潤させる作用を持つが、pHが高いほど膨潤度は [ A ] なる。アンモニア水とモノエタノールアミンがpHを大きく上昇させるのに必要な配合量は、ともに [ B ] が、アンモニア水は [ C ] 性が高く、モノエタノールアミンは [ C ] 性がない。このため、第1剤の作用時間中に、アンモニア水は [ C ] によりアルカリ剤としての作用が徐々に弱まるが、モノエタノールアミンは持続する。」",["A:大きく ― B:少ない ― C:揮発","A:大きく ― B:多い ― C:凝集","A:小さく ― B:少ない ― C:凝集","A:小さく ― B:多い ― C:揮発"],1],
        ["ヘアカラーに関する次の記述のうち、誤っているものはどれか。",["一時染毛料は、タール色素(法定色素)等を毛髪の表面に付着させて着色する。","脱色剤は、毛髪に含まれるメラニンを酸化して分解する。","酸化染毛剤は、1回のシャンプーで色落ちする。","染料中間体をカップラーとともに用いると、さまざまな色調に染毛できる。"],3],
        ["大正時代の女性の髪型に関する次の組合せのうち、誤っているものはどれか。",["女優髷 ― 新劇女優","日本髪 ― 二百三高地髷","耳隠し ― マーセルウェーブ","断髪 ― モダンガール"],2],
        ["1950〜1980年代の服装に関する次の記述のうち、誤っているものはどれか。",["1958年にソフィア・ローレンが来日して、立体裁断を伝えた。","1959年ごろ、ロンドンでメアリー・クワントがミニスカートを商品化した。","1964年に東京・銀座で「西銀座族」、「みゆき族」とよばれる若者達が話題となった。","1981年からパリコレクションに進出した山本耀司、川久保玲のデザインが「黒の衝撃」として注目された。"],1],
        ["男性の洋装礼装に関する次の記述のうち、誤っているものはどれか。",["昼間の正式礼装として、モーニングコートが着用される。","昼間の略式礼装として、メスジャケットが着用される。","夜の正式礼装として、燕尾服が着用される。","夜の略式礼装として、タキシードが着用される。"],2],
        ["シザーズに関する次の記述のうち、誤っているものはどれか。",["力学的には、てこの原理を応用している。","薬指孔のある方の刃が静刃である。","2枚の刃による剪断応力を利用している。","動刃と静刃の間にあきのないものがよい。"],4],
        ["リンスやトリートメントに関する次の記述のうち、誤っているものはどれか。",["リンス剤を用いずに、水やぬるま湯ですすぐことを、プレーンリンシングとよぶ。","石けんを主剤としたシャンプー剤の使用後には、アルカリ性のリンス剤が適している。","ヘアトリートメントの目的は、傷んだ毛髪を人工的に補強し、正常な状態に近づけること、また、それ以上傷まないように毛髪を保護することである。","パーマネントウェーブやヘアブリーチ、ヘアカラー施術後は、酸性効果のあるリンス剤を用いる。"],2],
        ["下図のソバージュヘアに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「ロングのソバージュヘアは、[ A ] ウェーブを付けた髪が [ B ] に広がり、[ C ] 印象となる。」",["A:大きい ― B:直線的 ― C:弱い","A:大きい ― B:曲線的 ― C:強い","A:細かい ― B:曲線的 ― C:弱い","A:細かい ― B:直線的 ― C:強い"],4,"sauvage_44_46"],
        ["次のヘアスタイルのうち、アップステムでパネルをシェープしてカットしたものはどれか。",["ワンレングススタイル","グラデーションスタイル","レイヤースタイル","セイムレングススタイル"],3],
        ["レザーカット技法に関する次の記述のうち、誤っているものはどれか。",["エンドテーパーカットは、生え際やパート際、毛量が少ない場合に用いられる。","ノーマルテーパーカットは、毛先 1/3 ほどをテーパーする技法である。","ディープテーパーカットは、根元近くからテーパーする技法である。","ポインティングカットは、パネルの内側の面をテーパーする技法である。"],4],
        ["下図は、ワインディングのロッドにかかるさまざまな力を表したものである。この図の中で、「髪につやと美しいウェーブを持たせるために毛束を引く力」を表しているものはどれか。",["(1)","(2)","(3)","(4)"],1,"rod_44_49"],
        ["次のワインディングのスタイルのうち、サイドのスライスを縦に取り、後方に強い方向性をつける巻き方をしたものはどれか。",["ダウンスタイル","ツイストスタイル","フォワードスタイル","リーゼントスタイル"],4],
        ["下図は、ヘアウェーブを表したものである。A、B、C、Dに該当する名称の組合せのうち、正しいものはどれか。",["A:トロー ― B:リッジ ― C:クローズドエンド ― D:オープンエンド","A:リッジ ― B:トロー ― C:クローズドエンド ― D:オープンエンド","A:トロー ― B:リッジ ― C:オープンエンド ― D:クローズドエンド","A:リッジ ― B:トロー ― C:オープンエンド ― D:クローズドエンド"],3,"wave_44_51"],
        ["染毛剤のパッチテストに関する次の記述のうち、正しいものはどれか。",["染毛剤による抗体はすぐにできるので、テストは1回限りでよい。","テスト液は、第1剤と第2剤を指定された割合で混ぜ合わせてつくる。","テスト液を綿棒にとり、腕の外側に米粒大に塗って自然乾燥させる。","テスト部位の観察は、塗布後すぐと24時間後の2回行う。"],2],
        ["ネイル技術の爪のカット形状に関する次の記述のうち、誤っているものはどれか。",["スクエアとは、サイドとトップがストレートで、フリーエッジの角が直角な四角形をいう。","オーバルとは、サイドとトップに丸みをもたせた卵形をいう。","スクエアオフとは、スクエアの角を取った形をいう。","ラウンドとは、先にいくにつれて細くなったアーモンド形をいう。"],4],
        ["まつ毛エクステンションによる接触皮膚炎に関する次の記述のうち、誤っているものはどれか。",["初回の施術では発症することはない。","過去に発症しなかった物質でもかぶれることがある。","刺激性の場合は、片側性のことがある。","アレルギー性の場合は、接触した部位を超えて症状があらわれることがある。"],1],
        ["下図は、着物各部を表したものである。A、B、C、Dに該当する名称の組合せのうち、正しいものはどれか。",["A:袖幅 ― B:裄 ― C:身八つ口 ― D:袖付","A:袖幅 ― B:袖付 ― C:身八つ口 ― D:裄","A:裄 ― B:身八つ口 ― C:袖付 ― D:袖幅","A:裄 ― B:袖幅 ― C:袖付 ― D:身八つ口"],2,"kimono_44_55"]
      ],
      43: [
        ["美容師法に関する次の記述のうち、誤っているものはどれか。",["公衆衛生の向上に資することを目的としている。","美容師の資格を定め、免許を持たない者が美容を業としてはならないと定めている。","美容業の振興を図る方策について定めている。","美容の業務が適正に行われるよう規律している。"],3],
        ["美容師の免許に関する次の記述のうち、正しいものはどれか。",["美容師試験に合格した者には自動的に免許証が交付される。","美容師が氏名を変更したときは、美容師名簿の訂正を申請しなければならない。","美容師が免許証を紛失したときは、住所地の都道府県知事に免許証の再交付を申請しなければならない。","美容師が住所地を変更したときは、免許証の書換え交付を申請しなければならない。"],2],
        ["次の事項のうち、美容所の開設の届出事項に該当しないものはどれか。",["美容所の構造及び設備の概要","美容師の氏名及び美容師名簿の登録番号","美容師の労働時間","美容師以外の従業者の氏名"],3],
        ["美容師法が定める衛生上必要な措置に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「美容師法では、美容師及び [ A ] が講ずべき衛生上必要な措置については [ B ] でも定められることとなっている。美容師が衛生上必要な措置を講じなかったときは [ C ] を受けることがある。」",["A:美容所の開設者 ― B:都道府県等の条例 ― C:業務の停止処分","A:管理美容師 ― B:地域保健法 ― C:業務の停止処分","A:美容所の開設者 ― B:地域保健法 ― C:罰金刑","A:管理美容師 ― B:都道府県等の条例 ― C:罰金刑"],1],
        ["美容師法に基づく行政処分に関する次の記述のうち、正しいものはどれか。",["心身の障害により美容師の業務を適正に行うことができない場合は、業務の停止処分を受けることがある。","美容師が美容所以外の場所で美容の業を行った場合は、そのことにより免許の取消処分を受けることがある。","美容所の開設者が環境衛生監視員の立入検査を正当な理由なく拒んだ場合は、美容所の閉鎖命令を受けることがある。","美容師が常時2人以上従事する美容所に管理美容師を置かなかった場合は、美容所の閉鎖命令を受けることがある。"],4],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に関する次の記述のうち、誤っているものはどれか。",["美容業の料金等を制限する適正化規程は、現在すべて廃止されている。","美容業の振興指針は、生活衛生同業組合の組合員のみを対象として都道府県知事が定める。","生活衛生営業指導センターは、経営の健全化を通じて衛生水準の維持向上を図り、利用者又は消費者の利益を守るために設置されている。","標準営業約款は、サービスや技術の内容等を適正に表示し、利用者又は消費者の選択の利便を図ることを目的としている。"],2],
        ["特定の感染症にかかった者の就業制限に関する次の記述のうち、誤っているものはどれか。",["美容師法では、美容師の業務の停止について定めている。","感染症の予防及び感染症の患者に対する医療に関する法律(感染症法)では、患者が業務に従事することの禁止について定めている。","消費者基本法では、従業者の就業禁止について定めている。","労働安全衛生法では、労働者の就業禁止について定めている。"],3],
        ["次の税金のうち、顧客から直接預かって後日税務署に納める税金はどれか。",["所得税","法人税","消費税","固定資産税"],3],
        ["社会保険に関する次の記述のうち、正しいものはどれか。",["法人が経営する美容所の場合、厚生年金保険の適用事業所となるかは法人が自由に選ぶことができる。","雇用されて2か月以上健康保険に加入していた者は、退職後も任意継続の被保険者となることができる。","雇用されて育児休業している期間の医療保険の保険料は免除されない。","自営業者や学生は、国民年金に加入しなくてもよい。"],2],
        ["次の給付のうち、労働者災害補償保険の給付に該当しないものはどれか。",["療養補償給付","休業補償給付","遺族補償給付","育児休業給付"],4],
        ["保健所に関する次の記述のうち、正しいものはどれか。",["保健所を設置することができるのは、都道府県だけである。","美容所の検査は、保健所の業務ではない。","保健所には医師が配置されることとなっている。","治療方法が確立していない疾病により長期療養を必要とする者の保健に関する事項は、保健所の業務ではない。"],3],
        ["2015年のわが国の出生と死亡に関する次の記述のうち、正しいものはどれか。",["出生数は、死亡数よりも少ない。","合計特殊出生率は、2.0である。","悪性新生物(がん)による死亡数は、2005年と比べ減少している。","乳児死亡率は、出生1,000に対して約10である。"],1],
        ["身体活動・運動に関する次の記述のうち、誤っているものはどれか。",["健康日本21(第2次)に「歩数の増加」の目標が定められている。","適切な運動や身体活動は、生活習慣病予防に有効である。","健康を維持するためには、短時間に激しい運動をすることが必要である。","定期的な運動は、よい睡眠をもたらす。"],3],
        ["住居の衛生に関する次の組合せのうち、誤っているものはどれか。",["自然光 ― 採光","明るさの度合い ― 照度","機械換気 ― 送気式換気法","暖房 ― 気化熱の利用"],4],
        ["換気に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「狭い室内に多くの人がいると、呼吸による水蒸気や [ A ] によって、室内の空気が汚染される。また、ガスや石油の燃焼による暖房は、[ B ] を排出し、不快感や酸素不足を起こす可能性がある。」",["A:二酸化炭素 ― B:窒素ガス","A:二酸化炭素 ― B:二酸化炭素ガス","A:窒素 ― B:窒素ガス","A:窒素 ― B:二酸化炭素ガス"],2],
        ["感染症法において、美容師が感染した場合、就業制限の対象となる感染症は、次のうちどれか。",["結核","麻しん","破傷風","A型肝炎"],1],
        ["次の感染症のうち、主として飛沫感染するものはどれか。",["急性灰白髄炎(ポリオ)","インフルエンザ","後天性免疫不全症候群(エイズ)","日本脳炎"],2],
        ["芽胞に関する次の記述のうち、正しいものはどれか。",["ウイルスは芽胞を作る。","芽胞は熱や乾燥に強い。","結核菌は芽胞を作る。","細菌は芽胞を作ると栄養型になる。"],2],
        ["結核に関する次の記述のうち、誤っているものはどれか。",["学校、事業所などで集団発生する傾向がある。","微熱、寝汗、長く続くせきや痰などが早期症状として現れる。","近年のわが国における死亡率のピークは青年期にある。","予防接種はBCGワクチンによる。"],3],
        ["B型肝炎に関する次の記述のうち、誤っているものはどれか。",["潜伏期は、1〜6か月である。","病原体は、B型肝炎ウイルスである。","感染源は、ヒトの血液や体液である。","予防のためのワクチンはない。"],4],
        ["美容所における消毒に関する次の記述のうち、誤っているものはどれか。",["使用後の器具は、消毒の前に十分洗浄しなければならない。","皮ふに接したかみそり以外の器具の消毒方法は、血液の付着又はその疑いの有無によって区分される。","刷毛、くしは皮ふに接する器具にあたる。","美容師法施行規則に定められている消毒方法と同等以上の効果があれば、他の消毒方法を用いてもよい。"],4],
        ["美容師法施行規則に定められている消毒法に関する次の記述のうち、正しいものの組合せはどれか。\na カットに用いた血液が付着していないはさみは、1cm²あたり85マイクロワット以上の紫外線を20分間以上照射する。\nb 整髪に用いた血液の付着したくしは、0.1%の逆性石けん水溶液中に浸す。\nc 顔そりに用いた血液が付着していないかみそりは、0.01%の次亜塩素酸ナトリウム水溶液中に10分間以上浸す。\nd 顔の清拭に用いた血液の付着した蒸しタオルは、沸騰後2分間以上煮沸する。",["aとb","bとc","cとd","aとd"],4],
        ["消毒に関する次の記述のうち、誤っているものはどれか。",["希釈した逆性石けんは、7日ごとに取り換える。","エタノールは蒸発しやすいので、ガーゼに含ませて清拭する方法では、長時間作用させることは難しい。","次亜塩素酸ナトリウムによる消毒は、温度により効果が異なる。","紫外線消毒器の紫外線ランプは、2,000〜3,000時間の照射で出力が低下する。"],1],
        ["両性界面活性剤に関する次の記述のうち、誤っているものはどれか。",["結核菌に対して殺菌効果がある。","多量の有機物があっても殺菌力は変わらない。","直射日光によっても殺菌力は変わらない。","普通の石けんと併用すると消毒力が低下する。"],2],
        ["消毒薬の希釈や器具の使い方に関する次の記述のうち、正しいものの組合せはどれか。\na 消毒薬の希釈倍数(倍)は、溶液量を溶質量で割った値である。\nb 薬品の臭いを嗅ぐときは、手のひらで容器の口をあおぎ、鼻のほうへ流れてくる気体を嗅ぐ。\nc メスシリンダーの読み方は、目を液面の高さに合わせ、真横から液面の高いほうを読む。\nd 薬品は、容器のラベルの反対側をもって注ぐ。",["aとb","bとc","cとd","aとd"],1],
        ["腕を動かすとき、中枢神経系からの指令を骨格筋に伝える神経は、次のうちどれか。",["運動神経","知覚神経","交感神経","副交感神経"],1],
        ["交感神経が優位に機能したときの臓器と反応に関する次の組合せのうち、正しいものはどれか。",["心臓 ― 心拍数減少","唾液腺 ― 唾液の希薄・多量","気管支 ― 収縮","眼 ― 瞳孔の散大"],4],
        ["次の耳の器官のうち、平衡器官はどれか。",["耳小骨","蝸牛","半規管","耳管"],3],
        ["次のうち、リンパ球の機能として正しいものはどれか。",["酸素の運搬","二酸化炭素の運搬","免疫反応","血液凝固"],3],
        ["次の臓器のうち、血液の小循環の経路に含まれるものはどれか。",["脳","肺","肝臓","筋肉"],2],
        ["皮膚の構造に関する次の記述のうち、誤っているものはどれか。",["表皮は、表面より角質層、顆粒層、有棘層、基底層の4つの細胞層からなる。","基底細胞から角質細胞に変化する過程を角化とよぶ。","角質層は手掌や足底で薄く、顔面や手足の屈曲部では厚い。","色素細胞(メラノサイト)は、皮膚の色素であるメラニンをつくる細胞である。"],3],
        ["皮膚付属器官の構造に関する次の記述のうち、誤っているものはどれか。",["毛は、ケラチンという硫黄を含むタンパク質の一種からできている。","毛は、中心から外に向かって順に毛髄質、毛小皮、毛皮質の3層からなっている。","毛の生える方向を毛流といい、皮膚の各部位で規則性がある。","毛は、皮膚表面から出ている部分を毛幹、皮膚の内部にある部分を毛根という。"],2],
        ["皮膚と皮膚付属器官の生理機能に関する次の記述のうち、誤っているものはどれか。",["皮膚は、日光にさらされると赤くなり、さらに強い照射を受けると水泡ができる。","皮膚からは、脂溶性物質より水溶性物質のほうが吸収されやすい。","皮膚への化学的刺激に対しては、最初に脂肪膜が、ついで角質層にあるケラチンが防いでいる。","皮脂は皮膚や毛を保護し、汗は体温調節に役立っている。"],2],
        ["皮膚と皮膚付属器官の保健に関する次の記述のうち、誤っているものはどれか。",["臓器に異常があると、皮膚にも変化が起きることがある。","ふけ症は、角質層が過剰に剥がれ落ちる現象で、脂性と乾性がある。","あぶら性の皮膚は、皮脂の分泌量が過剰であり、毛孔や汗孔に汚れがたまりやすい。","皮膚の老化は、個人の素因によるもので、環境の影響は受けない。"],4],
        ["皮膚疾患と病原体に関する次の組合せのうち、正しいものはどれか。",["尋常性毛瘡(カミソリカブレ) ― 化膿菌","伝染性膿痂疹(トビヒ) ― 真菌(カビ)","疥癬(ヒゼン) ― 虱","円形脱毛症 ― ウイルス"],1],
        ["アルコールに関する次の記述のうち、誤っているものはどれか。",["エタノール(エチルアルコール)は、水に溶けない油分などを溶かす有機溶媒である。","イソプロパノール(イソプロピルアルコール)は殺菌力があり、防腐作用を持つ。","メタノール(メチルアルコール)は、化粧品基準で配合が認められている。","エタノールは、皮膚を引き締める収れん作用がある。"],3],
        ["油性原料に関する次の記述のうち、誤っているものはどれか。",["炭化水素は、炭素原子と水素原子だけでできた化合物の総称である。","ロウ類は、高級脂肪酸とグリセリンとのエステルで、クリームや口紅などに用いられる。","油脂が酸素や日光などの作用により変質することを酸敗という。","スクワランは、動植物から得られる不飽和炭化水素であるスクワレンに水素を添加したもので、安定性に優れている。"],2],
        ["界面活性剤に関する次の記述のうち、誤っているものはどれか。",["ノニオン界面活性剤は、水に溶かしたときに親水基が陰イオンになる。","石けんは、陰イオン界面活性剤である。","陽イオン界面活性剤として、第四級アンモニウム塩がある。","両性界面活性剤は、酸性の水溶液中では陽イオンに、アルカリ性の水溶液中では陰イオンになる。"],1],
        ["パーマ剤に関する次の記述のうち、正しいものの組合せはどれか。\na 第1剤中の還元剤は、毛髪内のシスチン結合に水素を与えて切断する。\nb 第2剤に用いられる酸化剤として、臭素酸ナトリウムは過酸化水素より酸化力が強い。\nc モノエタノールアミンは、第1剤において還元剤として働く。\nd 第1剤中のアルカリ剤によって、イオン結合が切断される。",["aとb","bとc","cとd","aとd"],4],
        ["パーマ剤及びヘアカラーの成分と役割に関する次の組合せのうち、正しいものはどれか。",["アンモニア水 ― 調色剤(カップラー)","パラフェニレンジアミン ― 酸化剤","レゾルシン ― アルカリ剤","チオグリコール酸 ― 還元剤"],4],
        ["明治時代の女性の髪型に関する次の記述のうち、誤っているものはどれか。",["明治16年に建設された鹿鳴館での舞踏会は、女性の洋装や洋髪の出現に影響を与えた。","まがれいとやイギリス結びという髪型は、代表的な西洋束髪である。","束髪は、和装、洋装ともによく似合う髪型である。","日本髪は、明治時代に入ってから結われなくなった。"],4],
        ["1960年代の服装に関する次の記述のうち、誤っているものはどれか。",["ワンレングスカットと、ボディラインを意識してウエストを細くしぼった服装の「ワンレン・ボディコン」が話題となった。","東京銀座では、みゆき族と名付けられた若者ファッションが話題となったが、短期間で終わった。","黒などダークな色が主体であった男性ファッションをカラフルにしようとする「ピーコック革命」という動きが起こった。","パリのオートクチュールデザイナーが高級既製服を販売したことにより、日本でも既製服時代が到来した。"],1],
        ["女性の和装礼装に関する次の記述のうち、正しいものはどれか。",["準礼装の色留袖は、絵羽模様が特徴である。","黒留袖は、未婚者、既婚者の区別なく礼装として用いられる。","訪問着は、未婚者、既婚者の区別なく準礼装として用いられる。","付け下げの模様は、裾だけにあしらわれている。"],3],
        ["美容の電気器具に関する次の記述のうち、正しいものはどれか。",["電熱式アイロンに内蔵されたサーモスタットは、一定の温度を保つはたらきをする。","ハンドドライヤーは、タービネートタイプである。","スタンドドライヤーは、消費電力が2,000W以上のものが多い。","ヘアスチーマーは、乾熱を利用して技術効果を高めるはたらきをする。"],1],
        ["トリートメントに関する次の記述のうち、誤っているものはどれか。",["トリートメント剤に配合されているカチオン界面活性剤は、毛髪の補修作用にすぐれている。","トリートメント剤は、加温して用いることにより、浸透が促進される。","トリートメント剤は、洗い流すタイプと洗い流さないタイプがある。","プレトリートメントは、パーマネントウェーブやヘアカラーの施術前に行われる。"],1],
        ["ヘアカッティングの姿勢に関する次の記述のうち、正しいものはどれか。",["左サイドの前上がりラインを切る場合は、右肘を上げるとよい。","右から左へ下がるラインを切る場合は、左肘を下げるとよい。","目線の高さを調節する場合は、背筋を曲げて対応するとよい。","切る対象に対して、握りこぶし1つ分の間隔をおいて立つとよい。"],2],
        ["パーマネントウェーブのテストカールに関する次の記述のうち、正しいものはどれか。",["テストカールにより第2剤がどの程度毛髪に作用しているかチェックする。","テストカールは、ネープ最下部の細めのロッドで判断する。","ウェーブの大小は、ロッドの太さによって決まる。","タイム不足の場合、カール径がロッドの直径の2.5倍以下となる。"],3],
        ["メイポールカールに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「ストランドの [ A ] から巻かれるため、毛先の [ B ] は広く [ C ] は弱い。カールを巻く際にベースの周囲を一定の形や大きさにスライスしてつくる [ D ] に分類される。」",["A:根元 ― B:ウェーブ幅 ― C:弾力 ― D:ストランドカール","A:根元 ― B:トロー ― C:立ち上がり ― D:シェーピングカール","A:毛先 ― B:トロー ― C:弾力 ― D:ストランドカール","A:毛先 ― B:ウェーブ幅 ― C:立ち上がり ― D:シェーピングカール"],1],
        ["下図はスキップウェーブを表したものである。A、B、Cの長さに関する次の組合せのうち、正しいものはどれか。",["A:2cm ― B:1cm ― C:4.5cm","A:2cm ― B:1.5cm ― C:4cm","A:3cm ― B:1cm ― C:4cm","A:3cm ― B:1.5cm ― C:4.5cm"],4,"skipwave_43_49"],
        ["ヘアカラーの種類と特徴に関する次の記述のうち、正しいものはどれか。（※公式採点では(1)と(2)のいずれも正解）",["脱染剤は、毛髪のメラニン色素を脱色する。","酸化染毛剤は、黒色の毛髪を明るい色に染毛することもできる。","ヘアマニキュアは、永久染毛剤に分類される。","一時染毛料の色もちは、約2〜4週間である。"],2],
        ["ネイルケアの道具に関する次の記述のうち、正しいものはどれか。",["キューティクルプッシャーは、キューティクルをやわらかくし、爪や爪まわりの皮膚の乾燥を防ぐものである。","エメリーボードは、爪の長さや形を整えるものである。","ウッドスティックは、爪の表面の凹凸を滑らかにするものである。","フットパドルは、エナメルが塗りやすいように指の間を開くために装着するものである。"],2],
        ["まつ毛エクステンションに関する次の記述のうち、正しいものはどれか。",["エクステンションを接着しやすいように、コンタクトレンズの装着を勧める。","リペアは、個人差はあるが、通常6〜7週間で行う。","アイメイクアップを落としてから施術する。","過去にアレルギー性の接触皮膚炎を発症しなかった物質では、かぶれることはない。"],3],
        ["下図のウエディングドレスの基本シルエットのうち、プリンセスラインはどれか。",["(1) ボールガウン(ベルライン)","(2) プリンセスライン(上半身から裾へ切り替え線で広がるシルエット)","(3) ミディアム丈ドレス","(4) マーメイドライン"],2,"dress_43_53"],
        ["下図のヘアスタイルのバランスを表しているものは、次のうちどれか。",["シンメトリー","アシンメトリー","アンバランス","コントラスト"],1,"symmetry_43_54"],
        ["刃物の材料に関する次の記述のうち、正しいものはどれか。",["炭素鋼には鉄が2%含まれている。","ステンレス鋼にはクロムが5%含まれている。","炭素鋼はコバルト鋼に比べて加工性がよい。","炭素鋼はステンレス鋼に比べてさびに強い。"],3]

      42: [
        ["美容師法で定める次の事務のうち、都道府県知事、保健所設置市の市長又は特別区の区長の事務に含まれないものはどれか。",["美容所の開設届の受理","美容所の構造設備の検査確認","美容師試験の実施","美容所について講じなければならない衛生措置の実施状況の立入検査"],3],
        ["美容師の免許に関する次の記述のうち、誤っているものはどれか。",["美容師名簿に登録されなければ、美容を業としてはならない。","本籍地の都道府県名を変えたときは、免許証(免許証明書)の書換え交付を申請することができる。","美容師が、美容の業を行う場合に講ずべき措置に違反し、業務停止処分を受けたときは、処分を行った者にすみやかに免許証(免許証明書)を提出することとなっている。","免許証(免許証明書)を紛失したときは、住所地の都道府県知事等に免許証(免許証明書)の再交付を申請しなければならない。"],4],
        ["美容師法で定める変更手続きに関する次の記述のうち、正しいものはどれか。",["美容師が氏名を変更した場合は、30日以内に美容師名簿の訂正を申請しなければならない。","美容師が住所を変更した場合は、30日以内に美容師名簿の訂正を申請しなければならない。","開設した美容所の営業について定休日を変更した場合は、すみやかに変更の届出を提出しなければならない。","相続等により美容所の開設者の地位を承継した場合は、新たに美容所の開設の届出を提出しなければならない。"],1],
        ["美容所の開設に関する次の記述のうち、正しいものはどれか。",["外国人は、正当に日本に在留できる場合であっても開設者となることができない。","美容所の開設者は、管理美容師の資格がなければ、2か所以上の美容所の開設者を兼ねることができない。","会社の福利厚生のための美容所については、業として行う場合であっても開設の届出は必要ない。","美容所の開設者がその美容所を廃止し、その届出を怠った場合には、30万円以下の罰金に処されることがある。"],4],
        ["美容師法で定める行政処分や罰則に関する次の記述のうち、誤っているものはどれか。",["美容師が業務停止処分に違反したときは、免許を取り消されることがある。","美容師が美容師名簿の登録事項の変更について訂正申請を行わなかったときは、罰金に処されることがある。","美容所の開設者が閉鎖命令に違反したときは、罰金に処されることがある。","環境衛生監視員の立入検査を妨げた者は、美容師及び美容所の開設者以外であっても、罰金に処されることがある。"],2],
        ["生衛法(生活衛生関係営業の運営の適正化及び振興に関する法律)に関する次の記述のうち、誤っているものはどれか。",["生活衛生同業組合の設立について定めている。","生衛法の標準営業約款は、施術料金の統一についても定めている。","生活衛生同業組合の事業として、組合員に対する営業施設の整備改善等の資金のあっせんを定めている。","利用者又は消費者の利益の擁護を図ることも目的としている。"],2],
        ["保健所に関する次の記述のうち、正しいものはどれか。",["保健所を設置できるのは、都道府県と市町村である。","保健所の事業の一つとして、感染症その他の疾病の予防に関する事項がある。","保健所の事業には、歯科保健に関する事項は含まれていない。","保健所の事業の一つとして、美容所の経営指導がある。"],2],
        ["労働基準法に関する次の記述のうち、誤っているものはどれか。",["同居の親族以外の従業者を1人でも使用している美容所には、労働基準法が適用される。","美容所の使用者は、従業者の意思に反して、労働を強制してはならない。","美容所の使用者は、契約の際に従業者に賃金、労働時間その他の労働条件を必ずしも明示しなくてもよい。","美容所の使用者は、従業者に一定の休憩時間や一定の休日を与えなければならない。"],3],
        ["公的年金制度に関する次の記述のうち、正しいものはどれか。",["日本国内に居住する20歳以上の者は、すべて厚生年金保険に加入することとなっている。","国民年金による給付は、老齢基礎年金のみで、障害基礎年金はない。","老齢基礎年金の給付額は、保険料を納付した期間にかかわらずすべて同額である。","国民年金の保険料を納めることが困難な場合に対応するため、保険料の免除や納付猶予の制度がある。"],4],
        ["次のうち、雇用保険の給付に該当しないものはどれか。",["基本手当","療養補償給付","育児休業給付","介護休業給付"],2],
        ["わが国の出生に関する次の記述のうち、誤っているものはどれか。",["2015年の出生数は、約100万人である。","出生率は、人口1,000人に対する出生数の割合である。","1人の女性が一生の間に産む子どもの数は、2015年では2人以上である。","2015年の出生数は、1975年の出生数よりも少ない。"],3],
        ["次の疾病のうち、糖尿病に関連した合併症に該当しないものはどれか。",["大腸がん","白内障","心筋梗塞","末梢神経障害"],1],
        ["喫煙に関する次の記述のうち、誤っているものはどれか。",["受動喫煙は、小児ぜんそくの危険性を増す。","男性の喫煙率は、年々増加の傾向にある。","妊婦の喫煙は、低出生体重児の危険性を増す。","たばこの煙には、発がん物質や発がん促進物質が含まれている。"],2],
        ["さまざまな環境の要因を物理的環境要因、化学的環境要因、生物学的環境要因、社会的環境要因の4種類に分類する場合、物理的環境要因に含まれるものは次のうちどれか。",["温度","有毒ガス","衛生害虫","経済"],1],
        ["水道に関する次の記述のうち、誤っているものはどれか。",["人が飲む水である上水には、健康に悪影響がないこと、使用上、不便のないこと、おいしいことなどが求められる。","水道法に基づく水質基準により、水質の適・不適を判断する。","浄化槽とは、河川水を浄化して上水を得るための施設のことである。","高層建築物に作られている水槽が汚染されて、藻類が発生して異臭を出すことがある。"],3],
        ["次の感染症のうち、性行為によって感染するものはどれか。",["B型肝炎","日本脳炎","コレラ","マラリア"],1],
        ["細菌に関する次の記述のうち、誤っているものはどれか。",["細菌の固形成分のおよそ半分はタンパク質である。","細菌は、DNAとRNAの両方をもっている。","細菌は、生きた細胞の中でのみ増殖する。","細菌の中には、100℃の加熱に耐えるものがある。"],3],
        ["感染症予防の3原則に関する次の記述のうち、感染経路対策に該当しないものはどれか。",["学校(学級)の閉鎖","野菜類の十分な洗浄","ネズミ族、昆虫等の駆除","患者の入院治療"],4],
        ["風しんに関する次の記述のうち、誤っているものはどれか。",["潜伏期は、2〜3か月である。","妊婦がり患すると、心臓病、白内障、聴力障害をもつ子どもが生まれる危険性がある。","病原体はウイルスで、患者の鼻や咽頭の分泌物により飛沫感染する。","予防には、予防接種を受けることが有効である。"],1],
        ["O157による腸管出血性大腸菌感染症に関する次の記述のうち、誤っているものはどれか。",["感染経路は、飲食物等を介しての経口感染である。","病原体は、熱に対して弱い。","潜伏期は、約30日である。","病原体は、ベロ毒素を出すのが特徴である。"],3],
        ["血液が付着しているはさみに対して美容所で行う消毒の方法として正しいものは、次のうちどれか。",["0.1%次亜塩素酸ナトリウム水溶液中に10分間浸す。","0.1%逆性石けん水溶液中に10分間浸す。","0.1%両性界面活性剤水溶液中に10分間浸す。","消毒用エタノールを含ませた綿で表面を拭く。"],1],
        ["美容師法施行規則で定める消毒の方法に関する次の記述のうち、正しいものの組合せはどれか。\na 紫外線による消毒、熱による煮沸消毒及び蒸気消毒だけでなく、放射線や電子線などによる方法が規定されている。\nb 紫外線消毒は血液の付着がない器具の消毒に使用し、1cm²あたり80マイクロワットの紫外線を10分間照射する。\nc 煮沸消毒は被消毒物を沸騰後2分間以上煮沸する。\nd 蒸気消毒は80℃を超える湿熱に被消毒物を10分間以上触れさせる。",["aとb","bとc","cとd","aとd"],3],
        ["紫外線消毒に関する次の記述のうち、正しいものの組合せはどれか。\na タオルの消毒に適している。\nb 被消毒物の深部や陰の部分も消毒できる。\nc 紫外線殺菌灯から照射される紫外線は、粘膜に有害である。\nd プラスチックには長時間照射すると劣化するものがある。",["aとb","bとc","cとd","aとd"],3],
        ["化学的消毒法の特徴に関する次の記述のうち、正しいものの組合せはどれか。\na 逆性石けんは、無色無臭で毒性が弱く、ウイルスや結核菌に対して殺菌効果がある。\nb 逆性石けんは、普通の石けんと併用すると消毒力が著しく低下する。\nc 次亜塩素酸ナトリウムは、殺菌と同時に漂白の作用がある。\nd 消毒用エタノールは、芽胞型の菌に対して殺菌効果がある。",["aとb","bとc","cとd","aとd"],2],
        ["5%次亜塩素酸ナトリウムを希釈して、0.1%次亜塩素酸ナトリウム水溶液1,000mLを調製する場合の5%次亜塩素酸ナトリウムの量は、次のうちどれか。",["1 mL","2 mL","10 mL","20 mL"],4],
        ["関節とその運動範囲に関する次の組合せのうち、正しいものはどれか。",["鞍関節 ― 1方向だけに運動できる。","蝶番関節 ― 2方向だけに運動できる。","車軸関節 ― 3方向だけに運動できる。","球関節 ― 広い範囲で自由に運動できる。"],4],
        ["次の筋のうち、表情筋(顔面筋)に含まれないものはどれか。",["眼輪筋","口輪筋","咬筋","鼻筋"],3],
        ["神経系の分類で、中枢神経系に含まれないものはどれか。",["脳神経","延髄","大脳","脊髄"],1],
        ["次の記述のうち、交感神経が優位なときの反応として正しいものはどれか。",["唾液は希薄で多量に分泌する。","気管支は収縮する。","瞳孔は縮小する。","心拍数は増加する。"],4],
        ["血球成分に関する次の記述のうち、正しいものはどれか。",["好中球は主に血液凝固に関わる。","好塩基球は主に食作用に関わる。","リンパ球は主に免疫反応に関わる。","単球は主に即時型アレルギー反応に関わる。"],3],
        ["皮膚の構造に関する次の記述のうち、誤っているものはどれか。",["色素細胞(メラノサイト)の数は、同一部位であっても白色人種や黒色人種などの人種によって大きく異なる。","角化細胞(ケラチノサイト)は、約1か月かけて基底細胞から角質細胞に分化する。","ランゲルハンス細胞は、表皮内に侵入した抗原物質(アレルゲン)を取り込むはたらきがある。","真皮は、コラーゲンからできた膠原線維が大部分を占めている。"],1],
        ["皮膚付属器官に関する次の記述のうち、正しいものはどれか。",["毛根の下端のフラスコ状に膨らんだ部分を毛幹とよぶ。","毛のケラチンは、全体として長軸の方向に鎖状に結合しているため、縦に裂けやすい。","脂腺の数は、体の部位によって違いがあり、頭毛の生えている部位、額、眉間、下顎には少ない。","爪の成長周期は、成長期、退行期、休止期を繰り返す。"],2],
        ["皮膚の生理機能に関する次の記述のうち、誤っているものはどれか。",["皮膚には、痛点、触点、温点、冷点が分布している。","紫外線を浴びると、エラスチンが大量につくられ、皮膚の色が黒くなる。","皮脂に含まれる脂肪酸は、一部の細菌や真菌の発育を抑制する。","皮膚の表面には、汗と皮脂が混じり合い、乳化した状態の薄い膜がある。"],2],
        ["皮膚と皮膚付属器官の保健に関する次の記述のうち、誤っているものはどれか。",["皮膚の状態は、全身の健康状況によって変化する。","成人では、加齢とともに、皮膚の分泌作用や新陳代謝が低下し、皮膚は乾燥し硬くなる。","健康な成人の皮膚の表面はアルカリ性である。","脂腺から分泌される皮脂は、毛の光沢としなやかさを保つ役割がある。"],3],
        ["皮膚疾患に関する次の記述のうち、誤っているものはどれか。",["接触皮膚炎(カブレ)は、種々の化学物質や薬剤などが皮膚に接触して発生する皮膚の炎症である。","蕁麻疹は、食物や薬によるもののほか、花粉、ダニ、寒冷、温熱、日光などの外的刺激によるものもある。","ニキビは、毛包が角質の栓で詰まることなどによりでき、炎症へと進むことがある。","頭部白癬は、ウイルスによって引き起こされる。"],4],
        ["界面活性剤に関する次の記述のうち、誤っているものはどれか。",["界面活性剤は、1分子中に親油基(疎水基)と親水基を有する。","界面活性剤の乳化作用は、臨界ミセル濃度(cmc)より高い濃度で発揮される。","界面活性剤の作用により、ファンデーションの粉体の顔料を基剤中に均一に分散させることができる。","W/O型エマルジョンでは、水相に油滴が分散している。"],4],
        ["香粧品と関わりが深い有機化合物とその分類に関する次の組合せのうち、正しいものはどれか。",["ケラチン ― タンパク質","システイン ― 炭化水素","ワセリン ― 多糖類","セタノール ― アミノ酸"],1],
        ["紫外線とその防御に関する次の記述のうち、誤っているものはどれか。",["UV-B(中波長紫外線)は、皮膚に急性の紅斑を引き起こす。","紫外線は、皮膚に影響を与えるだけでなく、香粧品の品質を劣化させる原因となる。","SPF値は、主にUV-Bを防御する程度を示す値である。","紫外線による急性の炎症をサンバーンといい、PAはその防御効果の指標である。"],4],
        ["パーマ剤の有効成分に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「二浴式のパーマ剤は、[ A ] のような [ B ] を有効成分とする第1剤と、[ C ] のような [ D ] を有効成分とする第2剤からなる。」",["A:臭素酸ナトリウム ― B:還元剤 ― C:チオグリコール酸 ― D:酸化剤","A:臭素酸ナトリウム ― B:酸化剤 ― C:チオグリコール酸 ― D:還元剤","A:チオグリコール酸 ― B:還元剤 ― C:臭素酸ナトリウム ― D:酸化剤","A:チオグリコール酸 ― B:酸化剤 ― C:臭素酸ナトリウム ― D:還元剤"],3],
        ["酸化染毛剤に含まれる成分と、そのはたらきに関する次の組合せのうち、正しいものはどれか。（※公式採点では(2)と(4)のいずれも正解）",["過酸化水素 ― アルカリ剤","レゾルシン ― 調色剤(カップラー)","アンモニア水 ― 酸化剤","メタフェニレンジアミン ― 染料中間体"],2],
        ["第2次世界大戦後から1950年代にかけてスクリーンファッションとともにわが国にも登場したヘアスタイルに該当しないものはどれか。",["セシールカット","サーファーカット","ポニーテール","ヘップバーンカット"],2],
        ["下図のうち、竹の子族ファッションに該当するものはどれか。",["(1) ベルボトム・パンタロンスタイル","(2) アイビー・トラッドスタイル","(3) ニュートラ・ティアードスカートスタイル","(4) 竹の子族ファッション(原色のゆったりしたローブ・ハーレムパンツ)"],4],
        ["花嫁の和装の礼装に関する次の記述のうち、誤っているものはどれか。",["現在の花嫁衣装の起源は桃山時代の上級武家の夫人の正装である。","打掛の下に着用する小袖のことを、掛下や長着とよぶことがある。","打掛の下に着用する小袖は、今日、振袖となっている。","小袖の身丈は、かかとの位置に仕立てる。"],4],
        ["コーム各部の名称とそのはたらきに関する次の記述のうち、誤っているものはどれか。",["肩は、コームの目に入った毛髪を一線にそろえるはたらきをする。","胴は、コーム全体の支えとなり、バランスをとるはたらきをする。","歯は、毛髪を引き起こし垂直に立てて両側から支え、そろえるはたらきをする。","歯先は、頭皮に接して毛髪を引き起こす手引きをする。"],1],
        ["シャンプーイングの目的や方法に関する次の記述のうち、正しいものはどれか。",["シャンプーイングは、汚れを取り除き、その後のカットやブローなどヘアデザインを容易にする土台をつくる。","セカンドシャンプーでは、ファーストシャンプーで落としきれなかった汚れをとるので、大きめの動きでファーストシャンプーより時間をかけない。","パーマネントウェーブ及びヘアカラー施術前のシャンプーは、薬剤が効果的にはたらくようにしっかりとしたタッチで頭皮をこする。","ヘアカラー施術後のアフターシャンプーは、薬剤を除去するため、時間をかけずに強めに洗う。"],1],
        ["ヘアカッティングにおけるパネルの角度とシルエットの関係に関する次の記述のうち、正しいものはどれか。",["アップステムでシェープしてカットした場合、トップショートのロングエンドとなり、スタイルに立体感を与える。","ダウンステムでシェープしてカットした場合、シルエットは、骨格に沿った均等なものになる。","毛髪をすべて自然に落ちる位置にシェープしてカットした場合、頭部の形がそのままヘアスタイルのシルエットを形成する。","オンベースにシェープしてカットした場合、カットラインは水平となる。"],1],
        ["レザーカットの技法に関する次の記述のうち、誤っているものはどれか。",["テーパーカットは、毛髪を削いで先細りにするカット技法であり、テーパーする深さ・面・方向により技術が分類される。","セニングカットは、間引きすることによって毛量調整を行うカット技法である。","ディープテーパーカットは、毛先から 1/3 ほどをテーパーするカット技法である。","ポインティングカットは、毛先を不揃いに尖らせ、ヘアスタイルに遊びや変化をもたせるカット技法である。"],3],
        ["パーマネントウェーブ技術に関する次の記述のうち、正しいものはどれか。",["根元の新生部は、毛先に比べパーマがかかりやすい。","あらかじめ毛髪に第1剤を塗布し、ワインディング後に再び第1剤を塗布する方法を水巻きという。","かかりすぎるおそれのある毛髪には、つけ巻きが適している。","カラーリングや残存ウェーブがあるところには、状態に応じてトリートメント剤を塗布して第1剤の作用をセーブする。"],4],
        ["ヘアウェービングに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「カールスペースをつくるベースを取るためのスライス線は、ウェーブ幅の [ A ] であり、ループの直径はウェーブ幅の [ B ] 、カールスペースはウェーブ幅の [ C ] となる。」",["A: 1/3 ― B: 1/2 ― C: 2/3","A: 1/2 ― B: 2/3 ― C: 1/3","A: 1/3 ― B: 2/3 ― C: 2/3","A: 1/2 ― B: 1/2 ― C: 1/3"],2],
        ["アルカリ性タイプの酸化染毛剤によるヘアカラーリングに関する次の記述のうち、正しいものはどれか。",["細毛や軟毛などは、黄み系が出やすいので、希望色より明度の低い染毛剤を用いるとよい。","白髪は染まりやすいので、白髪染めの場合、白髪の少ない部分から塗布する。","放置時間の目安は、ヘアカラーの場合、約5〜20分で、5分おきにテストする。","放置時間がある程度経過した時点で、皮膚や発色の状態を確認するためパッチテストを行う。"],1],
        ["ネイル技術に関する次の記述のうち、誤っているものはどれか。",["スカルプチュアは、人工爪の土台となるフォームを使用して、アクリルやジェルなどで長さを出すテクニックである。","アートチップは、ナチュラルネイルにラインストーンやシールなどでアートを施すテクニックである。","フレンチスカルプチュアは、基本的にはフリーエッジにホワイトを使用するテクニックである。","ナチュラルネイルオーバーレイは、弱い爪の補強などを行うテクニックである。"],2],
        ["まつ毛エクステンションに関する次の記述のうち、正しいものはどれか。",["カウンセリングは、1回だけ行う。","カウンセリングは、目についてだけ行う。","カウンセリングでは、施術のリスクについても正しく伝える。","アレルギー反応は、必ず施術中にあらわれる。"],3],
        ["ヘアドライヤーに関する次の記述のうち、誤っているものはどれか。",["ブロータイプのヘアドライヤーは、音が静かで毛髪も乱れにくいが、タービネートタイプに比べてドライイングに時間を要する。","ヘアドライヤーは、ファンの回転によって起こされた風がニクロム線によって熱せられ、送風される仕組みになっている。","温度を一定に保つため、着脱式のアタッチメントを使用する。","ヘアドライヤーの熱によって毛髪の水分を蒸発させるが、結合水まで蒸発するとオーバードライとなる。"],3],
        ["美容デザインにおける錯覚現象に関する次の記述のうち、誤っているものはどれか。",["線をさまざまな形に配置して錯覚を生じさせるものを、化学的錯視という。","幾何学的錯視には、距離・大きさに関する錯視と角度・方向に関する錯視がある。","ボリュームの大きいヘアスタイルに囲まれた顔がボリュームの小さいヘアスタイルの場合より小さく感じるのは、大きさの対比現象によるものである。","平面的に描かれたものを立体的に見せる手法の1つに、陰影をつけるという方法がある。"],1],
        ["エステティックにおけるスキンチェックで見極める肌質の種類や特徴に関する次の記述のうち、正しいものはどれか。",["肌質は、水分や皮脂のバランスによって分けることができる。","乾燥肌は、毛穴が大きく開いている。","脂性肌は、きめが細かく、皮膚が薄い。","混合肌は、肌に健康的な血色があり、きめが整っている。"],1]
      ],
      41: [
        ["美容師の業務に関する次の記述のうち、誤っているものはどれか。",["美容師が理容所で理容の業を行うには、理容師の免許が必要である。","日本の国籍を有しない者は、美容師免許を取得することができない。","美容師の資格は、取消処分を受けない限り、有効期間の制限はない。","伝染性の疾病にかかり、その就業が公衆衛生上不適当と認められる場合は、そのことにより、業務停止処分の対象となる。"],2],
        ["美容師法の違反者に対する行政処分及び罰則に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「衛生上必要な措置を講じなかった美容師は業務の停止処分を受けることがあるが、その処分に違反して美容の業を行った場合、その美容師は [ A ] を受けることがある。また、その美容師に美容の業を行わせた開設者も [ B ] を受けることがある。なお、衛生上必要な措置に関する立入検査を妨害した者は [ C ] を受けることがある。」",["A:免許の取消処分 ― B:閉鎖処分 ― C:罰金刑","A:免許の取消処分 ― B:罰金刑 ― C:罰金刑","A:罰金刑 ― B:閉鎖処分 ― C:業務の停止処分","A:罰金刑 ― B:罰金刑 ― C:業務の停止処分"],1],
        ["管理美容師に関する次の記述のうち、正しいものはどれか。",["管理美容師は、美容所ごとに適切な経営管理を行わせるために置かなければならない。","管理美容師は、美容師の免許を受けた後5年以上美容の業に従事し、かつ厚生労働大臣が指定する講習会の課程を修了した者でなければならない。","2か所以上の美容所の開設者が管理美容師となることができる者であるときは、自ら主として管理する1つの美容所の管理美容師となることができる。","美容師が1人だけであっても、この美容師以外にも従業者がいる美容所は、管理美容師を置かなければならない。"],3],
        ["美容所の開設に関する次の記述のうち、正しいものはどれか。",["美容所を開設する者は、構造設備の検査確認を受けて使用を開始した後、すみやかに従業する美容師の氏名を届け出なければならない。","美容所の開設者は、届出事項に変更が生じるときは、事前に都道府県知事等に届け出なければならない。","美容所の開設者となる者は、美容師の免許を受けた者でなければならない。","美容所の閉鎖処分に違反した開設者は、30万円以下の罰金に処されることがある。"],4],
        ["美容師法に基づき条例で定めることができる事項に該当しないものは、次のうちどれか。",["美容師が美容所以外の場所で美容の業を行うことができる場合","美容師が美容の業を行う場合に講ずべき衛生上必要な措置","美容所の開設者が美容所につき講ずべき衛生上必要な措置","美容の施術に関する料金"],4],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に関する次の記述のうち、誤っているものはどれか。",["この法律は、美容業等の経営の健全化等を通じて、公衆衛生の向上と国民生活の安定に寄与することを目的としている。","生活衛生同業組合は、資金のあっせん、技能の改善向上、経営の健全化に関する指導等の事業を実施する。","生活衛生同業組合は、料金等を規制するための標準営業約款を定めることができる。","厚生労働大臣は、生活衛生関係営業の振興を図るため、業種ごとに振興指針を定めることができる。"],3],
        ["労働基準法に関する次の記述のうち、誤っているものはどれか。",["同居の親族以外で、5人未満の従業者を使用している美容所には、労働基準法は適用されない。","美容所の使用者(開設者)は、従業者の意思に反して、労働を強制してはならない。","美容所の使用者(開設者)は、従業者に賃金、労働時間その他の労働条件を明示しなければならない。","美容所の使用者(開設者)は、従業者に一定の休憩時間や一定の休日を与えなければならない。"],1],
        ["美容所の経営者の税金に関する次の記述のうち、誤っているものはどれか。",["所得税や法人税は、利益が出ているときに支払う税金である。","経営者は、従業員の給与から源泉所得税を預かり、原則として翌月の10日までに税務署に支払う。","固定資産税は、経営がうまくいかず赤字の場合は支払わなくてもよい税金である。","申告納税しなければならない者が申告や納税義務を怠った場合には、罰則として追加の税が課されることになっている。"],3],
        ["働く人たちの安全と健康の確保及び快適な職場環境の形成を促進することを目的としている法律は、次のうちどれか。",["労働安全衛生法","雇用保険法","労働者災害補償保険法","労働基準法"],1],
        ["医療保険に関する次の記述のうち、誤っているものはどれか。",["健康保険の療養の給付に当たっての被保険者の一部負担金は、すべて、かかった医療費の1割である。","健康保険では、被保険者自身だけでなく、一定の要件に合う扶養家族の業務外の傷病などに関しても給付を行う。","健康保険では、業務外の傷病による療養のために仕事を休み、給与を受けられないときに、傷病手当金を支給する。","国民健康保険は、健康保険などの被用者保険に加入していない者を対象とする医療保険制度である。"],1],
        ["次の事業のうち、母子保健法に基づく母子保健事業に含まれないものはどれか。",["母子健康手帳の交付","妊産婦や乳幼児の健康診査","新生児の訪問指導","児童虐待の捜査"],4],
        ["わが国の死亡率と平均寿命に関する次の記述のうち、正しいものはどれか。",["男性の粗死亡率は、女性の粗死亡率よりも高い。","がんの部位別年齢調整死亡率のトップは、男女ともに肺がんである。","2015年における男女の平均寿命の差は、10年以上である。","2015年におけるわが国の平均寿命は、男女とも世界一である。"],1],
        ["生活習慣病に関する次の記述のうち、誤っているものはどれか。",["従前は成人病とよばれていた。","食習慣、運動習慣、休養などの生活習慣が深く関与している。","関係法令による特定健康診査・特定保健指導の対象者は、50歳以上である。","1981年以降、がんによる死亡率が第1位となっている。"],3],
        ["室内の環境に関する次の記述のうち、誤っているものはどれか。",["快適と感じる温度は、温度そのものだけでなく、湿度や気流の影響も受けている。","美容所の湿度は、相対湿度30%以下が望ましいとされている。","気流とは空気の流れのことで、一般に0.1〜0.2m/秒が快適とされている。","冷房が強いと、体温調節の機能のバランスを失って、冷房病といわれる現象を起こす。"],2],
        ["衣服の役割と衣服材料の性質に関する次の組合せのうち、誤っているものはどれか。",["作業能率増進 ― 抗帯電性","清潔保持 ― 抗菌性","身体保護 ― 耐熱性","体温調節 ― 吸湿性"],1],
        ["細菌に関する次の記述のうち、誤っているものはどれか。",["菌体の周囲に鞭毛を持ち、これを動かして運動するものがある。","DNAまたはRNAの、いずれかのみを持っているものがある。","酸素があると発育できないものがある。","芽胞をつくるものがある。"],2],
        ["感染症と感染経路に関する次の記述のうち、誤っているものはどれか。",["A型肝炎は、血液を介して感染する。","マラリアは、蚊を介して感染する。","破傷風は、土壌を介して感染する。","百日せきは、飛沫を介して感染する。"],1],
        ["感染症予防の3原則に関する次の記述のうち、誤っているものはどれか。",["学校(学級)閉鎖は、感染経路対策である。","ネズミや昆虫の駆除は、感染源対策である。","予防接種は、宿主の感受性に関する対策である。","検疫は、感染源対策である。"],2],

      "q54_06": "【正解】（1）\n(1)×（非該当）：美容師試験は厚生労働大臣が行う国の事務であるため、その施行に関して必要な事項は都道府県等の条例では定められません。\n(2)○・(3)○・(4)○：出張美容が認められる場合、出張美容時の衛生確保措置、美容所の衛生設備基準はいずれも都道府県等の条例で定めることができます。",
      "q54_07": "【正解】（4）\n生衛法の正式名称は「生活衛生関係営業の運営の適正化及び【A：振興】に関する法律」です。同法では、厚生労働大臣が業種ごとに【B：振興指針】を定め、これに基づき生活衛生同業組合が【C：振興計画】を策定して認定を受ける仕組みとなっています。",
      "q54_08": "【正解】（3）\n(1)×：国民年金第1号被保険者の保険料は市町村ごとではなく「全国一律」です。\n(2)×：保険料免除を受けるには本人からの申請手続きが必要です（自動免除ではありません）。\n(3)○：保険料の全額免除期間中であっても、一定の要件を満たせば障害基礎年金を受給できます。\n(4)×：老齢基礎年金の給付額は、保険料納付済期間や免除期間の長さに応じて計算されるため一律同額ではありません。",
      "q54_09": "【正解】（3）\n(1)×：介護保険の保険者（運営主体）は国ではなく「市町村及び特別区」です。\n(2)×：介護保険の被保険者は「65歳以上の者（第1号）」と「40歳以上65歳未満の医療保険加入者（第2号）」であり、20歳以上すべてではありません。\n(3)○：介護保険の給付には、要介護者への「介護給付」、要支援者への「予防給付」、市町村が独自に定める「市町村特別給付」があります。\n(4)×：利用者負担割合は原則1割（一定以上所得者は2割または3割）であり、一律3割ではありません。",
      "q54_10": "【正解】（1）\n(1)×（誤り）：雇用保険の被保険者となるには「1週間の所定労働時間が20時間以上」かつ「31日以上の雇用見込みがあること」等の要件があり、所定労働時間の長さにかかわらず全員が被保険者となるわけではありません。\n(2)○・(3)○・(4)○：自己都合退職時の基本手当、65歳以上の高年齢求職者給付金、育児休業給付はいずれも正しい記述です。",
      "q54_11": "【正解】（1）\n2020年（令和2年）の日本の平均寿命は男性約81.64年、女性約87.74年で、男女とも【A：80】年を超えており、男女差は【B：6】年以上（約6.1年）で、【C：女性】の方が長くなっています。",
      "q54_12": "【正解】（2）\n糖尿病の代表的な合併症には、3大合併症である(3)末梢神経障害、(4)腎機能障害（糖尿病腎症）、網膜症のほか、動脈硬化による(1)心筋梗塞や脳梗塞があります。(2)「前立腺がん」は糖尿病の合併症には該当しません。",
      "q54_13": "【正解】（3）\n(1)○：加齢により心身の活力（筋力・活動量・体重等）が低下した虚弱状態をフレイルといいます。\n(2)○：骨粗しょう症は無症状のまま骨密度が低下し、骨折しやすくなります。\n(3)×（誤り）：運動器の障害により移動機能が低下するロコモティブシンドロームでは、歩行速度は「低下」します（上昇はしません）。\n(4)○：認知症の原因としてはアルツハイマー型が最も多く、次いで血管性認知症（脳梗塞・脳出血等）が多くなっています。",
      "q54_14": "【正解】（4）\n(1)○・(2)○・(3)○：直接照明・間接照明・グレア（不快なまぶしさ）の説明はいずれも正しい記述です。\n(4)×（誤り）：『理容所及び美容所における衛生管理要領』では、作業面の照度は80ルクスではなく「300ルクス以上」が望ましいとされています（※美容師法施行規則の法定基準でも100ルクス以上です）。",
      "q54_15": "【正解】（2）\n(1)○：家庭系一般廃棄物は市町村の責任で処理します。\n(2)×（誤り）：事業系一般廃棄物は都道府県ではなく、排出する「事業者（自らの責任）」および「市町村」の枠組みで処理されます。\n(3)○：産業廃棄物は排出事業者の責任で処理します。\n(4)○：生ごみ等をそのまま埋め立てるとハエやネズミ等の衛生害虫・獣の発生源となります。",
      "q54_16": "【正解】（3）\n感染症法において、美容師が感染した場合に接客業務等の就業制限の対象となり得るのは、二類感染症である（3）「結核」です（A型肝炎は四類、風しん・麻しんは五類感染症で、感染症法上の就業制限対象ではありません）。",
      "q54_17": "【正解】（4）\na○：細菌のなかには菌体周囲に鞭毛（べんもう）を持ち運動するものがあります。\nb×：細菌の成分の約70〜80%は「水分」です（タンパク質は固形成分の約半分です）。\nc×：ウイルスはDNAかRNAの「どちらか一方のみ」の核酸を持ちます。\nd○：ウイルスは単独では増殖できず、生きた宿主細胞内でのみ増殖します。\nしたがって正しい組合せは aとd の（4）です。",
      "q54_18": "【正解】（2）\n(1)×：病原体が体表面に付着しただけでは「汚染」であり、体内に侵入して定着・増殖することを「感染」といいます。\n(2)○：感染の結果、組織や臓器に病的変化（自覚症状や他覚所見）が現れることを「発病（顕性感染）」といいます。\n(3)×：感染しても症状が出ない「不顕性感染」があるため、必ず発病するわけではありません。\n(4)×：潜伏期は感染症の種類によって数時間〜数年まで大きく異なります。",
      "q54_19": "【正解】（2）\n（2）「伝染性膿痂疹（とびひ）」は黄色ブドウ球菌やレンサ球菌による皮膚感染症で、患者が使用したタオルや器具などの接触によって感染します。（1）デング熱と（4）日本脳炎は蚊が媒介し、（3）破傷風は土壌中の破傷風菌が傷口から侵入して感染します。",
      "q54_20": "【正解】（1）\n(1)×（誤り）：日本は2015年に麻しんの排除状態にあると認定されましたが、その後も海外からの輸入例やそれに伴う国内感染患者の発生報告があります。\n(2)○・(3)○・(4)○：麻しんの症状（発熱・せき・結膜充血・発疹）、空気感染と強い感染力、定期予防接種の対象であることはすべて正しい記述です。",
      "q54_21": "【正解】（2）\n消毒法は大きく【A：理学的】な方法と【B：化学的】な方法に分けられます。理学的消毒法は熱（煮沸・蒸気）や【C：紫外線】などの物理的作用により、化学的消毒法は消毒薬などの【D：薬品】の化学的作用により病原微生物を殺菌・不活化します。",
      "q54_22": "【正解】（3）\n(1)○：蒸気消毒（80℃超・10分以上）は煮沸消毒（沸騰後2分以上）より長い時間を要します。\n(2)○：消毒薬の殺菌作用は化学反応であるため、水分がない乾燥状態では進行しにくくなります。\n(3)×（誤り）：消毒薬水溶液の温度は、一般に「高いほど（適温20℃前後以上）」化学反応が速まり消毒効果が高くなります（低温ほど効果は低下します）。\n(4)○：湿熱は乾熱より熱伝導と浸透力が高いため、同じ温度・時間なら湿熱の方が殺菌効果は高くなります。",
      "q54_23": "【正解】（2）\na×：紫外線は長時間照射するとゴムや一部のプラスチックを劣化・変色させることがあります。\nb○：消毒用エタノール（76.9〜81.4%）は揮発性が強く引火性があります。\nc○：次亜塩素酸ナトリウムは光と熱で分解しやすいため、密栓して冷暗所に保存します。\nd×：陽イオン界面活性剤（逆性石けん）は普通の石けん（陰イオン界面活性剤）と併用すると中和されて効力が著しく低下します。\nよって正しい組合せは bとc の（2）です。",
      "q54_24": "【正解】（1）\na○：かみそりのエタノール消毒は、消毒用エタノールに10分間以上浸漬します（かみそりの清拭は不可）。\nb○：血液が付着していないくし等（かみそり以外の器具）は、消毒用エタノールを含ませたガーゼや脱脂綿での清拭が認められています。\nc×：ネイルケアの金属製器具等にも消毒用エタノールは適しています。\nd×：消毒用エタノールは逆性石けんと併用しても効力は低下しません（むしろ殺菌力が増強されます）。\nよって正しい組合せは aとb の（1）です。",
      "q54_25": "【正解】（4）\n【希釈計算】必要な原液量 ＝ 作りたい量(1000mL) × 目標濃度(0.01%) ÷ 原液濃度(5%) ＝ 1000 × 0.01 ÷ 5 ＝ 2mL です。したがって（4）2mL が正解です。",
      "q54_26": "【正解】（1）\n骨は外側の硬い（3）緻密質、内部の網目状の（4）海綿質、骨髄が入る（2）髄腔、および表面を覆う骨膜や関節軟骨で構成されますが、選択肢の中では独立した支持組織である（1）「軟骨」が狭義の骨そのものの内部構造区分から除外されるものとして正解となります（※関節面を除き骨質・髄腔とは別組織として扱われます）。",
      "q54_27": "【正解】（1）\n（1）「心筋」は、顕微鏡で見ると横紋構造を持つ「横紋筋」でありながら、自分の意思では動かせず自律神経（交感神経・副交感神経）の支配を受ける不随意筋です。（2）・（3）の骨格筋は運動神経（体性神経）支配の横紋筋、（4）の平滑筋は自律神経支配ですが横紋を持たない筋です。",
      "q54_28": "【正解】（3）\n(1)×：交感神経は体性神経ではなく「自律神経」の一種です。\n(2)×：交感神経の活性化は瞳孔の「散大（拡大）」を引き起こします（縮小は副交感神経）。\n(3)○：交感神経が活性化すると、副腎髄質からのアドレナリン分泌が促進されます。\n(4)×：消化・吸収や排泄を促すのは「副交感神経」です（交感神経は消化管運動を抑制します）。",
      "q54_29": "【正解】（4）\n眼球壁の最内層にある（4）「網膜」には、明暗を感じる杆体（かんたい）細胞と色を感じる錐体（すいたい）細胞という光受容感覚細胞（視細胞）が存在します。（1）角膜は光の屈折、（2）強膜は眼球の保護、（3）脈絡膜は暗箱の役割と栄養供給を担います。",
      "q54_30": "【正解】（4）\na○：耳下腺・顎下腺・舌下腺の3つを大唾液腺といいます。\nb×：食道から続く胃の入り口は「噴門（ふんもん）」、十二指腸へ続く出口は「幽門（ゆうもん）」です（逆になっています）。\nc×：小腸は「十二指腸・空腸・回腸」の3部で構成されます（盲腸は大腸の一部です）。\nd○：膵臓は消化酵素を含む膵液を十二指腸へ分泌します。\nよって正しい組合せは aとd の（4）です。",
      "q54_31": "【正解】（4）\n(1)×：色素細胞（メラノサイト）は角質層ではなく表皮最下層の「基底層」に分布しています。\n(2)×：基底細胞の核の上に核帽（メラニンキャップ）を形成するのはケラチンではなく「メラニン顆粒」です。\n(3)×：皮膚の色の濃淡は色素細胞の「数」ではなく（数は人種間でほぼ同じ）、産生される「メラニンの量や大きさ」によって決まります。\n(4)○：紫外線の刺激を受けるとチロシナーゼという酵素が活性化し、メラニン色素が産生されます。",
      "q54_32": "【正解】（3）\n(1)○：毛母には色素細胞が存在し、毛にメラニン色素を与えます。\n(2)○：立毛筋は毛包の毛隆起に付着しています。\n(3)×（誤り）：毛の表面にあるウロコ状の最も薄い層（キューティクル）は「毛小皮」です。「毛皮質（コルテックス）」はその内側にある毛の大部分を占める層です。\n(4)○：頭毛の成長期（2〜6年）に比べ、眉毛や体毛などの成長期は数か月と短くなっています。",
      "q54_33": "【正解】（1）\n(1)×（誤り）：健康な皮膚表面の脂肪膜（皮脂膜）は「弱酸性（pH4.5〜6.5程度）」であり、弱アルカリ性ではありません。\n(2)○・(3)○・(4)○：皮脂中の脂肪酸や皮膚常在菌による病原菌の増殖抑制、侵入時の白血球（好中球・単球）の遊走・食作用はいずれも正しい記述です。",
      "q54_34": "【正解】（3）\n(1)○：皮脂の分泌は男性ホルモン（アンドロゲン）によって促進されます。\n(2)○：更年期の女性では女性ホルモンが減少し相対的に男性ホルモンの影響が現れ、フケの増加やひげの発育がみられることがあります。\n(3)×（誤り）：アジソン病（皮膚の色素沈着）は、副腎皮質ホルモンの分泌が「減少（低下）」したときに起こります（増加ではありません）。\n(4)○：男性型脱毛症（AGA）には男性ホルモンや遺伝、加齢が関与します。",
      "q54_35": "【正解】（2）\n(1)×：癜風（でんぷう）の病原体は白癬菌ではなく「マラセチア（癜風菌）」です。\n(2)○：丹毒は「溶血性レンサ球菌（化膿菌）」が真皮に感染して起こる急性炎症です。\n(3)×：水痘（みずぼうそう）の病原体は「水痘・帯状疱疹ウイルス」です。\n(4)×：疥癬（かいせん）の病原体はトコジラミではなくダニの一種である「ヒゼンダニ」です。",
      "q54_36": "【正解】（4）\n(1)○：石けんは陰イオン界面活性剤で洗浄力に優れます。\n(2)○：第四級アンモニウム塩は陽イオン界面活性剤でリンス料等に用いられます。\n(3)○：レシチンは天然由来の両性界面活性剤です。\n(4)×（誤り）：アルキル硫酸ナトリウムは「陰イオン（アニオン）界面活性剤」であり、シャンプーの主洗浄剤として用いられます（非イオン界面活性剤や帯電防止剤ではありません）。",
      "q54_37": "【正解】（1）\n(1)×（誤り）：ベンガラは植物色素ではなく、酸化鉄からなる赤色の「無機着色顔料」です（ベニバナから得られるのは紅＝カルタミンです）。\n(2)○・(3)○・(4)○：酸化鉄の3色（黄・赤・黒）、白色顔料の酸化チタン、法定タール色素の説明はいずれも正しい記述です。",
      "q54_38": "【正解】（2）\n(1)×：クリームには油脂を含まず炭化水素やロウ類・エステル油等で構成されるものもあるため、必ず油脂が配合されるわけではありません。\n(2)○：バニシングクリームは水分が多く油分が少ない「O/W型（水中油滴型）」クリームです。\n(3)×：クレンジングクリームには水で洗い流せるウォッシャブルタイプ（O/W型等）もあります。\n(4)×：水を含まない無水型のクリーム（油性クリーム等）も存在します。",
      "q54_39": "【正解】（2）\nパーマ剤第1剤には還元剤の（1）システインや（4）チオグリコール酸、アルカリ剤の（3）モノエタノールアミンが配合されます。（2）「過酸化水素水」は酸化剤であり、パーマ剤の「第2剤」（または酸化染毛剤第2剤）に配合される成分です。",
      "q54_40": "【正解】（4）\na○：酸化染毛剤第1剤のパラフェニレンジアミン（酸化染料）は過酸化水素で酸化重合されて発色します。\nb×：チオグリコール酸はシスチンを「還元」してシステインにします。\nc×：過酸化水素は「酸素」を放出し、「酸化剤」として作用します。\nd○：トコフェロール（ビタミンE）は抗酸化剤（酸化防止剤）として香粧品の自動酸化を防ぎます。\nよって正しい組合せは aとd の（4）です。",
      "q54_41": "【正解】（3）\n(1)○：結綿（ゆいわた）は島田髷の一種です。\n(2)○：明治の束髪は和装・洋装のどちらにも似合う実用的な髪型でした。\n(3)×（誤り）：唐人髷（とうじんまげ）は既婚女性ではなく「少女〜未婚の若い女性」に結われた日本髪です（既婚女性の代表は丸髷です）。\n(4)○：明治初期の女性の断髪は強い社会的非難を浴び、明治5年に断髪禁止令が出されました。",
      "q54_42": "【正解】（1）\n1940年代の太平洋戦争下の戦時体制において、日本の女性に活動的な標準服・防空服装として広く着用されたのは（1）「もんぺ」です。（2）サックドレスと（3）落下傘スカートは1950年代、（4）海老茶袴は明治時代の女学生の服装です。",
      "q54_43": "【正解】（4）\n(1)○：地色が黒以外の振袖を色振袖といいます。\n(2)○：色留袖は現在は既婚女性に限らず未婚女性も着用できます。\n(3)○：訪問着は縫い目にまたがる絵羽模様（絵画風模様）が特徴です。\n(4)×（誤り）：「付け下げ」は反物の状態で模様付けされ、縫い目で模様がつながらない（絵羽模様ではない）よう控えめに配された着物です。",
      "q54_44": "【正解】（3）\na×：立位作業では技術者の重心から下ろした垂線が「両足とそれらにはさまれた領域（支持基底面）内」にある必要がありますが、本肢の対としてcとdが最も的確な作業姿勢原則です（※公式正答(3) cとd）。\nb×：技術を施す箇所は利き手近くではなく「身体の正面（正対する位置）」に置いて行います。\nc○：技術を施す箇所を目の高さに合わせることで無理な前傾を防ぎます。\nd○：肩関節を固定して手を動かす作業では、肘に余裕を持たせると操作が安定します。\nよって正しい組合せは cとd の（3）です。",
      "q54_45": "【正解】（3）\nコームの各部のうち、毛髪を引き起こし垂直に立てて両側から支え、そろえる働きをするのは歯の根元部分である（3）「歯元」です（歯先は頭皮に接して毛髪を引き起こす手引きをし、峰・背や歯は毛髪を一線にそろえ、胴は全体のバランスを支えます）。",
      "q54_46": "【正解】（4）\n(1)×：ファーストシャンプー（1回目）は毛髪表面の汚れや整髪料を軽く洗い流すのが目的で、マッサージを重視して本洗いするのはセカンドシャンプーです。\n(2)×：ヘアカラー施術前は頭皮の皮脂膜を落としすぎないよう、頭皮を強くこすらず汚れだけを軽く落とすか、シャンプーを行いません。\n(3)×：シャンプーのお湯の適温は「38〜40℃（体温よりやや高め）」です（30〜35℃ではぬるすぎます）。\n(4)○：タオルドライは髪同士をこすり合わせず、タオルに水分を吸わせるように優しく行います。",
      "q54_47": "【正解】（2）\n図のように、外側の白い丸枠の位置が上下にずれていることで、実際には同じ高さにある左右の黒目の位置が上下にずれて見える現象は、周囲の枠組みに影響される（2）「枠組み効果」です。",
      "q54_48": "【正解】（3）\n(1)×：毛髪を頭皮面に対して直角（90度）に引き出し全体を同じ長さに切るのは「セイムレングスカット」です（ワンレングスは0度で同一線上に切ります）。\n(2)×：上層ほど毛髪が長くカットラインが水平になるのは「ワンレングスカット」です。\n(3)○：レイヤーカットはアップステムで切るため、上層（トップ）が短く下層（ヘムライン側）の毛髪が長くなります。\n(4)×：セイムレングスカットは上層も下層も同じ長さになります。",
      "q54_49": "【正解】（3）\nフルウェーブを形成するにはロッドの円周の「3回転分」の毛髪の長さが必要です。直径8mm（0.8cm）のロッドの1回転の円周は 0.8 × 3.14 ＝ 2.512cm なので、3回転分は 2.512 × 3 ＝ 約7.5cm となり、（3）が正解です。",
      "q54_50": "【正解】（4）\n図の矢印のうち、(1)は毛束を引く力（テンション）、(2)はロッド自体の重さ（重力）、(3)は巻かれた毛髪が元に戻ろうとする回転反発力、(4)は「毛束を止めた部分（輪ゴム）から毛根までの毛が弾力でロッドの重みに反発して押し返す力」を表しています。",
      "q54_51": "【正解】（4）\na○：顔から後方（耳介方向）へ向かって流れるように巻くカールをリバースカールといいます。\nb×：右サイドで時計回り（クロックワイズ）に巻くカールは顔側へ向かう「フォワードカール」になります。\nc×：メイポールカールは根元から巻くため、毛先のウェーブ幅が広く根元の弾力は弱いフラットなカールです。\nd○：ラリアットカールはステムに角度をつけて立体的に立ち上げるスタンドアップカールに分類されます。\nよって正しい組合せは aとd の（4）です。",
      "q54_52": "【正解】（2）\n(1)×：色料の三原色（プライマリーカラー）は「赤（マゼンタ）・黄（イエロー）・青（シアン）」です（緑ではありません）。\n(2)○：明度（明るさ）と彩度（鮮やかさ）が組み合わさった色の調子を「トーン（色調）」といいます。\n(3)×：補色どうしを混ぜると互いの色みを打ち消し合って無彩色（黒・灰色）に近づきます（鮮やかにはなりません）。\n(4)×：彩度が低い色は「くすんだ色（鈍い色）」を指します。",
      "q54_53": "【正解】（4）\n(1)×：カウンセリングは初回だけでなく再来時も毎回健康状態や目の状態を確認します。\n(2)×：グルーのパッチテストは20分程度ではなく、24〜48時間経過後の皮膚や目元の反応を確認する必要があります。\n(3)×：クレンジング剤やテープ、グルー等によるかぶれを防ぐため、化粧品アレルギーの有無も必ずカウンセリングで確認します。\n(4)○：施術中や施術後に目や目元に痛み・かゆみ・充血などの違和感があれば、直ちに施術を中止し医療機関（眼科等）を受診してもらいます。",
      "q54_54": "【正解】（2）\n(1)花簪（はなかんざし）、(3)手絡（てがら：髷の根元に結ぶ布）、(4)根がけ（髷の根元に巻く飾り）はいずれも日本髪の髪飾りですが、（2）「筥迫（はこせこ）」は花嫁衣装などの懐（胸元）に挟む装身具であり、頭髪の装飾品ではありません。",
      "q54_55": "【正解】（1）\n着物の図において、Aは肩の折り山である「肩山」、Bは前身頃の端に縫い付けられた細長い布の幅である「衽幅（おくみはば）」、Cは襟の先端部分である「襟先（えりさき）」です。したがって（1）が正解です。",
      "q53_01": "【正解】（2）\na×：保健所は国の直轄機関ではなく、都道府県・政令指定都市・中核市・特別区などの「地方公共団体」が設置します。\nb○：保健所の所長は医師でなければなりません。\nc○：保健所は地域保健法に基づき、住宅・水道・下水道・廃棄物・清掃等の環境衛生業務を行います。\nd×：介護老人保健施設の許可は都道府県知事等の業務であり、地域保健法に定める保健所の業務ではありません。\nよって正しい組合せは bとc の（2）です。",
      "q53_02": "【正解】（4）\n(1)○：本籍地都道府県名を変更したときは30日以内に名簿の訂正申請が義務付けられています。\n(2)○：免許証の記載事項が変わったときは書換え交付を申請できます。\n(3)○：免許証を紛失したときは再交付を申請できます。\n(4)×（誤り）：免許取消処分を受けたときは、30日以内ではなく「5日以内」に厚生労働大臣へ免許証を返納しなければなりません。",
      "q53_03": "【正解】（4）\n(1)×：管理美容師は経営管理ではなく「美容所を衛生的に管理させるため」に置かれます。\n(2)×：管理美容師講習会の修了年月日は美容師名簿の登録事項ではありません。\n(3)×：設置義務は美容師が「常時2人以上」である場合であり、繁忙期に臨時に2人以上になるだけの場合は不要です。\n(4)○：管理美容師の設置義務に違反した開設者は、都道府県知事等から美容所の「閉鎖命令」を受けることがあります。",
      "q53_04": "【正解】（1）\n(1)○：譲渡や相続・合併・分割により美容所の開設者の地位を承継した者は、遅滞なくその旨を都道府県知事等に届け出なければなりません。\n(2)×：変更の届出を怠った場合は30万円以下の罰金に処せられることがあります。\n(3)×：美容師の採用や退職による変更届は30日以内ではなく「速やかに」届け出なければなりません。\n(4)×：管理美容師の届出事項は「氏名及び住所」であり、本籍地都道府県は届出事項ではないため変更届は不要です。",
      "q53_05": "【正解】（3）\n(1)○・(2)○・(4)○：開設者の衛生措置への立入検査、検査確認前使用への罰金、従業者による立入検査妨害への罰金はいずれも正しい記述です。\n(3)×（誤り）：環境衛生監視員の立入検査では、開設者が講ずべき措置だけでなく「美容師が講ずべき衛生上必要な措置の実施状況」も検査対象となります。",
      "q53_06": "【正解】（3）\n(1)×：伝染性疾病にかかり就業が不適当な場合は「業務停止処分」の対象です。\n(2)×：精神機能の障害により業務を適正に行えない場合は「免許取消処分」の対象です。\n(3)○：免許を取り消された後に美容を業とした場合は、無免許営業として「罰金刑（30万円以下）」の対象となります。\n(4)×：衛生上必要な措置を講じなかった場合は「業務停止処分」の対象です。",
      "q53_07": "【正解】（2）\n(1)○：薬機法は医薬品だけでなく医薬部外品・化粧品の製造販売も規制しています。\n(2)×（誤り）：生衛法の「標準営業約款（Sマーク）」は、役務の内容・施設設備の表示・損害賠償の確保を定めるもので、過度な競争時の料金規制を行う制度ではありません（料金規制を行うのは「適正化規程」で、現在はすべて廃止されています）。\n(3)○・(4)○：消費者安全法および個人情報保護法の記述はいずれも正しい記述です。",
      "q53_08": "【正解】（2）\n(1)○：常時10人以上の労働者を使用する場合は就業規則の作成・届出義務があります。\n(2)×（誤り）：労働基準法により、労働時間が6時間を超える場合は少なくとも45分、「8時間を超える場合は少なくとも1時間」の休憩時間を途中に与えなければなりません。\n(3)○：原則として毎週少なくとも1日の休日（法定休日）を与える義務があります。\n(4)○：事業主には職場のパワーハラスメント防止措置（相談体制の整備等）が義務付けられています。",
      "q53_09": "【正解】（2）\n(1)○：被用者保険に加入していない75歳未満の従業者は国民健康保険の対象となります。\n(2)×（誤り）：医療保険の自己負担割合は年齢や所得によって異なり（義務教育就学前は2割、就学後〜70歳未満は3割、70〜74歳は原則2割、75歳以上は原則1割）、年齢にかかわらず一律3割ではありません。\n(3)○・(4)○：健康保険の傷病手当金、および高額療養費制度についての記述は正しいです。",
      "q53_10": "【正解】（1）\n(1)×（誤り）：労災保険（労働者災害補償保険）の保険料は「全額事業主（雇用主）負担」であり、労働者の負担はありません（事業主と労働者の双方が負担するのは雇用保険です）。\n(2)○・(3)○・(4)○：業務災害の要件、治療費（療養補償給付）の原則自己負担なし、障害補償給付の説明はいずれも正しい記述です。",
      "q53_11": "【正解】（3）\n(1)×：喫煙はCOPD（慢性閉塞性肺疾患）の最大の原因であることが明確に判明しています。\n(2)×：妊婦の喫煙は早産や低出生体重児など胎児の発育に悪影響を及ぼします。\n(3)○：改正健康増進法により、美容所を含む多数の者が利用する施設（第二種施設）は「原則屋内禁煙」と定められています。\n(4)×：受動喫煙防止規定への違反には指導・命令や過料（罰則）が設けられています。",
      "q53_12": "【正解】（2）\n(1)○：2019年の日本は死亡数が出生数を上回る自然減となっています。\n(2)×（誤り）：2019年の65歳以上の高齢者数は「約3,589万人」であり、3,000万人を大きく超えています。\n(3)○：平均世帯人員は約2.4人で3人以下です。\n(4)○：高齢者のいる世帯の割合は増加傾向にあります。",
      "q53_13": "【正解】（2）\n(1)○・(3)○・(4)○：認知症の定義、アルツハイマー型が最多であること、脳血管障害が原因となることは正しい記述です。\n(2)×（誤り）：高齢化の進展に伴い、日本の認知症高齢者数は今後さらに「増加する」と予測されています。",
      "q53_14": "【正解】（3）\n(1)○：一酸化炭素は不完全燃焼で発生します。\n(2)○：無色・無臭の有毒ガスです。\n(3)×（誤り）：一酸化炭素は血液中のヘモグロビンとの結合力が酸素の「約200〜250倍強い」ため、酸素運搬を妨げて一酸化炭素中毒を引き起こします。\n(4)○：衛生管理要領における一酸化炭素濃度基準は10ppm以下です。",
      "q53_15": "【正解】（4）\n(1)○：離島などでは海水を淡水化して水道水源に用いることがあります。\n(2)○：浄水処理工程では消毒のため塩素剤（次亜塩素酸ナトリウム等）が添加されます。\n(3)○：下水処理水の放流水質は水質汚濁防止法や下水道法で規制されています。\n(4)×（誤り）：下水処理で発生する下水汚泥はすべて焼却されるわけではなく、セメント原料や建設資材、肥料（コンポスト）、バイオガス発電などに有効利用（再資源化）されたり埋立処分されたりしています。",
      "q53_16": "【正解】（1）\n（1）「デング熱」はウイルスを保有する蚊（ネッタイシマカやヒトスジシマカなどの節足動物）に刺されることで媒介・感染します。（2）C型肝炎は血液媒介、（3）ジフテリアは飛沫感染、（4）麻しんは空気感染（飛沫核感染）です。",
      "q53_17": "【正解】（4）\na○：細菌もウイルスも遺伝子の突然変異を起こすことがあります。\nb×：芽胞をつくるのは一部の細菌（破傷風菌・炭疽菌等）のみで、ウイルスは芽胞をつくりません。\nc×：2分裂で増殖するのは細菌であり、ウイルスは宿主細胞内で複製増殖します。\nd○：細菌もウイルスも、宿主の免疫力が低下した際に日和見感染を起こすことがあります。\nよって両方に当てはまるのは aとd の（4）です。",
      "q53_18": "【正解】（4）\n（1）麻しん、（2）結核（BCG）、（3）破傷風にはいずれも有効な予防ワクチンが実用化され定期接種が行われていますが、（4）「後天性免疫不全症候群（エイズ／HIV感染症）」には現在実用化された予防ワクチンはありません。",
      "q53_19": "【正解】（1）\n(1)×（誤り）：新型コロナウイルス感染症（COVID-19）は、「発症する前（潜伏期間中）や無症状の感染者」からも他人に感染させる可能性があります。\n(2)○・(3)○・(4)○：嗅覚・味覚障害の症状、手洗い等の手指衛生、PCR検査や抗原検査の実施はいずれも正しい記述です。",
      "q53_20": "【正解】（3）\n(1)×：百日せき患者は乳幼児や小児・若年層の割合が多く、高齢者が最多ではありません。\n(2)×：病原体はウイルスではなく細菌の「百日せき菌」です。\n(3)○：主に咳やくしゃみによる飛沫感染および接触感染で伝播します。\n(4)×：潜伏期は通常7〜10日程度であり、1〜2か月ではありません。",
      "q53_21": "【正解】（2）\na×：かみそりの消毒にエタノールを用いる場合は「10分間以上浸す（浸漬）」必要があり、ガーゼ等で拭く（清拭）方法は認められていません。\nb○：血液が付着しているかみそりを0.1%以上の次亜塩素酸ナトリウム水溶液に10分間以上浸すのは正しい方法です。\nc○：血液が付着していないくしに85μW/cm²以上の紫外線を20分間以上照射するのは正しい方法です。\nd×：血液が付着している器具に逆性石けんは使用できません（血液付着時は煮沸・エタノール浸漬・0.1%次亜塩素酸ナトリウム浸漬の3法のみ）。\nよって正しい組合せは bとc の（2）です。",
      "q53_22": "【正解】（1）\n細菌の【A：芽胞】は通常の増殖形態である【B：栄養型】よりも熱や消毒薬に対して強い抵抗性を持っています。また、ウイルスは【C：逆性石けん】などでは不活化されにくい（特にエンベロープを持たないウイルスには無効）ですが、【D：次亜塩素酸ナトリウム】には弱い（不活化される）という特徴があります。",
      "q53_23": "【正解】（3）\n(1)○・(2)○：80〜100℃の蒸気消毒や2〜3分間の煮沸消毒では、耐熱性の高い細菌の芽胞は死滅しません。\n(3)×（誤り）：「蒸気消毒」は血液が付着していない器具・布片にのみ適用でき、血液が付着している器具には適用できません。\n(4)○：煮沸消毒（沸騰後2分以上）は血液が付着している器具にも適用できます。",
      "q53_24": "【正解】（2）\na×：次亜塩素酸ナトリウムは直射日光や熱によって分解し効力が低下します。\nb○：強アルカリ性で酸化作用があるため、手指などの皮膚や粘膜に炎症を起こしやすく手指消毒には適しません。\nc○：酸性の薬品・洗剤と混ぜると有毒な塩素ガスが発生します。\nd×：水溶液は酸性ではなく「アルカリ性」を示します。\nよって正しい組合せは bとc の（2）です。",
      "q53_25": "【正解】（4）\n(1)×：5%を50倍希釈すると 5% ÷ 50 ＝ 0.1%水溶液になります（0.05%ではありません）。\n(2)×：10%液20mLを全量1000mL（＋水980mL）にすると 10% × 20 ÷ 1000 ＝ 0.2%水溶液になります。\n(3)×：0.05%液を1000mL作るのに必要な5%原液は 1000 × 0.05 ÷ 5 ＝ 10mL です（5mLではありません）。\n(4)○：10%液5mLで0.1%水溶液（100倍希釈）を作ると 5mL × 100 ＝ 500mL になり正しい記述です。",
      "q53_26": "【正解】（2）\n頭蓋を構成する骨のうち、側頭骨と顎関節をつくって連結され、咀嚼や発声のために大きく動かすことができる唯一の骨は（2）「下顎骨」です（上顎骨・鼻骨・頬骨は縫合によって固定されています）。",
      "q53_27": "【正解】（4）\n下顎を動かして食物をかみ砕く「咀嚼筋（そしゃくきん：三叉神経支配）」に該当するのは（4）「側頭筋」（ほか咬筋・内側翼突筋・外側翼突筋）です。（1）オトガイ筋、（2）口角挙筋、（3）口輪筋はいずれも表情筋（顔面神経支配）です。",
      "q53_28": "【正解】（1）\n脳は「大脳・間脳（視床・視床下部）・中脳・橋・延髄・小脳」で構成されます。（1）「頸髄（けいずい）」は脳ではなく「脊髄」の上部（首の部分）です。",
      "q53_29": "【正解】（3）\n白血球の一種である（3）「単球」は、血管外（組織内）へ出ると大食細胞とも呼ばれる「マクロファージ」に分化し、異物を貪食したり抗原提示を行ったりします。",
      "q53_30": "【正解】（4）\na○：左心室が収縮して大動脈へ血液を送り出すときの最高血圧を収縮期血圧といいます。\nb×：逆流防止の「弁」があるのは下肢の「静脈」やリンパ管であり、動脈にはありません。\nc×：リンパ管は鎖骨下付近で大動脈ではなく「静脈（静脈角）」に合流します。\nd○：門脈（肝門脈）は胃腸や脾臓などの毛細血管から集まった静脈血を肝臓へ運ぶ血管です。\nよって正しい組合せは aとd の（4）です。",
      "q53_31": "【正解】（2）\n(1)×：メラニンを産生して周囲の基底細胞や有棘細胞に受け渡すのが色素細胞（メラノサイト）であり、自ら角質層へ輸送するわけではありません。\n(2)○：メラニンは基底細胞の核の上（核帽）に集まり、紫外線による核DNAの損傷を防ぎます。\n(3)×：アレルゲンを取り込んでリンパ球に抗原提示するのは「ランゲルハンス細胞」です。\n(4)×：触覚を受容するのは「メルケル細胞」です。",
      "q53_32": "【正解】（3）\na×：脂腺孔は毛隆起（立毛筋付着部）よりも「上方（皮膚表面側）」の毛包頸部に開いています。\nb×：胎生毛（うぶ毛）や軟毛には中心の「毛髄質（メデュラ）」がないものが多くあります。\nc○：眉毛や鼻毛、耳毛は高齢になると成長期が長くなり、長い毛が見られるようになります。\nd○：思春期に性ホルモンの影響で発育する腋毛や陰毛、ひげなどを性毛といいます。\nよって正しい組合せは cとd の（3）です。",
      "q53_33": "【正解】（1）\n（2）エラスチン（弾性線維）、（3）ケラチン（角質層）、（4）コラーゲン（膠原線維）はいずれも皮膚の機械的外力に対する保護作用を持ちますが、（1）「サイトカイン」は細胞間の情報伝達や免疫・炎症反応に関わる生理活性タンパク質であり、機械的外力への保護構造物質ではありません。",
      "q53_34": "【正解】（4）\n(1)○：肝臓障害では血中のビリルビン（胆汁色素）が増えて皮膚が黄色くなる黄疸が現れます。\n(2)○：便秘や胃腸障害があるとニキビや肌荒れが悪化することがあります。\n(3)○：糖尿病では血行障害や神経障害により足の潰瘍や壊疽が起きやすくなります。\n(4)×（誤り）：全身の強い皮膚の「かゆみ（皮膚掻痒症）」を引き起こしやすい体内病変は心臓病ではなく「肝臓障害・腎不全・糖尿病」などです（心臓病ではチアノーゼやむくみが現れます）。",
      "q53_35": "【正解】（2）\n(1)○：単純性疱疹は単純ヘルペスウイルスが原因です。\n(2)×（誤り）：伝染性軟属腫（みずいぼ）の原因はブドウ球菌（細菌）ではなく「伝染性軟属腫ウイルス（ポックスウイルス科）」です。\n(3)○：ケルズス禿瘡（とくそう）は頭部に生じる重症の白癬（真菌感染症）です。\n(4)○：疥癬はヒゼンダニが原因です。",
      "q53_36": "【正解】（4）\n(1)×：セタノール（炭素数16）は常温で固体の「高級アルコール」です。\n(2)×：メタノールは有毒（失明等の中毒）なため化粧品への配合は禁止されています。\n(3)×：2-プロパノール（イソプロパノール）は化粧品への配合が認められています。\n(4)○：エタノール（エチルアルコール）は親水基（-OH）を持つため、水と任意の割合でよく混じり合います。",
      "q53_37": "【正解】（2）\n微生物による変質を防ぐために配合されるパラベン等は【A：防腐剤】です。また、空気中の【B：酸素】との接触で起こる自動酸化を抑えるため、酸化防止剤（ビタミンCやビタミンE等）や、酸化反応を促進する金属イオンを不活性化する【C：エチレンジアミン四酢酸（エデト酸、EDTA）】等のキレート剤が配合されます。",
      "q53_38": "【正解】（1）\n(1)×（誤り）：ポリフェノールは植物に含まれる抗酸化物質等であり、非イオン界面活性剤ではありません（非イオン界面活性剤はポリオキシエチレンアルキルエーテル等です）。\n(2)○・(3)○・(4)○：PVP（セット料の皮膜形成剤）、CMC（増粘剤）、ニトロセルロース（ネイルエナメルの皮膜形成剤）はいずれも正しい記述です。",
      "q53_39": "【正解】（2）\n二浴式パーマ剤の第1剤は【A：チオグリコール酸】（またはシステイン）のような【B：還元剤】を有効成分とし、第2剤は【C：臭素酸ナトリウム】（または過酸化水素）のような【D：酸化剤】を有効成分とします。",
      "q53_40": "【正解】（3）\na×：パラフェニレンジアミンは酸化重合によって初めて発色する無色の「酸化染料（染料中間体）」であり、直接染料ではありません。\nb×：酸性染毛料（ヘアマニキュア）は医薬部外品ではなく「化粧品」に分類されます。\nc○：染料中間体とカップラー（調色剤）を組み合わせることで多彩な色調に染められます。\nd○：脱色剤（ヘアブリーチ）は毛髪内部のメラニン色素を酸化分解して明るくします。\nよって正しい組合せは cとd の（3）です。",
      "q53_41": "【正解】（1）\n（1）「二百三高地髷」は明治37〜38年（日露戦争期）に大流行したひさし髪スタイルの西洋束髪です。（2）結綿、（3）桃割れ、（4）天神髷はいずれも伝統的な「日本髪」です。",
      "q53_42": "【正解】（3）\n(1)○・(2)○・(4)○：フィフティーズ、ケンゾーのフォークロア、ニュートラはいずれも1970年代の流行です。\n(3)×（非該当）：メンズの「コンチネンタルルック」は1970年代ではなく「1960年代前半」にアイビールックと並んで流行したスタイルです。",
      "q53_43": "【正解】（3）\n男性の洋装礼装において、昼間の正式礼装（正礼装）は（3）「モーニングコート」です。（1）燕尾服は夜間の正礼装、（2）タキシードは夜間の準礼装、（4）ディレクターズスーツは昼間の準礼装です。",
      "q53_44": "【正解】（3）\n頭部の基準点において、Aは頭頂部の最も高い点である「トップポイント」、Bは水平線と垂直線の交点から下ろした角の二等分線が頭表と交わる「ゴールデンポイント」、Cは後頭部の生え際中央の「ネープポイント」です。よって（3）が正解です。",
      "q53_45": "【正解】（2）\nシザーズは支点となるネジ部分の【A：鋏要（はさみかなめ）】から【B：近い側（刃元側）】では強い力（剪断力）が働き、支点から【C：遠い側（刃先側）】では力は弱まりますが刃先の動きが見やすく繊細な作業を行いやすいという特性があります。",
      "q53_46": "【正解】（1）\nスキャルプマッサージの基本手技のうち、ペトリサージュ（揉撚法：じゅうねんほう）は、（1）「手掌、4指、母指を用いて円を描くようにもみほぐす」手技です。（2）は強擦法（フリクション）、（3）は軽擦法（エフルラージュ）、（4）は叩打法（タapotement／パーカッション）です。",
      "q53_47": "【正解】（2）\n同じ正方形の図形でも、45度傾けて配置すると別の図形である「ひし形」に見えて動きや緊張感が生じる現象（2）が「図形の印象に及ぼす方向性の効果」です。（1）は構成要素の相互作用、（3）はプロポーション（比率）、（4）は大きさの対比現象です。",
      "q53_48": "【正解】（1）\n(1)○：カッティング時は、切る対象に対して腕を軽く曲げたくらいの適切な間隔をおいて正対して立ちます。\n(2)×：目線の高さを調整するときは背筋を曲げず、膝の屈伸や椅子の高さ調整で対応します。\n(3)×：左から右へ上がるラインを切る場合は、ハサミの角度に合わせ左肘を下げます。\n(4)×：右サイドの前上がりライン（後ろから前へ上がるライン）を切る場合は左肘を下げます。",
      "q53_49": "【正解】（2）\n(1)×：一度開封したパーマ剤は酸化・変質するため長期保存後の使用はできません。\n(2)○：毛髪の損傷や変色・ウェーブ低下を防ぐため、パーマ施術の前後1週間は酸化染毛剤によるヘアカラーは行いません。\n(3)×：パーマ施術の翌日に再施術すると毛髪が著しく損傷するため避けます。\n(4)×：頭髪用パーマ剤を眉毛やまつ毛に使用することは目や皮膚の重篤な障害を防ぐため禁止されています。",
      "q53_50": "【正解】（1）\n(1)×（誤り）：ダメージ毛などの「吸水性毛」は水や薬剤を急速に吸収しやすいため、パーマが「かかりやすい（かかりすぎて傷みやすい）」毛質です。薬剤をはじいてパーマがかかりにくいのは「はっ水性毛（撥水性毛）」です。\n(2)○・(3)○・(4)○：はいずれも正しい記述です。",
      "q53_51": "【正解】（2）\n(1)○・(3)○・(4)○：メイポールカールはストランドカールの一種で、ステム角度が0度に近いフラットなカールです。\n(2)×（誤り）：メイポールカールは根元から毛先に向かってスパイラル状に巻くため、毛先のウェーブ幅が広く、「根元の弾力は弱い」のが特徴です（根元に強いカールが現れるのはスカルプチュアカール等です）。",
      "q53_52": "【正解】（3）\nカールウェーブの構成比率では、ベースをとるためのスライス線はウェーブ幅の【A：1/2】、ループ（サークル）の直径はウェーブ幅の【B：2/3】、カールスペースはウェーブ幅の【C：1/3】となります。",
      "q53_53": "【正解】（4）\n色彩の補色（反対色）の原理により、黄色の補色は「紫（バイオレット）」です。そのため、黄色系に退色して明るくなり過ぎた毛髪の黄みを打ち消してナチュラルな色に近づけるには、（4）「紫系のヘアカラー」を用います。",
      "q53_54": "【正解】（4）\n(1)×：刺激性接触皮膚炎は初回の施術でも発症することがあります。\n(2)×：過去に発症しなかった物質でも、感作が成立したり体調により新たにかぶれることがあります。\n(3)×：アレルギー性接触皮膚炎（IV型遅延型アレルギー）は施術から24〜48時間後など遅れて現れることが多いです。\n(4)○：刺激性の接触皮膚炎は、グルーやテープが触れた片側の目元だけに発症すること（片側性）があります。",
