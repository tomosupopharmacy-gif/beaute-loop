      "q53_55": "【正解】（3）\n(1)×：掛下帯は花嫁衣装（打掛の下の振袖）に締める帯であり、普段着の紬には名古屋帯や半幅帯などを合わせます。\n(2)×：準礼装の訪問着には袋帯を合わせます（兵児帯は浴衣や子ども・男性の略帯です）。\n(3)○：浴衣には半幅帯（または兵児帯）を合わせるのが正しい組合せです。\n(4)×：第一礼装の黒留袖には格調高い袋帯や丸帯を合わせます（角帯は男性用の帯です）。",
      "q52_01": "【正解】（3）\n(1)○：美容師免許申請書には精神の機能の障害に関する医師の診断書を添付します。\n(2)○：氏名変更時は30日以内に美容師名簿の訂正申請が必要です。\n(3)×（誤り）：免許証を紛失したときの再交付申請先は、都道府県知事ではなく「厚生労働大臣（指定登録機関：理容師美容師試験研修センター）」です。\n(4)○：業務停止処分時は処分を行った都道府県知事等に速やかに免許証を提出します。",
      "q52_02": "【正解】（3）\n(1)○：美容所の開設には事前の届出が必要です。\n(2)○：管理美容師を置く美容所の開設届には管理美容師の氏名・住所を記載します。\n(3)×（誤り）：美容所の開設届に添付する医師の診断書は「結核、伝染性皮膚疾患等の有無に関する診断書」であり、精神の機能の障害に関する診断書ではありません。\n(4)○：虚偽の届出には30万円以下の罰金が科されることがあります。",
      "q52_03": "【正解】（1）\n(2)美容所の名称変更、(3)美容師以外の従業者の採用、(4)美容師の退職はいずれも開設届出事項の変更にあたるため速やかに届出が必要ですが、（1）「美容所の定休日（や営業時間・料金）の変更」は法定の開設届出事項ではないため届出は不要です。",
      "q52_04": "【正解】（4）\n(1)×：出張美容を行う際も美容所と同様に衛生上必要な措置を講じなければなりません。\n(2)×：美容所に所属していないフリーランスの美容師であっても、法定の要件を満たせば出張美容を行えます。\n(3)×：出張美容が認められる場合は、美容師法施行令（政令）だけでなく「都道府県等の条例」でも定められています。\n(4)○：家族の育児や介護を行っており、家を離れると育児・介護が困難になる者に対しても出張美容が認められています。",
      "q52_05": "【正解】（2）\n美容師が伝染性の疾病にかかり就業が公衆衛生上不適当なときは【A：業務停止処分】となることがあります。この業務停止処分に違反して業を行った美容師は【B：免許取消処分】となることがあり、また業務停止処分中の美容師を従事させた開設者は【C：美容所の閉鎖処分】となることがあります。",
      "q52_06": "【正解】（4）\na○：管理美容師の設置義務違反は美容所の閉鎖処分の対象となります。\nb×・c×：検査確認前の使用や変更届出義務違反は「30万円以下の罰金」の対象であり、閉鎖処分の対象事由ではありません。\nd○：従事する美容師が衛生上必要な措置を講じなかった場合は、美容所の閉鎖処分の対象となります。\nよって正しい組合せは aとd の（4）です。",
      "q52_07": "【正解】（4）\na○：生活衛生同業組合は同業者の自主的活動を促進するために設立されています。\nb×：生活衛生同業組合は業種ごとに「1つの都道府県に1つ」しか設立できません。\nc×：料金等を制限する適正化規程は現在すべて廃止されており、認可されている都道府県はありません。\nd○：組合員に対する営業施設の整備改善資金のあっせん等を行うことができます。\nよって正しい組合せは aとd の（4）です。",
      "q52_08": "【正解】（2）\na×：給与から天引きした源泉所得税は1年分一括ではなく、原則として「翌月10日まで」に毎月納付します（特例承認時でも年2回）。\nb○：法人税や個人の所得税は利益（所得）が出ているときに納める税金です。\nc○：個人事業主の所得税の確定申告は、原則として毎年2月16日〜3月15日までに行います。\nd×：固定資産税は土地だけでなく「建物（家屋）や償却資産」にも課税されます。\nよって正しい組合せは bとc の（2）です。",
      "q52_09": "【正解】（1）\na○：雇用契約締結時には契約期間・賃金・労働時間等の労働条件を書面等で明示する義務があります。\nb○：原則として毎週少なくとも1日の休日（または4週4日以上）を与えなければなりません。\nc×：パートタイム労働者であっても、所定労働日数等の要件を満たせば年次有給休暇を与えなければなりません。\nd×：常時使用する労働者に対する定期健康診断は2年に1回ではなく「1年以内ごとに1回」実施しなければなりません。\nよって正しい組合せは aとb の（1）です。",
      "q52_10": "【正解】（3）\n(1)○：国内居住の20歳以上60歳未満の自営業者・学生は国民年金の第1号被保険者となります。\n(2)○：厚生年金に加入する会社員等は国民年金の第2号被保険者として同時に国民年金にも加入しています。\n(3)×（誤り）：老齢基礎年金の給付額は、保険料を納付した期間（40年＝480月で満額）に応じて決まるため、期間にかかわらず同額ではありません。\n(4)○：遺族基礎年金の受給には一定の保険料納付要件が必要です。",
      "q52_11": "【正解】（1）\n(1)○：保健所は地域における公衆衛生の第一線機関です。\n(2)×・(3)×：エイズの予防や美容所等の環境衛生監視は保健所の重要な事業です。\n(4)×：都道府県だけでなく、政令指定都市・中核市・その他の政令市・特別区も保健所を設置できます。",
      "q52_12": "【正解】（2）\n高齢化が進む日本では、高齢者の死亡が増えるため人口当たりの全死亡数である【A：粗死亡率】は上昇傾向にありますが、集団間の【B：年齢構成】の違いを補正して比較するために用いられる【C：年齢調整死亡率】は医療や公衆衛生の向上により低下傾向にあります。",
      "q52_13": "【正解】（2）\n(1)○：1981年（昭和56年）以降、日本の死因第1位は悪性新生物（がん）です。\n(2)×（誤り）：1993年以降、男性のがんの部位別粗死亡率の第1位は胃がんではなく「肺がん」です。\n(3)○・(4)○：喫煙や多量の飲酒ががんのリスクを高めることは正しい記述です。",
      "q52_14": "【正解】（1）\n環境基本法に基づき大気の汚染に係る環境基準が定められている物質は、（1）「一酸化炭素」（ほか二酸化硫黄、二酸化窒素、浮遊粒子状物質、光化学オキシダント、PM2.5など）です。ヘリウム・塩化水素・メタンには大気環境基準は定められていません。",
      "q52_15": "【正解】（4）\n(1)○・(2)○・(3)○：体感温度、美容所の望ましい温度（17〜28℃）、相対湿度の定義はいずれも正しい記述です。\n(4)×（誤り）：『理容所及び美容所における衛生管理要領』では、美容所の相対湿度は35%以下ではなく「40〜70%」が望ましいとされています。",
      "q52_16": "【正解】（2）\n(1)○・(3)○・(4)○：細菌の細胞膜、芽胞の耐熱・耐乾燥性、鞭毛の運動性は正しい記述です。\n(2)×（誤り）：細菌の核（核様体）の本体として遺伝情報を担っているのはRNAではなく「DNA（デオキシリボ核酸）」です（細菌はDNAとRNAの両方を持ちますが、遺伝子の本体はDNAです）。",
      "q52_17": "【正解】（4）\n(1)○：A型肝炎は汚染された飲食物を介して経口感染します。\n(2)○：破傷風は土壌中の菌が傷口から入って感染します。\n(3)○：デング熱は蚊を介して感染します。\n(4)×（誤り）：日本脳炎は飛沫感染ではなく、ウイルスを持つ「蚊（コガタアカイエカ）」に刺されることで感染します。",
      "q52_18": "【正解】（4）\n(1)○・(2)○・(3)○：結核の飛沫核感染（空気感染）、胸部エックス線検査での発見、美容師の就業制限対象であることは正しい記述です。\n(4)×（誤り）：BCGワクチンの定期予防接種は、7歳以上ではなく「生後1歳に至るまでの間（標準的には生後5〜8か月未満）の乳児」を対象に行われています。",
      "q52_19": "【正解】（1）\n(1)×（誤り）：インフルエンザウイルスはヒトだけでなく、トリやブタ、ウマなどの動物にも感染します。\n(2)○・(3)○・(4)○：飛沫・接触感染、季節性インフルエンザ、新型インフルエンザのパンデミック（世界的大流行）の危険性はいずれも正しい記述です。",
      "q52_20": "【正解】（1）\n(1)×（誤り）：日本の梅毒の報告患者数は2010年以降減少しておらず、むしろ「急増傾向」にあります。\n(2)○・(3)○・(4)○：胎盤を介した母子感染（先天梅毒）、放置した場合の進行性全身症状、病原体が梅毒トレポネーマ（スピロヘータの一種）であることは正しい記述です。",
      "q52_21": "【正解】（2）\n病原微生物を殺すか除去して感染力をなくすことを【A：消毒】といい、あらゆる微生物（芽胞を含む）を完全に殺滅・除去して無菌状態にすることを【B：滅菌】といい、微生物を殺すことの総称を【C：殺菌】といいます。",
      "q52_22": "【正解】（3）\n(1)○・(2)○・(4)○：血液が付着していないくしの次亜塩素酸ナトリウム浸漬、はさみの紫外線照射、ブラシの逆性石けん浸漬はすべて正しい法定消毒法です。\n(3)×（誤り）：「かみそり」は血液付着の有無にかかわらず、消毒用エタノールで消毒する場合は「10分間以上浸す（浸漬）」必要があり、綿やガーゼで拭く（清拭）方法は認められていません。",
      "q52_23": "【正解】（3）\n(1)○：薬液消毒の殺菌効果の3要素は「温度・濃度・時間」です。\n(2)○：蒸気消毒（10分以上）は煮沸消毒（2分以上）より時間がかかります。\n(3)×（誤り）：薬液消毒は低温になると化学反応が遅くなり殺菌効果が落ちるため、低温より「適度な高温（20℃以上など）」で行ったほうが作用時間は短くてすみます。\n(4)○：乾熱は湿熱より熱が伝わりにくいため時間がかかります。",
      "q52_24": "【正解】（1）\na○：消毒用エタノールは揮発性が強く引火性があります。\nb○：結核菌や一般細菌、エンベロープを持つウイルスに効力があります。\nc×：逆性石けんと併用しても効力は低下しません。\nd×：消毒用エタノールは細菌の「芽胞」には効力がありません。\nよって正しい組合せは aとb の（1）です。",
      "q52_25": "【正解】（2）\n(1)○：10%液5mL＋水495mL（全量500mL＝100倍希釈）は 10% ÷ 100 ＝ 0.1%水溶液となり正しいです。\n(2)×（誤り）：5%グルコン酸クロルヘキシジン2mL＋水498mL（全量500mL＝250倍希釈）の濃度は、5% ÷ 250 ＝「0.02%」水溶液となり、法定基準の0.05%にはなりません（0.05%を500mL作るには5%原液5mL＋水495mLが必要です）。\n(3)○：6%液2mL＋水598mL（全量600mL＝300倍希釈）は 6% ÷ 300 ＝ 0.02%となり正しいです。\n(4)○：10%液10mL＋水990mL（全量1000mL＝100倍希釈）は 0.1%となり正しいです。",
      "q52_26": "【正解】（3）\n内眼角（目頭）の内側にある赤みを帯びた小さな高まりを【A：涙丘（るいきゅう）】といいます。その上下の眼瞼縁には【B：涙点（るいてん）】という小さな孔があり、眼の表面を潤した余分な涙は涙点から涙小管・涙嚢を経て【C：鼻涙管（びるいかん）】に入り、鼻腔へと排出されます。",
      "q52_27": "【正解】（4）\n骨の内部（髄腔や海綿質のすき間）を満たしている（4）「骨髄（特に赤色骨髄）」には造血幹細胞があり、赤血球・白血球・血小板をつくる造血作用があります。",
      "q52_28": "【正解】（3）\n唇の周囲を輪状に取り囲み、口を閉じたり唇を前方に尖らせたりする働きをする表情筋は（3）「口輪筋」です。（1）オトガイ筋は下唇を押し上げオトガイに梅干し状のしわを作る筋、（2）口角挙筋は口角を上げる筋、（4）頬筋は頬を歯列に押し付ける筋です。",
      "q52_29": "【正解】（4）\n(1)×：交感神経の活動が高まると気管支は「拡張」します。\n(2)×：副交感神経の活動が高まると心拍数は「減少」します。\n(3)×：交感神経の活動が低下（副交感神経優位）すると消化器の血管は「拡張」して血流が増えます。\n(4)○：副交感神経は瞳孔を縮小させるため、その活動が低下（交感神経が優位）すると瞳孔は「散大」します。",
      "q52_30": "【正解】（2）\n全身の組織からリンパ液を集めたリンパ管（胸管および右リンパ本幹）は、最終的に鎖骨下付近で（2）「静脈（内頸静脈と鎖骨下静脈の合流部＝静脈角）」に合流して血液循環に戻ります。",
      "q52_31": "【正解】（1）\n（2）色素細胞（メラノサイト）、（3）角化細胞（ケラチノサイト）、（4）ランゲルハンス細胞はいずれも「表皮」に含まれる細胞ですが、（1）「線維芽細胞」はコラーゲンやエラスチンを産生する「真皮」の細胞であり、表皮には含まれません。",
      "q52_32": "【正解】（2）\n(1)○・(3)○・(4)○：毛母での細胞分裂、口唇等の独立脂腺、手掌・足底には脂腺がなくエクリン腺が多いことはすべて正しい記述です。\n(2)×（誤り）：眉毛、まつ毛（睫毛）、鼻毛、耳毛などの毛包には立毛筋が付いていないため、すべての毛包に立毛筋が付いているわけではありません。",
      "q52_33": "【正解】（3）\n(1)○：脂肪膜とケラチンは酸やアルカリ等の化学的刺激から保護します。\n(2)○：脂肪膜中の脂肪酸は弱酸性を保ち微生物の増殖を抑えます。\n(3)×（誤り）：紫外線から基底細胞の核を保護する作用があるのは、組織球ではなく色素細胞がつくる「メラニン（メラニン顆粒）」です（組織球＝マクロファージは真皮で異物を貪食する免疫細胞です）。\n(4)○：真皮の膠原線維や弾性線維は機械的外力から保護します。",
      "q52_34": "【正解】（3）\n(1)○・(2)○・(4)○：洗浄後の保湿、40℃前後の入浴、紫外線吸収剤による接触皮膚炎の可能性は正しい記述です。\n(3)×（誤り）：急激な作用で皮膚に赤い炎症（サンバーン＝日光紅斑）を起こすのはUVAではなく、エネルギーの強い中波長紫外線「UVB」です。",
      "q52_35": "【正解】（4）\n(1)○・(2)○・(3)○：一次刺激性接触皮膚炎の濃度依存性、アレルギー性接触皮膚炎の交差・同一抗原反応、パッチテストの有効性は正しい記述です。\n(4)×（誤り）：ラテックスアレルギーは合成ゴムではなく「天然ゴム（ラテックス）」に含まれるタンパク質によって起こる即時型アレルギーです（対策としてニトリル等の合成ゴムやプラスチック手袋を使用します）。",
      "q52_36": "【正解】（1）\na○：ロウ類は高級アルコールと高級脂肪酸のエステルです。\nb○：高級アルコールは炭素数の多い（一般に6以上、香粧品では12〜22程度）アルコールです。\nc×：炭化水素には石油由来（ワセリン等）だけでなく、深海ザメの肝油やオリーブ油など動植物から得られるスクワランもあります。\nd×：シリコーン油はケイ素（Si）と酸素のシロキサン結合を骨格とする合成油であり、炭素と水素のみからなる炭化水素ではありません。\nよって正しい組合せは aとb の（1）です。",
      "q52_37": "【正解】（3）\n(1)×：石けんは「陰イオン（アニオン）界面活性剤」です。\n(2)×：レシチンは「両性界面活性剤」です。\n(3)○：第四級アンモニウム塩（陽イオン界面活性剤）は毛髪に吸着して静電気を防ぐ帯電防止効果や柔軟効果に優れています。\n(4)×：陰イオン界面活性剤は泡立ちと洗浄力に優れています。",
      "q52_38": "【正解】（4）\n(1)○：パラアミノ安息香酸エステルは紫外線吸収剤です。\n(2)○：パラベンは防腐剤です。\n(3)○：パラフェノールスルホン酸亜鉛は皮膚を引き締める収れん剤です。\n(4)×（誤り）：パラフェニレンジアミンは酸化染毛剤第1剤に配合される「酸化染料（染料中間体）」であり、酸化剤ではありません（酸化剤は過酸化水素水などです）。",
      "q52_39": "【正解】（3）\n二浴式パーマ剤において、（1）過酸化水素水は酸化剤として第2剤に、（2）炭酸水素アンモニウムと（4）モノエタノールアミンはアルカリ剤、システインは還元剤として第1剤に配合されます。（3）「A：臭素酸ナトリウム ― B：酸化剤 ― C：第2剤」が正しい組合せです。",
      "q52_40": "【正解】（4）\n(1)×：酸性染料は水に溶かすと「マイナス（陰イオン）」の電気を帯びます。\n(2)×：ヘアマニキュアは一時染毛料ではなく「半永久染毛料（酸性染毛料）」に分類されます。\n(3)×：パラフェニレンジアミンは分子量が小さい「低分子」の染料中間体であるため毛髪内部へ浸透し、酸化重合して高分子の色素になります。\n(4)○：脱色剤（ヘアブリーチ）は毛髪内部のメラニン色素を酸化して分解します。",
      "q52_41": "【正解】（2）\n1960年代後半にアメリカのベトナム反戦運動や自然回帰のヒッピー運動から生まれたヒッピーファッションは、長髪にバンダナやヘアバンド、ベルボトムジーンズやエスニック調の服を着た（2）です。（1）はミニスカート、（3）は1950年代のマンボズボン、（4）は1980年代のボディコンです。",
      "q52_42": "【正解】（3）\n(1)○：セシールカットは映画『悲しみよこんにちは』から流行したベリーショートです。\n(2)○：ウルフカットは襟足を長めに残しレイヤーを入れたスタイルです。\n(3)×（誤り）：ソバージュは毛先だけでなく「根元近くから毛先まで髪全体に細かいウェーブ」をつけた髪型です。\n(4)○：聖子ちゃんカットは1980年代に大流行したレイヤードブローヘアです。",
      "q52_43": "【正解】（4）\n(1)○・(2)○・(3)○：花嫁衣装のお引きずり（引き裾）、丸帯の文庫結びと丸ぐけ帯締め、文金高島田とべっこう等の簪・櫛は正しい記述です。\n(4)×（誤り）：「筥迫（はこせこ）」は胸元（懐）に差し込む箱形の装身具（今でいう化粧ポーチ）であり、扇子ではありません。慶事用の扇子の別名は「末広（すえひろ）」です。",
      "q52_44": "【正解】（3）\n(1)×：前頭部の生え際と正中線の交点は「フロントポイント（センターフォアヘッドポイント）」です。\n(2)×：耳のつけ根の上の部分は「イヤポイント」です。\n(3)○：頭部の生え際全体を「ヘアライン」といいます。\n(4)×：ヘムラインとはネープラインなどカットした髪の裾まわり（アウトライン）の線を指します。",
      "q52_45": "【正解】（2）\n(1)○・(3)○・(4)○：剪断応力の利用、母指が動刃であること、交点での接触圧の均等性は正しい記述です。\n(2)×（誤り）：支点となる鋏要（ネジ）に「近い側（刃元）」は強い力が出る部分であり、力の調整がしやすく繊細な作業がしやすいのは鋏要から「遠い側（刃先）」です。",
      "q52_46": "【正解】（2）\n(1)は軽擦法（ストローキング／エフルラージュ）、（2）「指先が頭皮に触れる瞬間に力を入れてつまみ上げ、円を描くように揉んでいく」のが揉撚法（ペトリサージュ）、(3)は振動法（バイブレーション）、(4)は叩打法のカッピングです。",
      "q52_47": "【正解】（3）\n(1)○・(2)○・(4)○：黄金比、バランスの3分類、三つ編みのリズムはいずれも正しい記述です。\n(3)×（誤り）：青と黄、ストレートとウェーブのように異質な色や形をぶつけ合って際立たせることは、調和（ハーモニー）ではなく「対比（コントラスト）」といいます。",
      "q52_48": "【正解】（1）\n(1)○：パネルを中央に集めて（コンケーブに）シェープして切ると、両端の毛束ほど移動距離が長くなるため両端が長くなり、頭の丸みとは逆の（中が短く端が長い）カットラインになります。\n(2)×：パネルを右に集めて切ると、移動距離が長い「左側」の方が長いカットラインになります。\n(3)×：パネルの幅が「狭い」ほうが両端の移動距離の差が小さく、誤差が小さくなります。\n(4)×：パネルの長さが「長い」ほうが引き寄せ角度の差が緩やかになり、誤差が小さくなります。",
      "q52_49": "【正解】（4）\n(1)○・(2)○・(3)○：セニングの基本注意事項として正しい記述です。\n(4)×（誤り）：ワンレングススタイルに丸みを出しながら毛量調節する場合は、レイヤー状ではなく「グラデーション状（内側の毛を短く、表面側を長く残す）」にセニングを入れます（レイヤー状に入れると表面が短くなりフラットになります）。",
      "q52_50": "【正解】（3）\n(1)○・(2)○・(4)○：縮毛矯正ではパネルに貼り付けず、過度なテンションをかけず、第2剤の酸化不足を防ぐことが重要です。\n(3)×（誤り）：根元（頭皮付近）に第1剤が付着すると毛根の損傷や根元折れの原因になるため、頭皮から「1〜2cm程度あけて」塗布し、また新生部と既矯正部（毛先）のダメージ差に応じて塗り分けます（根元から毛先まで均一には塗布しません）。",
      "q52_51": "【正解】（4）\nストランドカールのベースの形のうち、三角形のベースである（4）「トライアンギュラーベース」は、カールのステムを斜めにオーバーラップ（重なり合わせ）させやすく、仕上がりの割れ目（パートライン）が目立ちにくい特徴があります。",
      "q52_52": "【正解】（4）\n(1)×：植物色素（ヘナ等）を有効成分とするのは非酸化染毛剤や着色料であり、酸化染毛剤は酸化染料を有効成分とします。\n(2)×：約2〜4週間色持ちするのは「半永久染毛料（ヘアマニキュア等）」です（酸化染毛剤は2〜3か月持続する永久染毛剤です）。\n(3)×：マスカラタイプやフェルトペンタイプがあるのは「一時染毛料」です。\n(4)○：酸化染毛剤は過酸化水素によるメラニンの脱色作用と酸化染料の発色を同時に行うため、黒髪を明るい色に染めることができます。",
      "q52_53": "【正解】（2）\n爪の図において、(1)はフリーエッジ（遊離縁）、（2）の爪の縦方向の湾曲（カーブ）が「アーチ」、(3)はイエローライン（ストレスポイント付近の境界）、(4)は爪半月（ルヌラ）を表しています。",
      "q52_54": "【正解】（4）\n(1)×：まつ毛の毛周期は3週間〜4か月程度で、頭髪の毛周期（2〜6年）に比べて非常に「短い」です。\n(2)×：施術後最低5〜6時間はグルーが完全硬化しておらず白化や劣化の原因となるため、洗顔や入浴・サウナ等の高温多湿環境は避けます。\n(3)×：アレルギーの有無だけでなく、目や目元の疾患・体調・コンタクトレンズの有無・生活習慣など幅広く確認します。\n(4)○：カウンセリングではメリットだけでなく、アレルギーやトラブル等のデメリット（リスク）についても正しく説明します。",
      "q52_55": "【正解】（1）\n日本髪の各部名称において、Aの頭頂部に結い上げた部分は「髷（まげ）」、Bの左右側面の張り出した部分は「鬢（びん）」、Cの後頭部下方の張り出した部分は「髱（たぼ／つと）」です。したがって（1）が正解です。",
      "q51_01": "【正解】（4）\n(1)○：美容師でなければ美容を業とすることはできません。\n(2)○：福利厚生目的であっても反復継続して行う場合は美容の「業」に該当します。\n(3)○：衛生上必要な措置は都道府県等の条例にも従う必要があります。\n(4)×（誤り）：美容所の「開設者（経営者）」は美容師免許を持っていなくてもなることができます（実際に施術を行う従業者が美容師である必要があります）。",
      "q51_02": "【正解】（3）\n(1)○：試験合格後、美容師名簿に登録されて初めて免許が与えられます。\n(2)○：無免許営業には30万円以下の罰金が科されることがあります。\n(3)×（誤り）：美容師の「住所」は美容師名簿の登録事項ではないため、住所地を変更しても名簿訂正の申請は不要です（訂正が必要なのは氏名と本籍地都道府県名です）。\n(4)○：業務停止処分時は処分を行った都道府県知事等に免許証を提出します。",
      "q51_03": "【正解】（3）\n(1)×：管理美容師の設置義務は美容師が「常時2人以上」いる場合であり、繁忙期に臨時に2人以上になる場合は不要です。\n(2)×：管理美容師の要件は「免許取得後3年以上美容の業務に従事し、都道府県知事が指定する講習会を修了した者」です（5年以上・厚生労働大臣指定ではありません）。\n(3)○：管理美容師を置く美容所の開設届には、管理美容師の氏名及び住所を記載しなければなりません。\n(4)×：管理美容師を置かなかった場合は「美容所の閉鎖命令（行政処分）」の対象であり、直接の罰金刑ではありません。",
      "q51_04": "【正解】（4）\na○：美容所を開設するときは営業開始前に都道府県知事等に開設届を提出します。\nb×：開設届出事項には美容師だけでなく「美容師以外の従業者の氏名」も含まれます。\nc×：届出事項に変更が生じたときは、30日以内ではなく「速やかに」届け出なければなりません。\nd○：構造設備の検査確認を受けずに美容所を使用したときは、30万円以下の罰金に処せられることがあります。\nよって正しい組合せは aとd の（4）です。",
      "q51_05": "【正解】（3）\n(1)×・(2)×：無免許者に業務を行わせたときや業務停止処分中の美容師に業務を行わせたときは、開設者に対する「美容所の閉鎖処分」の対象であり、そのこと自体による罰金刑の規定はありません。\n(3)○：開設者が美容師法に基づく衛生上必要な措置を講じなかったときは、美容所の「閉鎖処分（または期間を定めた閉鎖命令）」となることがあります。\n(4)×：変更の届出を怠ったときは「30万円以下の罰金」の対象であり、閉鎖処分ではありません。",
      "q51_06": "【正解】（1）\n【A：保健所】等に配置された環境衛生監視員は、美容所に立ち入って衛生措置の実施状況を調べる【B：立入検査】を行う権限を持っており、正当な理由なくこれを拒み、妨げ、または忌避した者は30万円以下の【C：罰金刑】に処せられることがあります。",
      "q51_07": "【正解】（2）\n(1)○・(3)○・(4)○：振興指針の内容、生活衛生営業指導センターの目的、標準営業約款登録店（Sマーク）の掲示はいずれも正しい記述です。\n(2)×（誤り）：生活衛生同業組合は同業者の互助・衛生水準向上のための「非営利法人」であり、営利を目的としてはいけません。",
      "q51_08": "【正解】（3）\n(1)×・(2)×：一時点の資産・負債（借金）・純資産の状況を示すのが「貸借対照表（B/S）」であり、一定期間の収益・費用・利益を示すのが「損益計算書（P/L）」です（説明が逆になっています）。\n(3)○：貸借対照表において、1年以内に返済期限が到来する借入金などは「流動負債」に分類されます（1年を超えるものは固定負債）。\n(4)×：個人営業の税務上の計算期間（課税期間）は「1月1日〜12月31日」と法律で決まっており、自由に決めることはできません。",
      "q51_09": "【正解】（1）\na○：健康保険の適用事業所に使用される75歳未満の者は、原則として健康保険の被保険者となります。\nb○：健康保険には産前産後休業期間中および育児休業期間中の保険料が労使とも免除される制度があります。\nc×：国民健康保険の運営主体（保険者）は国ではなく「都道府県及び市町村（特別区）」と「国民健康保険組合」です。\nd×：国民健康保険には傷病手当金や出産手当金が任意給付であるなど、健康保険と給付内容が全く同じではありません。\nよって正しい組合せは aとb の（1）です。",
      "q51_10": "【正解】（3）\na×：雇用保険は週所定労働時間20時間以上・31日以上雇用見込み等の要件を満たす者が被保険者となります（全員ではありません）。\nb×：自己都合退職でも、受給資格期間を満たせば（給付制限期間後に）基本手当が支給されます。\nc○：雇用保険には働く人の主体的な能力開発を支援する「教育訓練給付」があります。\nd○：雇用保険の保険料は事業主と被保険者（労働者）の双方が負担します。\nよって正しい組合せは cとd の（3）です。",
      "q51_11": "【正解】（1）\n(1)○：たばこの煙にはニコチン・タール・一酸化炭素をはじめ多種の発がん物質や発がん促進物質が含まれています。\n(2)×：妊婦の喫煙は早産や低出生体重児など胎児の発育に悪影響を及ぼします。\n(3)×：喫煙は虚血性心疾患（心筋梗塞・狭心症）の重大な危険因子です。\n(4)×：受動喫煙でも肺がんのリスクが高まることが証明されています。",
      "q51_12": "【正解】（2）\n（1）がん（悪性新生物）、（3）脳卒中（脳血管疾患）、（4）心臓病（虚血性心疾患）はいずれも食生活・運動・喫煙・飲酒などが関与する生活習慣病ですが、（2）「B型肝炎」はB型肝炎ウイルスの感染によって起こるウイルス性感染症であり、生活習慣病ではありません。",
      "q51_13": "【正解】（4）\n(1)○・(2)○・(3)○：心の健康とQOL、うつ病の早期発見・治療、休養とストレス管理の重要性はいずれも正しい記述です。\n(4)×（誤り）：日本の自殺死亡率は1958年以降一貫して上昇し続けているわけではなく、1960年代に低下し、1998年に急増した後、2010年代以降は減少傾向に転じるなど増減しています。",
      "q51_14": "【正解】（3）\n(1)○・(2)○・(4)○：浮遊粒子状物質の健康影響、環境基準の設定、PM2.5（粒径2.5μm以下）の定義は正しい記述です。\n(3)×（誤り）：浮遊粒子状物質（SPM）とは、大気中に浮遊する粒子状物質のうち粒径が1ミリメートル（1000μm）以下ではなく「10マイクロメートル（10μm＝0.01mm）以下」のものをいいます。",
      "q51_15": "【正解】（4）\n(1)○・(2)○・(3)○：自然換気、在室者による空気汚染、燃焼器具による二酸化炭素発生はいずれも正しい記述です。\n(4)×（誤り）：『理容所及び美容所における衛生管理要領』では、作業場内の二酸化炭素濃度は100ppm以下ではなく「5,000ppm（0.5%）以下」（建築物衛生法では1,000ppm＝0.1%以下）とされています。外気中ですら約400ppmあるため100ppm以下は不可能です。",
      "q51_16": "【正解】（3）\n酸素があると発育できない細菌を「偏性嫌気性菌」といいます。（3）「破傷風菌」（やボツリヌス菌など）は偏性嫌気性菌であり、酸素のない土壌深部や深い傷口の奥で増殖します。（1）百日せき菌や（2）結核菌は酸素を必要とする好気性菌、（4）大腸菌は通性嫌気性菌です。",
      "q51_17": "【正解】（4）\n予防接種法に基づく定期予防接種の対象疾病（A類疾病）に含まれているのは、a「風しん」とd「結核（BCG）」です。b「A型肝炎」は任意接種、c「デング熱」は国内定期接種の対象ではありません。よって aとd の（4）が正解です。",
      "q51_18": "【正解】（4）\n空気感染（飛沫核感染）する代表的な感染症は「結核・麻しん（はしか）・水痘（みずぼうそう）」の3つです。したがって（4）「水痘」が正解です。（1）日本脳炎は蚊媒介、（2）破傷風は土壌からの創傷感染、（3）コレラは経口感染です。",
      "q51_19": "【正解】（1）\n(1)×（誤り）：デング熱は飛沫感染ではなく、ウイルスを保有する「蚊（ネッタイシマカ・ヒトスジシマカ）」が媒介して感染します。\n(2)○：マラリアはハマダラカ（蚊）が媒介します。\n(3)○：エイズ（HIV）は血液や体液を介して感染します。\n(4)○：A型肝炎は汚染された飲食物を介して経口感染します。",
      "q51_20": "【正解】（1）\na○：風しんの病原体は風しんウイルスです。\nb○：主な症状は発熱、全身の小紅斑（発疹）、耳の後ろや首のリンパ節の腫れです。\nc×：風しんの潜伏期は2〜3日ではなく「約14〜21日（2〜3週間）」です。\nd×：妊娠初期の女性が風しんに罹患すると、胎児に難聴・白内障・先天性心疾患などを起こす「先天性風しん症候群」の危険があります。\nよって正しい組合せは aとb の（1）です。",
      "q51_21": "【正解】（4）\na○：血液の付着したはさみを消毒用エタノールに10分間以上浸すのは正しい法定消毒法です。\nb×：血液の付着した器具に逆性石けんは使用できません。\nc×：次亜塩素酸ナトリウムの0.01%水溶液は血液が付着していない器具の基準ですが、かみそり等の血液付着リスクや選択肢対比上、aとd（紫外線85μW/cm²以上・20分以上照射）が確実な正答組合せとなります（※なおcも血液付着なしなら規則上可能ですが、公式の組合せ選択肢ではaとdの(4)が正解です）。",
      "q51_22": "【正解】（1）\n(1)×（誤り）：消毒用エタノールは一般細菌や結核菌には有効ですが、細菌の「芽胞」には効力がありません。\n(2)○：両性界面活性剤は結核菌に効力があります。\n(3)○：次亜塩素酸ナトリウムはエンベロープを持たないノロウイルスにも効力があります。\n(4)○：逆性石けんは黄色ブドウ球菌などの一般細菌に効力があります。",
      "q51_23": "【正解】（2）\n(1)○：紫外線（波長253.7nm付近）は微生物のDNAに作用して殺菌します。\n(2)×（誤り）：紫外線は透過力が極めて弱いため、器具の表面に油膜やゴミなどの汚れが付着していると紫外線が遮られ、消毒効果は著しく減弱します。\n(3)○：煮沸消毒は水が沸騰してから2分間以上計測します。\n(4)○：蒸気消毒は煮沸消毒より長い時間（10分以上）を要します。",
      "q51_24": "【正解】（2）\na×：両性界面活性剤も有機物の汚れが多量にあると消毒効果は低下します。\nb○：エタノールは揮発性が強く濃度が低下しやすいため密栓して保存します。\nc○：次亜塩素酸ナトリウムは日光や熱で分解するため冷暗所で保存します。\nd×：逆性石けん（陽イオン）は普通の石けん（陰イオン）と併用すると消毒効果が失われます。\nよって正しい組合せは bとc の（2）です。",
      "q51_25": "【正解】（4）\n(1)×：10%液20mL＋水980mL（全量1000mL）は 10% × 20 ÷ 1000 ＝ 0.2%になります（0.1%にするには10mL＋水990mL）。\n(2)×：同じく10%逆性石けん20mL＋水980mLは 0.2%水溶液になります。\n(3)×：5%次亜塩素酸ナトリウム10mL＋水990mL（全量1000mL）は 5% × 10 ÷ 1000 ＝ 0.05%になります（0.1%にするには20mL＋水980mL）。\n(4)○：5%グルコン酸クロルヘキシジン10mL＋水990mL（全量1000mL＝100倍希釈）は 5% ÷ 100 ＝ 0.05%水溶液となり正しい記述です。",
      "q51_26": "【正解】（2）\n(1)○・(3)○・(4)○：睫毛（まつ毛）の配列、上眼瞼の方が長いこと、内側に皮脂腺の一種であるマイボーム腺（瞼板腺）が開口していることは正しい記述です。\n(2)×（誤り）：まつ毛の本数は、下眼瞼（約50〜75本）よりも「上眼瞼（約100〜150本）」の方が多くなっています。",
      "q51_27": "【正解】（1）\n（2）上肢、（3）下肢、（4）舌の筋肉はいずれも自分の意思で動かせる「骨格筋（横紋筋・随意筋）」ですが、（1）「心臓」の壁をつくる心筋は、横紋筋でありながら自分の意思では動かせない「不随意筋」です。",
      "q51_28": "【正解】（3）\n瞳孔散大筋に働いて瞳孔を開く（散大させる）のは自律神経のうちの（3）「交感神経」です（逆に瞳孔括約筋に働いて瞳孔を縮めるのは副交感神経です）。",
      "q51_29": "【正解】（2）\n内耳にある平衡感覚器のうち、頭や体の「回転運動（回転加速度）」を感知するのは互いに直角に配置された3つの管からなる（2）「半規管（三半規管）」です。（3）球形嚢と（4）卵形嚢（前庭）は体の傾きや直線加速度を感知し、（1）蝸牛は聴覚器です。",
      "q51_30": "【正解】（3）\n空気の通り道である「気道」は、鼻腔・口腔 → 咽頭 → 喉頭 → 気管 → 気管支の順に肺へと続きます。（3）「食道」は咽頭から胃へ食物を送る「消化管」であり、気道には含まれません。",
      "q51_31": "【正解】（1）\n(1)○：頭部の皮膚（頭皮）は太い頭毛を養うため血管が多く、脂腺も非常に多く分布しています。\n(2)×：顔の皮膚は部位によって厚さが異なり、眼瞼（まぶた）などは極めて薄く、鼻や唇周囲は厚めです。\n(3)×：手掌（手のひら）や足底の角質層は全身で最も「厚い」部位です。\n(4)×：体幹の皮膚は腹側よりも「背側」のほうが厚くなっています。",
      "q51_32": "【正解】（1）\n(1)×（誤り）：毛の生える方向である「毛流」は、皮膚の線維の走行方向である「皮膚の割線とほぼ一致する（平行な）方向」に流れています（直角ではありません）。\n(2)○・(3)○・(4)○：毛幹と毛根、毛周期（成長期・退行期・休止期）、立毛筋（平滑筋・交感神経支配）の説明はいずれも正しい記述です。",
      "q51_33": "【正解】（4）\n皮膚の感覚点（1cm²あたりの平均分布数）は、危険から身を守る【A：痛点】（約100〜200個）が最も多く、次いで触点（圧点：約25個）、冷点（約6〜12個）の順であり、最も数が少ないのは【B：温点】（約1〜2個）です。",
      "q51_34": "【正解】（4）\n(1)×：皮脂分泌が過剰な脂性肌では、皮膚（角質層）は厚くキメが粗くなっています（皮膚が薄いのは乾燥肌です）。\n(2)×：皮膚や脂腺・毛などの付属器官は性ホルモンや副腎皮質ホルモンなどの影響を強く受けます。\n(3)×：健康な肌では、真皮（約70〜80%の水分量）よりも角質層表面（約15〜20%の水分量）の方が水分量は少なくなっています。\n(4)○：加齢や紫外線（光老化）により真皮のコラーゲンやエラスチンが変性・減少すると、皮膚の張りと弾力が失われてたるみやしわとなります。",
      "q51_35": "【正解】（3）\n(1)○：男性ホルモンは皮脂分泌を促しニキビ（尋常性痤瘡）の発生要因となります。\n(2)○：腋臭症（ワキガ）は思春期にアポクリン腺の分泌が活発になることで発症します。\n(3)×（誤り）：小児の顔面などに白い粉をふいたような斑ができる「顔面単純性粃糠疹（はたけ）」は、乾燥や軽い湿疹変化によるものであり、白癬菌（カビ）が原因ではありません。\n(4)○：疥癬はヒゼンダニの寄生によって起こります。",
      "q51_36": "【正解】（3）\n(1)×：溶液において溶けている物質は「溶質」といい、それを溶かしている液体を「溶媒」といいます。\n(2)×：有機化合物とは「炭素（C）原子」を骨格として含む化合物の総称です（窒素ではありません）。\n(3)○：水分子（H₂O）において酸素原子側がわずかにマイナス、水素原子側がわずかにプラスに帯電している電気の偏りを「極性」といいます。\n(4)×：水溶液中で水素イオン（H⁺）濃度が高い状態は「酸性」といいます（水酸化物イオンOH⁻が多い状態が塩基性＝アルカリ性です）。",
      "q51_37": "【正解】（1）\n(1)○：アミノ変性シリコーンは傷んだ毛髪への吸着性（親和性）が高く、優れたコンディショニング効果を発揮します。\n(2)×：カルナウバロウはカルナウバヤシの葉から得られる「植物性ロウ」です（羊の毛からとれる動物性ロウはラノリンです）。\n(3)×：スクワランは炭素と水素のみからなる「炭化水素」です（油脂ではありません）。\n(4)×：常温で固体の油脂を「脂肪（脂）」、常温で液体の油脂を「脂肪油（油）」というため、脂肪油の方が流動性が高いです。",
      "q51_38": "【正解】（3）\na×：界面活性剤が臨界ミセル濃度以上で親水基を外側に向けて集合したものはイオンではなく「ミセル」といいます。\nb×：可溶化とは、本来「水に溶けにくい（不溶・難溶性の）少量の油溶性物質」をミセル内部に取り込んで透明に溶かす作用をいいます。\nc○：水と油が乳化して得られた白濁液をエマルション（エマルジョン：乳濁液）といいます。\nd○：液体中に固体の粉体粒子が均一に安定して混ざっている状態を「分散」といいます。\nよって正しい組合せは cとd の（3）です。",
      "q51_39": "【正解】（2）\n(1)○：パラベンは防腐剤です。\n(2)×（誤り）：パラアミノ安息香酸エステルはキレート剤ではなく「紫外線吸収剤」です（キレート剤はエデト酸塩＝EDTAなどです）。\n(3)○：PVPはセット料等の皮膜形成剤です。\n(4)○：BHTは酸化防止剤です。",
      "q51_40": "【正解】（2）\n(1)○：過酸化水素水は染料中間体を酸化重合させます。\n(2)×（誤り）：「ニトロパラフェニレンジアミン」は酸化重合しなくても最初から赤橙色などの色を持っている「直接染料」であり、無色ではありません（無色なのは酸化染料であるパラフェニレンジアミン等です）。\n(3)○：レゾルシンは調色剤（カップラー）として発色の色調を変えます。\n(4)○：アンモニア水はアルカリ剤として液性をアルカリ性にします。",
      "q51_41": "【正解】（2）\n(1)○・(3)○・(4)○：明治18年の婦人束髪会、日露戦争期の二百三高地髷、まがれいとによるリボンの流行はいずれも正しい記述です。\n(2)×（誤り）：「銀杏返し（いちょうがえし）」は西洋束髪ではなく、江戸末期から明治にかけて結われた伝統的な「日本髪」です（代表的な束髪はイギリス結び・まがれいと・夜会巻きなどです）。",
      "q51_42": "【正解】（4）\n(1)○・(2)○・(3)○：銀座のみゆき族（1964年）、男性服のピーコック革命、クレージュのミニスカート発表はいずれも1960年代の出来事です。\n(4)×（非該当）：高田賢三（ケンゾー）のフォークルック（フォークロアファッション）がパリや日本で流行したのは「1970年代」です。",
      "q51_43": "【正解】（1）\n（2）黒留袖、（3）色留袖（五つ紋）、（4）本振袖はいずれも女性の「第一礼装（正礼装）」ですが、（1）「訪問着（一つ紋または三つ紋・無紋）」は未婚・既婚を問わず着用できる「準礼装（略礼装）」です。",
      "q51_44": "【正解】（4）\n顔面の図において、Aの目の下外側の張り出した部分は「頬骨部」、Bの鼻の下から上唇中央にある縦の溝は「人中（じんちゅう）」、Cの下唇とオトガイ（あご先）の間の横のくぼみは「オトガイ唇溝」です。したがって（4）が正解です。",
      "q51_45": "【正解】（3）\nスキャルプトリートメントにおいて、(1)ブラッシングや(4)マッサージは「器械的（機械的）方法」、(2)スチームタオルや遠赤外線の利用は「物理的方法」に分類され、薬剤の成分作用を利用する（3）「ヘアトニックやスキャルプトリートメント剤などを使用する」方法が「化学的な方法」に該当します。",
      "q51_46": "【正解】（1）\nデザインの原理における「リズム（律動）」は、同じ形や線の周期的な反復（繰り返し）や規則的な変化によって生まれます。したがって（1）「三つ編みを取り入れ、周期的なパターンをつくる」がリズムを感じるスタイルです。（2）はコントラスト（対比）、（3）・（4）はアシンメトリーバランスです。",
      "q51_47": "【正解】（3）\n(1)×：すべてのパネルをオンベース（頭皮に対して90度）で引き出して同じ長さに切ると、頭の形に沿った「セイムレングス」のシルエットになります。\n(2)×：毛髪が自然に落ちる位置（0度）で同一線上に切ると、上層が一番長い「ワンレングス」のシルエットになります。\n(3)○：ダウンステムでシェープしてカットしたグラデーションスタイルでは、最も長い表面の毛髪が重なる部分がボリュームの頂点（ウェイトポイント）になります。\n(4)×：アップステムで切ると上層が短く下層が長い「レイヤー」スタイルになります。",
      "q51_48": "【正解】（4）\nレザーによるテーパーカットを深さで分類すると、毛先から「1/3ほど」を削ぐ技法が（4）「ノーマルテーパーカット」です。（1）の根元近く（毛束の2/3程度）から削ぐのは「ディープテーパーカット」、（3）の毛先のみを削ぐのは「エンドテーパーカット」、（2）の間引く技法は「セニングカット」です。",
      "q51_49": "【正解】（1）\n(1)×（誤り）：パーマ施術前のプレシャンプーにオイル分（油分）の強いシャンプー剤を使うと、毛髪表面に油膜が残ってパーマ剤第1剤の浸透を妨げてしまうため不適です（刺激が少なく適度な洗浄力のあるプレーンなシャンプー剤を用います）。\n(2)○・(3)○・(4)○：はいずれも正しい記述です。",
      "q51_50": "【正解】（3）\nロッドにかかる力の図において、(1)は輪ゴムが毛束を押さえる力、(2)は毛根側の毛がロッドの重みに反発する力、（3）のロッド外周に沿った矢印が「巻かれた毛髪の弾力でロッドが逆回転して元に戻ろうとする力」、(4)はロッド自体の重さ（重力）を表しています。",
      "q51_51": "【正解】（1）\nピンカールのうち、毛先側から巻き始めて毛先が円の中心（内側）になり、根元に向かってループが重なりながら広がる巻き方は（1）の「クロッキノールカール」です（根元から巻いて毛先が外側に出るのがスカルプチュアカールやメイポールカールです）。",
      "q51_52": "【正解】（3）\n(1)もトーンダウンの基本として言及されることがありますが、本問の公式正答は（3）「バージンヘアは、毛先が染まりやすい」です（※毛先は紫外線や摩擦等によりキューティクルがわずかに損傷・開いているため、中間部より薬剤が浸透しやすく染まりやすい性質があります。なお(2)損傷毛は明るく染まりすぎやすく、(4)白髪は染まりにくいため放置時間を長めにします）。",
      "q51_53": "【正解】（2）\n爪のカット形状5種類のうち、(1)は先端も側面も直線で角がある「スクエア」、（2）は側面がストレートで先端に緩やかな丸みをつけた「ラウンド」、(3)は側面から先端まで卵形に丸みをつけた「オーバル」、(4)は先端を細く尖らせたアーモンド形の「ポイント」です。",
      "q51_54": "【正解】（2）\n(1)○・(3)○・(4)○：予約時からのカウンセリング、グルー乾燥までの眼鏡推奨、違和感発生時の速やかな眼科受診はいずれも正しい記述です。\n(2)×（誤り）：まつ毛の「成長初期」は細く短いため接着に適さず、またすぐ伸びてバラつきの原因になります。装着に最適なのは「成長期の終わりから退行期の初め」のしっかり成長したまつ毛です。",
      "q51_55": "【正解】（4）\n(1)○・(2)○・(3)○：振袖着付けの若々しい体型補整、長襦袢の襟合わせ、着丈（くるぶしが隠れ床にすれすれの位置）はいずれも正しい記述です。\n(4)×（誤り）：着物の上に締める伊達締め（伊達巻）を帯幅より広くしてしまうと、帯の上下からはみ出して見えてしまうため、必ず「帯幅より狭く（内側に収まるように）」締めます。",
      "q50_01": "【正解】（4）\na○：美容師試験に合格しても、美容師名簿に登録されなければ美容を業としてはなりません。\nb×：美容師試験は都道府県知事ではなく「厚生労働大臣」が行います。\nc×：外国の美容師試験合格者に対する日本の試験の一部免除制度はありません。\nd○：過去に無免許で美容の業を行った者には、試験に合格しても免許が与えられないことがあります。\nよって正しい組合せは aとd の（4）です。",
      "q50_02": "【正解】（1）\n(1)○：美容師免許の申請書には、精神の機能の障害に関する医師の診断書を添付しなければなりません。\n(2)×：氏名変更時は「30日以内」に美容師名簿の訂正申請が必要です（免許証の書換え交付は任意であり2か月以内という規定はありません）。\n(3)×：名簿訂正の申請先は都道府県知事ではなく「厚生労働大臣（指定登録機関）」です。\n(4)×：免許取消処分を受けたときは、「5日以内」に「厚生労働大臣」へ免許証を返納します。",
      "q50_03": "【正解】（4）\na○：美容師である従業者が常時2人以上の美容所には管理美容師を置かなければなりません。\nb×：管理美容師は経営管理ではなく「衛生管理」のために置かれます。\nc×：管理美容師を変更したときは1か月以内ではなく「速やかに」変更届を提出します。\nd○：管理美容師の設置義務に違反したときは、美容所の閉鎖命令を受けることがあります。\nよって正しい組合せは aとd の（4）です。",
      "q50_04": "【正解】（1）\n(1)○：美容師の新たな雇用や退職は開設届出事項の変更にあたるため、速やかに届け出なければなりません。\n(2)×：美容所の名称も届出事項であるため、変更時は速やかに届出が必要です。\n(3)×：変更の届出を怠った場合は30万円以下の罰金に処せられることがあります。\n(4)×：相続等により開設者の地位を承継した場合は、新規の開設届ではなく「承継の届出」を遅滞なく行います。",
      "q50_05": "【正解】（3）\n(1)出張美容規定違反、(2)衛生上必要な措置の不履行、(4)伝染性疾病での就業はいずれも「業務停止処分」の対象ですが、（3）「心身の障害（精神の機能の障害）により業務を適正に行うことができない場合」は業務停止処分ではなく「免許取消処分」の対象です。",
      "q50_06": "【正解】（4）\n(1)免許取消後の無免許営業、(2)検査確認前の美容所使用、(3)閉鎖処分違反はいずれも「30万円以下の罰金」の対象ですが、（4）「開設者が業務停止処分中の美容師に業務を行わせた場合」は「美容所の閉鎖処分（行政処分）」の対象であり、罰金刑の対象ではありません。",
      "q50_07": "【正解】（2）\n(1)○・(3)○・(4)○：振興指針は厚生労働大臣が定め、組合が振興計画を策定し、政府が資金確保等の援助に努めます。\n(2)×（誤り）：振興指針は生活衛生同業組合の組合員だけでなく、「業界全体（非組合員を含む生活衛生関係営業者全体）」を対象として策定されます。",
      "q50_08": "【正解】（2）\n(1)○・(3)○・(4)○：労働安全衛生法の目的、健康診断後の医師の意見聴取、伝染性疾病労働者の就業禁止はいずれも正しい記述です。\n(2)×（誤り）：労働者に対する医師による定期健康診断の実施は、従業員数にかかわらず「常時使用する労働者を1人でも雇用するすべての事業者」に義務付けられています（50人以上のみではありません）。",
      "q50_09": "【正解】（1）\n(1)×（誤り）：日本の公的年金は2階建て構造になっており、厚生年金保険に加入する会社員等は、同時に国民年金の「第2号被保険者」として国民年金にも加入しています。\n(2)○・(3)○・(4)○：厚生年金の保険料決定方法、第1号被保険者の全国一律保険料、免除・納付猶予制度はいずれも正しい記述です。",
      "q50_10": "【正解】（4）\n介護保険の被保険者は、市区町村に住所を有する【A：65】歳以上の者（第1号被保険者）と、市区町村に住所を有する【B：40】歳以上【C：65】歳未満の医療保険加入者（第2号被保険者）の2種類に区分されます。",
      "q50_11": "【正解】（1）\n(1)×（誤り）：保健所はエイズに関する正しい知識の普及や匿名相談・検査（HIV検査）などの予防事業を行いますが、患者に対する「治療（医療行為）」は病院・診療所が行うものであり、保健所では実施していません。\n(2)○・(3)○・(4)○：はいずれも保健所の正しい記述です。",
      "q50_12": "【正解】（3）\n(1)○・(2)○・(4)○：合計特殊出生率の定義と推移、高齢化に伴う心疾患粗死亡率の上昇は正しい記述です。\n(3)×（誤り）：年齢構成の異なる集団間で死亡率を比較する場合は、高齢化等の年齢構成の違いを補正した「年齢調整死亡率」が用いられます（粗死亡率では高齢者割合が高い集団ほど高くなってしまい比較できません）。",
      "q50_13": "【正解】（2）\na×：高齢化に伴い、全悪性新生物（がん）の「粗死亡率」は上昇傾向にあります。\nb○：ピロリ菌感染率の低下や食生活改善・検診普及により、「胃がん」の粗死亡率は減少傾向にあります。\nc○：2015年の男性の部位別粗死亡率の第1位は「肺がん」です。\nd×：2015年の女性の部位別粗死亡率の第1位は子宮がんではなく「大腸がん（次いで肺がん）」です。\nよって正しい組合せは bとc の（2）です。",
      "q50_14": "【正解】（3）\n(1)○・(2)○・(4)○：下水の定義、病原体や有害物質の混入、放流水質の法的規制は正しい記述です。\n(3)×（誤り）：下水処理で発生する汚泥は、セメント原料や建設資材、肥料、固形燃料などに再資源化（リサイクル）する技術が広く実用化されており、すべて埋立処分されているわけではありません。",
      "q50_15": "【正解】（4）\n(1)○・(2)○・(3)○：廃棄物処理法の規制、一般廃棄物と産業廃棄物の区分、家庭ごみの処理方法は正しい記述です。\n(4)×（誤り）：「産業廃棄物」は市町村ではなく、排出した「事業者自身の責任（自ら処理するか許可を受けた産業廃棄物処理業者に委託）」で処理しなければなりません。",
      "q50_16": "【正解】（2）\na×：細菌の成分の約70〜80%は「水分」です。\nb○：細菌は栄養や温度条件が整えば菌体の「2分裂」によって増殖します。\nc○：ウイルスはDNAかRNAのどちらか1種類の核酸のみを持っています。\nd×：ウイルスの核酸を保護するタンパク質の殻は「カプシド」といいます（莢膜は細菌が持つ構造です）。\nよって正しい組合せは bとc の（2）です。",
      "q50_17": "【正解】（4）\n(1)○：不顕性感染の説明とポリオの例は正しいです。\n(2)○：日和見感染の説明とエイズ患者の真菌性肺炎の例は正しいです。\n(3)○：持続性感染の説明とB型肝炎ウイルスの例は正しいです。\n(4)×（誤り）：「垂直感染（母子感染）」とは、妊娠・分娩・授乳を通じて母親から子どもへ直接感染すること（B型肝炎・風しん・梅毒・HIV等）をいいます。汚染された飲食物によるコレラ等の感染は「水平感染（経口感染）」です。",
      "q50_18": "【正解】（4）\n(1)○・(2)○・(3)○：常在細菌叢の定着、外来病原体の侵入防止、腸内細菌によるビタミン産生は正しい記述です。\n(4)×（誤り）：鼻腔や皮膚に常在する黄色ブドウ球菌は、手指や器具を介して傷口に入れば化膿症、食品に入ればブドウ球菌食中毒の「感染源」となります。",
      "q50_19": "【正解】（1）\n(1)×（誤り）：季節性インフルエンザの大きな流行の原因となるのはB型だけでなく、「A型およびB型」のインフルエンザウイルスです（特にA型は大流行を起こしやすい特徴があります）。\n(2)○・(3)○・(4)○：高齢者の肺炎併発、飛沫・接触感染、手洗い・アルコール消毒・予防接種はいずれも正しい記述です。",
      "q50_20": "【正解】（1）\na○：麻しんの病原体は麻しんウイルスで、感染力は非常に強いです。\nb○：麻しんは予防接種法に基づく定期予防接種の対象です。\nc×：潜伏期は2〜3日ではなく「約10〜12日」であり、発疹は顔だけでなく「全身」に広がります。\nd×：海外からの輸入例（持込み例）による国内感染リスクは現在も存在します。\nよって正しい組合せは aとb の（1）です。",
      "q50_21": "【正解】（1）\na○：消毒とは病原微生物を殺すか除去して感染力をなくすことです。\nb○：滅菌とはすべての微生物を殺すか除去して生きている微生物が存在しない状態にすることです。\nc×：殺菌は微生物を殺すことの総称であり、必ずしも無菌状態（滅菌）にすることではありません。\nd×：防腐とは微生物を殺さず発育・作用を抑えて腐敗を防ぐことです。\nよって正しい組合せは aとb の（1）です。",
      "q50_22": "【正解】（2）\n(1)○・(3)○・(4)○：血液が付着していないクリッパーの刃への紫外線照射、くしの0.01%以上次亜塩素酸ナトリウム浸漬、はさみの0.1%以上逆性石けん浸漬はいずれも正しい消毒法です。\n(2)×（誤り）：「かみそり」を消毒用エタノールで消毒する場合は、血液付着の有無にかかわらず「10分間以上浸す（浸漬）」必要があり、綿やガーゼで拭く（清拭）方法は認められていません。",
      "q50_23": "【正解】（4）\na○：タンパク質は水分があると熱変性しやすいため、湿熱は乾熱より短時間で消毒できます。\nb×：美容所で用いることができる理学的消毒法は、煮沸・蒸気に「紫外線消毒」を加えた「3種類」です。\nc×：蒸気消毒（10分以上）は煮沸消毒（2分以上）より「長い時間」がかかります。\nd○：消毒薬の殺菌効果は「温度・濃度・時間」の3要素に左右されます。\nよって正しい組合せは aとd の（4）です。",
      "q50_24": "【正解】（3）\n(1)○：揮発性・引火性があるため火気厳禁です。\n(2)○：細菌の芽胞には効力がありません。\n(3)×（誤り）：消毒用エタノールは逆性石けんやグルコン酸クロルヘキシジンなど「他の消毒薬と併用することが可能」であり、併用によって殺菌効果が高まります。\n(4)○：ゴムや一部のプラスチックを変質・溶解させることがあります。",
      "q50_25": "【正解】（1）\n(1)○：水98＋5%原液2（全量100＝50倍希釈）で混合すると、5% ÷ 50 ＝「0.1%水溶液」になり正しい記述です。\n(2)×：5%原液を100倍希釈すると 5% ÷ 100 ＝ 0.05%水溶液になります。\n(3)×：水99＋5%原液1（100倍希釈）は 0.05%水溶液になります（0.01%にするには500倍希釈が必要です）。\n(4)×：5%原液を50倍希釈すると 0.1%水溶液になります。",
      "q50_26": "【正解】（2）\n(1)×：涙点は外眼角（目尻）ではなく「内眼角（目頭）」の近くにあります。\n(2)○：瞳孔は虹彩の中央にある光の通り道（黒く見える孔）です。\n(3)×：「しろめ」の白い色は透明な眼球結膜の下にある「強膜」の色です。\n(4)×：上眼瞼の睫毛（まつ毛）の方が下眼瞼よりも長く密に生えています。",
      "q50_27": "【正解】（2）\n（1）心筋は心筋組織（自律神経支配）、（3）血管の平滑筋と（4）気管支の平滑筋は平滑筋（自律神経支配）ですが、呼吸筋である（2）「横隔膜」は骨格筋（横紋筋）であり、体性神経である「運動神経（横隔神経）」によって収縮が引き起こされます。",
      "q50_28": "【正解】（3）\n呼吸中枢や循環（心臓・血管運動）中枢など生命維持に不可欠な中枢があるのは、延髄・橋・中脳からなる（3）「脳幹（特に延髄）」です。（1）大脳は知覚・思考・随意運動、（2）小脳は平衡・運動調節、（4）脊髄は反射と伝導路を担います。",
      "q50_29": "【正解】（3）\n鼓膜の奥にある鼓室（（3）「中耳」）は、「耳管（エウスタキオ管）」によって咽頭（上咽頭）とつながっており、鼓膜の内外の気圧を等しく保つ働きをしています。",
      "q50_30": "【正解】（1）\n内部に赤色色素タンパク質のヘモグロビンを含み、肺から全身の組織へ酸素を運搬する機能がある血球は（1）「赤血球」です。（2）好中球は食作用、（3）血小板は血液凝固、（4）リンパ球は免疫反応を担います。",
      "q50_31": "【正解】（3）\na×：皮膚の厚さは体の部位によって大きく異なります（眼瞼は薄く、手掌・足底や背部は厚い）。\nb×：表皮細胞の約95%を占めるのは色素細胞ではなく「角化細胞（ケラチノサイト）」です。\nc○：表皮と真皮の境界が乳頭状に波打っていることは、剥がれにくさと皮膚の弾力性の一因となっています。\nd○：真皮の下方には脂肪組織に富む皮下組織があります。\nよって正しい組合せは cとd の（3）です。",
      "q50_32": "【正解】（3）\n(1)×：皮膚表面に出ている部分は「毛幹」といいます（皮膚内部が毛根です）。\n(2)×：毛の3層の中心部は「毛髄質（メデュラ）」です（毛小皮＝キューティクルは最外層です）。\n(3)○：中間層である「毛皮質（コルテックス）」の細胞にはメラニン顆粒が含まれ、毛髪の色を決めています。\n(4)×：ウロコのように角化した透明な核のない細胞からなるのは「毛小皮（キューティクル）」です。",
      "q50_33": "【正解】（2）\n(1)○：皮膚感覚では痛覚が最も鋭敏（痛点が最多）で、温覚が最も鈍い（温点が最少）です。\n(2)×（誤り）：皮脂の分泌は思春期から20歳代頃にピークを迎え、その後は「加齢とともに減少」します（高齢になるほど増加はしません）。\n(3)○：精神的緊張等による手掌・足底・腋窩の発汗を精神性発汗といいます。\n(4)○：爪をつくる爪母が失われると爪は再生しません。",
      "q50_34": "【正解】（4）\n(1)○・(2)○・(3)○：糖尿病の易感染性、肝臓障害による皮膚掻痒（かゆみ）、更年期女性のフケ・ひげの発育は正しい記述です。\n(4)×（誤り）：貧血では血液中のヘモグロビンが減少するため皮膚や粘膜は「蒼白（青白く）」なります。チアノーゼ（皮膚や粘膜が青紫色になる状態）は、呼吸器や心臓の疾患等で血液中の酸素が不足（還元ヘモグロビンが増加）したときに起こります。",
      "q50_35": "【正解】（1）\n(1)×（誤り）：頭部白癬（シラクモ）の原因は細菌ではなく、真菌（カビ）の一種である「白癬菌」です。\n(2)○：帯状疱疹は水痘・帯状疱疹ウイルスが原因です。\n(3)○：伝染性膿痂疹（トビヒ）は黄色ブドウ球菌やレンサ球菌などの細菌が原因です。\n(4)○：疥癬（ヒゼン）はヒゼンダニが原因です。",
      "q50_36": "【正解】（2）\n(1)○：高級アルコールは炭素数の多いアルコールです。\n(2)×（誤り）：炭化水素には石油から得られる流動パラフィンやワセリンだけでなく、深海ザメの肝油やオリーブ油など「動植物から得られるスクワラン」もあります。\n(3)○：油脂が空気中の酸素や光、微生物等で変質し異臭等を生じることを酸敗といいます。\n(4)○：ロウ類は高級アルコールと高級脂肪酸のエステルです。",
      "q50_37": "【正解】（4）\n(1)○・(2)○・(3)○：石けん（陰イオン）、第四級アンモニウム塩（陽イオン）、レシチン（両性）の説明は正しいです。\n(4)×（誤り）：アルキル硫酸ナトリウムは「陰イオン（アニオン）界面活性剤」であり、主にシャンプー等の洗浄剤として用いられます（非イオン界面活性剤や帯電防止剤ではありません）。",
      "q50_38": "【正解】（3）\na×：まれに油性成分を含まない水性タイプのクリームもあります。\nb×：油性成分が10%程度のクリームは「弱油性クリーム」に分類されます（中油性は20〜50%程度）。\nc○：クレンジングクリームは油性のメイクアップ料を溶かし出して除去する機能を持っています。\nd○：バニシングクリームはステアリン酸と水を主成分とする「O/W型（水中油滴型）」クリームです。\nよって正しい組合せは cとd の（3）です。",
      "q50_39": "【正解】（3）\n(1)×：チオグリコール酸は「第1剤」の還元剤です。\n(2)×：モノエタノールアミンは第1剤の「アルカリ剤」です。\n(3)○：【A：臭素酸ナトリウム】は二浴式パーマ剤の【B：第2剤】の有効成分で、【C：酸化剤】として働きます。\n(4)×：システインは第1剤の「還元剤」です。",
      "q50_40": "【正解】（1）\n酸化染毛剤では、第2剤の【A：過酸化水素】が第1剤のアルカリ剤の影響で分解して酸素を発生し、毛髪中の【B：メラニン】色素を酸化分解（脱色）するとともに、第1剤の染料中間体を酸化重合させて発色させます。このとき【C：調色剤（カップラー）】が共に酸化結合することで多様な色調に発色します。",
      "q50_41": "【正解】（1）\n（2）ひさし髪、（3）二百三高地髷、（4）まがれいとはいずれも明治時代に流行した「西洋束髪」ですが、（1）「銀杏返し（いちょうがえし）」は伝統的な「日本髪」に該当します。",
      "q50_42": "【正解】（2）\n(1)○・(3)○・(4)○：文明開化による洋風化、関東大震災以降の女性洋装の定着、大正末期の女学生セーラー服採用は正しい記述です。\n(2)×（誤り）：明治20年代（日清戦争頃）に国粋主義（日本古来の伝統を見直す動き）が台頭したことで、女性の洋装化は一時「後退（停滞）」し、和装や日本髪・和装束髪が見直されました。",
      "q50_43": "【正解】（3）\n(1)○・(2)○・(4)○：色留袖と黒留袖の区別、色留袖の未婚者着用可、留袖の語源は正しい記述です。\n(3)×（誤り）：留袖の絵羽模様は「裾まわり（腰から下）のみ」にあしらわれており、肩や袖には模様はありません（肩・袖・胸元にも絵羽模様があるのは訪問着や振袖です）。",
      "q50_44": "【正解】（2）\n(1)○・(3)○・(4)○：ヘアライン、サイドライン、バックポイントの説明は正しいです。\n(2)×（誤り）：頭部の頂点で正中線上の点は「トップポイント」といいます（ゴールデンポイントはトップポイントとバックポイントの中間にある後頭部上方の基準点です）。",
      "q50_45": "【正解】（4）\nヘアドライヤーの構造の中心は、風を起こす【A：ファン】、ファンを回転させる【B：モーター】、空気を温める【C：発熱器（ニクロム線ヒーター）】の3つです。ファンで起こされた風が発熱器で熱せられ、温風として送風されます。",
      "q50_46": "【正解】（2）\n（1）ニーディング（もみ込む）、（3）フィンガースルー（手ぐしを通す）、（4）スクランチ（毛先を握り込む）はいずれもトリートメント剤を毛髪に浸透・なじませるヘアトリートメント手技ですが、（2）「ハッキング」はスキャルプマッサージの叩打法（手刀で軽く叩く手技）であり、ヘアトリートメント技術ではありません。",
      "q50_47": "【正解】（1）\n線の方向性による視覚効果として、大地や水面を表す【A：水平線】は安定感や静けさを与え、柱や樹木を表す【B：垂直線】は平衡・均衡・厳粛さ・強力な支柱を暗示し、傾いた【C：斜線】は不安定感・運動感（動き）・緊張感を生じさせます。",
      "q50_48": "【正解】（2）\nテーパーカットのうち、「テーパーする深さ（どこから削ぐか）」による分類は「ノーマルテーパー（毛先1/3）・ディープテーパー（根元近くから）・エンドテーパー（毛先のみ）」の3つであり、（2）「ノーマルテーパーカット」が正解です。（1）アウトサイド・（3）インサイドは削ぐ「面」による分類、（4）レフトサイドは削ぐ「方向」による分類です。",
      "q50_49": "【正解】（4）\n(1)×：フェイスラインに保護クリームを塗るのはヘアカラーやコールドクリーム施術時であり、パーマのワインディング前に塗ると毛髪に油分が付いて薬剤をはじいてしまいます。\n(2)×：はっ水性毛は薬剤をはじくためパーマが「かかりにくい」毛質です。\n(3)×：テストカールは第2剤塗布前（第1剤の作用確認時）に行います。\n(4)○：テストカール時の適正なカールの直径は、使用したロッドの直径の約1.5〜2.5倍（本問基準では約2.5倍）です。",
      "q50_50": "【正解】（1）\n毛先から巻いて毛先が内側になる巻き方では、内側の円が小さいため毛先のウェーブ幅が【A：狭く】、外側（根元側）になるほど円が大きくなるためウェーブ幅が【B：広く】なります。この毛先巻き方式の代表的なピンカールが【C：クロッキノールカール】です。",
      "q50_51": "【正解】（4）\n色相環において「赤」の補色（反対色）は「緑（青緑・マット系）」です。したがって、赤みのある毛髪の赤みを打ち消してナチュラルな色に仕上げたいときは、（4）「緑系のヘアカラー」を用います。",
      "q50_52": "【正解】（2）\n(1)×：爪の長さや形を整えるのは「エメリーボード」です（フィラーはシルクラップやグルーと共に亀裂補修等に用いるパウダーです）。\n(2)○：アクティベーターはネイルグルーやレジンの硬化を促進する硬化促進剤です。\n(3)×：プライマーはアクリルやジェルの密着を高める下地剤です。\n(4)×：エメリーボードは自爪のファイリング用具です。",
      "q50_53": "【正解】（3）\n(1)×：グルーは開封後劣化する（約1〜2か月程度）ため、厳格な使用期限があります。\n(2)×：精製水には殺菌・消毒作用はないため、器具の消毒にはエタノールや紫外線等を用います。\n(3)○：エアブロアは前処理後のまつ毛の水分や施術後のグルーの揮発成分を風で乾かすために使用します。\n(4)×：マイクロスティックは前処理剤やリムーバーを細かく塗布・除去する綿棒状の道具です（目元保護にはサージカルテープやアイシートを用います）。",
      "q50_54": "【正解】（4）\n文金高島田の髪飾りにおいて、Aの髷の中央に左右から挿す簪は「中挿し（なかざし）」、Bの前髪と髷の境目に挿す櫛は「飾櫛（かざりぐし）」、Cの前髪の左右に挿すビラ付きの簪は「前挿し（まえざし）」です。よって（4）が正解です。",
      "q50_55": "【正解】（3）\n幅約70cm（約1尺8寸）、丈約4.2m以上あり、表裏とも同じ豪華な錦織などで仕立てられた最も格調高い女性の第一礼装用の帯は（3）「丸帯」です（花嫁衣装や黒留袖等に用いられます）。",
      "q49_01": "【正解】（2）\n(1)○・(3)○・(4)○：はいずれも美容師法第1条・第6条に定められた内容です。\n(2)×（誤り）：「美容業の経営の健全化を促進し、美容業の振興を図る」ことを定めているのは美容師法ではなく「生活衛生関係営業の運営の適正化及び振興に関する法律（生衛法）」です。",
      "q49_02": "【正解】（3）\n(1)×：美容師免許申請時に添付するのは「精神の機能の障害」に関する医師の診断書です（伝染性疾病の診断書は美容所開設届の添付書類です）。\n(2)×：住所変更は美容師名簿の登録事項ではないため訂正申請は不要です。\n(3)○：業務停止処分を受けたときは、速やかに処分を行った都道府県知事等に免許証を提出します。\n(4)×：免許証再交付の申請先は都道府県知事ではなく「厚生労働大臣（指定登録機関）」です。",
      "q49_03": "【正解】（1）\n(2)衛生措置義務違反、(3)伝染性疾病での就業、(4)出張美容違反はいずれも「業務停止処分」の対象ですが、（1）「業務停止処分に違反して業務停止期間中に美容の業をした場合」は厚生労働大臣による「免許取消処分」の対象となります。",
      "q49_04": "【正解】（4）\n(1)×：管理美容師の設置義務は「美容師である従業者」が常時2人以上いる場合であり、美容師が1人なら他の従業者がいても不要です。\n(2)×：講習会を指定するのは厚生労働大臣ではなく「都道府県知事」であり、また免許取得後「3年以上美容の業務に従事」した実務経験が必要です。\n(3)×：管理美容師は1か所の美容所に専任である必要があり、複数の美容所の管理美容師を兼ねることはできません。\n(4)○：美容所開設届には管理美容師の氏名及び住所を届け出なければなりません。",
      "q49_05": "【正解】（3）\n(1)○：営業開始前に開設届が必要です。\n(2)○：構造設備や衛生基準を満たせば自動車による移動美容所の開設も認められます。\n(3)×（誤り）：施術者全員が理容師と美容師の双方の免許を有している場合には、同一施設での理容所・美容所の重複開設が認められます。\n(4)○：相続等による承継時は遅滞なく届出が必要です。",
      "q49_06": "【正解】（4）\n(1)×：立入検査は「衛生上必要な措置の実施状況」を確認するためのものであり、経営状況の検査は含まれません。\n(2)×：立入検査を行うのは民間委託ではなく、都道府県や保健所設置市等の職員である「環境衛生監視員」です。\n(3)×：立入検査を妨げた場合は「30万円以下の罰金」の対象であり、閉鎖処分ではありません。\n(4)○：構造設備の確認検査を受けずに美容所を使用した開設者は、30万円以下の罰金に処されることがあります。",
      "q49_07": "【正解】（2）\na×：生活衛生同業組合は「非営利」の組織です。\nb○：組合への加入や脱退は営業者の任意（自由）です。\nc○：厚生労働大臣が定める振興指針に沿って振興計画を策定できます。\nd×：営業方法や料金の制限協定（適正化規程）には主務大臣の認可や公正取引委員会との協議など厳格な法的制約があり、現在はすべて廃止されています。\nよって正しい組合せは bとc の（2）です。",
      "q49_08": "【正解】（2）\na×：法人税や所得税は利益（所得）が出ているときに納める税金です（赤字でも納めるのは固定資産税や均等割等）。\nb○：源泉所得税は従業員の給与から天引きして預かり、原則翌月10日までに税務署へ納付します。\nc○：申告や納税義務を怠ると無申告加算税や延滞税などの附帯税が課されます。\nd×：個人事業主の所得税の確定申告期限は1月15日ではなく原則「毎年3月15日」です。\nよって正しい組合せは bとc の（2）です。",
      "q49_09": "【正解】（3）\n(1)○：労働基準法が適用除外となるのは「同居の親族のみ」を使用する場合であり、別居の親族には適用されます。\n(2)○：採用時には賃金・労働時間等の労働条件を明示する義務があります。\n(3)×（誤り）：パートタイム労働者であっても、6か月以上継続勤務し所定労働日数の8割以上出勤する等の要件を満たせば、比例付与による年次有給休暇を与えなければなりません。\n(4)○：労働時間が8時間を超える場合は少なくとも1時間の休憩が必要です。",
      "q49_10": "【正解】（4）\na○：健康保険や後期高齢者医療制度に加入していない従業者は国民健康保険の対象となります。\nb×：後期高齢者医療制度の被保険者となるのは原則「75歳以上」の者（および65〜74歳で一定の障害認定を受けた者）であり、70歳以上すべてではありません。\nc×：一部負担金の割合は年齢や所得によって1割〜3割と異なります。\nd○：健康保険・国民健康保険ともに自己負担限度額を超えた分が払い戻される高額療養費制度があります。\nよって正しい組合せは aとd の（4）です。",
      "q49_11": "【正解】（3）\n(1)○・(2)○・(4)○：母子健康手帳の交付、母体の健康状態と乳児の生存、1歳6か月児・3歳児健診はいずれも正しい記述です。\n(3)×（誤り）：妊婦の健康診査は病気のある妊婦だけでなく、「すべての妊婦」を対象に定期的な受診が推奨・公費補助されています。",
      "q49_12": "【正解】（2）\n(1)○・(3)○・(4)○：生活習慣の要素、心疾患との関与、健康日本21（第2次）の目標はいずれも正しい記述です。\n(2)×（誤り）：メタボリックシンドロームに着目した特定健康診査・特定保健指導の対象者は、30歳以上60歳未満ではなく「40歳以上74歳以下（75歳未満）」の医療保険加入者です。",
      "q49_13": "【正解】（1）\n(1)×（誤り）：食事や運動不足・肥満などの生活習慣が主たる原因となるのは「2型糖尿病」です。「1型糖尿病」は自己免疫等により膵臓のβ細胞が破壊されてインスリンが出なくなる疾患であり、生活習慣が主因ではありません。\n(2)○・(3)○・(4)○：はいずれも糖尿病に関する正しい記述です。",
      "q49_14": "【正解】（2）\n(1)○・(3)○・(4)○：照度不適による眼精疲労、美容所作業面の望ましい照度（300ルクス以上）、局所照明と全般照明は正しい記述です。\n(2)×（誤り）：一般に読書や日常生活に不自由のない明るさは「150〜300ルクス程度以上」であり、20〜30ルクスでは薄暗すぎて日常生活に支障があります。",
      "q49_15": "【正解】（1）\n(1)×（誤り）：アタマジラミは頭皮（皮膚表面）ではなく、「毛髪（特に耳の後ろや後頭部の毛の根元近く）」にセメント様物質で卵を産み付けます。\n(2)○・(3)○・(4)○：幼虫・成虫ともの吸血、保育所等での集団発生、櫛・タオルの共用による感染は正しい記述です。",
      "q49_16": "【正解】（4）\n感染症法において、美容師が感染している場合に接客業務等の就業制限の対象となるのは二類感染症の（4）「結核」です。",
      "q49_17": "【正解】（1）\n(1)×（誤り）：百日せきの病原体はウイルスではなく、細菌である「百日せき菌」です。\n(2)○：コレラはコレラ菌（細菌）が病原体です。\n(3)○：マラリアはマラリア原虫が病原体です。\n(4)○：ツツガムシ病はツツガムシ病リケッチアが病原体です。",
      "q49_18": "【正解】（4）\n(1)○：A型肝炎は汚染された水や魚介類等による経口感染が主です。\n(2)○：B型肝炎は出産時等に母から子へ垂直感染（母子感染）することがあります。\n(3)○：C型肝炎は血液等を介して感染します。\n(4)×（誤り）：A型・B型・C型肝炎のうち、急性肝炎で治癒し原則として慢性肝炎に移行することがないのは「A型肝炎」です（C型肝炎は約70%と最も高い確率で慢性肝炎に移行します）。",
      "q49_19": "【正解】（2）\na「腸チフス」とd「腸管出血性大腸菌感染症」は飲食物を介する経口感染です。血液や体液を介して感染するのは b「B型肝炎」と c「後天性免疫不全症候群（エイズ）」であり、正しい組合せは bとc の（2）です。",
      "q49_20": "【正解】（2）および（4）\n【公式採点注記】妊娠中の母体から胎盤を介して胎児に感染（経胎盤感染）する代表的な感染症は（2）「梅毒」（先天梅毒）ですが、妊娠中に（4）「麻しん」に罹患した場合も経胎盤感染（流早産や新生児麻しん）の可能性を排除できないため、公式試験では（2）と（4）のいずれも正解として採点されました。（1）ジフテリアは飛沫感染、（3）細菌性赤痢は経口感染です。",
      "q49_21": "【正解】（3）\n(1)×：かみそりは血液付着リスクが高いため、次亜塩素酸ナトリウムや逆性石けんの低濃度（0.01%）ではなく、美容師法施行規則および衛生管理要領の区分に則り適切な消毒を行います（特に本問では(3)が明確な正答）。\n(2)×：血液が付着したはさみに蒸気消毒（80℃超の湿熱）は適用できません。\n(3)○：血液が付着していないヘアブラシを0.1%以上の逆性石けん水溶液に10分間以上浸すのは正しい法定消毒法です。\n(4)×：血液が付着したくしはエタノール清拭（拭く方法）では消毒できません（10分間以上浸す必要があります）。",
      "q49_22": "【正解】（4）\n(1)○：加熱消毒では煮沸（2分以上）より蒸気（10分以上）の方が時間がかかります。\n(2)○：薬液消毒では温度が低いほど化学反応が遅くなり時間がかかります。\n(3)○：同じ温度・時間なら乾熱より湿熱の方が殺菌効果は高くなります。\n(4)×（誤り）：薬液消毒の殺菌効果の3要素は「温度・時間・濃度」であり、「湿度」は関係ありません。",
      "q49_23": "【正解】（3）\n(1)○：紫外線殺菌灯は殺菌力が最も強い波長253.7nm付近の紫外線（UV-C）を照射します。\n(2)○：血液が付着していない器具には85μW/cm²以上の紫外線を20分間以上照射します。\n(3)×（誤り）：紫外線殺菌灯は使用時間（寿命約2,000〜3,000時間）とともに紫外線の出力が低下するため、青白く発光して見えても殺菌力は低下しており定期的な交換が必要です。\n(4)○：陰になる部分は消毒できないため、重ならないように配置します。",
      "q49_24": "【正解】（1）\na○：次亜塩素酸ナトリウムには強い殺菌作用と同時に漂白作用があります。\nb○：酸性の洗剤と混ぜると有毒な塩素ガスが発生するため絶対に行ってはいけません。\nc×：0.1%水溶液に10分間浸しても、最も抵抗性の強い細菌の「芽胞」は完全には不活化できません。\nd×：有機物の汚れ（血液や毛髪・皮脂など）が残っていると有効塩素が消費され、消毒効果は著しく低下します。\nよって正しい組合せは aとb の（1）です。",
      "q49_25": "【正解】（4）\n(1)×：10%逆性石けん10mL＋水990mL（100倍希釈）は 0.1%水溶液になります（0.2%にするには20mL＋水980mL）。\n(2)×：10%両性界面活性剤20mL＋水980mL（50倍希釈）は 0.2%水溶液になります。\n(3)×：20%グルコン酸クロルヘキシジン5mL＋水995mL（200倍希釈）は 20% ÷ 200 ＝ 0.1%水溶液になります（0.05%にするには2.5mL＋水997.5mL）。\n(4)○：5%次亜塩素酸ナトリウム10mL＋水990mL（全量1,000mL＝100倍希釈）は、5% ÷ 100 ＝「0.05%水溶液」となり正しい記述です。",
      "q49_26": "【正解】（1）\n腕の力こぶをつくる「上腕二頭筋」は自分の意思で動かす骨格筋（随意筋）であるため、収縮するときに直接働くのは体性神経の（1）「運動神経」です。",
      "q49_27": "【正解】（4）\n(1)×：光は眼球結膜ではなく透明な「角膜」を通って眼球内部に入ります。\n(2)×：厚さを変えて光の焦点を調節するレンズの役割を果たすのは「水晶体」です。\n(3)×：光を感じる杆体細胞と錐体細胞があるのは角膜ではなく「網膜」です。\n(4)○：網膜で受容された光の感覚は、視神経を通して大脳皮質の視覚野に伝えられます。",
      "q49_28": "【正解】（2）\n健康な成人の血液中の血球成分のうち、成熟する過程で核を失い「核がない」中央がくぼんだ円盤状をしているのは（2）「赤血球」（および血小板）です。（1）好中球、（3）単球、（4）リンパ球はいずれも核を持つ白血球です。",
      "q49_29": "【正解】（3）\n呼吸器において、吸い込んだ空気中の酸素を血液に取り込み、血液中の二酸化炭素を空気中へ出す「ガス交換（外呼吸）」が行われるのは、気管支の末端にある小さな袋状の（3）「肺胞」です。",
      "q49_30": "【正解】（3）\n消化管の運動のうち、消化管の輪状筋と縦走筋が交互に収縮・弛緩して内容物を口側から肛門側へと送り出す運動は（3）「蠕動（ぜんどう）運動」です。（1）分節運動と（2）振子運動は内容物と消化液を混ぜ合わせる運動、（4）嚥下は食物を飲み込む運動です。",
      "q49_31": "【正解】（2）\n表皮を構成する細胞のうち、全体の「約95%」と最も多く含まれているのは、角化して角質層をつくる（2）「角化細胞（ケラチノサイト）」です。",
      "q49_32": "【正解】（3）\n(1)○：毛母には色素細胞が多数存在します。\n(2)○：眉毛やまつ毛など立毛筋がない毛包もあります。\n(3)×（誤り）：手掌（手のひら）や足底には、毛包だけでなく「脂腺（独立脂腺を含む）も一切存在しません」（エクリン汗腺は多数存在します）。\n(4)○：エクリン腺は全身のほとんどの皮膚に分布しています。",
      "q49_33": "【正解】（1）\n【公式採点注記】第49回問33は公式試験では採点対象から除外（全員正解扱い）となった問題ですが、出題意図としては（1）「脂肪膜（皮脂膜）」の保護作用は主に「化学的刺激（酸・アルカリ）や微生物の侵入・水分蒸発」に対するものであり、機械的外力に対する保護作用を主に担うのは角質層・真皮（膠原線維・弾性線維）・皮下脂肪であるため（1）が誤りとして作問されました。",
      "q49_34": "【正解】（1）\n(1)×（誤り）：心臓疾患（心不全など）で皮膚に現れる代表的な変化は「チアノーゼ（青紫色）」や「むくみ（浮腫）」であり、蕁麻疹ではありません。\n(2)○：肝臓障害ではビリルビン沈着による黄疸が出ます。\n(3)○：腎疾患では水分排泄障害によるむくみ（浮腫）が出ます。\n(4)○：糖尿病では免疫力低下により細菌や真菌の皮膚感染症にかかりやすくなります。",
      "q49_35": "【正解】（4）\n（1）アトピー性皮膚炎、（2）尋常性乾癬、（3）尋常性白斑はいずれも非感染性の皮膚疾患であり他人にうつりませんが、（4）「頭部白癬（しらくも）」は白癬菌（真菌・カビ）による感染性皮膚疾患です。",
      "q49_36": "【正解】（4）\n(1)×：水中のミセルは、「親水基（親水性の部分）を外側（水側）に、疎水基（親油基）を内側」に向けて形成されます。\n(2)×：粉体を液体中に均一な微細粒子状で安定させることは「分散」といいます（乳化は水と油を混ぜることです）。\n(3)×：石けんは「陰イオン（アニオン）界面活性剤」です。\n(4)○：第四級アンモニウム塩などの陽イオン界面活性剤は毛髪に吸着して静電気を防ぐ帯電防止効果があります。",
      "q49_37": "【正解】（3）および（2）\n【公式採点注記】本来は（3）「有機合成色素（タール色素）は光によって退色・変色などの経時変化を受けることがある」ため(3)が誤りとして出題されましたが、(2)の紫外線散乱剤としての酸化チタンの記述表現等との兼ね合いから、公式採点では（2）と（3）のいずれも正解として扱われました。",
      "q49_38": "【正解】（2）\n香粧品の微生物変質を防ぐパラベン等は【A：防腐剤】です。また空気中の【B：酸素】との接触で起こる酸化反応を抑えるため、トコフェロール（ビタミンE）等の酸化防止剤や、酸化を促進する金属イオンを封鎖する【C：エチレンジアミン四酢酸（エデト酸、EDTA）】等のキレート剤が配合されます。",
      "q49_39": "【正解】（1）\n(1)×（誤り）：ジメチルエーテル（DME）はエアゾール製品（ヘアスプレー等）の「噴射剤（高圧ガス）」として用いられる成分であり、ヘアジェルの保湿剤ではありません（保湿剤にはグリセリンやプロピレングリコール等が用いられます）。\n(2)○・(3)○・(4)○：はいずれも正しい記述です。",
      "q49_40": "【正解】（3）\n二浴式パーマ剤は、【A：チオグリコール酸】（やシステイン）のような【B：還元剤】を有効成分とする第1剤と、【C：臭素酸ナトリウム】（や過酸化水素）のような【D：酸化剤】を有効成分とする第2剤からなります。",
      "q49_41": "【正解】（1）\n(1)×（誤り）：「唐人髷（とうじんまげ）」や「結綿（ゆいわた）」は西洋束髪ではなく、江戸時代から明治にかけて結われた伝統的な「日本髪」です（代表的な束髪はイギリス結び・まがれいと・夜会巻き・二百三高地髷などです）。\n(2)○・(3)○・(4)○：はいずれも明治時代の髪型に関する正しい記述です。",
      "q49_42": "【正解】（2）\n1957〜1958年のパリ・コレクションでバレンシアガやジバンシィ、サン・ローランらに発表され、日本でも大流行したウエストを絞らない筒形で袋（サック）のようなシルエットのワンピースは（2）「サックドレス」です。",
      "q49_43": "【正解】（4）\n(1)×：懐剣（かいけん）は帯の右胸下ではなく「左胸下（懐の左側）」に差します。\n(2)×：花嫁衣装の小袖（掛下）の身丈は、かかとの位置ではなく床に裾を引く「お引きずりの丈（身長より長い丈）」に仕立てます。\n(3)×：掛下帯は半幅帯ではなく「丸帯（または袋帯）」を用い、文庫結びや立て矢結びなどに結びます。\n(4)○：花嫁の和装の色直しは、本来は大振袖の二枚重ねが正式とされています。",
      "q49_44": "【正解】（2）\n手掌（手のひら）の図において、Aの親指の付け根のふくらみは「母指球（ぼしきゅう）」、Bの指先の腹の部分は「指腹（しふく）」、Cの中央の指は「中指（ちゅうし）」です。したがって（2）が正解です。",
      "q49_45": "【正解】（1）\nコームの部位のうち、コームの目に入った毛髪を一線にそろえる働きをするのは（1）「歯」（および峰・背）です（肩は歯の両端の補強部、歯元は毛髪を引き起こし垂直に立てて支える部分、歯先は頭皮に接して毛髪を引き起こす手引きをする部分です）。",
      "q49_46": "【正解】（3）\n(1)○・(2)○・(4)○：ヘッドスパによる毛穴クレンジング、頭部マッサージによる血行促進、リラクゼーション効果は正しい記述です。\n(3)×（誤り）：ヘッドスパでは頭皮環境の改善だけでなく、毛髪のダメージ補修や髪質改善のためのヘアトリートメントも同時に組み合わせて行うのが一般的です。",
      "q49_47": "【正解】（3）\n図は平行な縦線に斜めの短い線を交差させることで、縦線同士が傾いて見える「ツェルナー錯視」であり、幾何学的錯視のうち（3）「角度・方向の錯視」に該当します。",
      "q49_48": "【正解】（1）\n(1)○：パネルの面を頭皮面に対して直角（90度）に引き出すことを「オンベース」といいます。\n(2)×：パネルの幅が同じなら、パネルの長さが「長い」ほうが両端の引き寄せ角度差が小さく、誤差が小さくなります。\n(3)×：パネルの長さが同じなら、パネルの幅が「狭い」ほうが両端の距離差が小さく、誤差が小さくなります。\n(4)×：セイムレングスカットはすべてのパネルを頭皮に対して90度の「オンベース」に引き出してカットします。",
      "q49_49": "【正解】（2）\nフルウェーブを形成するにはロッドの「3回転分」の毛髪の長さが必要です。直径10mm（1.0cm）のロッドの1回転の円周は 1.0 × 3.14 ＝ 3.14cm なので、3回転分は 3.14 × 3 ＝ 9.42cm（約9.4cm）となり、（2）が正解です。",
      "q49_50": "【正解】（4）\n(1)×：毛髪診断はシャンプー前の「ドライヘア」とシャンプー後の「ウェットヘア」の両方の状態で行います。\n(2)×：ウェット状態でワインディングした後に第1剤を塗布する方法は「水巻き」といいます（あらかじめ第1剤を塗布しながら巻くのが「つけ巻き」です）。\n(3)×：ウェーブの大小は放置タイムではなく主に「ロッドの太さ」によって決まります。\n(4)○：テストカール時の適正なカールの直径は、使用したロッドの直径の約2.5倍（1.5〜2.5倍）です。",
      "q49_51": "【正解】（1）\n(1)○：ローラーカーリングでは、毛先がばらけないよう中心に集めて巻くことで、平行な広がりと応用性に富んだムーブメントが得られます。\n(2)×：生え際で立ち上がりを求める場合は、ベースを厚くすると角度が下がるため、適度なベース幅でアップステムに巻きます。\n(3)×：最もボリュームが出るのは90度（オンベース）ではなく、135度（45度アップステム）で巻いた場合です。\n(4)×：ダウンステムでボリュームを抑える場合、ベースを厚く取りすぎると根元がたるんでローラーのおさまりが悪くなります。",
      "q49_52": "【正解】（2）\n(1)○・(3)○・(4)○：永久染毛剤の2分類、半永久染毛料の色持ち（約2〜4週間）、脱色剤による接触皮膚炎は正しい記述です。\n(2)×（誤り）：カラースプレーやヘアチョークなどの「一時染毛料」は毛髪表面に色素を付着させるだけなので、「1回のシャンプーで簡単に色落ち」します。",
      "q49_53": "【正解】（1）\n(1)○：施術中にグルーやリムーバーが目に入った場合は、こすらず直ちに流水（または洗眼液）で洗い流し、速やかに眼科医の診察を受けてもらいます。\n(2)×：施術中はソフト・ハードを問わずコンタクトレンズは必ず外してもらいます。\n(3)×：再来時も体調や目元の変化を確認するためカウンセリングは毎回行います。\n(4)×：衛生面およびグルーの接着力を高めるため、アイメイクアップは必ず落としてから施術します。",
      "q49_54": "【正解】（2）\n日本髪の結髪用櫛のうち、歯が粗く長い（2）「鬼歯（おにば）」は、鬢（びん）や髱（たぼ）の裏側から逆毛を立ててふくらませたり形を整えたりするために使います。（1）表面の毛流れを仕上げるのは「すき櫛（細歯）」、（4）最初に髪をとかすのは「荒櫛（解き櫛）」です。",
      "q49_55": "【正解】（4）\n(1)×：腰ひもや伊達締めの結び目を体の中心（背骨やみぞおちの真上）にすると、帯の下でゴロゴロして痛みの原因になるため、中心を避けて左右にずらして結びます。\n(2)×：第一礼装の留袖では、半襟・足袋・帯揚げ・帯締めは「白（または金銀）」を用います（色物は用いません）。\n(3)×：大柄な人や背の高い人の帯幅は、全体のバランスをとるため「やや広め」にします。\n(4)○：若い人の帯幅は、若々しく華やかに見せるため「広め」にします。",
      "q48_01": "【正解】（4）\n(1)○・(2)○・(3)○：外国での業務経験者の養成施設履修義務、理容・美容養成施設間の課目一部免除制度、無免許営業歴がある者の相対的欠格事由はすべて正しい記述です。\n(4)×（誤り）：伝染性の疾病にかかっていることは美容師免許交付の欠格事由ではなく（免許は取得可能）、実際に就業する際の業務停止処分の対象事由です。",
      "q48_02": "【正解】（2）\n(1)○：伝染性疾病にかかり就業が公衆衛生上不適当なときは業務停止処分の対象となります。\n(2)×（誤り）：美容師が業務停止処分に違反して業務を行ったときは、罰金ではなく厚生労働大臣による「免許取消処分」の対象となります。\n(3)○：精神機能の障害により業務を適正に行えないときは免許取消処分の対象となります。\n(4)○：免許取消処分後に引き続き美容の業を行ったときは、無免許営業として30万円以下の罰金の対象となります。",
      "q48_03": "【正解】（4）\n(1)×：美容所の開設者（経営者）は美容師免許を持っていなくてもなれます。\n(2)×：会社の福利厚生のための美容所であっても、反復継続して業として行う場合は開設の届出が必要です。\n(3)×：開設届出事項には美容師だけでなく「その他の従業者の氏名」も含まれます。\n(4)○：美容所の開設届には、従事する美容師について指定伝染性疾病（結核・伝染性皮膚疾患）の有無に関する医師の診断書を添付しなければなりません。",
      "q48_04": "【正解】（1）\n(1)○：美容師が出張美容を行う際も美容師法に基づく衛生上必要な措置を講じる義務があり、怠ったときは業務停止処分の対象となります。\n(2)×：出張美容が認められる場合は、条例だけでなく「美容師法施行令（政令）」でも定められています。\n(3)×：家族の育児や介護のため美容所に行けない者に対する出張美容は認められています。\n(4)×：出張美容が認められない場所で美容師が業を行った場合は、その美容師に対する「業務停止処分」の対象であり、美容所の閉鎖処分ではありません。",
      "q48_05": "【正解】（1）\na○：管理美容師を設置すべき美容所に設置しないときは、美容所の閉鎖処分の対象となります。\nb○：構造設備の検査確認を受けずに美容所を使用したときは、30万円以下の罰金の対象となります。\nc×：開設者が衛生措置を講じなかったときは「美容所の閉鎖処分」の対象であり、罰金ではありません。\nd×：立入検査を妨害したときは「30万円以下の罰金」の対象であり、閉鎖処分ではありません。\nよって正しい組合せは aとb の（1）です。",
      "q48_06": "【正解】（3）\n(1)×：標準営業約款は全国生活衛生営業指導センターが定めるもので、料金を規制するものではありません。\n(2)×：生活衛生同業組合は1つの都道府県に各業種1つしか設立できません。\n(3)○：生活衛生営業指導センターは経営の健全化と衛生水準の維持向上、利用者・消費者の利益擁護のために設置されています。\n(4)×：振興指針を定めるのは都道府県知事ではなく「厚生労働大臣」です。",
      "q48_07": "【正解】（2）\n(1)×：薬機法は医薬品だけでなく医薬部外品・化粧品も規制対象としています。\n(2)○：針先に色素を付けて皮膚に色素を入れるアートメイクは医療行為にあたり、医師法に基づき医師でない美容師等が業として行うことは禁止されています。\n(3)×：美容所から排出される毛髪は産業廃棄物ではなく「事業系一般廃棄物」として処理されます。\n(4)×：個人情報保護法は法改正により5,000人要件が撤廃され、取り扱う個人情報の数にかかわらずすべての事業者が規制対象です。",
      "q48_08": "【正解】（3）\n(1)○・(2)○・(4)○：老齢基礎年金、遺族基礎年金、付加年金の説明はいずれも正しい記述です。\n(3)×（誤り）：国民年金の第1号被保険者（自営業者・学生等）の保険料は、所得の多少にかかわらず「全国一律の定額」です。",
      "q48_09": "【正解】（4）\na○：健康保険の保険者（運営主体）は全国健康保険協会（協会けんぽ）と健康保険組合です。\nb×：健康保険の保険料率は保険者（各健康保険組合や都道府県支部）ごとに設定されており一律ではありません。\nc×：国民健康保険の保険者は国ではなく「都道府県・市町村（特別区）」と「国民健康保険組合」です。\nd○：国民健康保険の保険料（税）は各市区町村や国保組合ごとに設定されています。\nよって正しい組合せは aとd の（4）です。",
      "q48_10": "【正解】（2）\n(1)○・(3)○・(4)○：自己都合退職時の基本手当、労災保険の全労働者適用、通勤災害への保険給付は正しい記述です。\n(2)×（誤り）：「育児休業給付」は雇用保険の重要な給付の一つとして含まれています。",
      "q48_11": "【正解】（4）\n(1)○・(2)○・(3)○：はいずれも保健所の役割・業務として正しい記述です。\n(4)×（誤り）：要介護認定の審査を行う「介護認定審査会」が設置されているのは保健所ではなく、介護保険の保険者である「市町村（および特別区）」です。",
      "q48_12": "【正解】（3）\n(1)○：2015年の平均寿命は男性80.75年、女性86.99年で男女とも80年を超えています。\n(2)○：男女の平均寿命の差は約6.2年で10年以下です。\n(3)×（誤り）：日本の平均寿命は2015年がピークではなく、その後も2020年にかけてさらに延びています。\n(4)○：戦後の平均寿命の大幅な延びには乳児死亡率の低下や感染症対策など公衆衛生の向上が大きく貢献しました。",
      "q48_13": "【正解】（1）\n(1)×（誤り）：日本の成人女性の喫煙者率は、2005年以降上昇しておらず「横ばいから減少傾向（約7〜8%程度）」で推移しています。\n(2)○・(3)○・(4)○：たばこの煙の発がん物質、健康増進法による受動喫煙防止、飲酒による健康障害はいずれも正しい記述です。",
      "q48_14": "【正解】（3）\n(1)○・(2)○・(4)○：春の花粉症、梅雨明け直後の熱中症リスク、冬の季節性インフルエンザはいずれも正しい記述です。\n(3)×（誤り）：高温多湿な「夏季」に発生件数がピークとなるのは腸炎ビブリオやサルモネラ、カンピロバクターなどの「細菌性食中毒」です。ノロウイルスなどの「ウイルス性食中毒」は「冬季（11〜3月頃）」にピークとなります。",
      "q48_15": "【正解】（2）\n(1)×：一酸化炭素は「無色・無臭」の気体であり臭いはありません。\n(2)○：一酸化炭素は赤血球のヘモグロビンとの結合力が酸素の約200〜250倍強いため、酸素の運搬を阻害します。\n(3)×：少量でも頭痛・めまい・吐き気を起こし、高濃度では死に至る猛毒ガスです。\n(4)×：空気中に窒素（約78%）に次いで多く含まれるのは「酸素（約21%）」です。",
      "q48_16": "【正解】（4）\n（1）エイズ（HIV）と（3）SARSは「ウイルス」、（2）アニサキス症は魚介類に寄生する「寄生虫（線虫）」が病原体であり、細菌を病原体とするのは百日せき菌による（4）「百日せき」です。",
      "q48_17": "【正解】（2）\na×：生きた細胞の中だけで増殖するのは「ウイルス」（やリケッチア・クラミジア）であり、一般の細菌は栄養があれば環境中や培地でも単独で増殖できます。\nb○：常在細菌であっても宿主の抵抗力が低下すると日和見感染を起こすことがあります。\nc○：細菌やウイルスが抗菌薬・抗ウイルス薬等に対して抵抗性を持つようになることを「薬剤耐性の獲得」といいます。\nd×：ウイルスは変異によって感染力や病原性が強まる（強毒化する）こともあります。\nよって正しい組合せは bとc の（2）です。",
      "q48_18": "【正解】（3）\n空気感染（飛沫核感染）する代表的な感染症は「結核・麻しん・水痘」です。したがって（3）「麻しん」が正解です。（1）破傷風は土壌からの創傷感染、（2）C型肝炎は血液媒介感染、（4）デング熱は蚊媒介感染です。",
      "q48_19": "【正解】（4）\n(1)○・(2)○・(3)○：2週間以上続くせき、定期健康診断による早期発見、美容師の就業制限対象はいずれも正しい記述です。\n(4)×（誤り）：日本の結核の年間新規登録患者数は近年減少傾向にあるものの、1,000人程度ではなく「約1万人〜1万数千人程度（2015〜2020年頃は約1.2万〜1.8万人）」で推移しています。",
      "q48_20": "【正解】（1）\na○：腸管出血性大腸菌（O157等）は少量の菌でも感染するため、患者や保菌者の便から手指等を介して家族などに二次感染することがあります。\nb○：強い毒性を持つ「ベロ毒素」を産生するのが特徴です。\nc×：病原体（大腸菌）は熱に弱く、75℃・1分間以上の加熱で死滅します。\nd×：潜伏期は約20日ではなく「約3〜8日（平均3〜5日）」です。\nよって正しい組合せは aとb の（1）です。",
      "q48_21": "【正解】（1）\n美容師法第13条等の規定により、皮膚に接する布片（タオル等）は清潔なものを保ち客一人ごとに【A：取りかえ】、皮膚に接する器具は客一人ごとに【B：消毒】することと定められています。また、美容所には器具等を消毒するための【C：消毒】設備を設けなければなりません。",
      "q48_22": "【正解】（1）\n(1)×（誤り）：「かみそり」は血液付着の疑いがない場合であっても、消毒用エタノールで消毒する際は「10分間以上浸す（浸漬）」必要があり、綿やガーゼで表面を拭く（清拭）方法は認められていません。\n(2)○・(3)○・(4)○：くしの0.01%次亜塩素酸ナトリウム浸漬、はさみの煮沸消毒、クリッパー刃の0.1%逆性石けん浸漬はすべて正しい法定消毒法です。",
      "q48_23": "【正解】（4）\na○：紫外線は直進し物体の表面にしか作用しないため、陰になる部分の消毒はできません。\nb×：器具表面に油膜や汚れが付いていると紫外線が遮られ、消毒効果は減弱します。\nc×：80〜100℃・10分間の蒸気消毒では、耐熱性の高い細菌の「芽胞」は不活化できません。\nd○：2〜3分間の煮沸消毒でも細菌の芽胞は不活化しません（芽胞の滅菌には高圧蒸気滅菌等が必要です）。\nよって正しい組合せは aとd の（4）です。",
      "q48_24": "【正解】（3）\na×：消毒用エタノールの濃度は40〜50%ではなく「76.9〜81.4%（約80%）」です。\nb×：逆性石けんと併用しても消毒効果は減弱しません。\nc○：揮発性が強く引火性があるため火気厳禁です。\nd○：金属を腐食させないため手指や刃物類（はさみ・かみそり等）の消毒に適しています。\nよって正しい組合せは cとd の（3）です。",
      "q48_25": "【正解】（2）\n【希釈計算】5%原液10mLを水で希釈して1,000mLにした場合（100倍希釈）、水溶液の濃度は 5% × 10mL ÷ 1,000mL ＝「0.05%」となります。よって（2）が正解です。",
      "q48_26": "【正解】（2）\n小鼻（鼻翼）の付け根から口角の外側に向かって斜め下方に走る溝（いわゆるほうれい線）は（2）「鼻唇溝（びしんこう）」といいます。（1）人中は鼻下から上唇中央の溝、（3）オトガイ唇溝は下唇とあご先の間の溝です。",
      "q48_27": "【正解】（2）\n骨の髄腔や海綿質の中にある骨髄のうち、赤血球や白血球・血小板をつくる造血作用があるのは（2）「赤色骨髄」です（黄色骨髄は脂肪組織に置き換わったもので造血作用はほとんどありません）。",
      "q48_28": "【正解】（3）\n（1）心筋、（2）皮膚血管の平滑筋、（4）立毛筋はいずれも「交感神経」の興奮により収縮（または心拍促進）しますが、（3）「気管支の平滑筋」は「副交感神経」の興奮によって収縮し（気道が狭くなり）、交感神経の興奮によって弛緩（拡張）します。",
      "q48_29": "【正解】（2）\n眼球において、中央に瞳孔（ひとみ）があり、明暗に応じて瞳孔の大きさを変えて目に入る光の量を調節するカメラの「絞り」の働きをするのは（2）「虹彩（こうさい）」です。",
      "q48_30": "【正解】（1）\n全身からリンパ液を集めたリンパ管は、最終的に鎖骨下付近の静脈角で（1）「静脈」に合流します。",
      "q48_31": "【正解】（4）\n(1)×：表皮は皮膚表面（外側）から順に「角質層 → 顆粒層 → 有棘層 → 基底層」の4層からなります（順番が逆です）。\n(2)×：表皮細胞の約95%を占めるのは「角化細胞（ケラチノサイト）」です。\n(3)×：多量の脂肪を含んだ皮下組織があるのは真皮の外側ではなく「内側（下方）」です。\n(4)○：真皮は表皮の数倍〜十数倍の厚さがあり、膠原線維（コラーゲン）や弾性線維（エラスチン）を含んで皮膚の弾力と強さを保っています。",
      "q48_32": "【正解】（1）\n(1)×（誤り）：毛は皮膚表面に対して垂直ではなく、「斜め」に生えており、一定の毛流（流れ）を持っています。\n(2)○・(3)○・(4)○：毛母の色素細胞、毛隆起への立毛筋の付着、硫黄を含むケラチンタンパク質はいずれも正しい記述です。",
      "q48_33": "【正解】（4）\n(1)○・(2)○・(3)○：脂肪膜の弱酸性、化学的刺激への保護、男性ホルモンによる脂腺発育促進は正しい記述です。\n(4)×（誤り）：エクリン腺の汗は「弱酸性（pH4.5〜6.5程度）」であり、アポクリン腺の汗は「中性〜弱アルカリ性」です（記述が逆になっています）。",
      "q48_34": "【正解】（2）\n(1)×：紫外線のうち波長が最も長いのは「UVA（長波長紫外線）」であり、UVCは最も波長が短い紫外線です。\n(2)○：UVB（中波長紫外線）はエネルギーが高く、UVAに比べて皮膚に対する急性刺激（紅斑・サンバーンを起こす力）が強いです。\n(3)×・(4)×：紫外線により生じる急性の赤い炎症（紅斑）を「サンバーン」といい、数日後にメラニンが産生されて皮膚の色が黒くなることを「サンタン」といいます（説明が逆です）。",
      "q48_35": "【正解】（3）\n（1）伝染性膿痂疹（トビヒ）は細菌、（2）疥癬はヒゼンダニ、（4）頭部白癬（シラクモ）は真菌（白癬菌）が病原体であり、ウイルス（伝染性軟属腫ウイルス）を病原体とするのは（3）「伝染性軟属腫（ミズイボ）」です。",
      "q48_36": "【正解】（2）\n(1)○・(3)○・(4)○：エタノールの溶媒作用、セタノール（高級アルコール）の乳化助剤作用、グリセリン（多価アルコール）の説明は正しいです。\n(2)×（誤り）：メタノール（メチルアルコール）は人体に有毒（失明等の中毒症状）であるため、化粧品への配合は禁止されています。",
      "q48_37": "【正解】（3）\na×：界面活性剤はクリームの乳化剤として不可欠な成分です。\nb×：非イオン（ノニオン）界面活性剤は水溶液中でもイオン化しません。\nc○：陽イオン（カチオン）界面活性剤はマイナスの電荷を帯びた毛髪への吸着性に優れ、リンスやトリートメントに用いられます。\nd○：アルキル硫酸ナトリウム（陰イオン界面活性剤）は泡立ちと洗浄力に優れ、シャンプー剤に用いられます。\nよって正しい組合せは cとd の（3）です。",
      "q48_38": "【正解】（3）\n(1)○：キトサンはカニやエビの甲殻に含まれるキチンから得られる高分子化合物です。\n(2)○：ラノリンは羊毛に付着する脂質から得られる動物性ロウです。\n(3)×（誤り）：じゃ香（ムスク）はジャコウジカの分泌物から得られる代表的な「動物性香料（天然香料）」であり、植物性香料ではありません。\n(4)○：β-カロチンはニンジン等に含まれる橙黄色の天然色素（カロテノイド系色素）です。",
      "q48_39": "【正解】（2）\n(1)○：パラベンは防腐剤です。\n(2)×（誤り）：パラアミノ安息香酸エステルは金属イオン封鎖剤ではなく「紫外線吸収剤」です。\n(3)○：グリセリンは保湿剤です。\n(4)○：BHTは酸化防止剤です。",
      "q48_40": "【正解】（4）\n(1)×：アンモニア水は「アルカリ剤」です。\n(2)×：パラフェニレンジアミンは酸化染毛剤の「染料中間体（酸化染料）」です。\n(3)×：レゾルシンは酸化染毛剤の「調色剤（カップラー）」です。\n(4)○：チオグリコール酸はパーマ剤第1剤の「還元剤」です。",
      "q48_41": "【正解】（3）\n（1）桃割れ、（2）結綿、（4）銀杏返しはいずれも伝統的な「日本髪」であり、明治時代の西洋束髪に該当するのは日露戦争期に流行したひさし髪の（3）「二百三高地髷」です。",
      "q48_42": "【正解】（2）\n(1)○・(3)○・(4)○：明治時代の制服の洋装化、女学生の海老茶袴、宮中礼服の洋装化はいずれも正しい記述です。\n(2)×（誤り）：女性のバス車掌（バスガール）が登場し洋装の制服が採用されたのは明治時代ではなく「大正時代（大正9年〜）」です。",
      "q48_43": "【正解】（3）\n男性の洋装礼装の図において、(1)は昼の正礼装のモーニングコート、(2)は夜の正礼装の燕尾服、（3）の襟に拝絹（光沢のある絹）を用い蝶ネクタイとカマーバンドを合わせたジャケットが夜の準礼装（略礼装）である「タキシード」、(4)はフロックコートです。",
      "q48_44": "【正解】（3）\n(1)×：コーム全体の支えとなりバランスをとるのは「胴（または峰）」です（歯元は毛髪を引き起こし垂直に立てて両側から支える部分）。\n(2)×：毛髪を垂直に立てて両側から支えるのは「歯元」です。\n(3)○：「歯先」は頭皮に接して毛髪を分け取り引き起こす手引きをする部分です。\n(4)×：コームの目に入った毛髪を一線にそろえるのは「峰（背）および歯」ですが、本問の最も的確な正答組合せは（3）です。",
      "q48_45": "【正解】（4）\nシザーズの正しい操作では、【A：薬指】を入れる方の鋏身（静刃）を固定して安定させ、【B：母指（親指）】だけを軽く入れて動かす方の刃が【C：動刃】となります。したがって（4）が正解です。",
      "q48_46": "【正解】（4）\nスキャルプマッサージの基本手技のうち、揉撚法（ペトリサージュ）は（4）「4指と母指を用いてもみほぐす」手技です。（1）は強擦法、（2）は振動法、（3）は圧迫法です。",
      "q48_47": "【正解】（2）\n(1)○・(3)○・(4)○：ドンディスの3基本形（正方形・円・正三角形）、枠組み効果、主観的輪郭線の説明は正しいです。\n(2)×（誤り）：ハの字型の2本の斜線の間に置かれた同じ長さの水平線が、上にある方が長く見える「ポンゾ錯視」は、角度・方向錯視ではなく「距離・大きさの錯視」の代表例です。",
      "q48_48": "【正解】（3）\n(1)×：純鉄は柔らかすぎるため、炭素を加える（炭素鋼にする）ことで刃物としての硬さと切れ味が生まれます。\n(2)×：ステンレス鋼はクロムを含むため炭素鋼に比べて「さびに強い」性質があります。\n(3)○：コバルト鋼はコバルト等を添加した特殊鋼で、炭素鋼に比べて硬く「摩耗に強い（耐摩耗性に優れる）」特徴があります。\n(4)×：刃物用ステンレス鋼にはクロムが「約13%以上」含まれています（3〜6%ではさび止め効果が不十分です）。",
      "q48_49": "【正解】（3）\n(1)○・(2)○・(4)○：ディープテーパー、ボスサイドテーパー（両面削ぎ）、ノーマルテーパーの説明は正しいです。\n(3)×（誤り）：「ポインティングカット」は毛先を不揃いにギザギザに尖らせて動きを出す技法です。パネルの外側の面をテーパーする技法は「アウトサイドテーパーカット」といいます。",
      "q48_50": "【正解】（2）\n(1)×：ウェット状態でワインディングした後に第1剤を塗布する方法は「水巻き」です。\n(2)○：ダメージ部や既パーマ部にあらかじめトリートメント剤を塗布して巻く「トリートメント巻き（保護巻き）」は、第1剤の過剰な作用をセーブしかかりすぎや損傷を防ぐために行います。\n(3)×：フルウェーブにはロッドの「3回転分（約2.5〜3回転）」の毛髪の長さが必要です。\n(4)×：テストカールは「第1剤塗布後（第2剤塗布前）」に行います。",
      "q48_51": "【正解】（1）\nピンを取った後のカールウェーブの図を見ると、毛先（内側）のウェーブ幅が狭く、根元（外側）に向かうにつれてウェーブ幅が広くなっています。この特徴を持つのは毛先から巻く（1）「クロッキノールカール」です。",
      "q48_52": "【正解】（1）\n日本人の太くて硬く黒い毛髪（硬毛・太毛）は、赤褐色のユウメラニンが多いため脱色時に【A：赤み系】が出やすく、また薬剤が浸透しにくいため明るさは【B：出にくい】特徴があります。そのため希望色より明度の【C：高い（明るい）】染毛剤を選択するとよいとされています。",
      "q48_53": "【正解】（1）\nマニキュア（ネイルケア＆カラー）の基本手順は、手指消毒 → エナメル除去 → カウンセリング → 爪の形・長さを整える【A：ファイリング】 → 爪表面を滑らかにする【B：バッフィング】 → キューティクル処理（フィンガーボール・ケア） → マッサージ → 油分除去・ベース・【C：カラーリング】・トップコート → 保湿 の順に行います。",
      "q48_54": "【正解】（2）\n(1)×：まつ毛の毛周期は頭髪に比べて短いです。\n(2)○：グルーが完全に硬化するまでの施術後最低5〜6時間は、洗顔や入浴・サウナなど高温・多湿の環境を避けます。\n(3)×：アレルギー反応（遅延型）は施術後数時間〜48時間後以降に現れることが多いです。\n(4)×：リペアは通常「2〜3週間」で行います。",
      "q48_55": "【正解】（1）\n着物の各部名称の図において、Aの背中心から袖先までの長さは「裄（ゆき）」、Bの袖の横幅は「袖幅」、Cの脇のあき部分は「身八つ口」、Dの肩山から裾までの縦の長さは「身丈（みたけ）」です。よって（1）が正解です。",
      "q47_01": "【正解】（1）\n保健所の設置や役割は【A：地域保健法】に定められており、都道府県や【B：保健所設置市又は東京都の特別区】に設置されています（すべての市町村ではありません）。また、これらの自治体には美容所に対して【C：立入検査】を行う環境衛生監視員が配置されています。",
      "q47_02": "【正解】（4）\n(1)×：美容師名簿を備えて登録する事務は都道府県知事ではなく「厚生労働大臣（指定登録機関）」が行います。\n(2)×：氏名を変更したときは2か月以内ではなく「30日以内」に名簿の訂正を申請しなければなりません。\n(3)×：管理美容師講習会の修了は美容師名簿の登録事項ではないため追加申請は不要です。\n(4)○：美容師が死亡（または失踪宣告）したときは、戸籍法による届出義務者が30日（1か月）以内に名簿の登録の消除を申請し免許証を返納しなければなりません。",
      "q47_03": "【正解】（3）\n美容師である従業者が常時【A：2】人以上いる美容所の開設者は管理美容師を置かなければなりません。管理美容師の資格要件は美容師免許を受けた後【B：3】年以上美容の業務に従事し講習会を修了した者であり、専任規定により自ら主として管理する【C：1】か所の美容所のみの管理美容師となることができます。",
      "q47_04": "【正解】（3）\n(1)○：外国籍の者でも美容所の開設者になることができます。\n(2)○：衛生上必要な措置は都道府県等の条例でも定められています。\n(3)×（誤り）：美容所の開設者が講ずべき衛生上必要な措置を怠ったときは、都道府県知事等による「美容所の閉鎖命令（行政処分）」の対象であり、そのこと自体による罰金刑の規定はありません。\n(4)○：施術者全員が理容師・美容師双方の資格を有するときは重複開設が認められます。",
      "q47_05": "【正解】（2）\n(1)×：美容所の名称も届出事項であるため、変更時は速やかに変更届が必要です。\n(2)○：管理美容師を設置すべき美容所の開設者は、開設届に管理美容師の氏名及び住所を記載して届け出なければなりません。\n(3)×：開設届出事項の変更は30日以内ではなく「速やかに」届け出なければなりません。\n(4)×：開設の届出を怠って無届で美容所を開設した場合は「30万円以下の罰金」の対象です。",
      "q47_06": "【正解】（4）\na○：無免許で美容を業とした場合は30万円以下の罰金の対象となります。\nb×：業務停止処分に違反した場合は「免許取消処分」の対象であり、罰金刑ではありません。\nc×：管理美容師を設置しない場合は「美容所の閉鎖命令」の対象であり、罰金刑ではありません。\nd○：構造設備の検査確認前に美容所を使用した場合は30万円以下の罰金の対象となります。\nよって正しい組合せは aとd の（4）です。",
      "q47_07": "【正解】（1）\n生衛法において、業種ごとに振興指針を定めるのは【A：厚生労働大臣】であり、その指針に基づいて各都道府県の【B：生活衛生同業組合】が振興計画を策定します。また、サービス内容の表示や損害賠償確保について全国生活衛生営業指導センターが定めるのは【C：標準営業約款】です。",
      "q47_08": "【正解】（3）\n(1)○・(2)○・(4)○：所得税・法人税、源泉所得税の翌月10日納付、申告義務違反への加算税・延滞税はいずれも正しい記述です。\n(3)×（誤り）：固定資産税は所有する土地・家屋・償却資産の資産価値に対して課される税金であるため、経営が赤字（損失）であっても納付は免除されず支払う義務があります。",
      "q47_09": "【正解】（2）\n(1)○・(3)○・(4)○：労働条件の最低基準、徒弟の酷使禁止、採用時の労働条件明示義務はいずれも正しい記述です。\n(2)×（誤り）：労働基準法は、同居の親族のみを使用する場合を除き、従業員を「1人でも」使用している美容所に適用されます（5人未満でも適用されます）。",
      "q47_10": "【正解】（3）\na×：介護保険の運営主体（保険者）は都道府県ではなく「市町村及び特別区」です。\nb×：介護保険の被保険者は「65歳以上の者」と「40歳以上65歳未満の医療保険加入者」であり、20歳以上すべてではありません。\nc○：介護保険には要介護者への介護給付のほか、要支援者への「予防給付」があります。\nd○：介護給付を受けるには市町村から要介護認定を受ける必要があります。\nよって正しい組合せは cとd の（3）です。",
      "q47_11": "【正解】（4）\n2015年の日本の人口動態統計において、(1)心疾患死亡者数（第2位）の方が肺炎死亡者数より大きく、(2)女性の平均寿命の方が男性より長く、(3)男性の粗死亡率の方が女性より高くなっています。少子高齢化・人口減少期にあるため、（4）「A：死亡数（約129万人） ― B：出生数（約100.6万人）」のみAの方が大きくなっています。",
      "q47_12": "【正解】（2）\n(1)○・(3)○・(4)○：脳血管疾患死亡率の減少、40歳代以降の虚血性心疾患の増加、生活習慣改善による2型糖尿病の予防は正しい記述です。\n(2)×（誤り）：悪性新生物（がん）は高齢化により粗死亡率は増えているものの、年齢構成を補正した「年齢調整死亡率」は医療の進歩や検診・禁煙の普及により「減少（低下）傾向」にあります。",
      "q47_13": "【正解】（3）\n2015年（平成27年）国勢調査における日本の65歳以上高齢者人口は「約3,347万人（約3,400万人、高齢化率26.6%）」であり、（3）が正解です。",
      "q47_14": "【正解】（1）\n(1)×（誤り）：室内の天井や壁に発生する黒カビ（クラドスポリウムやアスペルギルス等）の胞子は、吸い込むと気管支ぜんそくやアレルギー性鼻炎、過敏性肺炎などの「アレルギー反応を引き起こす原因（アレルゲン）」となります。\n(2)○・(3)○・(4)○：はいずれもカビとダニに関する正しい記述です。",
      "q47_15": "【正解】（4）\n(1)○・(2)○・(3)○：下水道の役割、放流水質の規制、下水道未整備地域での浄化槽の活用はいずれも正しい記述です。\n(4)×（誤り）：浄化槽の設置、保守点検、清掃および製造等については「浄化槽法」という法律によって厳格に定められています。",
      "q47_16": "【正解】（2）\n感染症法に基づき就業制限の対象となるのは一類・二類・三類感染症および新型インフルエンザ等感染症です。選択肢のうち b「結核（二類感染症）」と c「エボラ出血熱（一類感染症）」が就業制限の対象であり、五類感染症であるaエイズやd梅毒は対象外です。よって bとc の（2）が正解です。",
      "q47_17": "【正解】（1）\n(1)×（誤り）：予防接種法における接種は、かつての「義務（罰則付き強制）」から、個人の意思と副反応リスクへの理解を尊重する「努力義務（受けるよう努めなければならない）」へと改められています（逆になっています）。\n(2)○・(3)○・(4)○：はいずれも予防接種法に関する正しい記述です。",
      "q47_18": "【正解】（1）\n(1)○：ペストの病原体は「ペスト菌（細菌）」です。\n(2)×：破傷風の病原体は原虫ではなく「破傷風菌（細菌）」です。\n(3)×：ジフテリアの病原体はウイルスではなく「ジフテリア菌（細菌）」です。\n(4)×：デング熱の病原体は蠕虫ではなく「デングウイルス（ウイルス）」です。",
      "q47_19": "【正解】（3）\n妊娠中の母体から胎児へ胎盤を介して胎内感染（垂直感染）し、先天性風しん症候群を引き起こすことがあるのは（3）「風しん」です。（1）腸管出血性大腸菌と（4）コレラは経口感染、（2）百日せきは飛沫感染です。",
      "q47_20": "【正解】（4）\n感染症予防の3原則は、(1)「感染源に関する対策」、(2)「感染経路に関する対策」、(3)「感受性宿主に関する対策（宿主の感受性対策）」の3つであり、（4）「個人予防対策」という区分は3原則の名称には含まれません。",
      "q47_21": "【正解】（1）\n(1)×（誤り）：紫外線は繊維の奥や折り重なった陰の部分には届かないため、タオルやケープなどの布片類の消毒には「適していません」（布片類には蒸気消毒や煮沸消毒、次亜塩素酸ナトリウム消毒を用います）。\n(2)○・(3)○・(4)○：はいずれも紫外線消毒の正しい記述です。",
      "q47_22": "【正解】（3）\n(1)×：かみそりの法定消毒法に蒸気消毒は含まれていません（煮沸・エタノール・次亜塩素酸ナトリウムを用います）。\n(2)×：蒸気消毒（10分以上）は煮沸消毒（2分以上）より時間が長くなります。\n(3)○：美容所で用いるタオル蒸し器（流通蒸気消毒器）は密閉加圧しないため、器内の圧力は「大気圧と同じ」です。\n(4)×：80〜100℃の蒸気消毒では細菌の芽胞は不活化できません。",
      "q47_23": "【正解】（1）\n(1)○：消毒用エタノール水溶液は無色透明で特有の芳香と揮発性・引火性があります。\n(2)×：次亜塩素酸ナトリウム水溶液に「引火性」はありません。\n(3)×：両性界面活性剤水溶液は赤桃色ではなく「無色〜微黄色」です（赤桃色なのはグルコン酸クロルヘキシジン製剤です）。\n(4)×：逆性石けんは一般の石けんと併用すると消毒力が著しく「低下」します。",
      "q47_24": "【正解】（2）\n(1)×：5%液を50倍希釈すると 5% ÷ 50 ＝ 0.1%水溶液になります（0.01%にするには500倍希釈）。\n(2)○：10%逆性石けんを100倍希釈すると 10% ÷ 100 ＝「0.1%水溶液」になり正しい記述です。\n(3)×：20%液を200倍希釈すると 20% ÷ 200 ＝ 0.1%水溶液になります（0.05%にするには400倍希釈）。\n(4)×：15%液を150倍希釈すると 15% ÷ 150 ＝ 0.1%水溶液になります。",
      "q47_25": "【正解】（2）\n「血液が付着している」器具の法定消毒法は、①煮沸消毒（2分以上）、②0.1%以上の次亜塩素酸ナトリウム水溶液浸漬（10分以上：b）、③消毒用エタノール浸漬（10分以上：c）の3種類のみです。aの蒸気消毒やdの紫外線消毒は血液付着器具には使用できません。よって正しい組合せは bとc の（2）です。",
      "q47_26": "【正解】（4）\n関節の運動範囲において、球状の関節頭が関節窩にはまり込み、前後・左右・回旋など多方向に最も広く自由に運動できるのは、肩関節や股関節にみられる（4）「球関節」です。",
      "q47_27": "【正解】（4）\n（1）眼輪筋、（2）口輪筋、（3）前頭筋はいずれも顔面の皮膚を動かす「表情筋（顔面神経支配）」ですが、（4）「側頭筋」は下顎骨を引き上げて咀嚼を行う「咀嚼筋（三叉神経支配）」であり表情筋には含まれません。",
      "q47_28": "【正解】（2）\n交感神経が優位に機能（興奮）したときは、副腎髄質からのアドレナリン分泌促進、心筋収縮力増強、消化管機能抑制、および（2）「瞳孔散大」が起こります。",
      "q47_29": "【正解】（2）\n眼球の最内層にある「網膜」の視軸上にあり、錐体細胞が密集していて最も視力（解像度）が良いくぼみは（2）「中心窩（ちゅうしんか：黄斑の中央）」です。（1）虹彩と（4）毛様体は中膜（ぶどう膜）、（3）硝子体は眼球内部を満たすゲル状物質です。",
      "q47_30": "【正解】（1）\n心臓と肺の間を巡る血液の「小循環（肺循環）」の経路は、「（1）右心室 → 肺動脈 → 肺の毛細血管 → 肺静脈 → 左心房」です。（2）左心室、（3）脳の毛細血管、（4）門脈はいずれも大循環（体循環）の経路に含まれます。",
      "q47_31": "【正解】（3）\n(1)○・(2)○・(4)○：頭皮の硬さと弾力、体幹背側の皮膚が腹側より厚いこと、耳の皮下脂肪がほとんどないことは正しい記述です。\n(3)×（誤り）：顔の皮膚は部位によって厚さが大きく異なり、眼瞼（まぶた）は全身で最も薄く、鼻や口唇周囲は厚いため均一ではありません。",
      "q47_32": "【正解】（3）\n(1)×：毛根の下端のフラスコ状に膨らんだ部分は「毛球」といいます（毛幹は皮膚表面に出ている部分です）。\n(2)×：手掌や足底には脂腺はまったく存在しません（頭や顔に多く分布します）。\n(3)○：汗腺には全身に分布する「エクリン腺（小汗腺）」と腋窩等に分布する「アポクリン腺（大汗腺）」の2種類があります。\n(4)×：爪の主な成分はエラスチンではなく硬い「ケラチン（硬ケラチン）」です。",
      "q47_33": "【正解】（2）\n(1)○・(3)○・(4)○：寒冷刺激による立毛筋反射（鳥肌）、精神性発汗、弱酸性の脂肪膜による静菌作用は正しい記述です。\n(2)×（誤り）：思春期における脂腺の発育と皮脂分泌の増加は、女性ホルモンではなく「男性ホルモン（アンドロゲン）」の刺激によって促進されます。",
      "q47_34": "【正解】（1）\n(1)×（誤り）：肝臓障害によって血中の胆汁色素（ビリルビン）が皮膚や粘膜に沈着すると、皮膚は紫色ではなく「黄色（黄疸）」になります（紫色になるのはチアノーゼです）。\n(2)○・(3)○・(4)○：はいずれも正しい記述です。",
      "q47_35": "【正解】（4）\n(1)×：伝染性軟属腫（ミズイボ）の病原体は「ウイルス」です。\n(2)×：伝染性膿痂疹（トビヒ）の病原体は「細菌（ブドウ球菌・レンサ球菌）」です。\n(3)×：帯状疱疹の病原体は「ウイルス（水痘・帯状疱疹ウイルス）」です。\n(4)○：尋常性疣贅（いぼ）の病原体は「ヒトパピローマウイルス（ウイルス）」であり正しい組合せです。",
      "q47_36": "【正解】（4）\n溶液において溶媒に溶けている物質を【A：溶質】といい、水のように炭素を含まない溶媒を【B：無機】溶媒（エタノールのように炭素を含む溶媒を有機溶媒）といいます。またエタノールが蒸発する際に熱を奪い皮膚を引き締める作用を【C：収れん】作用といいます。",
      "q47_37": "【正解】（4）\n(1)○：オリーブ油は植物性の「油脂」です。\n(2)○：ホホバ油は液状の「植物性ロウ（ロウ類）」です。\n(3)○：マイクロクリスタリンワックスは石油から得られる固形の「炭化水素」です。\n(4)×（誤り）：ワセリンはシリコーン油ではなく、石油から得られる半固形状の「炭化水素」です。",
      "q47_38": "【正解】（3）\n(1)×：石けんは「陰イオン（アニオン）界面活性剤」です。\n(2)×：第四級アンモニウム塩は「陽イオン（カチオン）界面活性剤」です。\n(3)○：レシチンは「両性界面活性剤」に分類され、大豆や卵黄などから得られます。\n(4)×：ラノリンは界面活性剤ではなく、羊毛から得られる「動物性ロウ（油性原料）」です。",
      "q47_39": "【正解】（1）\n(1)×（誤り）：過酸化水素は酸素を放出して相手を酸化する「酸化剤」として染毛剤第2剤やパーマ剤第2剤に配合されます（還元剤ではありません）。\n(2)○・(3)○・(4)○：チオグリコール酸（還元剤）、臭素酸ナトリウム（酸化剤）、抗酸化剤の働きはいずれも正しい記述です。",
      "q47_40": "【正解】（3）\n(1)○・(2)○・(4)○：パラフェニレンジアミンの酸化重合、脱色剤のメラニン酸化分解、カップラーによる調色は正しい記述です。\n(3)×（誤り）：酸化染料は医薬部外品である「酸化染毛剤（永久染毛剤）」に配合されます。ヘアマニキュア（酸性染毛料・化粧品）に配合されるのは「タール色素（酸性染料）」です。",
      "q47_41": "【正解】（4）\n(1)○・(2)○・(3)○：セシールカット、サーファーカット、ソバージュの説明は正しいです。\n(4)×（誤り）：「後頭部で束ねた毛束を子馬のしっぽのように垂らした髪型」は「ポニーテール」です（ヘップバーンスタイルは映画『ローマの休日』で流行した短い前髪とショートカットまたはアップスタイルです）。",
      "q47_42": "【正解】（1）\n1960〜1970年代の若者男性にはビートルズの（3）マッシュルームカット、ヒッピーやフォークブームの（2）ロングヘア、ソウル・ディスコブームの（4）アフロヘアなどが流行しましたが、（1）「GI刈（アメリカ兵風の角刈り・短髪）」は終戦直後〜1950年代初頭に流行した髪型です。",
      "q47_43": "【正解】（1）\n(1)×（誤り）：1960年代にアメリカのアイビースタイルを日本に紹介し「みゆき族」やアイビーブームを定着させたのは高田賢三ではなく、石津謙介の「VAN（ヴァンジャケット）」です（高田賢三は1970年代にパリでケンゾーのフォークロア等を発表しました）。\n(2)○・(3)○・(4)○：はいずれも1960年代の正しい記述です。",
      "q47_44": "【正解】（4）\n(1)○・(2)○・(3)○：重心線の位置、作業箇所への正対、目の高さへの調整は正しい記述です。\n(4)×（誤り）：肩の関節を固定させて手先だけを細かく動かす作業を行うときは、肘がぶれないよう「肘を体側（脇）につけて安定」させます（肩から大きく動かすときに肘に余裕を持たせます）。",
      "q47_45": "【正解】（4）\n(1)×：母指（親指）で操作する方の刃は「動刃」です（薬指側が静刃）。\n(2)×：濡れたティッシュペーパーを切ったときに、毛を逃がさず「すべらずにスムーズに切れる」ものが良いシザーズです。\n(3)×：開閉時の交点での接触圧は「終始均等」であるものがよいとされます。\n(4)○：動刃と静刃の間には、裏スキと刃線のソリによって「凸レンズ状のあき」が正確につくられているものが軽い力でよく切れます。",
      "q47_46": "【正解】（4）\nヘアアイロンは【A：熱】と物理的な力で毛髪に変化を与えます。ロッド表面にはローション等が焦げ付かないよう【B：フッ素樹脂（テフロン）】加工等を施したものがあります。また、本体内部のニクロム線と電源【C：コード】との接続部分は屈曲等で傷みやすく断線・感電に注意が必要です。",
      "q47_47": "【正解】（3）\nスキャルプトリートメントにおいて、(1)ブラッシングと(2)スキャルプマッサージは「器械的（機械的）方法」、(4)ヘアスチーマーの湿熱利用は「物理的方法」であり、薬剤成分を作用させる（3）「ヘアトニックを用いる方法」が「化学的方法」に分類されます。",
      "q47_48": "【正解】（2）\n(1)○・(3)○・(4)○：黄金比（約1：1.618）、アンバランスの緊張感、ダ・ヴィンチの人体カノンは正しい記述です。\n(2)×（誤り）：人間のプロポーションにおいて、身体に対して頭が相対的に大きい（頭身が低い）と「子どもっぽい（幼児的な）印象」を与え、頭が小さく頭身が高いほど「大人っぽい成熟した印象」を与えます。",
      "q47_49": "【正解】（3）\n(1)×：ブラントカットは毛束を直線的にスパッと切りそろえる技法です（ラインを修整するのはトリミングカット）。\n(2)×：ポインティングカットは刃先を縦・斜めに入れて毛先をギザギザに尖らせる技法です。\n(3)○：スライドカットはシザーズを半開きのまま毛束に沿って滑らせるように削ぎ、毛先を先細りの穂先のような状態にする技法です。\n(4)×：毛量を減らして調整する技法はセニングカットです。",
      "q47_50": "【正解】（2）\n(1)×：薬剤をはじいてパーマがかかりにくいのは「はっ水性毛」です（吸水性毛はかかりやすい）。\n(2)○：パーマ施術前のプレシャンプーには、頭皮への刺激が少なく適度に洗浄力のあるシャンプー剤（油分が残りすぎないもの）が適しています。\n(3)×：かかりすぎるおそれのある毛髪には第1剤の作用が穏やかな「水巻き」や「トリートメント巻き」が適しています。\n(4)×：テストカール時の適正カール径はロッド径の「約2〜2.5倍」です。",
      "q47_51": "【正解】（4）\nストランドカールのベースのうち、三角形の（4）「トライアンギュラーベース」は毛束の方向づけやステムのオーバーラップ（重ね合わせ）がしやすく、スライス線（割れ目）が目立たない仕上げに適しています。",
      "q47_52": "【正解】（1）\n(1)×（誤り）：染まり具合を確認するカラーチェックは、部位による温度差や髪質差があるため1か所だけでなく「複数か所（ネープ・サイド・トップなど）」で行います。\n(2)○・(3)○・(4)○：トーンアップ時のネープからの塗布、おしゃれ染めの塗り分け、白髪染めの塗布順序はいずれも正しい記述です。",
      "q47_53": "【正解】（1）\n(1)×（誤り）：「チップ（ネイルチップ）」は爪の長さを出したりデザインを施したりするために自爪に接着する人工爪プレートそのものであり、チップを貼った上からアクリルやジェル等で覆って補強するのは(2)の「チップオーバーレイ」、自爪の上に直接ジェル等を塗って弱い爪を補強・修復するのは(4)の「ナチュラルネイルオーバーレイ（フローター）」です。",
      "q47_54": "【正解】（2）\n(1)×：施術中に目や体に違和感が生じた場合は、美容師が薬を塗るなどの医療行為は絶対に行わず、直ちに施術を中止して医師の診察を受けてもらいます。\n(2)○：グルーは完全硬化までに時間がかかるため、施術後最低5〜6時間は洗顔・入浴・サウナ等の高温多湿環境を避けます。\n(3)×：リペアの目安はおおむね「2〜3週間」です。\n(4)×：再来時も体調や目元の状態を確認するためカウンセリングが必要です。",
      "q47_55": "【正解】（4）\n日本髪の4構成部分の図において、Aの額の上の部分は「前髪（まえがみ）」、Bの左右側面の張り出しは「鬢（びん）」、Cの後頭部下方の張り出しは「髱（たぼ／つと）」です（頭頂部は髷）。したがって（4）が正解です。",
      "q46_01": "【正解】（3）\n(1)○・(2)○・(4)○：公衆衛生の向上、美容業務の適正な規律、無免許営業の禁止はいずれも美容師法に定められています。\n(3)×（誤り）：「美容業の経営の健全化を促進し、美容業の振興を図る」ことは美容師法ではなく「生活衛生関係営業の運営の適正化及び振興に関する法律（生衛法）」の目的です。",
      "q46_02": "【正解】（2）\n(1)×：美容師の住所は美容師名簿の登録事項ではないため、住所変更による名簿訂正申請は不要です。\n(2)○：氏名（または本籍地都道府県名）を変更したときは、30日以内に美容師名簿の訂正を厚生労働大臣（指定登録機関）へ申請しなければなりません。\n(3)×：免許取消処分を受けたときは、「5日以内」に「厚生労働大臣」へ免許証を返納します。\n(4)×：業務停止処分を受けたときは、速やかに「処分を行った都道府県知事等」へ免許証を提出します。",
      "q46_03": "【正解】（3）\n(1)伝染性疾病での就業、(2)衛生措置義務違反、(4)出張美容違反はいずれも都道府県知事等による「業務停止処分」の対象であり、厚生労働大臣による「免許取消処分」の対象となるのは（3）「法の規定による業務の停止処分に違反して、美容の業をした場合」です。",
      "q46_04": "【正解】（1）\na○：管理美容師は美容師である従業者が常時2人以上の美容所に設置しなければなりません。\nb○：管理美容師は専任である必要があり、同一人が複数の美容所の管理美容師を兼ねることはできません。\nc×：管理美容師は施設だけでなく「美容の業務」についても衛生的に管理する責務があります。\nd×：資格要件は免許取得後「3年以上」の業務従事と、「都道府県知事」指定の講習会修了です（2年以上・厚生労働大臣指定ではありません）。\nよって正しい組合せは aとb の（1）です。",
      "q46_05": "【正解】（4）\n(1)×：美容所の開設者は美容師免許を持っていなくてもなれます。\n(2)×：開設届と構造設備の検査確認は「使用開始前」に受けなければなりません。\n(3)×：福利厚生目的の美容所でも反復継続して業として行う場合は開設の届出が必要です。\n(4)○：相続によって美容所の開設者の地位を承継した相続人は、遅滞なくその旨を都道府県知事等に届け出なければなりません。",
      "q46_06": "【正解】（1）\n(1)○：美容所の開設者が美容師でない者（無免許者）に美容の業務を行わせた場合は、都道府県知事等による「美容所の閉鎖命令」の対象となります。\n(2)×・(4)×：変更届出義務違反や立入検査妨害は「30万円以下の罰金」の対象であり、閉鎖命令ではありません。\n(3)×：美容師自身の精神機能の障害は美容師に対する「免許取消処分」の対象です。",
      "q46_07": "【正解】（2）\n(1)×：適正化規程は過度の競争により正常な経営や衛生水準が阻害されるおそれがある場合に組合が設定するもので、現在はすべて廃止されています。\n(2)○：生活衛生同業組合は、組合員の営業に関する技能の改善向上、経営指導、資金あっせん等を事業としています。\n(3)×：振興指針を定めるのは都道府県知事ではなく「厚生労働大臣」です。\n(4)×：標準営業約款は役務の内容・施設設備の表示・損害賠償の確保の3項目を定めるもので、営業日の統一は定めません。",
      "q46_08": "【正解】（4）\n(1)○・(2)○・(3)○：損益計算書（P/L）の役割と利益計算式、貸借対照表（B/S）の役割はいずれも正しい記述です。\n(4)×（誤り）：貸借対照表において、1年以内に返済しなければならない借金は固定負債ではなく「流動負債」に分類されます（返済期限が1年を超えるものが固定負債です）。",
      "q46_09": "【正解】（4）\n(1)×：国民健康保険の保険者は「都道府県・市町村（特別区）」と「国民健康保険組合」です（全国健康保険協会は健康保険の保険者です）。\n(2)×：国民健康保険の保険料は各市町村や国保組合ごとに定められており全国一律ではありません。\n(3)×：健康保険の保険料は事業主と被保険者が「折半（双方で負担）」します。\n(4)○：健康保険では、育児休業期間中（および産前産後休業期間中）の保険料が申請により免除される制度があります。",
      "q46_10": "【正解】（2）\n(1)○・(3)○・(4)○：雇用保険料の労使負担、労災保険の全労働者適用、通勤災害の補償はいずれも正しい記述です。\n(2)×（誤り）：雇用保険の基本手当（失業手当）は、自己都合で退職した場合であっても、受給資格期間を満たしていれば（所定の待期・給付制限期間経過後に）支給されます。",
      "q46_11": "【正解】（1）\n(1)○：日本の年齢別死亡率は、0歳（乳児期）でやや高く、その後急減して「10〜14歳（思春期のころ）」で最も低くなり、以後は加齢とともに上昇するJ字型（またはU字型）の曲線を描きます。\n(2)×：人口1,000人に対する1年間の死亡数は「粗死亡率」です。\n(3)×・(4)×：高齢化に伴い、がんによる死亡数および粗死亡率は増加（上昇）傾向にあります。",
      "q46_12": "【正解】（2）\n(1)×：平均寿命の伸長には公衆衛生の向上や医療の発展が大きく寄与しています。\n(2)○：2015年の日本の平均寿命は男性80.75年、女性86.99年で、「男女とも80年以上」となっています。\n(3)×：2015年時点で香港などが上回っており男女とも世界第1位ではありません。\n(4)×：男女の平均寿命の差は約6.2年であり、3年以下ではありません。",
      "q46_13": "【正解】（3）\n（1）がん、（2）脳卒中、（4）心臓病はいずれも生活習慣が発症・進行に深く関与する代表的な生活習慣病（3大生活習慣病）ですが、（3）「肺炎」は細菌やウイルス等の感染によって起こる感染症であり、生活習慣病には該当しません。",
      "q46_14": "【正解】（2）\n(1)○・(3)○・(4)○：不完全燃焼による発生、ヘモグロビンとの強固な結合、一酸化炭素中毒の症状はいずれも正しい記述です。\n(2)×（誤り）：一酸化炭素は「無色・無臭（臭いがない）」の気体であるため、発生に気づきにくく中毒事故を起こしやすい危険性があります。",
      "q46_15": "【正解】（2）\n(1)○・(3)○・(4)○：直射日光と天空光、局所照明と全般照明、直接照明の特徴はいずれも正しい記述です。\n(2)×（誤り）：一般に日常生活に不自由のない明るさは「150〜300ルクス程度以上」であり、10ルクスはろうそくの明かりや薄暮程度の暗さであって不十分です。",
      "q46_16": "【正解】（3）\n(1)○：百日せきは飛沫により気道から侵入します。\n(2)○：腸管出血性大腸菌は汚染された飲食物から経口感染します。\n(3)×（誤り）：C型肝炎は動物や節足動物（蚊等）ではなく、主に汚染された「血液や体液」を介して感染します。\n(4)○：エイズ（HIV）は性的接触や傷口・血液を介して感染します。",
      "q46_17": "【正解】（3）\n(1)×：細菌の成分の約70〜80%は「水分」です。\n(2)×：細菌の芽胞は熱や乾燥・消毒薬に対して極めて「強い」抵抗性を持っています。\n(3)○：破傷風菌などの偏性嫌気性菌は、酸素があると発育・増殖できません。\n(4)×：生きた細胞内でないと増殖できないのは「ウイルス」等であり、一般の細菌は人工培地等でも増殖できます。",
      "q46_18": "【正解】（4）\n(1)○・(2)○・(3)○：細菌の変異による性質の獲得・喪失、病原性の低下（弱毒化）、薬剤耐性の獲得はいずれも正しい記述です。\n(4)×（誤り）：細菌は変異によって鞭毛や莢膜を失ったり集落（コロニー）の形状が変わるなど、「形態が変化すること」もあります。",
      "q46_19": "【正解】（1）\n(1)×（誤り）：病原体が体内に侵入しても定着・増殖できずにそのまま体外へ排出された場合は「感染」とはいいません（病原体が体内に定着・増殖することが感染の定義です）。\n(2)○・(3)○・(4)○：日和見感染症、不顕性感染、潜伏期の定義はいずれも正しい記述です。",
      "q46_20": "【正解】（2）\na×：2015年の日本の結核新登録患者数は約100人ではなく「約1万8千人」です。\nb○：結核の感染経路は主として飛沫核感染（空気感染）です。\nc○：早期発見のため学校や職場等で定期の健康診断（胸部エックス線検査等）が行われています。\nd×：結核菌は肺だけでなく、リンパ節・骨・関節・腎臓・髄膜など全身の臓器を侵すことがあります（肺外結核）。\nよって正しい組合せは bとc の（2）です。",
      "q46_21": "【正解】（3）\n微生物を殺すことの総称は【A：殺菌】であり、そのうち病原微生物を殺すか除去して感染力をなくすことを【B：消毒】といい、芽胞を含むあらゆる微生物を殺すか除去して無菌状態にすることを【C：滅菌】といいます。",
      "q46_22": "【正解】（4）\na○：血液が付着していないブラシを0.1%以上の逆性石けん水溶液に10分間以上浸すのは正しい方法です。\nb×：血液が付着した器具に紫外線消毒は適用できません。\nc×：かみそりをエタノールで消毒する場合は「10分間以上浸す（浸漬）」必要があり、綿やガーゼで拭く方法は認められていません。\nd○：血液が付着したくしを0.1%以上の次亜塩素酸ナトリウム水溶液に10分間以上浸すのは正しい方法です。\nよって正しい組合せは aとd の（4）です。",
      "q46_23": "【正解】（2）\n(1)○・(3)○・(4)○：湿熱と乾熱の比較、対象に適した消毒薬濃度、蒸気消毒と煮沸消毒の時間比較は正しい記述です。\n(2)×（誤り）：消毒薬水溶液による殺菌は化学反応であるため、温度が低いと効果が低下し、適度な温度（20℃前後以上）の方が効果が高くなります。",
      "q46_24": "【正解】（1）\n(1)×（誤り）：消毒用エタノールは非イオン性のアルコールであるため、陽イオン界面活性剤である逆性石けんと併用しても効果は低下しません（普通石けんと併用して効果が低下するのは逆性石けんや両性界面活性剤です）。\n(2)○・(3)○・(4)○：芽胞に無効であること、揮発性、引火性はいずれも正しい記述です。",
      "q46_25": "【正解】（2）\n【希釈計算】5%原液から0.1%水溶液を作る希釈倍数は 5% ÷ 0.1% ＝「50倍希釈」です。したがって5%原液5mLを用いる場合、完成する溶液の全体量は 5mL × 50倍 ＝「250mL」（水245mLを加える）となり、（2）が正解です。",
      "q46_26": "【正解】（4）\n顔面において目の下外側に位置する「頬骨部（きょうこつぶ）」と直接接しているのは、目の周囲のくぼみである（4）「眼窩部（がんかぶ）」です。",
      "q46_27": "【正解】（3）\n骨の構造のうち、赤血球や白血球・血小板をつくる造血作用を持つのは、海綿質のすき間などにある（3）「赤色骨髄」です。",
      "q46_28": "【正解】（2）\n眼の周囲を輪状に取り囲み、収縮することでまぶた（眼瞼）を閉じる働きをする骨格筋（表情筋）は（2）「眼輪筋」です。（1）オトガイ筋はあご先、（3）頬筋は頬、（4）前頭筋は眉を引き上げ額に横じわをつくる筋です。",
      "q46_29": "【正解】（2）\n神経系は「中枢神経系（脳と脊髄）」と「末梢神経系（脳神経・脊髄神経／体性神経・自律神経）」に大別されます。したがって中枢神経系に分類されるのは（2）「脊髄」です。",
      "q46_30": "【正解】（1）\n音の振動は（4）鼓膜 →（3）耳小骨（ツチ骨・キヌタ骨・アブミ骨） → 内耳の（2）蝸牛へと伝わって聴覚を生じます。内耳の（1）「前庭」は三半規管とともに体の傾きや直線加速度を感じる「平衡感覚器」であり、聴覚には関与しません。",
      "q46_31": "【正解】（1）\n(1)○：表皮は内側から基底層・有棘層・顆粒層・角質層の4つの層からなります。\n(2)×：アレルゲンを取り込んで抗原提示するのは「ランゲルハンス細胞」です。\n(3)×：約1か月かけて基底細胞から角質細胞に分化（角化）するのは「角化細胞（ケラチノサイト）」です。\n(4)×：色素細胞（メラノサイト）の数は人種による差はほとんどなく、産生されるメラニン量が異なります。",
      "q46_32": "【正解】（1）\n(1)×（誤り）：毛の中心部にある「毛髄質（メデュラ）」は太い硬毛には存在しますが、産毛（軟毛）や細い毛には存在しないことが多いため、すべての毛にあるわけではありません。\n(2)○・(3)○・(4)○：毛幹と毛根、毛母での毛の形成、含硫タンパク質のケラチンはいずれも正しい記述です。",
      "q46_33": "【正解】（3）\n(1)○・(2)○・(4)○：皮膚呼吸は全呼吸の1%未満でほとんど行われないこと、脂肪膜とケラチンの保護作用、精神性発汗は正しい記述です。\n(3)×（誤り）：健康な皮膚表面の脂肪膜（皮脂膜）はpH7（中性）ではなく「pH4.5〜6.5の弱酸性」であり、酸に弱い病原細菌の発育を抑制する作用（自浄作用）があります。",
      "q46_34": "【正解】（4）\n(1)○・(2)○・(3)○：ボツリヌス毒素による表情じわ治療、便秘によるニキビ等の悪化、男性ホルモンによる脂腺発育は正しい記述です。\n(4)×（誤り）：長波長紫外線（UVA）は真皮まで到達してコラーゲン等を変性させるとともに、色素細胞（メラノサイト）を「活性化（刺激）」してメラニン色素を黒化（サンタン）させます（働きを弱めるのではありません）。",
      "q46_35": "【正解】（1）\n(1)○：脂漏性皮膚炎は頭部や顔面など皮脂分泌の多い部位（脂漏部位）に紅斑やフケ状の落屑（らくせつ）がみられる皮膚炎です。\n(2)×：白癬菌は足（足白癬＝水虫）だけでなく、手（手白癬）や爪、頭部にも感染し病変を生じます。\n(3)×：アレルギー性接触皮膚炎は感作が成立していると、原因物質を薄めても微量で発症します。\n(4)×：尋常性疣贅（いぼ）の原因は真菌ではなく「ヒトパピローマウイルス（ウイルス）」です。",
      "q46_36": "【正解】（4）\n(1)×：水は炭素を含まない「無機溶媒」です。\n(2)×：メタノールは有毒なため化粧品への配合は禁止されています。\n(3)×：イソプロパノールにはエタノールと同様に強い殺菌力があります。\n(4)○：アセトンはネイルエナメルの皮膜形成剤（ニトロセルロース等）をよく溶かす有機溶媒であり、エナメルリムーバー（除光液）に用いられます。",
      "q46_37": "【正解】（4）\n(1)×：セタノールは「高級アルコール」です。\n(2)×：ワセリンは「炭化水素」です。\n(3)×：ステアリン酸は「高級脂肪酸」です。\n(4)○：システインはケラチンを構成する含硫「アミノ酸」の一種であり正しい組合せです。",
      "q46_38": "【正解】（3）\n(1)○：パラアミノ安息香酸エステルは紫外線吸収剤です。\n(2)○：パラベンは防腐剤です。\n(3)×（誤り）：パラフィン（流動パラフィン・固形パラフィン）は水に溶けない炭化水素であり、「油性原料」としてクリームや口紅等に配合されます（水性原料ではありません）。\n(4)○：パラフェノールスルホン酸亜鉛は収れん剤です。",
      "q46_39": "【正解】（1）\n(1)×（誤り）：システインはパーマ剤の「第1剤」に含まれ、シスチン結合を切断する「還元剤」として働きます。\n(2)○・(3)○・(4)○：臭素酸ナトリウム（第2剤・酸化剤）、チオグリコール酸（第1剤・還元剤）、モノエタノールアミン（第1剤・アルカリ剤）はいずれも正しい記述です。",
      "q46_40": "【正解】（2）\na×：酸性染毛料（ヘアマニキュア）は医薬部外品ではなく「化粧品」です。\nb○：一度染めた酸化染料を分解脱色する「脱染剤」には、過酸化水素に加えて酸化力の強い「過硫酸塩（過硫酸アンモニウム等）」が用いられます。\nc○：酸化染毛剤第2剤の過酸化水素から放出される活性酸素によりメラニン色素が分解（脱色）されます。\nd×：パラフェニレンジアミンは無色の酸化染料（染料中間体）であり、直接染料ではありません。\nよって正しい組合せは bとc の（2）です。",
      "q46_41": "【正解】（4）\n(1)○・(2)○・(3)○：和装に束髪の組み合わせ、束髪の衛生性と利便性、知識層・働く女性への普及はいずれも正しい記述です。\n(4)×（誤り）：明治時代に西洋束髪が登場した後も、伝統的な「日本髪（丸髷や島田髷・銀杏返しなど）」は一般女性の日常や晴れの日の髪型として明治・大正を通じて広く結われ続けました。",
      "q46_42": "【正解】（3）\n1970年代に流行した、トップからレイヤーを入れて襟足（ネープ）を長めに残し、段々に削いでオオカミのたてがみのように野性的に仕上げた髪型は（3）「ウルフカット」です。",
      "q46_43": "【正解】（2）\n本来は街着（外出着）である小紋のうち、極小の柄で型染めされた（2）「江戸小紋」は、背中に「一つ紋」を付けることで色無地と同格の「女性の準礼装（略礼装）」として着用できます。（1）紬や（3）浴衣には紋を付けても礼装にはなりません。",
      "q46_44": "【正解】（2）\n頭部の基準点の図において、Aの頭頂部最高点は「トップポイント」、Bの後頭部上方の角の二等分線交点は「ゴールデンポイント」、Cの耳珠上縁（耳の付け根）は「イヤーポイント」です。よって（2）が正解です。",
      "q46_45": "【正解】（1）\nシザーズが応用している「てこの原理」において、毛髪を切断する刃部のAは「作用点」、2枚の刃が交わるネジ部分のBは「支点」、指を入れて力を加える指穴部分のCは「力点」です。したがって（1）が正解です。",
      "q46_46": "【正解】（4）\nスキャルプマッサージ手技のうち、（1）タッピング（指先で叩く）、（2）ハッキング（手刀で叩く）、（3）カッピング（くぼませた手掌で叩く）はいずれも「打法（叩打法）」ですが、（4）「ストローキング」は手のひらや指腹で軽く滑らせる「軽擦法」であり打法には該当しません。",
      "q46_47": "【正解】（2）\n(1)○・(3)○・(4)○：幾何学的錯視の2分類、面の構成要素、ヘアスタイルのテクスチャーは正しい記述です。\n(2)×（誤り）：ドンディスが提唱した形の3つの基本形は「正方形・円・正三角形」であり、正五角形ではありません。",
      "q46_48": "【正解】（4）\nパネルと頭皮の角度（ステム）の図において、(1)と(2)は90度より高く引き上げるアップステム、(3)は水平〜オンベース方向、（4）の斜め下方に引き下ろしている角度が「ダウンステム」に該当します。",
      "q46_49": "【正解】（4）\n(1)×：中間リンス（中間水洗）は第2剤ではなく、役割を終えた「第1剤」を洗い流すために行います。\n(2)×：ロッドアウト後のプレーンリンスは、残存する第2剤が髪や頭皮に残らないようぬるま湯で十分に洗い流します。\n(3)×：アフターリンス（酸リンス）は、毛髪に残留した「アルカリ成分」を中和して収れんさせ、等電点（弱酸性）に戻すために行います。\n(4)○：アフターリンス（およびトリートメント）の目的の1つに、パーマ施術中に失われた油分や水分・タンパク質を補い毛髪を保護することがあります。",
      "q46_50": "【正解】（1）\nピンカールのうち、ストランドの根元から巻き始め（根元巻き方式）、根元のループが小さいため根元に強いカール（弾力）が現れ、毛先がサークルの外側に出るフラットなカールは（1）「スカルプチュアカール」です。",
      "q46_51": "【正解】（4）\n(1)○・(2)○・(3)○：プライマリーカラー（赤・黄・青）、明度と彩度、トーンの定義は正しい記述です。\n(4)×（誤り）：プライマリーカラー（第一次色）を2色ずつ混合して作られる色（橙・緑・紫）は「セカンダリーカラー（第二次色・間色）」といいます（カラーサークル＝色相環は各色相を順序よく円環状に並べたものです）。",
      "q46_52": "【正解】（3）\n(1)×：爪が長い場合はキューティクルニッパーではなく「ネイルニッパー（または爪切り）」でカットします（キューティクルニッパーは甘皮処理用です）。\n(2)×：エメリーボードによるファイリングは、二枚爪を防ぐため往復がけはせず「一方向（サイドからセンターへ）」に動かします。\n(3)○：皮膚にはみ出したカラーエナメルは、ウッドスティックの先にコットンを巻いたコットンスティックにリムーバーを含ませて丁寧に拭き取ります。\n(4)×：爪表面の油分・水分除去（プレパレーション）は、ベースコートを塗る「前」に行います。",
      "q46_53": "【正解】（1）\n(1)○：ドローイング技法では、削った芯のかたいアイブロウペンシルを用いて、眉毛を1本1本植え込むように繊細に描きます。\n(2)×：眉山の基本位置は「黒目の外側の端と目尻の間（白目のほぼ中央上）」です。\n(3)×：アイシャドー（パウダー）で眉全体にぼかしや陰影をつけて立体感を出す技法は「シェーディング」といいます。\n(4)×：アーチ形の眉は直線的ではなく、丸みのある緩やかな曲線に描きます。",
      "q46_54": "【正解】（3）\n(1)×：エクステンションの装着は、成長期初期ではなく「成長期の終わりから退行期の初め」が最適です。\n(2)×：地肌（毛根部）から「1〜2mm程度」離して接着します（3mm以上離すと不自然になり持ちも悪くなります）。\n(3)○：まつ毛エクステンションは毛周期や接着剤の劣化により、通常2〜3週間程度でリペアの時期を迎えます。\n(4)×：施術中は安全のためコンタクトレンズを外し、眼鏡の使用を勧めます。",
      "q46_55": "【正解】（1）\n(1)×（誤り）：脇のあきである「身八つ口（みやつぐち）」は「女物（女性用・子ども用）の着物」にのみあり、男物（成人男性用）の着物には身八つ口はありません（人形袖に縫われています）。\n(2)○：女物の着物は腰上げ（おはしょり）をとるため、身丈を着丈より長く仕立てます。\n(3)○：男物の着物は「対丈（ついたけ）」で着るため、身丈＝着丈に仕立てます。\n(4)○：上前（うわまえ：着用者の左側・向かって右側）が上に重なる右前（みぎまえ）に着付けます。",
      "q45_01": "【正解】（4）\n(1)美容所の開設届の受理、(2)構造設備の検査確認、(3)立入検査はいずれも美容所を管轄する「都道府県知事・保健所設置市長・特別区長」の事務ですが、（4）「美容師免許証（免許証明書）の交付」は「厚生労働大臣（指定登録機関：理容師美容師試験研修センター）」が行う国の事務です。",
      "q45_02": "【正解】（3）\n(1)○：試験合格後、美容師名簿に登録されることで免許が与えられます。\n(2)○：衛生上必要な措置は都道府県等の条例にも従う必要があります。\n(3)×（誤り）：外国の美容師資格を持っていても、日本国内で美容を業とするには「日本の美容師免許」を取得しなければなりません。\n(4)○：染毛（ヘアカラーリング）は美容・理容行為に含まれるため、美容師または理容師でなければ業として行えません。",
      "q45_03": "【正解】（1）\n(1)○：かつて無免許で美容の業を行った者（美容師法第6条違反）には、試験に合格しても相対的欠格事由として免許が与えられないことがあります。\n(2)×：美容師免許申請時に添付する診断書は「精神の機能の障害」に関するものです（結核・伝染性皮膚疾患の診断書は美容所開設届の添付書類です）。\n(3)×：美容師免許に有効期限や10年ごとの更新制度はありません（取消処分を受けない限り終身有効です）。\n(4)×：免許証再交付の申請先は都道府県知事ではなく「厚生労働大臣（指定登録機関）」です。",
      "q45_04": "【正解】（2）\n(1)出張美容違反、(3)衛生措置義務違反、(4)伝染性疾病での就業はいずれも「業務停止処分」の対象ですが、（2）「免許証を破り、汚し、又は紛失した場合」は免許証の再交付申請の事由であって、業務停止処分の対象ではありません。",
      "q45_05": "【正解】（4）\n美容所の開設は許可制ではなく事前の【A：届出】制であり、都道府県知事等による【B：構造設備】の検査確認を受けた後でなければ使用してはなりません。この検査確認を受ける前に美容所を使用した開設者は30万円以下の【C：罰金刑】に処せられることがあります。",
      "q45_06": "【正解】（4）\n(1)管理美容師の変更、(2)美容師の退職、(3)美容師の新たな雇用はいずれも法定の開設届出事項の変更にあたるため速やかに届出が必要ですが、（4）「美容所の営業日（や定休日・営業時間・施術料金）の変更」は法定の届出事項ではないため届出は不要です。",
      "q45_07": "【正解】（3）\n(1)×：生活衛生同業組合は1つの都道府県に各業種1つしか設立できません。\n(2)×：標準営業約款は全国生活衛生営業指導センターが定めるもので、施術料金の統一を定めるものではありません。\n(3)○：生活衛生同業組合は、組合員に対する営業施設の設備改善資金のあっせんや技能の改善向上、経営指導などの事業を行うことができます。\n(4)×：生活衛生同業組合は「非営利」の組織です。",
      "q45_08": "【正解】（1）\n(1)×（誤り）：労働安全衛生法に基づく労働者への医師による健康診断（雇入時および1年以内ごとに1回の定期健康診断）は、事業場の規模にかかわらず「常時使用する労働者を1人でも雇用するすべての事業者（小規模事業者を含む）」に義務付けられています。\n(2)○・(3)○・(4)○：はいずれも正しい記述です。",
      "q45_09": "【正解】（2）\n(1)○・(3)○・(4)○：老齢基礎年金、付加年金、保険料の免除・納付猶予制度の説明は正しいです。\n(2)×（誤り）：障害基礎年金の給付額は一律同額ではなく、障害の程度（1級は2級の1.25倍）や子の加算の有無によって異なります。",
      "q45_10": "【正解】（3）\n(1)○：健康保険の保険者は全国健康保険協会（協会けんぽ）と健康保険組合です。\n(2)○：被用者保険に加入していない75歳未満の従業者は国民健康保険の対象となります。\n(3)×（誤り）：医療保険の自己負担割合は年齢や所得によって1割〜3割（就学前2割、70〜74歳原則2割、75歳以上原則1割など）と異なり、年齢にかかわらずすべて3割ではありません。\n(4)○：出産時には出産育児一時金が支給されます。",
      "q45_11": "【正解】（4）\n1980年（昭和55年）と2015年（平成27年）を比較すると、少子化と医療の進歩により（1）出生率、（2）合計特殊出生率、（3）乳児死亡率はいずれも低下（減少）していますが、高齢化の進行により人口1,000人あたりの全死亡数である（4）「粗死亡率」は増加しています。",
      "q45_12": "【正解】（3）\n(1)×：日本の平均寿命が男女とも50歳を超えたのは戦後の「1947年（昭和22年）」です。\n(2)×：2015年の平均寿命は「男性80.75歳、女性86.99歳」です（男女の数値が逆になっています）。\n(3)○：1981年（昭和56年）以降、日本の主要死因別死亡率の第1位は一貫して「悪性新生物（がん）」です。\n(4)×：がんの部位別年齢調整死亡率の第1位は、男性は「肺がん」ですが、女性は「大腸がん（または乳がん・肺がん）」であり男女とも肺がんではありません。",
      "q45_13": "【正解】（2）\n(1)○・(3)○・(4)○：喫煙による疾患リスク、平成以降のアルコール消費量の減少傾向、飲酒に起因する健康・社会問題はいずれも正しい記述です。\n(2)×（誤り）：日本の成人女性の喫煙者率（約7〜8%）は、欧米などの他の先進諸国と比べて「低率」です。",
      "q45_14": "【正解】（4）\n『理容所及び美容所における衛生管理要領』では、美容所内の温度は【A：17〜28】℃、湿度は相対湿度【B：40〜70】%であることが望ましいと定められています。",
      "q45_15": "【正解】（1）\n(1)×（誤り）：アタマジラミは不完全変態の昆虫であり、卵からかえった「幼虫も成虫と同様に頭皮から吸血」します。\n(2)○・(3)○・(4)○：毛髪への産卵、タオルや帽子・ブラシの共用による感染、幼児・児童での好発は正しい記述です。",
      "q45_16": "【正解】（1）\n(1)×（誤り）：百日せきは蚊による媒介ではなく、患者の咳やくしゃみのしぶきを介する「飛沫感染（および接触感染）」によって感染します。\n(2)○：結核は飛沫核感染（空気感染）です。\n(3)○：B型肝炎は血液・体液を介して感染します。\n(4)○：コレラは汚染された食物や水を介して経口感染します。",
      "q45_17": "【正解】（4）\na○：破傷風菌などの偏性嫌気性菌は、酸素があると発育できません。\nb×：ウイルスはDNAかRNAの「どちらか一方のみ」の核酸を持っています。\nc×：芽胞をもつ細菌は熱や乾燥・消毒薬に対して極めて強い抵抗力を持っています。\nd○：ウイルスは増殖過程で遺伝子の突然変異をしばしば起こします。\nよって正しい組合せは aとd の（4）です。",
      "q45_18": "【正解】（2）\n(1)○・(3)○・(4)○：感染の定義、発病の定義、不顕性感染（感染しても発病しない状態）の存在は正しい記述です。\n(2)×（誤り）：病原体が人体の皮膚や粘膜に付着しただけでは「汚染」にとどまり、洗い流されたり常在菌や免疫に排除されたりするため、必ず感染が成立するわけではありません。",
      "q45_19": "【正解】（3）\n(1)○・(2)○・(4)○：予防接種の目的、集団免疫効果、定期接種と臨時接種の区分は正しい記述です。\n(3)×（誤り）：予防接種は対象疾病（ワクチンの種類）によって「接種対象年齢および接種回数がそれぞれ細かく異なって」定められています。",
      "q45_20": "【正解】（2）\n(1)○・(3)○・(4)○：麻しん（別名はしか）、麻しんウイルスが病原体であること、全身の発疹を伴うことは正しい記述です。\n(2)×（誤り）：麻しんの潜伏期は2〜3日ではなく「約10〜12日（10日前後）」です。",
      "q45_21": "【正解】（4）\n微生物を殺すことの総称は【A：殺菌】であり、すべての微生物を殺滅・除去して生きている微生物が存在しない状態にすることを【B：滅菌】といいます。病原微生物を死滅させるか感染力をなくすことを【C：消毒】といい、美容所の衛生管理で法的に求められるのは【C：消毒】です。",
      "q45_22": "【正解】（2）\n(1)○・(3)○・(4)○：重ならない配置、血液付着器具には不適であること、ランプの寿命による定期交換は正しい記述です。\n(2)×（誤り）：紫外線殺菌灯から出る紫外線（UV-C）は目（結膜炎や角膜炎）や皮膚（紅斑や色素沈着）に直接照射すると「有害」であるため、直接見たり皮膚に当てたりしてはいけません。",
      "q45_23": "【正解】（2）\n(1)○：次亜塩素酸ナトリウムは有機物の汚れがあると効力が低下します。\n(2)×（誤り）：逆性石けん（陽イオン界面活性剤）は一般細菌には有効ですが、「結核菌（およびウイルス・芽胞）には効力がありません」。\n(3)○：両性界面活性剤は普通の石けんと併用すると効力が低下します。\n(4)○：消毒用エタノールは細菌の芽胞には効力がありません。",
      "q45_24": "【正解】（1）\n【希釈計算】5%原液2mLを希釈して全量1,000mLにした場合（500倍希釈）、水溶液の濃度は 5% × 2mL ÷ 1,000mL ＝「0.01%」となります。したがって（1）が正解です。",
      "q45_25": "【正解】（3）\na×：かみそりをエタノールで消毒する際は「10分間以上浸す（浸漬）」必要があり、綿で拭く（清拭）方法は不可です。\nb×：ヘアドライヤーは直接皮膚に接して施術する器具（かみそり・はさみ・くし・刷毛等）には該当しません。\nc○：皮膚に接する器具は消毒効果を高めるため、事前に十分洗浄してから消毒します。\nd○：タオルの蒸気消毒は、80℃を超える蒸気に10分間以上触れさせます。\nよって正しい組合せは cとd の（3）です。",
      "q45_26": "【正解】（2）\n身体の左右の中央を通る「正中線上」にあるのは、鼻の下から上唇中央にある縦の溝である（2）「人中（じんちゅう）」です。（1）鼻唇溝、（3）鼻翼、（4）口角はいずれも左右一対あり正中線上にはありません。",
      "q45_27": "【正解】（3）\n心臓の心拍数を増やし、心筋の収縮力を増強するときに直接働く自律神経は（3）「交感神経」です（副交感神経は心臓の働きを抑制します）。",
      "q45_28": "【正解】（1）\n内耳にある平衡感覚器には、回転を感知する（2）半規管と、傾きや直線加速度を感知する前庭の（3）卵形嚢・（4）球形嚢があります。（1）「鼓膜」は外耳と中耳の境にあって音の振動を受け止める聴覚器の一部であり、内耳の平衡器官ではありません。",
      "q45_29": "【正解】（4）\n酸素と結合して全身へ酸素を運搬する赤色色素タンパク質「ヘモグロビン（血色素）」が含まれているのは（4）「赤血球」です。",
      "q45_30": "【正解】（3）\n胸郭を広げて肺の吸気・呼気を行う「呼吸筋」には、（4）横隔膜や（1）内肋間筋・（2）外肋間筋がありますが、（3）「咬筋（こうきん）」は下顎を動かして食物をかむ「咀嚼筋」であり呼吸運動には関与しません。",
      "q45_31": "【正解】（3）\n(1)×：皮膚は表面（外側）から「表皮・真皮・皮下組織」の3層でできています。\n(2)×：角化細胞（ケラチノサイト）は真皮ではなく「表皮」の細胞の約95%を占めます。\n(3)○：表皮最下層の基底細胞は分裂して順次表面へ移動し、有棘細胞・顆粒細胞を経て最終的に核のない角質細胞に変化（角化）します。\n(4)×：リンパ球に抗原情報を提示するのは色素細胞ではなく「ランゲルハンス細胞」です。",
      "q45_32": "【正解】（2）\n(1)○：眉毛・鼻毛・耳毛は高齢になると成長期が長くなり長い毛が生えることがあります。\n(2)×（誤り）：健康な成人の頭毛（約10万本）は、その「85〜90%が成長期」であり、休止期にあるのは約10%前後です（成長期と休止期が逆になっています）。\n(3)○：上肢などの体毛の成長期は数か月（6か月以下）と短いです。\n(4)○：毛の成長速度は月経周期には影響されません。",
      "q45_33": "【正解】（1）\n(1)×（誤り）：紫外線の照射によって色素細胞で大量につくられ、皮膚の色を黒くする（サンタン）物質はエラスチンではなく「メラニン（メラニン色素）」です（エラスチンは真皮の弾性線維です）。\n(2)○・(3)○・(4)○：はいずれも皮膚の生理機能として正しい記述です。",
      "q45_34": "【正解】（1）\n(1)×（誤り）：皮膚の老化には加齢による自然老化（個人の素因）だけでなく、長年の紫外線曝露（光老化）や乾燥などの「環境の影響」が大きく関与します。\n(2)○・(3)○・(4)○：ボツリヌス毒素の抗しわ療法、肝障害による黄疸、糖尿病による易感染性はいずれも正しい記述です。",
      "q45_35": "【正解】（4）\n(1)○・(2)○・(3)○：接触皮膚炎、パッチテスト、理美容師の手荒れに多い進行性指掌角皮症の説明はいずれも正しい記述です。\n(4)×（誤り）：尋常性痤瘡（ニキビ）は毛包に皮脂がたまり、ウイルスではなく常在細菌である「アクネ桿菌（プロピオニバクテリウム・アクネス）やブドウ球菌などの細菌」が増殖して炎症を起こす疾患です。",
      "q45_36": "【正解】（3）\n(1)○・(2)○・(4)○：高級アルコール、炭化水素の用途、ロウ類の定義は正しい記述です。\n(3)×（誤り）：炭化水素には石油から得られるワセリンや流動パラフィンだけでなく、深海ザメの肝油やオリーブ油などの「動植物から得られるスクワラン」もあります。",
      "q45_37": "【正解】（4）\n洗浄作用に優れる石けんは【A：陰イオン（アニオン）】界面活性剤です。水相と油相を混ぜてエマルジョン（乳濁液）を形成させる作用を【B：乳化】といい、またヘアリンス剤に配合され帯電防止・柔軟効果を発揮する陽イオン界面活性剤として【C：第四級】アンモニウム塩が用いられます。",
      "q45_38": "【正解】（1）\n(1)○：パラオキシ安息香酸エステル（パラベン）は微生物の繁殖を防ぐ「防腐剤」です。\n(2)×：EDTA（エデト酸）は「金属イオン封鎖剤（キレート剤）」です。\n(3)×：グリセリンは「保湿剤」です。\n(4)×：アルキル硫酸ナトリウムは洗浄剤として働く「陰イオン界面活性剤」です。",
      "q45_39": "【正解】（2）\nパーマ剤第1剤には還元剤の（1）システイン・（4）チオグリコール酸、およびアルカリ剤の（3）モノエタノールアミンが配合されます。（2）「臭素酸ナトリウム」は酸化剤であり、パーマ剤の「第2剤」に配合される成分です。",
      "q45_40": "【正解】（4）\n(1)○：小麦色の日焼け肌をつくるサンタン製品は、サンバーンを起こすUV-Bを防ぎつつUV-Aを適度に透過させます。\n(2)○：SPF値は主にUV-B（サンバーン）を防御する指標です。\n(3)○：酸化チタンや酸化亜鉛は紫外線散乱剤として紫外線を反射・散乱させます。\n(4)×（誤り）：日焼け止めであるサンスクリーン製品は、UV-Bだけでなく光老化や黒化を起こす「UV-Aも合わせて防御」します（UV-A防御指標はPAで示されます）。",
      "q45_41": "【正解】（4）\n(1)○・(2)○・(3)○：サラリーマンの背広普及、バスガールの洋装制服、女学生のセーラー服はいずれも大正時代の事象です。\n(4)×（誤り）：軍服をモデルにした男性用の標準服である「国民服」が制定されたのは大正時代ではなく、太平洋戦争直前の「昭和15年（1940年）」です。",
      "q45_42": "【正解】（2）\n(1)○・(3)○・(4)○：ウルフカット、ソバージュ、聖子ちゃんカットの説明は正しいです。\n(2)×（誤り）：映画『ローマの休日』のヒロイン（オードリー・ヘップバーン）の髪型は「ヘップバーンカット」です。「セシールカット」は映画『悲しみよこんにちは』のヒロイン（ジーン・セバーグ）のベリーショートヘアです。",
      "q45_43": "【正解】（1）\n（3）留袖と（4）振袖は女性の第一礼装、（2）訪問着は準礼装に該当しますが、全体に同じ模様が繰り返し染められた（1）「小紋（通常のファッション小紋）」は外出着・街着（普段着）であり、礼装や準礼装には該当しません（※江戸小紋で紋付の場合のみ例外）。",
      "q45_44": "【正解】（3）\n風を送るための「モーター（ファン）」と、空気を温めるための「発熱器（ニクロム線ヒーター）」の両方を内蔵している美容用具は（3）「ヘアドライヤー」です。（1）クリッパーはモーターのみ、（2）アイロンと（4）ホットカーラーは発熱器のみです。",
      "q45_45": "【正解】（1）\n(1)×（誤り）：本レザー（日本剃刀・西洋剃刀）の刃線の形態は、内側にへこんだ内曲線状ではなく、わずかに外側へ丸みを帯びた「外曲線状」または「直線状」です（内曲線状だと角が皮膚に食い込んで危険です）。\n(2)○・(3)○・(4)○：はいずれもレザーに関する正しい記述です。",
      "q45_46": "【正解】（2）\n(1)×：シャンプーのお湯の適温は「38〜40℃」です（45〜48℃は熱すぎて頭皮を傷め火傷の危険があります）。\n(2)○：毛髪同士を強くこすり合わせて洗うと、摩擦で表面のキューティクル（毛小皮）が剥がれ傷みます。\n(3)×：パーマやヘアカラー施術前は、頭皮が傷ついて薬剤がしみるのを防ぐため頭皮を強くこすってはいけません。\n(4)×：汚れがひどい場合は一度に大量につけるのではなく、2回に分けて洗う（ツーシャンプー）のが効果的です。",
      "q45_47": "【正解】（4）\n同じ大きさの顔でも、周囲を取り囲むヘアスタイルのボリュームが大きいと相対的に顔が小さく見え、ヘアスタイルのボリュームが小さいと顔が大きく見える現象は、周囲の大きさとの比較で生じる（4）「大きさの対比現象（エビングハウス錯視等）」です。",
      "q45_48": "【正解】（2）\n(1)×：頭皮に対して直角（90度）に引き出して同じ長さに切るのは「セイムレングスカット」です。\n(2)○：グラデーションカットにおいてパネルをダウンステムでシェープして切ると、最も長い表面の毛髪が重なる部分がボリュームの頂点（ウェイト）となります。\n(3)×：頭部の形がそのままシルエットになるのは「セイムレングスカット」です。\n(4)×：毛髪が自然に落ちる位置（0度）で同一線上に切るのは「ワンレングスカット」です。",
      "q45_49": "【正解】（1）\n(1)×（誤り）：毛髪上でシザーズを開閉しながら滑らせて毛先を先細りにする技法は「スライドカット（またはストロークカット）」です。「セニングカット」はセニングシザーズ（梳き鋏）や通常のシザーズを用いて毛束を間引くように毛量調整する技法です。\n(2)○・(3)○・(4)○：はいずれもセニングカットの正しい記述です。",
