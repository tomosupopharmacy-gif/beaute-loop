    }

    // ---------------------------------------------------------
    // I. モーダル群（付箋モーダル / 管理者用学生詳細＆PW再発行 / 管理者用問題訂正）
    // ---------------------------------------------------------
    function renderModals(globalMetrics) {
      let html = '';

      // 1. 学生用：付箋メモモーダル
      if (state.stickyModalQId) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-4 animate-fadeIn">
              <div class="flex items-center justify-between">
                <h3 class="text-base font-black text-slate-900">付箋と暗記メモの設定</h3>
                <button type="button" onclick="window.appActions.closeStickyModal()" class="text-slate-400 hover:text-slate-700">✕</button>
              </div>
              <div class="grid grid-cols-3 gap-2">
                ${Object.values(STICKY_COLORS).map(sc => `
                  <button type="button" onclick="window.appActions.setStickyDraftColor('${sc.id}')"
                    class="p-2.5 rounded-xl border text-xs font-bold flex flex-col items-center gap-1 ${state.stickyDraftColor === sc.id ? `${sc.bg} ${sc.text} ${sc.border} ring-2 ring-slate-900` : 'bg-slate-50 text-slate-600 border-slate-200'}">
                    <span class="w-3 h-3 rounded-full ${sc.dot}"></span>
                    <span>${sc.label}</span>
                  </button>
                `).join('')}
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">暗記メモ・ポイント</label>
                <textarea rows="3" oninput="window.appActions.updateInput('stickyDraftMemo', this.value)"
                  placeholder="例：取消処分の返納は5日以内！30日とひっかけ注意"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs">${escapeHtml(state.stickyDraftMemo)}</textarea>
              </div>
              <div class="flex items-center justify-between gap-2 pt-2">
                <button type="button" onclick="window.appActions.removeSticky()"
                  class="px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 font-bold text-xs">
                  付箋を外す
                </button>
                <div class="flex items-center gap-2">
                  <button type="button" onclick="window.appActions.closeStickyModal()"
                    class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">キャンセル</button>
                  <button type="button" onclick="window.appActions.saveSticky()"
                    class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm">保存する</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 2. 管理者用：学生カルテ詳細＆パスワード再発行モーダル
      if (state.adminSelectedStudentId) {
        const st = globalMetrics.studentRankings.find(s => s.studentId === state.adminSelectedStudentId);
        if (st) {
          const passEval = evaluatePassCriteria(st.accuracy, st.mastered, st.totalAttempts, 0);
          html += `
            <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
              <div class="bg-white rounded-3xl max-w-lg w-full p-5 shadow-2xl space-y-4 animate-fadeIn my-8">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">学生個別カルテ＆パスワード管理</span>
                    <h3 class="text-base font-black text-slate-900 mt-0.5">${escapeHtml(st.name)} (ID: ${escapeHtml(st.studentId)})</h3>
                  </div>
                  <button type="button" onclick="window.appActions.closeAdminStudentModal()" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <!-- パスワード再発行セクション -->
                <div class="p-3.5 rounded-2xl bg-indigo-50 border border-indigo-200 space-y-2">
                  <div class="text-xs font-black text-indigo-900 flex items-center gap-1.5">
                    <i data-lucide="key" class="w-4 h-4"></i> パスワードの再発行・変更
                  </div>
                  <div class="flex items-center gap-2">
                    <input type="text" value="${escapeHtml(state.adminNewPasswordInput)}"
                      oninput="window.appActions.updateInput('adminNewPasswordInput', this.value)"
                      placeholder="新しいパスワードを入力"
                      class="flex-1 px-3 py-2 rounded-xl border border-indigo-200 bg-white text-xs font-bold" />
                    <button type="button" onclick="window.appActions.resetStudentPassword()"
                      class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shrink-0">
                      再発行して保存
                    </button>
                  </div>
                </div>

                <!-- 学生の成績サマリー -->
                <div class="grid grid-cols-3 gap-2 text-center">
                  <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                    <div class="text-[10px] text-slate-500">全体順位</div>
                    <div class="text-base font-black text-slate-900">${st.rank}位 / ${globalMetrics.totalStudentsCount}名</div>
                  </div>
                  <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                    <div class="text-[10px] text-slate-500">総合正答率</div>
                    <div class="text-base font-black text-emerald-600">${st.accuracy}%</div>
                  </div>
                  <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                    <div class="text-[10px] text-slate-500">合格判定</div>
                    <div class="text-xs font-black text-indigo-700 mt-1">${passEval.passGrade}</div>
                  </div>
                </div>

                <!-- 5科目別内訳 -->
                <div class="space-y-1.5">
                  <div class="text-xs font-bold text-slate-700">5科目別 正答率・定着状況</div>
                  ${CATEGORIES.map(c => {
                    const cs = st.catScores[c.id] || { mastered: 0, attempts: 0, accuracy: 0 };
                    return `
                      <div class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs">
                        <span class="font-bold ${c.text}">${c.name}</span>
                        <span>定着 ${cs.mastered}問 ｜ 正答率 <strong>${cs.accuracy}%</strong> (${cs.attempts}回解答)</span>
                      </div>
                    `;
                  }).join('')}
                </div>

                <div class="text-right pt-2">
                  <button type="button" onclick="window.appActions.closeAdminStudentModal()"
                    class="px-5 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs">
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          `;
        }
      }

      // 3. 管理者用：問題の解答訂正・編集モーダル
      if (state.adminEditingQuestion) {
        const eq = state.adminEditingQuestion;
        html += `
          <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
            <form onsubmit="window.appActions.saveEditedQuestion(event)" class="bg-white rounded-3xl max-w-lg w-full p-5 shadow-2xl space-y-3 animate-fadeIn my-8">
              <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
                <h3 class="text-base font-black text-slate-900">第${eq.session}回 問${eq.questionNumber} の問題・正答訂正</h3>
                <button type="button" onclick="window.appActions.closeAdminEditQuestionModal()" class="text-slate-400 hover:text-slate-700 font-bold">✕</button>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">問題文</label>
                <textarea rows="3" oninput="window.appActions.updateEditingQuestionField('question', this.value)"
                  class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs">${escapeHtml(eq.question)}</textarea>
              </div>
              <div class="grid grid-cols-1 gap-2">
                ${[1, 2, 3, 4].map(n => `
                  <div>
                    <label class="block text-[11px] font-bold text-slate-600 mb-0.5">選択肢 (${n})</label>
                    <input type="text" value="${escapeHtml(eq['opt' + n])}"
                      oninput="window.appActions.updateEditingQuestionField('opt${n}', this.value)"
                      class="w-full px-3 py-1.5 rounded-xl border border-slate-200 text-xs" />
                  </div>
                `).join('')}
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">正解番号の訂正 (1〜4)</label>
                <select onchange="window.appActions.updateEditingQuestionField('correctOne', this.value)"
                  class="w-full px-3 py-2 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-900 text-xs font-bold">
                  ${[1, 2, 3, 4].map(n => `<option value="${n}" ${Number(eq.correctOne) === n ? 'selected' : ''}>(${n}) を正解にする</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">解説文</label>
                <textarea rows="2" oninput="window.appActions.updateEditingQuestionField('explanation', this.value)"
                  class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs">${escapeHtml(eq.explanation)}</textarea>
              </div>
              <div class="flex items-center justify-end gap-2 pt-2">
                <button type="button" onclick="window.appActions.closeAdminEditQuestionModal()"
                  class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">キャンセル</button>
                <button type="submit"
                  class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-sm">訂正内容を保存</button>
              </div>
            </form>
          </div>
        `;
      }

      return html;
    }

    // =========================================================
    // 10. メイン render() 関数
    // =========================================================
    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      const allQuestions = buildAllQuestions();
      const globalMetrics = computeGlobalMetrics(allQuestions);

      let contentHtml = '';

      if (state.isAdmin) {
        contentHtml = renderAdminPortal(allQuestions, globalMetrics);
      } else if (!state.studentAccount) {
        contentHtml = renderAuthScreen(globalMetrics);
      } else {
        const stats = computeStudentStats(allQuestions, globalMetrics);
        let mainBody = '';
        if (state.quizSession) {
          mainBody = renderQuizRunner(globalMetrics);
        } else if (state.activeTab === 'dashboard') {
          mainBody = renderDashboardTab(allQuestions, stats, globalMetrics);
        } else if (state.activeTab === 'exam') {
          mainBody = renderExamListTab(allQuestions, stats, globalMetrics);
        } else if (state.activeTab === 'stickies') {
          mainBody = renderStickiesTab(allQuestions, stats, globalMetrics);
        } else if (state.activeTab === 'analytics') {
          mainBody = renderAnalyticsTab(allQuestions, stats, globalMetrics);
        } else if (state.activeTab === 'pdfs') {
          mainBody = renderPdfsTab();
        }

        contentHtml = `
          <div class="min-h-screen flex flex-col bg-slate-50">
            ${renderStudentHeader(stats, globalMetrics)}
            <main class="flex-1 max-w-4xl w-full mx-auto px-4 pt-4 pb-safe-main">
              ${mainBody}
            </main>
            ${renderStudentBottomNav(stats)}
          </div>
        `;
      }

      // トースト通知
      const toastHtml = state.toastMessage ? `
        <div class="fixed top-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-slate-900/95 text-white text-xs font-bold shadow-xl flex items-center gap-2 animate-fadeIn">
          <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
          <span>${escapeHtml(state.toastMessage)}</span>
        </div>
      ` : '';

      appEl.innerHTML = contentHtml + renderModals(globalMetrics) + toastHtml;

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }
