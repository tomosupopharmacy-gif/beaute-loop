        ["界面活性剤に関する次の記述のうち、誤っているものはどれか。",["石けんは、陰イオン界面活性剤(アニオン界面活性剤)に分類され、洗浄効果に優れている。","第四級アンモニウム塩は、陽イオン界面活性剤(カチオン界面活性剤)に分類され、ヘアリンス料等に用いられる。","レシチンは、両性界面活性剤に分類され、大豆や卵黄等から得られる。","アルキル硫酸ナトリウムは、非イオン界面活性剤(ノニオン界面活性剤)に分類され、毛髪に対する帯電防止効果に優れている。"],4],
        ["香粧品に用いられる色材に関する次の記述のうち、誤っているものはどれか。",["ベンガラは、ベニバナの花から得られる赤色色素である。","酸化鉄は着色原料で、黄色、赤色、黒色がある。","酸化チタンは、白色顔料としてファンデーション類に配合される。","有機合成色素(タール色素)は、メイクアップ用香粧品に用いられるが、法令で定められた色素から選択しなければならない。"],1],
        ["香粧品におけるクリームに関する次の記述のうち、正しいものはどれか。",["クリームには、必ず油脂が配合される。","バニシングクリームは、O/W型クリームである。","クレンジングクリームには、水で洗い流せるものはない。","クリームには、必ず水が配合される。"],2],
        ["次の成分のうち、パーマ剤第1剤に配合されないものはどれか。",["システイン","過酸化水素水","モノエタノールアミン","チオグリコール酸"],2],
        ["酸化・還元に関する次の記述のうち、正しいものの組合せはどれか。\na 酸化染毛剤に配合されるパラフェニレンジアミンは、酸化されて発色する。\nb パーマ剤に配合されるチオグリコール酸は、システインを酸化する。\nc 永久染毛剤中の過酸化水素は、窒素を放出し、還元剤として作用する。\nd トコフェロール(ビタミンE)は、香粧品の自動酸化を防ぐ。",["aとb","bとc","cとd","aとd"],4],
        ["明治時代の女性の髪型に関する次の記述のうち、誤っているものはどれか。",["結綿は、島田髷の一種である。","束髪は、和装、洋装どちらにも似合う髪型であった。","唐人髷は、既婚女性の髪型として結われた。","女性の断髪は、強い非難を浴びた。"],3],
        ["次の女性の服装のうち、1940年代の戦時体制下で広く着用されたものはどれか。",["もんぺ","サックドレス","落下傘スカート","海老茶袴"],1],
        ["女性の和装に関する次の記述のうち、誤っているものはどれか。",["地色が黒以外の振袖を色振袖という。","色留袖は、既婚女性に限らず着用できる。","訪問着には、肩、袖、腰から裾にかけて縫い目にまたがる絵画風模様が描かれている。","付け下げには、絵羽模様が描かれている。"],4],
        ["美容技術における作業姿勢に関する次の記述のうち、正しいものの組合せはどれか。\na 技術者の重心から下した垂線が両足に囲まれた領域内にあることが必要である。\nb 技術を施す箇所を利き手近くに置いて行う。\nc 技術を施す箇所を目の高さに合わせて行う。\nd 肩の関節を固定させて手を動かす場合は、肘に余裕を持たせる。",["aとb","bとc","cとd","aとd"],3],
        ["次のコームの部位のうち、毛髪を引き起こし垂直に立てて両側から支え、そろえる働きをするものはどれか。",["歯先","歯","歯元","胴"],3],
        ["シャンプーイングに関する次の記述のうち、正しいものはどれか。",["ファーストシャンプーは、マッサージを重視して強めに洗う。","ヘアカラーの施術前は、薬剤が効果的に働くように頭皮をしっかり洗う。","お湯は、30〜35℃が適温である。","タオルドライは、キューティクルを傷めないようにタオルに水分を吸わせるつもりで行う。"],4],
        ["次のうち、下図に該当する錯視はどれか。",["分割距離錯視","枠組み効果","ポンゾ錯視","大きさの対比現象"],2,"illusion_54_47"],
        ["ヘアカッティングに関する次の記述のうち、正しいものはどれか。",["ワンレングスカットは、毛髪を頭皮面に対して直角に引き出し、全体をほぼ同じ長さにカットする。","グラデーションカットは、上層ほど毛髪が長く、カットラインが水平になる。","レイヤーカットは、上層より下層の毛髪が長くなる。","セイムレングスカットは、上層より下層の毛髪が短くなる。"],3],
        ["次のうち、パーマネントウェーブ技術で直径8mmのロッドでフルウェーブを形成する場合に必要となる毛髪の長さはどれか。",["約9.4 cm","約8.5 cm","約7.5 cm","約5.7 cm"],3],
        ["下図は、ロッドにかかる力を表したものである。この図の中で、毛束を止めた部分から毛根までの毛が弾力でロッドの重みに反発する力を表している矢印はどれか。",["(1)","(2)","(3)","(4)"],4,"rod_54_50"],
        ["ヘアカーリングに関する次の記述のうち、正しいものの組合せはどれか。\na 耳介に沿って巻かれたカールをリバースカールという。\nb 右サイドにおけるクロックワイズワインドカールは、リバースカールである。\nc メイポールカールは、根元に強く弾力が得られる巻き方である。\nd ラリアットカールは、スタンドアップカールに分類される。",["aとb","bとc","cとd","aとd"],4],
        ["色の基本に関する次の記述のうち、正しいものはどれか。",["色の三原色は、赤・黄・緑である。","明度と彩度が組み合わさった調子を色のトーンという。","補色どうしを混ぜると、お互いの色を打ち消して色鮮やかになる。","彩度が低いといえば、鮮やかな色をさす。"],2],
        ["まつげエクステンションに関する次の記述のうち、正しいものはどれか。",["カウンセリングは初回の施術でのみ行う。","グルーのパッチテストは、エクステンション2〜3本を実際と同様につけ、20分程度様子をみる。","アイメイクアップを落として施術するので、化粧品のアレルギーについてはカウンセリングで問う必要はない。","施術中や施術後に目や目元に違和感があれば、直ちに医療機関で診察を受けてもらう。"],4],
        ["次のうち、日本髪の装飾品に該当しないものはどれか。",["花簪","筥迫","手絡","根がけ"],2],

      53: [
        ["保健所に関する次の記述のうち、正しいものの組合せはどれか。\na 保健所は、国が直轄する出先機関として全国に配置されている。\nb 保健所の所長は、原則として医師が任命されることとなっている。\nc 保健所は、地域保健法に基づき、住宅、水道、下水道、廃棄物の処理、清掃その他の環境の衛生に関する業務を行う。\nd 保健所は、地域保健法に基づき、介護老人保健施設の許可に関する業務を行う。",["aとb","bとc","cとd","aとd"],2],
        ["美容師の免許と名簿に関する次の記述のうち、誤っているものはどれか。",["本籍地都道府県を変更したときは、30日以内に名簿の訂正を申請しなければならない。","本籍地都道府県を変更したときは、免許証(免許証明書)の書換え交付を申請することができる。","免許証(免許証明書)を紛失したときは、免許証(免許証明書)の再交付を申請することができる。","免許取消処分を受けたときは、30日以内に免許証(免許証明書)を返納しなければならない。"],4],
        ["管理美容師に関する次の記述のうち、正しいものはどれか。",["管理美容師は、美容所ごとに適切な経営管理を行わせるために置かなければならない。","管理美容師の資格認定講習会の修了年月日は、美容師名簿の登録事項である。","美容師である従業者が常時1人の美容所であっても、年末等の繁忙期に臨時に美容師が2人以上従事するときは、管理美容師を置かなければならない。","管理美容師を置かなければならない美容所に管理美容師を置かなかったときは、美容所の閉鎖命令を受けることがある。"],4],
        ["美容所の開設者が行う届出に関する次の記述のうち、正しいものはどれか。",["美容所の営業を譲り受けてその開設者の地位を承継した場合には、遅滞なくその旨を届け出なければならない。","美容所の届出事項の変更の届出を怠った場合でも、罰金刑の対象となることはない。","美容師を新たに雇用した場合や美容師が退職して従事しなくなった場合には、30日以内に届け出なければならない。","美容所に置く管理美容師の本籍地都道府県が変更となった場合には、変更の届出をしなければならない。"],1],
        ["美容師法に基づく検査に関する次の記述のうち、誤っているものはどれか。",["美容所の開設者の講ずべき衛生上必要な措置の実施状況については、環境衛生監視員による立入検査の対象となる。","美容所の開設者が構造設備について検査確認を受ける前にこれを使用した場合には、罰金に処せられることがある。","美容師の講ずべき衛生上必要な措置の実施状況については、環境衛生監視員による立入検査の対象とはなっていない。","美容師以外の従業者であっても環境衛生監視員による立入検査を妨げた場合は、罰金に処せられることがある。"],3],
        ["美容師に対する行政処分や罰則の適用に関する次の組合せのうち、正しいものはどれか。",["伝染性の疾患にかかり、その就業が公衆衛生上不適当と認められる場合 ― 免許取消処分","精神の機能の障害により美容師の業務を適正に行うことができない場合 ― 業務停止処分","美容師免許を取り消されたにもかかわらず、美容を業とした場合 ― 罰金刑","美容師法等で定める衛生上必要な措置を講じなかった場合 ― 免許取消処分"],3],
        ["美容業の衛生や運営に関連する法律に関する次の記述のうち、誤っているものはどれか。",["医薬品、医療機器等の品質、有効性及び安全性の確保等に関する法律では、医薬部外品、化粧品の製造販売の規制についても定めている。","生活衛生関係営業の運営の適正化及び振興に関する法律では、過度の競争がある場合に料金の規制等を行うための標準営業約款の普及等について定めている。","消費者安全法では、地方公共団体による消費生活センターの設置等について定めている。","個人情報の保護に関する法律では、本人の同意を得ないで第三者に個人データを提供することの原則禁止等について定めている。"],2],
        ["労働者に対する事業主の義務に関する次の記述のうち、誤っているものはどれか。",["常時10人以上の労働者を使用する場合は、就業規則を作成し、労働基準監督署に届け出なければならない。","労働者の労働時間が8時間を超える場合は、少なくとも45分の休憩時間を労働時間の途中に与えなければならない。","労働者に対して、原則として毎週少なくとも1日の休日を与えなければならない。","職場におけるパワーハラスメントについて、労働者からの相談に応じるなどの措置を講じなければならない。"],2],
        ["医療保険に関する次の記述のうち、誤っているものはどれか。",["美容所の75歳未満の従業者で、健康保険などの被用者保険に加入していない者は、国民健康保険の対象となる。","療養の給付における一部負担金の割合は、年齢にかかわらず、かかった医療費の3割である。","健康保険には、傷病による療養のために仕事を休み、給与を受けられないときに支給される傷病手当金がある。","健康保険、国民健康保険ともに高額療養費制度がある。"],2],
        ["労働者災害補償保険法に関する次の記述のうち、誤っているものはどれか。",["保険料は、事業主と労働者の両方が負担する。","業務災害に該当するには、その傷病等が業務に起因したものである必要がある。","業務災害では、原則として治療費の自己負担はない。","障害補償給付は、業務災害による傷病が治ったときに一定の障害が残った場合の給付である。"],1],
        ["喫煙に関する次の記述のうち、正しいものはどれか。",["COPD(慢性閉塞性肺疾患)との因果関係は不明である。","妊婦の喫煙が、胎児の発育に影響することはない。","美容所は、健康増進法で原則屋内禁煙と定められている。","健康増進法に基づく受動喫煙防止に関する規定に違反しても、罰則が科されることはない。"],3],
        ["2019年のわが国の人口と世帯に関する次の記述のうち、誤っているものはどれか。",["死亡数は、出生数より多い。","65歳以上の高齢者数は、3000万人以下である。","平均世帯人員は、3人以下である。","65歳以上の高齢者のいる世帯の割合は、増加傾向である。"],2],
        ["認知症に関する次の記述のうち、誤っているものはどれか。",["認知症は、認知機能が低下し、日常生活全般に支障が出てくる状態をいう。","わが国の認知症の高齢者は、今後減少することが予測されている。","アルツハイマー型認知症が最も多い。","脳血管障害が認知症の原因になることがある。"],2],
        ["一酸化炭素に関する次の記述のうち、誤っているものはどれか。",["一酸化炭素は、有機物が不完全燃焼したときに発生する。","一酸化炭素は、無色、無臭のガスである。","一酸化炭素は、血液中のヘモグロビンとの結合力が酸素より弱い。","理容所及び美容所における衛生管理要領では、美容所の空気中の一酸化炭素濃度は10ppm以下が望ましいとされている。"],3],
        ["わが国の水道水と下水に関する次の記述のうち、誤っているものはどれか。",["水道水の水源として、海水が用いられることがある。","水道水を製造するための浄水処理工程で、消毒剤として次亜塩素酸ナトリウムなどの塩素剤が加えられている。","下水処理された水を放流する際の水質は、法令によって規制されている。","下水の処理中に発生する汚泥は、すべて焼却されている。"],4],
        ["次の感染症のうち、節足動物が媒介するものはどれか。",["デング熱","C型肝炎","ジフテリア","麻しん"],1],
        ["次の記述のうち、細菌とウイルスの両方にあてはまるものの組合せはどれか。\na 変異を起こすことがある。\nb 芽胞をつくることがある。\nc 2分裂によって増殖する。\nd 日和見感染を起こすことがある。",["aとb","bとc","cとd","aとd"],4],
        ["次の感染症のうち、予防に有効なワクチンが実用化されていないものはどれか。",["麻しん","結核","破傷風","後天性免疫不全症候群(エイズ)"],4],
        ["新型コロナウイルス感染症(COVID-19)に関する次の記述のうち、誤っているものはどれか。",["発症前には人に感染させることはない。","においや味がしないといった症状が出ることがある。","予防対策の一つとして、流水と石けんを用いた正しい手洗いが重要である。","検査には、PCR検査、抗原検査などがある。"],1],
        ["百日せきに関する次の記述のうち、正しいものはどれか。",["患者のうち、高齢者の割合が最も多い。","病原体は、ウイルスである。","患者の咽頭などからの分泌物による飛沫で感染するが、分泌物で汚染された物品を介しても感染する。","通常、1〜2か月の潜伏期を経て発病する。"],3],
        ["美容師法施行規則で規定されている消毒法に関する次の記述のうち、正しいものの組合せはどれか。\na 血液が付着していないかみそりを消毒用エタノールを含ませたガーゼで拭く。\nb 血液が付着しているかみそりを0.1%次亜塩素酸ナトリウム水溶液に10分間以上浸す。\nc 血液が付着していないくしに1cm²当たり85マイクロワット以上の紫外線を20分間以上照射する。\nd 血液が付着しているはさみを0.1%逆性石けん水溶液に10分間以上浸す。",["aとb","bとc","cとd","aとd"],2],
        ["消毒に対する病原微生物の抵抗性に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「細菌では [ A ] は [ B ] より消毒薬に対して強い抵抗性を持っている。ウイルスは [ C ] では不活化されにくいが、[ D ] には弱い。」",["A:芽胞 ― B:栄養型 ― C:逆性石けん ― D:次亜塩素酸ナトリウム","A:栄養型 ― B:芽胞 ― C:逆性石けん ― D:次亜塩素酸ナトリウム","A:栄養型 ― B:芽胞 ― C:次亜塩素酸ナトリウム ― D:逆性石けん","A:芽胞 ― B:栄養型 ― C:次亜塩素酸ナトリウム ― D:逆性石けん"],1],
        ["美容所で行われる蒸気消毒と煮沸消毒に関する次の記述のうち、誤っているものはどれか。",["蒸気消毒は、80〜100℃では芽胞に対して効力がない。","煮沸消毒は、2〜3分間の作用では芽胞に対して効力がない。","蒸気消毒は、血液が付着している器具に適用できる。","煮沸消毒は、血液が付着している器具に適用できる。"],3],
        ["次亜塩素酸ナトリウムに関する次の記述のうち、正しいものの組合せはどれか。\na 直射日光が当たるところに放置しても効力は低下しない。\nb 皮膚や粘膜に炎症を起こしやすい。\nc 酸性薬品と混ぜると塩素ガスを発生する。\nd 酸性を示す。",["aとb","bとc","cとd","aとd"],2],
        ["消毒薬水溶液の調製に関する次の記述のうち、正しいものはどれか。",["5%次亜塩素酸ナトリウムを50倍希釈すると0.05%次亜塩素酸ナトリウム水溶液になる。","10%逆性石けん20mLに水980mLを加えると0.1%逆性石けん水溶液になる。","0.05%グルコン酸クロルヘキシジン水溶液を1000mLつくるためには5%グルコン酸クロルヘキシジンが5mL必要である。","10%両性界面活性剤5mLを用いて0.1%両性界面活性剤水溶液をつくると500mLになる。"],4],

        ["循環器系に関する次の記述のうち、正しいものの組合せはどれか。\na 左心室が収縮したときの血圧を収縮期血圧という。\nb 下肢の動脈には、ところどころに弁がある。\nc リンパ管は、鎖骨下付近で大動脈に合流する。\nd 門脈(肝門脈)は、消化管などの毛細血管と肝臓の毛細血管を結ぶ血管である。",["aとb","bとc","cとd","aとd"],4],
        ["色素細胞に関する次の記述のうち、正しいものはどれか。",["メラニンを取り込んで、長い細胞突起を介して角質層に輸送する。","メラニンは、紫外線による基底細胞の核DNAの傷害を抑制する。","アレルゲンを取り込んで、リンパ球に抗原情報を提示する。","知覚神経とつながり、物理的刺激を受けると触覚を生じる。"],2],
        ["皮膚付属器官に関する次の記述のうち、正しいものの組合せはどれか。\na 脂腺孔は、毛隆起の部位より下方に開いている。\nb 毛髄質は、胎生毛や軟毛を含むすべての毛にある。\nc 眉毛や鼻毛は、高齢になるとその成長期が長くなる。\nd 思春期になり、性ホルモンの影響で変化する毛を性毛という。",["aとb","bとc","cとd","aとd"],3],

        ["アルコールに関する次の記述のうち、正しいものはどれか。",["セタノール(セチルアルコール)は、低級アルコールである。","メタノール(メチルアルコール)は、溶媒として化粧水に用いられる。","2-プロパノール(イソプロピルアルコール)は、香粧品への配合が禁止されている。","エタノール(エチルアルコール)は、水とよく混じり合う。"],4],
        ["香粧品の品質保持に用いられる配合成分に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「香粧品には、微生物による変質を防ぐためにパラオキシ安息香酸エステル(パラベン)等の [ A ] が配合される。また、香粧品原料と空気中の [ B ] との接触により起こる酸化反応を抑えるため、アスコルビン酸(ビタミンC)等の酸化防止剤や [ C ] 等の金属イオン封鎖剤(キレート剤)が配合される。」",["A:防腐剤 ― B:窒素 ― C:イソプロピルメチルフェノール","A:防腐剤 ― B:酸素 ― C:エチレンジアミン四酢酸(エデト酸、EDTA)","A:界面活性剤 ― B:酸素 ― C:イソプロピルメチルフェノール","A:界面活性剤 ― B:窒素 ― C:エチレンジアミン四酢酸(エデト酸、EDTA)"],2],
        ["香粧品に用いられる成分に関する次の記述のうち、誤っているものはどれか。",["ポリフェノールは、非イオン界面活性剤で乳化や可溶化に用いられる。","ポリビニルピロリドン(PVP)は、皮膜形成剤としてヘアスタイリング料に配合される。","カルボキシメチルセルロース(CMC)は、シャンプー料や乳液などに粘度を与える目的で用いられる。","ニトロセルロースは、皮膜形成剤としてマニキュア製品に配合される。"],1],
        ["パーマ剤の有効成分に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「二浴式のパーマ剤は、[ A ] のような [ B ] を有効成分とする第1剤と、[ C ] のような [ D ] を有効成分とする第2剤からなる。」",["A:チオグリコール酸 ― B:酸化剤 ― C:臭素酸ナトリウム ― D:還元剤","A:チオグリコール酸 ― B:還元剤 ― C:臭素酸ナトリウム ― D:酸化剤","A:臭素酸ナトリウム ― B:還元剤 ― C:チオグリコール酸 ― D:酸化剤","A:臭素酸ナトリウム ― B:酸化剤 ― C:チオグリコール酸 ― D:還元剤"],2],
        ["ヘアカラー製品に関する次の記述のうち、正しいものの組合せはどれか。\na パラフェニレンジアミンは、もともと色を有する直接染料である。\nb 酸性染毛料は、医薬部外品に分類される。\nc 染料中間体をカップラーとともに用いると、染料中間体単独とは異なったさまざまな色調に染毛できる。\nd 脱色剤は、毛髪内部のメラニン色素を酸化して分解する。",["aとb","bとc","cとd","aとd"],3],
        ["次の明治時代の女性の髪型のうち、束髪はどれか。",["二百三高地髷","結綿","桃割れ","天神髷"],1],
        ["次のうち、1970年代の服装に関する記述に該当しないものはどれか。",["映画「アメリカン・グラフィティ」に出てくるストリートファッションをまねたフィフティーズが流行した。","ケンゾーのフォークルック(フォークロアファッション)が流行した。","メンズファッションでは、肩幅が広く、ウエストを絞って、胸に厚みを出したヨーロッパ大陸調のコンチネンタルルックが流行した。","ファッション雑誌の情報により、ニュートラディショナル(ニュートラ)ファッションが流行した。"],3],

        ["下図は、頭部のポイントを表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:トップポイント ― B:バックポイント ― C:ゴールデンポイント","A:ゴールデンポイント ― B:バックポイント ― C:ネープポイント","A:トップポイント ― B:ゴールデンポイント ― C:ネープポイント","A:ゴールデンポイント ― B:トップポイント ― C:バックポイント"],3,"head_53_44"],
        ["シザーズの原理に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「シザーズはてこの原理を応用した道具で、支点となる [ A ] から [ B ] では力があり、[ A ] から [ C ] では繊細な作業を行いやすい。」",["A:交点 ― B:遠い側 ― C:近い側","A:鋏要 ― B:近い側 ― C:遠い側","A:鋏要 ― B:遠い側 ― C:近い側","A:交点 ― B:近い側 ― C:遠い側"],2],
        ["スキャルプマッサージの基本手技の方法に関する次の記述のうち、ペトリサージュに該当するものはどれか。",["手掌、4指、母指を用いて円を描くようにもみほぐす。","皮膚を押さえつけながら強くこする。","手掌、4指、母指を用いて軽くこする。","皮膚を叩いて平均的に刺激を与える。"],1],
        ["次の記述のうち、図形の印象に及ぼす方向性の効果に該当するものはどれか。",["点、線、面など、デザインの要素が2つ以上描かれると互いに影響を及ぼしあう。","正方形を45度傾けると、ひし形に見えてしまう。","人間のプロポーションでは、頭が相対的に大きいと全体的に子どもっぽい印象を与える。","大きいもののそばに小さいものを置けば、小さいものはさらに小ささが強調される。"],2],
        ["ヘアカッティングの姿勢に関する次の記述のうち、正しいものはどれか。",["切る対象に対して、腕を軽く曲げたくらいの間隔をおいて立つ。","目線の高さを調整する場合は、背筋を曲げて対応する。","左から右へ上がるラインを切る場合は、左肘を上げる。","右サイドの前上がりラインを切る場合は、左肘を上げる。"],1],
        ["パーマネントウェービングに関する次の記述のうち、正しいものはどれか。",["一度開封したパーマ剤は、密閉しておけば、2〜3年後に使用してよい。","パーマネントウェーブ施術の前後1週間は、酸化染毛剤によるヘアカラー施術は行わない。","毛髪を傷めないようにトリートメント巻きをすれば、パーマネントウェーブ施術の翌日に施術し直してよい。","パーマ剤は、頭髪以外にも眉やまつ毛に使用してよい。"],2],
        ["パーマネントウェーブ技術に関する次の記述のうち、誤っているものはどれか。",["吸水性毛は、水を吸収し薬剤をはじくのでパーマがかかりにくい。","ウェーブの大小は、ロッドの太さによって決まる。","テストカールでの適正カールの直径は、使用したロッドの直径の約2.5倍である。","毛髪診断は、ドライヘアとウェットヘアで行う。"],1],
        ["メイポールカールに関する次の記述のうち、誤っているものはどれか。",["ベースの周囲を一定の形や大きさにスライスしてつくるカールである。","根元に強いカールが現れる。","ステムの角度が0度に近い、フラットなカールである。","ステムをつぶさないようにループの片面をピンで止める。"],2],
        ["カールウェーブに関する次の文章の [ ] 内に入る数値の組合せのうち、正しいものはどれか。「ベースをとるためのスライス線は、ウェーブ幅の [ A ] であり、ループの直径はウェーブ幅の [ B ] 、カールスペースはウェーブ幅の [ C ] となる。」",["A: 1/2 ― B: 1/3 ― C: 2/3","A: 1/3 ― B: 1/2 ― C: 2/3","A: 1/2 ― B: 2/3 ― C: 1/3","A: 2/3 ― B: 1/3 ― C: 1/2"],3],
        ["次のヘアカラーのうち、黄色系に明るくなり過ぎた毛髪の色をナチュラルな毛髪の色に近づけたいときに用いるものはどれか。",["青系のヘアカラー","赤系のヘアカラー","緑系のヘアカラー","紫系のヘアカラー"],4],
        ["まつ毛エクステンションによる接触皮膚炎に関する次の記述のうち、正しいものはどれか。",["初回の施術では接触皮膚炎を発病することはない。","過去にアレルギー性の接触皮膚炎を発病しなかった物質では発病することはない。","グルーやリムーバーによるアレルギー反応は、施術後、数分で必ず現われる。","刺激性の接触皮膚炎の場合は、片側性のこともある。"],4],
        ["着物と帯に関する次の組合せのうち、正しいものはどれか。",["紬 ― 掛下帯","訪問着 ― 兵児帯","浴衣 ― 半幅帯","黒留袖 ― 角帯"],3]

      52: [
        ["美容師の免許と名簿に関する次の記述のうち、誤っているものはどれか。",["免許の申請に当たっては、免許申請書に精神の機能の障害に関する医師の診断書を添付しなければならない。","美容師が氏名を変更したときは、30日以内に美容師名簿の訂正を申請しなければならない。","免許証(免許証明書)を紛失したときは、住所地の都道府県知事に再交付を申請しなければならない。","業務停止処分となったときは、処分を行った者に免許証(免許証明書)を速やかに提出する必要がある。"],3],
        ["美容所の開設に関する次の記述のうち、誤っているものはどれか。",["美容所を開設しようとする者は、営業を開始する前に都道府県知事等に開設の届出をしなければならない。","管理美容師を置くべき美容所の開設届には、管理美容師の氏名と住所を記載しなければならない。","美容所の開設届には、記載したすべての美容師について精神の機能の障害に関する医師の診断書を添付しなければならない。","美容所を開設しようとする者が開設届に虚偽の記載をして届け出たときは、30万円以下の罰金に処せられることがある。"],3],
        ["次のうち、美容所の開設者が美容師法に基づく変更の届出を行う必要がないものはどれか。",["美容所の定休日を変更した場合","美容所の名称を変更した場合","美容師でない従業者を新たに雇用した場合","美容師が退職した場合"],1],
        ["出張美容に関する次の記述のうち、正しいものはどれか。",["出張美容を行う美容師に対しては、衛生上必要な措置を講ずることは求められていない。","出張美容は、美容所に所属する美容師でなければ行うことができない。","出張美容が認められる場合については、美容師法の政令のみによって定められている。","家族の育児や介護のために美容所に来ることが困難と認められる人に対しては、出張美容を行うことができる。"],4],
        ["美容師法に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「美容師が伝染性の疾病にかかり、その就業が公衆衛生上不適当と認められるときは、そのことにより [ A ] となることがある。美容師がこの処分に違反して美容の業を行った場合には、そのことにより [ B ] となることがある。また、美容所の開設者は [ A ] を受けた美容師を従事させた場合には、そのことにより [ C ] となることがある。」",["A:免許取消処分 ― B:業務停止処分 ― C:美容所の閉鎖処分","A:業務停止処分 ― B:免許取消処分 ― C:美容所の閉鎖処分","A:免許取消処分 ― B:罰金刑 ― C:免許取消処分","A:業務停止処分 ― B:罰金刑 ― C:罰金刑"],2],
        ["次のうち、美容所の閉鎖処分となることがある場合として正しいものの組合せはどれか。\na 管理美容師を置くべき美容所に管理美容師を置かなかった場合\nb 開設者が構造設備の検査前に美容所を使用した場合\nc 開設者が届出事項の変更について届出を怠った場合\nd 従事する美容師が衛生上必要な措置を講じなかった場合",["aとb","bとc","cとd","aとd"],4],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に基づく生活衛生同業組合に関する次の記述のうち、正しいものの組合せはどれか。\na 同業者の組織として、自主的活動を促進するために設立されている。\nb 美容業について、1つの都道府県に複数の生活衛生同業組合を設立することができる。\nc 施術料金について組合員間の協定を行う適正化規程は、現在、複数の都道府県で認可されている。\nd 組合員に対する営業施設の整備改善のための資金のあっせんを行うことができる。",["aとb","bとc","cとd","aとd"],4],
        ["税金に関する次の記述のうち、正しいものの組合せはどれか。\na 雇用主は、従業員の給与から源泉所得税を預かり、1年分を一括して税務署に納める。\nb 法人税や個人で経営する者の所得税は、利益が出ているときに納める税金である。\nc 個人で経営する者の所得税については、原則として毎年3月15日までに税務申告書を税務署に提出することとなっている。\nd 土地と建物を所有する場合は、固定資産税は土地に課税されるが建物に課税されることはない。",["aとb","bとc","cとd","aとd"],2],
        ["労働基準法と労働安全衛生法に関する次の記述のうち、正しいものの組合せはどれか。\na 使用者は、雇用契約を結ぶときは、労働者に対し契約期間、給与等の法令に定められた事項について書面等で明示しなければならない。\nb 使用者は、労働者に対して、原則として毎週少なくとも1日の休日を与えなければならない。\nc 使用者は、パートタイムの労働者に対しては、年次有給休暇を与えなくてもよい。\nd 労働者は、事業者が法律に基づいて実施する健康診断を2年に1回受けなければならない。",["aとb","bとc","cとd","aとd"],1],
        ["国民年金制度に関する次の記述のうち、誤っているものはどれか。",["日本国内に居住する20歳以上60歳未満の自営業者や学生は、国民年金に加入することとなっている。","厚生年金保険に加入する会社員等は、原則として国民年金にも加入する。","老齢基礎年金の給付額は、保険料納付済期間にかかわらず同額となっている。","遺族基礎年金の給付には、保険料納付に関する要件が設けられている。"],3],
        ["保健所に関する次の記述のうち、正しいものはどれか。",["保健所は、公衆衛生の第一線機関である。","エイズの予防に関する事項は、保健所の事業ではない。","美容所の衛生に関する事項は、保健所の事業ではない。","保健所を設置できるのは、都道府県だけである。"],1],
        ["人口動態統計に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「2000年から2015年までのわが国の [ A ] は上昇傾向にあるが、[ B ] の異なる集団間の比較に用いられる [ C ] は低下傾向にある。」",["A:粗死亡率 ― B:生活習慣 ― C:年齢調整死亡率","A:粗死亡率 ― B:年齢構成 ― C:年齢調整死亡率","A:年齢調整死亡率 ― B:生活習慣 ― C:粗死亡率","A:年齢調整死亡率 ― B:年齢構成 ― C:粗死亡率"],2],
        ["がんに関する次の記述のうち、誤っているものはどれか。",["1981年以降は、わが国の死因の第1位はがんである。","わが国では、1993年から、男性では胃がんの粗死亡率ががんの部位別死因の第1位である。","喫煙は、肺がん、喉頭がん、膀胱がんなどのがんのリスクを増大させる。","多量の飲酒は、がんのリスクを増大させる。"],2],
        ["次のうち、大気の汚染に係る環境基準が定められているものはどれか。",["一酸化炭素","ヘリウム","塩化水素","メタン"],1],
        ["温度と湿度に関する次の記述のうち、誤っているものはどれか。",["快適と感じる温度は、温度そのものだけでなく、湿度や気流の影響も受けている。","理容所及び美容所における衛生管理要領では、美容所の温度は17〜28℃が望ましいとされている。","相対湿度とは、空気中に含まれている水蒸気量の、同一温度の飽和水蒸気量に対する割合(%)をいう。","理容所及び美容所における衛生管理要領では、美容所の相対湿度は35%以下が望ましいとされている。"],4],
        ["細菌に関する次の記述のうち、誤っているものはどれか。",["細胞壁の内側に脂質の二重層からなる細胞膜がある。","核は、遺伝子であるRNA(リボ核酸)を含む。","芽胞は、熱や乾燥に対して抵抗が強い。","鞭毛は、細菌の運動性に関わる。"],2],
        ["感染症と主な感染経路に関する次の記述のうち、誤っているものはどれか。",["A型肝炎は、飲食物を介して感染する。","破傷風は、土壌を介して感染する。","デング熱は、蚊を介して感染する。","日本脳炎は、飛沫を介して感染する。"],4],
        ["結核に関する次の記述のうち、誤っているものはどれか。",["主な感染経路は、飛沫核感染である。","症状がなく、健康診断のエックス線検査で診断される場合もある。","美容師が罹患した場合は、感染症法に基づく就業制限の対象となる。","BCGワクチンの定期の予防接種は、7歳以上を対象に行われている。"],4],
        ["インフルエンザに関する次の記述のうち、誤っているものはどれか。",["インフルエンザウイルスは、ヒトのみに感染する。","飛沫や、患者の分泌物に汚染された器物を介して感染する。","一般にわが国で冬から春先にかけて流行するインフルエンザは、季節性インフルエンザと呼ばれている。","新型インフルエンザは、多くの人が免疫を持たないため急速な世界的大流行を起こす危険性がある。"],1],
        ["梅毒に関する次の記述のうち、誤っているものはどれか。",["患者数は、2010年以降、減少傾向が続いている。","妊娠している人が感染すると、胎盤を介して胎児にも感染することがある。","適切な治療をしないまま放置していると、数年から10年以上にわたって進行し、全身症状が現れ、時には死に至ることもある。","細菌の一種である梅毒トレポネーマが病原体である。"],1],
        ["次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「病原微生物を殺すか除去して感染力をなくすことを [ A ] という。あらゆる微生物を殺すか除去して微生物の存在をなくすことを [ B ] という。また、[ C ] とは、微生物を殺すことの総称をいう。」",["A:殺菌 ― B:消毒 ― C:滅菌","A:消毒 ― B:滅菌 ― C:殺菌","A:滅菌 ― B:消毒 ― C:殺菌","A:消毒 ― B:殺菌 ― C:滅菌"],2],
        ["美容所で行う血液の付着している疑いのない器具の消毒法に関する次の記述のうち、誤っているものはどれか。",["くしを0.01%以上の次亜塩素酸ナトリウム水溶液中に10分間以上浸す。","はさみに1cm²当たり85マイクロワット以上の紫外線を20分間以上照射する。","かみそりを消毒用エタノールを含ませた綿若しくはガーゼで拭く。","ブラシを0.1%以上の逆性石けん水溶液中に10分間以上浸す。"],3],
        ["消毒に関する次の記述のうち、誤っているものはどれか。",["薬液消毒では、温度・濃度・時間が殺菌効果の3要素である。","加熱消毒では、蒸気は煮沸よりも時間がかかる。","薬液消毒は、高温より低温で行ったほうが作用時間は短くてすむ。","加熱消毒では、乾熱は湿熱よりも時間がかかる。"],3],
        ["消毒用エタノールに関する次の記述のうち、正しいものの組合せはどれか。\na 揮発性が強く、引火性がある。\nb 結核菌に効力がある。\nc 逆性石けんと併用すると効力が低下する。\nd 細菌の芽胞に効力がある。",["aとb","bとc","cとd","aとd"],1],
        ["消毒薬水溶液の調製に関する次の記述のうち、誤っているものはどれか。",["10%両性界面活性剤5mLを水495mLで希釈して、0.1%水溶液を調製する。","5%グルコン酸クロルヘキシジン2mLを水498mLで希釈して、0.05%水溶液を調製する。","6%次亜塩素酸ナトリウム2mLを水598mLで希釈して、0.02%水溶液を調製する。","10%逆性石けん10mLを水990mLで希釈して、0.1%水溶液を調製する。"],2],
        ["内眼角(めがしら)に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「内眼角の内側には [ A ] という赤みを帯びた小さな高まりがある。周辺には [ B ] という小さな孔があり、余分な涙はこの孔から [ C ] に入る。」",["A:涙点 ― B:涙丘 ― C:涙腺","A:涙丘 ― B:涙腺 ― C:涙点","A:涙丘 ― B:涙点 ― C:鼻涙管","A:涙腺 ― B:涙丘 ― C:鼻涙管"],3],
        ["次の骨の組織のうち、造血作用があるものはどれか。",["骨膜","緻密質","海綿質","骨髄"],4],
        ["次の筋のうち、口を閉じ、口の周囲を前方に尖らせるものはどれか。",["オトガイ筋","口角挙筋","口輪筋","頬筋"],3],
        ["自律神経の作用に関する次の記述のうち、正しいものはどれか。",["交感神経の活動が高まると、気管支は収縮する。","副交感神経の活動が高まると、心拍数は増加する。","交感神経の活動が低下すると、消化器の血管は収縮する。","副交感神経の活動が低下すると、瞳孔は散大する。"],4],
        ["次の血管のうち、リンパ管が集合して、最終的に合流するものはどれか。",["動脈","静脈","毛細血管","門脈"],2],
        ["次の細胞のうち、表皮には含まれないものはどれか。",["線維芽細胞","色素細胞","角化細胞","ランゲルハンス細胞"],1],
        ["皮膚付属器官に関する次の記述のうち、誤っているものはどれか。",["毛母では細胞の分裂増殖がさかんに行われ、毛の細胞がつくられている。","すべての毛包に立毛筋が付いている。","独立脂腺は、口唇、口腔粘膜、眼瞼、乳輪などにある。","手掌や足底には脂腺はないが、エクリン腺が多く分布している。"],2],
        ["皮膚の保護作用に関する次の記述のうち、誤っているものはどれか。",["脂肪膜とケラチンには、化学的刺激に対する保護作用がある。","脂肪膜に含まれる脂肪酸には、微生物に対する保護作用がある。","組織球には、紫外線から基底細胞を保護する作用がある。","膠原線維や弾性線維には、機械的外力に対する保護作用がある。"],3],
        ["皮膚の保護と手入れに関する次の記述のうち、誤っているものはどれか。",["皮膚の洗浄後は、クリームなどの保湿剤で皮膚を保護するのがよい。","入浴の温度は、40℃前後が適当である。","UVAは、UVBに比べて急激な作用でサンバーンを起こす。","紫外線吸収剤は、接触皮膚炎を起こすことがある。"],3],
        ["接触皮膚炎に関する次の記述のうち、誤っているものはどれか。",["刺激物質による接触皮膚炎では、その物質の濃度が高いほど発症しやすい。","化粧品によるアレルギー性接触皮膚炎を起こした場合は、その原因物質を含む他の化粧品でも発症する。","アレルギー性接触皮膚炎の原因物質の特定にはパッチテストが有効である。","ラテックスアレルギーは、合成ゴム製の手袋を使う職業の人に多く発症する。"],4],
        ["香粧品に配合される油性原料に関する次の記述のうち、正しいものの組合せはどれか。\na ロウ類は、高級アルコールと高級脂肪酸とのエステルである。\nb 高級アルコールは、炭素数の多いアルコールである。\nc 炭化水素は石油から得られるもので、動植物からは得られない。\nd シリコーン油は、炭化水素である。",["aとb","bとc","cとd","aとd"],1],
        ["界面活性剤に関する次の記述のうち、正しいものはどれか。",["石けんは、陽イオン界面活性剤(カチオン界面活性剤)である。","レシチンは、非イオン界面活性剤(ノニオン界面活性剤)である。","第四級アンモニウム塩は、帯電防止効果に優れている。","陰イオン界面活性剤(アニオン界面活性剤)は、泡立ちがよくない。"],3],
        ["香粧品に配合される成分とその配合目的に関する次の組合せのうち、誤っているものはどれか。",["パラアミノ安息香酸エステル ― 紫外線吸収剤","パラオキシ安息香酸エステル(パラベン) ― 防腐剤","パラフェノールスルホン酸亜鉛 ― 収れん剤","パラフェニレンジアミン ― 酸化剤"],4],
        ["パーマ剤の有効成分に関する次の文章の [ ] 内に入る語句の組合せとして、正しいものはどれか。「二浴式のパーマ剤において、[ A ] は [ B ] として [ C ] に配合される。」",["A:過酸化水素水 ― B:還元剤 ― C:第1剤","A:炭酸水素アンモニウム ― B:酸化剤 ― C:第2剤","A:臭素酸ナトリウム ― B:酸化剤 ― C:第2剤","A:システイン ― B:アルカリ剤 ― C:第1剤"],3],
        ["ヘアカラー製品に関する次の記述のうち、正しいものはどれか。",["酸性染料は、水に溶かすとプラスの電気を帯びる。","ヘアマニキュアは、一時染毛料に分類される。","酸化染毛剤に配合されるパラフェニレンジアミンは、高分子である。","脱色剤は、毛髪内部のメラニン色素を酸化して分解する。"],4],
        ["下図のうち、1960年代にアメリカのヒッピー運動の影響から生まれたヒッピーファッションはどれか。",["(1) ミニスカートスタイル","(2) 長髪・バンダナ・ベルボトムジーンズ","(3) マンボズボンスタイル","(4) ボディコンシャススタイル"],2],
        ["昭和時代に流行した髪型に関する次の記述のうち、誤っているものはどれか。",["セシールカットは、髪全体を極端に短くしたボーイッシュな髪型である。","ウルフカットは、襟足を長めにして段々に削がれた髪型である。","ソバージュは、毛先だけにソフトで大きなウェーブをつける髪型である。","聖子ちゃんカットは、前髪は目にかかるかかからないほどにし、サイドは後ろに流す髪型である。"],3],
        ["花嫁の和装の礼装に関する次の記述のうち、誤っているものはどれか。",["身丈は引き裾となる丈に仕立てる。","帯は丸帯を文庫結びにして、丸ぐけの帯締めをする。","髪は文金高島田で、べっこうの花簪や櫛などが使われる。","筥迫は扇子の別名で、慶事用は片面に金が塗られている。"],4],
        ["頭部のポイントとヘアラインに関する次の記述のうち、正しいものはどれか。",["前頭部の生え際と正中線の交わった点をトップポイントという。","耳のつけ根の上の部分をバックポイントという。","頭部の生え際をヘアラインという。","フロントラインとサイドラインを合わせてヘムラインという。"],3],
        ["シザーズに関する次の記述のうち、誤っているものはどれか。",["2枚の刃による剪断応力を利用している。","支点となる鋏要に近い側では力の調整がしやすく、繊細な作業がしやすい。","母指で操作するほうの刃が動刃となる。","シザーズを開閉したときに、交点での接触圧が均等であるものがよい。"],2],
        ["スキャルプマッサージの基本手技に関する次の記述のうち、揉撚法に該当するものはどれか。",["前頭部から側頭部、頭頂部から後頭部まで、母指を除く両手の4指の指の腹を頭皮に軽く滑らせる。","両手掌を左右の耳介部にかぶせるように置き、指先が頭皮に触れる瞬間に力を入れてつまみ上げ、指先全体で円を描くように頭頂部まで揉んでいく。","耳上部から頭頂まで、両手掌に振動を与えながら圧迫し、徐々に指のつけ根から指先を頭頂につけていく。","手掌をカップ状にくぼませて両手を軽く握り、手の甲で頭、首、肩をリズミカルに叩く。"],2],
        ["デザインに関する次の記述のうち、誤っているものはどれか。",["黄金比は、デザインの縦横比として、さまざまなデザインに適用されている。","バランスには、シンメトリーバランス、アシンメトリーバランス、アンバランスがある。","調和(ハーモニー)とは、青と黄、ストレートとウェーブなど色や形のぶつかりあいのことをいう。","三つ編みは、パターンが周期的に繰り返されることによりリズムを感じさせる。"],3],
        ["カットラインに関する次の記述のうち、正しいものはどれか。",["パネルを中央に集めて切った場合は、頭の丸みとは逆のカットラインになる。","パネルを右に集めて切った場合は、左より右が長いカットラインになる。","長さが同じで幅の異なる2つのパネルをそれぞれ中央に集めて切った場合は、パネルの幅が広いほうがカットラインの長さの誤差が小さくなる。","幅が同じで長さの異なる2つのパネルをそれぞれ中央に集めて切った場合は、パネルが短いほうがカットラインの長さの誤差が小さくなる。"],1],
        ["ワンレングススタイルに行うセニングカットに関する次の記述のうち、誤っているものはどれか。",["根元近くや同じところを何度もセニングしない。","表面にあたる部分はセニングし過ぎない。","フロントの生え際は、セニングし過ぎない。","レイヤー状に毛量調節することにより、丸みを出す。"],4],
        ["縮毛矯正に関する次の記述のうち、誤っているものはどれか。",["パネルなどに毛髪を貼り付けない。","コーミングの際は、必要以上にテンションをかけない。","根元部分から毛先まで均一に第1剤を塗布する。","第2剤は酸化不足にならないようにする。"],3],
        ["次のストランドカールのベースのうち、ステムをオーバーラップさせやすく、仕上がりが割れにくいものはどれか。",["パラレログラムベース","オブロングベース","スクエアベース","トライアンギュラーベース"],4],
        ["酸化染毛剤に関する次の記述のうち、正しいものはどれか。",["植物の色素を有効成分としたものがある。","色持ちは、約2〜4週間である。","マスカラタイプやフェルトペンタイプがある。","黒色の毛髪を明るい色に染めることもできる。"],4],
        ["下図は、ヒトの爪を表したものである。アーチに該当するものはどれか。",["(1)","(2)","(3)","(4)"],2,"nail_52_53"],
        ["まつ毛エクステンションに関する次の記述のうち、正しいものはどれか。",["まつ毛の毛周期は、頭髪の毛周期に比べて長い。","施術後、顔を洗わなければ、すぐに入浴やサウナなど高温・多湿の環境を利用してもよい。","カウンセリングでは、健康状態についてはアレルギーの有無を聞くだけでよい。","カウンセリングでは、デメリットについても正しく伝える。"],4],
        ["下図は、日本髪を表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:髷 ― B:鬢 ― C:髱","A:根 ― B:髱 ― C:鬢","A:髷 ― B:髱 ― C:鬢","A:根 ― B:鬢 ― C:髱"],1,"nihongami_52_55"]

      51: [
        ["美容の業に関する次の記述のうち、誤っているものはどれか。",["美容師でなければ、美容を業とすることはできない。","会社の福利厚生のための美容行為であっても、反復継続的に行われる場合には業に当たる。","美容師が美容の業を行う場合の衛生上必要な措置については、美容所が所在する都道府県等の条例にも従う必要がある。","美容所の開設者(法人の場合は、その代表者のうちの1人)は、美容師でなければならない。"],4],
        ["美容師の免許と名簿に関する次の記述のうち、誤っているものはどれか。",["美容師試験に合格しても、美容師名簿に登録されなければ美容の業を行うことはできない。","美容師の免許を受けていない者が美容を業としたときは、30万円以下の罰金に処せられることがある。","美容師が他の都道府県に住所地を変更したときは、速やかに美容師名簿の訂正を申請しなければならない。","美容師が業務停止処分を受けたときは、処分を行った都道府県知事等に免許証(免許証明書)を提出しなければならない。"],3],
        ["管理美容師に関する次の記述のうち、正しいものはどれか。",["美容師である従業者が常時1人の美容所であっても、年末等の繁忙期に臨時に美容師が2人以上従事するときは、管理美容師を置かなければならない。","管理美容師は、美容師の免許取得後5年以上美容の業務に従事し、厚生労働大臣が指定する講習会の課程を修了した者でなければならない。","管理美容師を置かなければならない美容所の開設の届出においては、管理美容師の氏名のほかに、その者の住所も届け出なければならない。","管理美容師を置かなければならない美容所の開設者が管理美容師を置かなかったときは、そのことにより罰金に処せられることがある。"],3],
        ["美容所の開設に関する次の記述のうち、正しいものの組合せはどれか。\na 美容所を開設しようとする者は、営業を開始する前に都道府県知事等に開設の届出をしなければならない。\nb 美容所の開設の届出事項には、美容師の氏名は含まれるが、その他の従業者の氏名は含まれない。\nc 美容所の開設者は、届出事項に変更が生じたときは、30日以内に届け出なければならない。\nd 美容所の開設者が、施設の構造設備の検査確認を受けずに美容所を使用したときは、30万円以下の罰金に処せられることがある。",["aとb","bとc","cとd","aとd"],4],
        ["美容所の開設者に対する行政処分と罰則に関する次の記述のうち、正しいものはどれか。",["美容師以外の者に美容の業務を行わせたときは、そのことにより罰金に処せられることがある。","業務停止処分を受けている美容師に美容の業務を行わせたときは、そのことにより罰金に処せられることがある。","美容師法に基づく衛生上必要な措置を講じなかったときは、閉鎖処分となることがある。","美容所の届出事項の変更の届出を怠ったときは、閉鎖処分となることがある。"],3],
        ["環境衛生監視員に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「[ A ] に配置された環境衛生監視員は、美容所の [ B ] を行うことができ、これを妨げたときは、[ C ] となることがある。」",["A:保健所 ― B:立入検査 ― C:罰金刑","A:生活衛生営業指導センター ― B:経営指導 ― C:罰金刑","A:保健所 ― B:経営指導 ― C:閉鎖処分","A:生活衛生営業指導センター ― B:立入検査 ― C:閉鎖処分"],1],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に関する次の記述のうち、誤っているものはどれか。",["厚生労働大臣が定める振興指針には、衛生施設、サービス、経営内容等についての改善目標とその目標を達成するために必要な事項などが盛り込まれている。","生活衛生同業組合は、同業者の組織として営利を目的として設立されている。","生活衛生営業指導センターは、経営の健全化を通じて衛生水準の維持向上を図り、利用者又は消費者の利益を守るために設置されている。","標準営業約款登録店の登録を受けた営業者は、一定の標識(Sマーク)と標準営業約款の要旨を営業施設に掲示することとなっている。"],2],
        ["会計に関する次の記述のうち、正しいものはどれか。",["損益計算書では、一時点においてどれだけの資産があるのか、借金はどれだけあるのかなどの状況を把握することができる。","貸借対照表では、一定の期間における利益や費用がどのような状況になっているのかを把握できる。","貸借対照表において、1年以内に返済しなければならない借金は流動負債に分類される。","個人営業の場合は、税務上の決算日は自由に決められる。"],3],
        ["医療保険に関する次の記述のうち、正しいものの組合せはどれか。\na 健康保険の適用事業所に使用される75歳未満の者は、適用除外の者を除き、健康保険の被保険者となる。\nb 健康保険には、産前産後休業中の保険料と育児休業中の保険料が免除される制度がある。\nc 国民健康保険には、国が運営するものと国民健康保険組合が運営するものの2種類がある。\nd 国民健康保険の給付は、制度上、健康保険の給付と全く同じである。",["aとb","bとc","cとd","aとd"],1],
        ["雇用保険に関する次の記述のうち、正しいものの組合せはどれか。\na 雇用保険の適用事業に雇用される者は、所定労働時間の長さにかかわらず、すべて被保険者となる。\nb 雇用保険の基本手当は、自己都合で退職し失業した場合には支給されない。\nc 雇用保険の給付には、一定の教育訓練を受けた場合に支給される教育訓練給付がある。\nd 雇用保険の保険料は、事業主と被保険者の両方が負担する。",["aとb","bとc","cとd","aとd"],3],
        ["喫煙に関する次の記述のうち、正しいものはどれか。",["たばこの煙には、多種の発がん物質や発がん促進物質が含まれている。","妊婦の喫煙が、胎児の発育に影響することはない。","喫煙によって心疾患になる危険性はない。","受動喫煙では肺がんになる危険性はない。"],1],
        ["次の疾病のうち、生活習慣病に該当しないものはどれか。",["がん","B型肝炎","脳卒中","心臓病"],2],
        ["心の健康に関する次の記述のうち、誤っているものはどれか。",["心の健康は身体状況や生活の質に大きく影響する。","うつ病は早期発見、適切な治療が重要である。","心の健康を保つためには、休養、ストレス管理などが重要である。","自殺による人口10万人あたりの死亡率は、1958年以降現在まで上昇し続けている。"],4],
        ["空気中に浮遊する粒子状の物質に関する次の記述のうち、誤っているものはどれか。",["浮遊する物質の量とともに、その成分や大きさも健康に関係がある。","大気中の浮遊粒子状物質に関する環境基準が定められている。","浮遊粒子状物質とは、その粒径が1ミリメートル以下のものをいう。","PM2.5とは、その粒径が2.5マイクロメートル以下のものをいう。"],3],
        ["換気に関する次の記述のうち、誤っているものはどれか。",["窓や隙間などを通じて起こる換気を自然換気という。","同じ室内に多くの人がいると、粉じんや二酸化炭素などにより空気が汚れる。","ガスや石油を燃焼させて行う暖房は、二酸化炭素を発生させる。","理容所及び美容所における衛生管理要領では、作業場内の二酸化炭素濃度は100ppm以下であることが望ましいとしている。"],4],
        ["次の細菌のうち、酸素があると発育できないものはどれか。",["百日せき菌","結核菌","破傷風菌","大腸菌"],3],
        ["次の疾病のうち、予防接種法に基づく定期の予防接種の対象となるものの組合せはどれか。\na 風しん\nb A型肝炎\nc デング熱\nd 結核",["aとb","bとc","cとd","aとd"],4],
        ["次の感染症のうち、空気感染(飛沫核感染)するものはどれか。",["日本脳炎","破傷風","コレラ","水痘"],4],
        ["感染症と感染経路に関する次の組合せのうち、誤っているものはどれか。",["デング熱 ― 飛沫","マラリア ― 蚊","後天性免疫不全症候群(エイズ) ― 血液","A型肝炎 ― 飲食物"],1],
        ["風しんに関する次の記述のうち、正しいものの組合せはどれか。\na 病原体は風しんウイルスである。\nb 症状は、発熱、発疹、リンパ節の腫れなどである。\nc 潜伏期は、2〜3日である。\nd 妊婦が罹患しても胎児に影響することはない。",["aとb","bとc","cとd","aとd"],1],
        ["美容師法施行規則に定められた消毒の方法に関する次の記述のうち、正しいものの組合せはどれか。\na 血液の付着したはさみを、消毒用エタノールに10分間以上浸す。\nb 血液の付着したクリッパーの刃を、0.1%逆性石けん水溶液に10分間以上浸す。\nc 血液の付着していないかみそりを、0.01%次亜塩素酸ナトリウム水溶液に10分間以上浸す。\nd 血液の付着していないくしに、1cm²当たり85マイクロワット以上の紫外線を20分間以上照射する。",["aとb","bとc","cとd","aとd"],4],
        ["消毒薬の効力に関する次の記述のうち、誤っているものはどれか。",["消毒用エタノールは、細菌の芽胞に効力がある。","両性界面活性剤は、結核菌に効力がある。","次亜塩素酸ナトリウムは、ノロウイルスに効力がある。","逆性石けんは、黄色ブドウ球菌に効力がある。"],1],
        ["理学的消毒法に関する次の記述のうち、誤っているものはどれか。",["紫外線には、細菌のDNAや細胞壁を破壊する作用がある。","紫外線の消毒効果は、油膜などの汚れのある表面でも減弱しない。","煮沸消毒の消毒時間は、水が沸騰してから計る。","蒸気消毒は、煮沸消毒より長い時間を要する。"],2],
        ["消毒薬に関する次の記述のうち、正しいものの組合せはどれか。\na 両性界面活性剤は、多量の有機物があっても消毒効果は変わらない。\nb エタノールは、揮発性が強く濃度変化を起こしやすいので、密栓して保存する。\nc 次亜塩素酸ナトリウムは、日光で分解するため、冷暗所で保存する。\nd 逆性石けんの消毒効果は、普通の石けんと併用すると向上する。",["aとb","bとc","cとd","aとd"],2],
        ["消毒薬水溶液の調製に関する次の記述のうち、正しいものはどれか。",["0.1%両性界面活性剤水溶液1000mLを調製するためには、水980mLに10%両性界面活性剤20mLを加える。","10%逆性石けん20mLに水980mLを加えると、0.1%逆性石けん水溶液になる。","0.1%次亜塩素酸ナトリウム水溶液1000mLを調製するためには、水990mLに5%次亜塩素酸ナトリウム10mLを加える。","5%グルコン酸クロルヘキシジン10mLに水990mLを加えると、0.05%グルコン酸クロルヘキシジン水溶液になる。"],4],
        ["睫毛に関する次の記述のうち、誤っているものはどれか。",["上下の眼瞼の縁に数列の幅で生えている毛である。","上眼瞼の睫毛より下眼瞼の睫毛の方が本数が多い。","下眼瞼の睫毛より上眼瞼の睫毛の方が長い。","睫毛の生え際の内側にはマイボーム腺が開口している。"],2],
        ["次の部位にある横紋筋のうち、不随意筋はどれか。",["心臓","上肢","下肢","舌"],1],
        ["次の神経のうち、瞳孔が開くときに直接働くものはどれか。",["運動神経","知覚神経","交感神経","副交感神経"],3],
        ["次の耳の器官のうち、体の回転を感知するものはどれか。",["蝸牛","半規管(三半規管)","球形嚢","卵形嚢"],2],
        ["次の部位のうち、気道に含まれないものはどれか。",["鼻腔","喉頭","食道","気管支"],3],
        ["皮膚の構造に関する次の記述のうち、正しいものはどれか。",["頭の皮膚には血管や脂腺が多い。","顔の皮膚は、全体的に厚さが均一である。","手掌や足底の角質層は薄い。","体幹の皮膚は、腹側よりも背側のほうが薄い。"],1],
        ["皮膚付属器官の構造に関する次の記述のうち、誤っているものはどれか。",["毛の生える方向を毛流といい、皮膚の割線と直角の方向に一致している。","毛は、皮膚の表面から出ている部分を毛幹、皮膚の内部にある部分を毛根という。","毛は、成長期、退行期、休止期を繰り返す。","立毛筋は平滑筋で、自律神経に支配されている。"],1],
        ["皮膚の感覚に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「皮膚にある温点、冷点、痛点のうち、1cm²中最も数が多いものは [ A ] で、最も数が少ないものは [ B ] である。」",["A:冷点 ― B:温点","A:温点 ― B:痛点","A:冷点 ― B:痛点","A:痛点 ― B:温点"],4],
        ["皮膚と皮膚付属器官の保健に関する次の記述のうち、正しいものはどれか。",["皮脂の分泌量が過剰な脂性肌では、皮膚は薄くなっている。","皮膚や皮膚付属器官は、ホルモンの影響を受けない。","健康な肌では水分量は真皮より角質層の表面の方が多い。","老化に伴って皮膚の張りと弾力が失われ、皮膚のたるみとなり、やがてしわとなる。"],4],
        ["皮膚と皮膚付属器官の疾患に関する次の記述のうち、誤っているものはどれか。",["男性ホルモンは、ニキビの発生要因となる。","腋臭症(ワキガ)は、アポクリン腺が機能を開始する思春期に発症することが多い。","顔面単純性粃糠疹(ハタケ)は、白癬菌が原因である。","疥癬は、ヒゼンダニの寄生によって起こる。"],3],
        ["香粧品に配合される物質とそれを溶かしている水に関する次の記述のうち、正しいものはどれか。",["物質が均一に溶け合って液体の状態のとき、溶けている物質を溶媒という。","窒素を含む化合物を有機化合物という。","酸素原子に水素原子2個が結合した水分子内で生じている電気の偏りを極性という。","水に電解質を溶かしたとき、水素イオンの濃度が高い状態を塩基性という。"],3],
        ["油性原料に関する次の記述のうち、正しいものはどれか。",["毛髪に親和性の高いアミノ変性シリコーンは、すぐれたコンディショニング効果を発揮する。","カルナウバロウは、羊の毛からとれる動物性ロウである。","植物を原料とするスクワランは、油脂である。","常温では、脂肪は脂肪油より流動性が高い。"],1],
        ["界面活性剤の働きに関する次の記述のうち、正しいものの組合せはどれか。\na ある濃度以上に水中に溶けた界面活性剤どうしで親水基を外側に向けて形成する集合体をイオンという。\nb 可溶化とは水に溶けやすい物質を溶けにくくする作用をいう。\nc 乳化して得られたものをエマルション(エマルジョン)という。\nd 液体中に粉体が均一な微細粒子状に安定して存在しているとき、これを分散しているという。",["aとb","bとc","cとd","aとd"],3],
        ["香粧品に用いられる成分とその配合目的に関する次の組合せのうち、誤っているものはどれか。",["パラオキシ安息香酸エステル(パラベン) ― 防腐剤","パラアミノ安息香酸エステル ― 金属イオン封鎖剤(キレート剤)","ポリビニルピロリドン(PVP) ― 皮膜形成剤","ジブチルヒドロキシトルエン(BHT) ― 酸化防止剤"],2],
        ["酸化染毛剤の成分とその性質に関する次の記述のうち、誤っているものはどれか。",["過酸化水素水は、染料中間体を酸化する。","ニトロパラフェニレンジアミンは、無色である。","レゾルシンは、染料中間体の発色の色調を変える。","アンモニア水は、液性をアルカリ性にする。"],2],
        ["明治時代の女性の髪型に関する次の記述のうち、誤っているものはどれか。",["婦人束髪会が設立され、従来の日本髪から簡単な洋風の束髪に改めようという束髪運動が始まった。","代表的な束髪は、銀杏返しである。","ひさし髪は、日露戦争頃には二百三高地髷と呼ばれた。","まがれいとなどの流行によってリボンが大流行した。"],2],
        ["次のうち、1960年代の服装に関する記述に該当しないものはどれか。",["東京・銀座でみゆき族と名付けられた若者たちのファッションが話題となった。","ネズミ色、黒などダークな色が主体であった男性ファッションをカラフルにしようとするピーコック革命という動きが起こった。","アンドレ・クレージュがパリ・コレクションでミニスカートを取り上げ、話題となった。","ケンゾーのフォークルック(フォークロアファッション)が流行した。"],4],
        ["次の着物のうち、女性の準礼装となるものはどれか。",["訪問着(一つ紋)","黒留袖","色留袖(五つ紋)","振袖"],1],
        ["下図は、頭部を表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:頬部 ― B:オトガイ ― C:オトガイ唇溝","A:頬骨部 ― B:オトガイ ― C:鼻唇溝","A:頬部 ― B:人中 ― C:鼻唇溝","A:頬骨部 ― B:人中 ― C:オトガイ唇溝"],4,"face_51_44"],
        ["スキャルプトリートメントの施術方法に関する次の記述のうち、化学的な方法に該当するものはどれか。",["ブラシを使用する。","スチームタオルなどの湿熱や遠赤外線などの温熱を利用する。","ヘアトニックやスキャルプトリートメント剤などを使用する。","スキャルプマッサージを行う。"],3],
        ["次のうち、リズムを感じるヘアスタイルに仕上がるものはどれか。",["三つ編みを取り入れ、周期的なパターンをつくる。","ストレートとウェーブのテクスチュアを対比させる。","日本髪の片方だけに簪をさす。","サイドパートの分量の少ない方にボリュームを出す。"],1],
        ["カッティングにおけるパネルの角度とシルエットに関する次の記述のうち、正しいものはどれか。",["すべてのパネルをオンベースでシェープしてカットした場合は、シルエットはトップショートのロングエンドとなる。","毛髪が自然に落ちる位置にパネルをシェープしてカットした場合は、頭部の形がそのままヘアスタイルのシルエットを形成する。","ダウンステムでパネルをシェープしてカットした場合は、最も長い毛髪の部分がボリュームの頂点になる。","アップステムでパネルをシェープしてカットした場合は、上層ほど毛髪が長くカットラインは水平になる。"],3],
        ["レザーによるカット技法に関する次の記述のうち、ノーマルテーパーカットに該当するものはどれか。",["根元近くからテーパーする。","間引きすることによって毛量調整を行う。","毛先をテーパーする。","毛先から 1/3 ほどをテーパーする。"],4],
        ["パーマネントウェーブ技術に関する次の記述のうち、誤っているものはどれか。",["施術前のシャンプーは、オイル分の強いシャンプー剤が適している。","はっ水性毛は薬剤をはじき、パーマがかかりにくい。","ロッドの太さによって、ウェーブの大小が決まる。","フルウェーブには、使用するロッドの3回転分の毛髪の長さが必要である。"],1],
        ["下図は、ロッドにかかる力を表したものである。この図の中で、毛の弾力でロッドが逆の回転で元に戻ろうとする力を表しているものはどれか。",["(1)","(2)","(3)","(4)"],3,"rod_51_50"],
        ["下図は、ピンカールを表したものである。クロッキノールカールはどれか。",["(1) 毛先が内側・ループが重なり根元に向かって広がる巻き方","(2) 根元巻き方式のピンカール","(3) スカルプチュアカール","(4) スタンドアップカール"],1],
        ["酸化染毛剤に関する次の記述のうち、正しいものはどれか。",["全体を暗く染める場合は、毛髪の色が明るい部分から塗布する。","全体を明るく染める場合は、損傷のある部分の毛髪の色は暗く出やすい。","バージンヘアは、毛先が染まりやすい。","白髪は染まりやすいので、放置時間を短めにする。"],3],
        ["下図は、爪のカット形状を表したものである。ラウンドはどれか。",["(1) スクエア","(2) ラウンド(側面がストレートで先端が緩やかな丸み)","(3) オーバル","(4) ポイント(アーモンド)"],2],
        ["まつ毛エクステンションに関する次の記述のうち、誤っているものはどれか。",["カウンセリングは、予約時から始まる。","エクステンションは、まつ毛の成長初期に装着するのが最適である。","グルーが乾くまでコンタクトレンズは使用できないので、眼鏡の使用を勧める。","施術中や施術後に目や目元に違和感があれば、直ちに医療機関で診察を受けてもらう。"],2],
        ["振袖着付けに関する次の記述のうち、誤っているものはどれか。",["体型補整では、胸のふくらみの位置を高めにするなどして若々しさを出すようにする。","長襦袢の襟合わせの位置は、顔の中心線でのどのくぼみがやや隠れる程度にする。","着物の着丈は、裾が床に触れるぐらいの位置にする。","着物に締める伊達巻は、帯幅より広くなるようにする。"],4]
      ],
      50: [
        ["美容師試験に関する次の記述のうち、正しいものの組合せはどれか。\na 美容師試験に合格しても、美容師名簿に登録されなければ美容を業としてはならない。\nb 美容師試験は、都道府県知事が行うこととなっている。\nc 外国の美容師試験に合格した者については、日本の美容師試験が一部免除される。\nd 美容師試験に合格しても、かつて無免許で美容の業務を行った者には美容師の免許が与えられないことがある。",["aとb","bとc","cとd","aとd"],4],
        ["美容師の免許と名簿に関する次の記述のうち、正しいものはどれか。",["免許の申請に当たっては、免許申請書に精神の機能の障害に関する医師の診断書を添付しなければならない。","美容師が氏名を変更したときは、2か月以内に免許証(免許証明書)の書換え交付を申請しなければならない。","美容師が本籍地を変更し都道府県名が変わったときは、新しい本籍地の都道府県知事に名簿の訂正を申請しなければならない。","美容師が免許取消処分を受けたときは、速やかに住所地の都道府県知事に免許証(免許証明書)を返納しなければならない。"],1],
        ["管理美容師に関する次の記述のうち、正しいものの組合せはどれか。\na 美容師である従業者が常時2人以上の美容所には、管理美容師を置かなければならない。\nb 管理美容師は、美容所ごとに適切な経営管理を行わせるために置かなければならない。\nc 美容所の開設者は、管理美容師を変更したときは、1か月以内に届け出なければならない。\nd 管理美容師を置かなければならない美容所に管理美容師を置かなかったときは、美容所の閉鎖命令を受けることがある。",["aとb","bとc","cとd","aとd"],4],
        ["美容所の開設者が行う届出に関する次の記述のうち、正しいものはどれか。",["美容所の開設者は、美容師を新たに雇用した場合や美容師が退職して従事しなくなった場合には、速やかに届け出なければならない。","美容所の開設者は、美容所の名称のみを変更した場合には、届け出る必要はない。","美容所の届出事項の変更の届出を怠った場合であっても、罰金刑の対象となることはない。","相続等により美容所の開設者の地位を承継した場合には、新たに美容所の開設を届け出なければならない。"],1],
        ["次のうち、美容師の業務停止処分の対象に該当しないものはどれか。",["美容師法の政令又は都道府県等の条例で定める特別の事情がないにもかかわらず、美容所以外の場所で美容の業をした場合","美容の業を行うときに講ずべき衛生上必要な措置を講じなかった場合","美容師が心身の障害により美容師の業務を適正に行うことができない者とされた場合","美容師が伝染性の疾病にかかり、その就業が公衆衛生上不適当と認められる場合"],3],
        ["次のうち、そのことにより罰金に処せられることがある場合に該当しないものはどれか。",["美容師の免許を取り消された者が美容の業務に従事した場合","開設者が美容所の構造設備についての検査確認前に美容所を使用した場合","開設者が美容所の閉鎖処分に違反した場合","開設者が業務停止処分を受けている美容師に美容の業務を行わせた場合"],4],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に基づく振興指針に関する次の記述のうち、誤っているものはどれか。",["振興指針は、厚生労働大臣が定めることができる。","振興指針は、生活衛生同業組合の組合員のみを対象として策定される。","生活衛生同業組合は、振興指針に沿って振興計画を定めることができる。","政府は、振興計画に基づく事業の実施に必要な資金の確保などの援助に努めるものとされている。"],2],
        ["労働安全衛生法に関する次の記述のうち、誤っているものはどれか。",["労働安全衛生法は、職場における労働者の安全と健康を確保するとともに、快適な職場環境の形成を促進することを目的としている。","労働者に対する医師による健康診断の実施は、従業員が50人以上いる事業者のみに義務付けられている。","事業者は、健康診断の結果、異常の所見があると診断された労働者について、医師等の意見を聴かなければならない。","事業者には、特定の伝染性の疾病にかかった労働者の就業を禁止することが義務付けられている。"],2],
        ["年金制度に関する次の記述のうち、誤っているものはどれか。",["厚生年金保険に加入する会社員等は、同時に国民年金に加入することはない。","厚生年金の保険料の額は、給与をもとにした標準報酬月額と賞与をもとにした標準賞与額それぞれに一定の保険料率を乗じて決定される。","国民年金の第1号被保険者(自営業者等)の保険料の額は、全国一律で決まっている。","国民年金において、所得が低いなど保険料を納めることが困難な場合に保険料の免除や納付猶予となる制度が設けられている。"],1],
        ["介護保険に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「介護保険の被保険者は、市区町村に住所を有する [ A ] 歳以上の者と、市区町村に住所を有する [ B ] 歳以上 [ C ] 歳未満の医療保険加入者である。」",["A:75 ― B:20 ― C:75","A:75 ― B:40 ― C:75","A:65 ― B:20 ― C:65","A:65 ― B:40 ― C:65"],4],
        ["保健所に関する次の記述のうち、誤っているものはどれか。",["エイズ対策の一環として、エイズ患者の治療を実施している。","人口動態統計など管内の地域保健に係る統計をまとめている。","生活衛生、食品衛生関係施設などの監視や指導を実施している。","保健所には、医師が配置されることになっている。"],1],
        ["出生率と死亡率に関する次の記述のうち、誤っているものはどれか。",["合計特殊出生率とは、15歳から49歳までの女性の年齢別出生率を合計したもので、1人の女性が一生の間に産む子どもの数に相当する。","第2次ベビーブーム期の合計特殊出生率は2を少し上回る状態であったが、その後は2を下回る状態が続いている。","年齢構成の異なる集団間の死亡率の比較では、人口に対する1年間の死亡数である粗死亡率が用いられる。","人口の高齢化に伴い、心臓病の粗死亡率が上昇している。"],3],
        ["2015年の悪性新生物(がん)の統計に関する次の記述のうち、正しいものの組合せはどれか。\na 全悪性新生物の粗死亡率は、減少傾向である。\nb 胃がんの粗死亡率は、減少傾向である。\nc 男性の部位別にみた粗死亡率の第1位は、肺がんである。\nd 女性の部位別にみた粗死亡率の第1位は、子宮がんである。",["aとb","bとc","cとd","aとd"],2],
        ["下水に関する次の記述のうち、誤っているものはどれか。",["下水には、台所などで使われた生活排水のほか、各種工場から出る産業排水などがある。","下水には、病原微生物や寄生虫卵、有害物質が含まれている場合がある。","下水処理で発生する汚泥は、肥料やレンガなどに再資源化される技術が実用化されていないことから、すべて埋立処分が行われている。","下水処理が行われた後に河川などに放流される水の水質については、法令で規制されている。"],3],
        ["廃棄物の処理に関する次の記述のうち、誤っているものはどれか。",["美容所から排出される廃棄物も、法律による規制の対象となる。","廃棄物は、一般廃棄物と産業廃棄物とに大別される。","家庭から排出されるごみは、焼却される場合が多いが、再資源化されるものや埋め立てられるものもある。","産業廃棄物は、市町村が処理しなくてはならない。"],4],
        ["微生物に関する次の記述のうち、正しいものの組合せはどれか。\na 細菌の成分の80%は、タンパク質である。\nb 細菌の増殖は、菌体の2分裂によって行われる。\nc ウイルスは、DNAとRNAのいずれか1種類の核酸を持っている。\nd ウイルスの基本構造は、核酸とそれを保護する莢膜である。",["aとb","bとc","cとd","aとd"],2],
        ["感染に関する次の記述のうち、誤っているものはどれか。",["不顕性感染とは、感染していても発病していない状態であり、急性灰白髄炎(ポリオ)の不顕性感染はその一例である。","日和見感染とは、健康な人では問題にならないような病原性の低い病原体に感染、発病することであり、エイズ患者の真菌性肺炎はその一例である。","持続性感染とは、感染者が長期間にわたって病原体と共存し続けている状態であり、B型肝炎ウイルスの持続性感染はその一例である。","垂直感染とは、病原体に汚染された飲食物により感染することであり、コレラによる下痢はその一例である。"],4],
        ["常在細菌叢に関する次の記述のうち、誤っているものはどれか。",["皮膚や粘膜などには、一定の細菌が定着している。","病原体の侵入を防ぐ働きもある。","ビタミンなど人体に必要な物質を産生するものもある。","鼻腔に存在するブドウ球菌が感染源となることはない。"],4],
        ["季節性インフルエンザに関する次の記述のうち、誤っているものはどれか。",["大きな流行の原因となるのは、B型のインフルエンザウイルスのみである。","高齢者が肺炎を併発すると、重症になることがある。","飛沫により感染し、また、患者の分泌物に汚染された器物を介しても感染する。","予防対策として、手洗いの励行や手指のアルコール製剤による消毒、予防接種などがある。"],1],
        ["麻しんに関する次の記述のうち、正しいものの組合せはどれか。\na 病原体は麻しんウイルスであり、その感染力は非常に強い。\nb 定期の予防接種が実施されている。\nc 2〜3日の潜伏期を経て、急に高熱が出た後、小さな発疹が顔だけに現れる。\nd 海外からの持込み例もなく、国内での感染リスクはない。",["aとb","bとc","cとd","aとd"],1],
        ["消毒等の定義に関する次の記述のうち、正しいものの組合せはどれか。\na 消毒とは、病原微生物を殺すか除去して、感染力をなくすことをいう。\nb 滅菌とは、生きている微生物が存在しない状態にすることをいう。\nc 殺菌とは、微生物を殺して無菌な状態にすることをいう。\nd 防腐とは、対象物から微生物を除去することをいう。",["aとb","bとc","cとd","aとd"],1],
        ["美容所で行う血液が付着している疑いのない器具類の消毒法に関する次の記述のうち、誤っているものはどれか。",["クリッパーの刃に1cm²当たり85マイクロワット以上の紫外線を20分間以上照射する。","かみそりの表面を消毒用エタノールを含ませた綿若しくはガーゼで拭く。","くしを0.01%以上の次亜塩素酸ナトリウム水溶液に10分間以上浸す。","はさみを0.1%以上の逆性石けん水溶液に10分間以上浸す。"],2],
        ["消毒に関する次の記述のうち、正しいものの組合せはどれか。\na 水分の多いほうがタンパク質は熱変性を起こしやすいので、湿熱は乾熱より短い時間で消毒できる。\nb 美容所で用いることができる理学的消毒法は、蒸気消毒と煮沸消毒の2種類である。\nc 蒸気消毒は、煮沸消毒に比べて物品への熱侵入が確実なため、より短い時間で消毒できる。\nd 消毒薬の効果は、温度、濃度、時間に左右される。",["aとb","bとc","cとd","aとd"],4],
        ["消毒用エタノールに関する次の記述のうち、誤っているものはどれか。",["蒸発しやすく、可燃性蒸気が発生するため、火気があると引火することがある。","細菌の芽胞には効力がない。","ほかの消毒薬との併用はできない。","ゴムや一部のプラスチックを溶かすことがある。"],3],
        ["次亜塩素酸ナトリウム水溶液の調製に関する次の記述のうち、正しいものはどれか。",["水98に対して5%次亜塩素酸ナトリウム2の割合で混合すると、0.1%水溶液になる。","5%次亜塩素酸ナトリウムを100倍希釈すると、0.1%水溶液になる。","水99に対して5%次亜塩素酸ナトリウム1の割合で混合すると、0.01%水溶液になる。","5%次亜塩素酸ナトリウムを50倍希釈すると、0.01%水溶液になる。"],1],
        ["眼とその周辺の構造に関する次の記述のうち、正しいものはどれか。",["涙点は、外眼角の近くにある点状の小さな孔である。","瞳孔は、虹彩の中央にある黒く見える部分である。","「しろめ」の白い色は、眼球結膜の色である。","下眼瞼の睫毛は、上眼瞼の睫毛より長く密である。"],2],
        ["次の筋のうち、運動神経により収縮が引き起こされるものはどれか。",["心筋","横隔膜","血管の平滑筋","気管支の平滑筋"],2],
        ["次のうち、呼吸や循環機能の中枢があるものはどれか。",["大脳","小脳","脳幹","脊髄"],3],
        ["次の耳の部分のうち、耳管により咽頭とつながっているものはどれか。",["耳介","外耳道","中耳","内耳"],3],
        ["次の血球のうち、酸素を運搬する機能があるものはどれか。",["赤血球","好中球","血小板","リンパ球"],1],
        ["皮膚の構造に関する次の記述のうち、正しいものの組合せはどれか。\na 皮膚の厚さは部位による差がなく、均一である。\nb 皮膚の最も外側にある表皮は、その95%が色素細胞(メラノサイト)で成り立っている。\nc 表皮と真皮の境目が波形であることは、皮膚の弾力性の一因である。\nd 真皮の下方には、多量の脂肪を含んだ皮下組織がある。",["aとb","bとc","cとd","aとd"],3],
        ["毛の構造に関する次の記述のうち、正しいものはどれか。",["皮膚表面に出ている毛の部分を毛根という。","毛の3つの層のうち、中心部を毛小皮という。","毛皮質の細胞には、褐色のメラニンが含まれる。","毛髄質は、ウロコのように角化した透明な核のない細胞からなる。"],3],
        ["皮膚と皮膚付属器官の生理機能に関する次の記述のうち、誤っているものはどれか。",["皮膚では、痛覚が最も鋭敏で、温覚が最も鈍い。","皮脂の分泌は20〜25歳頃から増え始め、高齢になるほど増加する。","手掌、足底、腋窩から、温度と関係なく精神的な感動によって急激に汗が出ることがある。","爪は、爪母が取り除かれると再生しない。"],2],
        ["皮膚と皮膚付属器官の保健に関する次の記述のうち、誤っているものはどれか。",["糖尿病があると、細菌や真菌による皮膚疾患にかかりやすい。","肝臓障害により、皮膚に強いかゆみを生じることがある。","更年期の女性では、フケの増加やひげの発育がみられることがある。","貧血があるとチアノーゼの状態になり、皮膚は紫色を帯びる。"],4],
        ["皮膚疾患とその原因に関する次の組合せのうち、誤っているものはどれか。",["頭部白癬(シラクモ) ― 細菌","帯状疱疹 ― ウイルス","伝染性膿痂疹(トビヒ) ― 細菌","疥癬(ヒゼン) ― ダニ"],1],
        ["香粧品に配合される油性原料に関する次の記述のうち、誤っているものはどれか。",["高級アルコールは、炭素数の多いアルコールである。","炭化水素は、石油から得られるもので、動植物からは得られない。","油脂が酸素や微生物等の作用で酸化したり加水分解したりして変質することを、酸敗という。","ロウ類は、高級アルコールと高級脂肪酸とのエステルである。"],2],
        ["界面活性剤に関する次の記述のうち、誤っているものはどれか。",["石けんは、陰イオン界面活性剤(アニオン界面活性剤)に分類され、洗浄効果に優れている。","第四級アンモニウム塩は、陽イオン界面活性剤(カチオン界面活性剤)に分類され、ヘアリンス剤等に用いられる。","レシチンは、両性界面活性剤に分類され、大豆や卵黄等から得られる。","アルキル硫酸ナトリウムは、非イオン界面活性剤(ノニオン界面活性剤)に分類され、損傷毛に対する帯電防止効果に優れている。"],4],
        ["香粧品のクリームに関する次の記述のうち、正しいものの組合せはどれか。\na クリームには、必ず油性成分が入っている。\nb 油性成分が10%のクリームは、中油性クリームに分類される。\nc クレンジングクリームは、メイクアップ用香粧品を除去する機能を有している。\nd バニシングクリームは、O/W型クリームである。",["aとb","bとc","cとd","aとd"],3],
        ["パーマ剤の有効成分とその働きに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「[ A ] は、二浴式パーマ剤の [ B ] の有効成分で [ C ] として働く。」",["A:チオグリコール酸 ― B:第2剤 ― C:還元剤","A:モノエタノールアミン ― B:第1剤 ― C:還元剤","A:臭素酸ナトリウム ― B:第2剤 ― C:酸化剤","A:システイン ― B:第1剤 ― C:酸化剤"],3],
        ["2剤型の酸化染毛剤による染毛メカニズムに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「第2剤の [ A ] が第1剤の影響で分解して酸素を放出する。この酸素が毛髪中の [ B ] を分解し、さらに第1剤の染料中間体を酸化して重合させ、発色させる。このとき、第1剤に配合された [ C ] が染料中間体と共に酸化されると、染料中間体単独とは異なった色調に発色する。」",["A:過酸化水素 ― B:メラニン ― C:調色剤(カップラー)","A:過酸化水素 ― B:シスチン ― C:アルカリ剤","A:過硫酸塩 ― B:メラニン ― C:アルカリ剤","A:過硫酸塩 ― B:シスチン ― C:調色剤(カップラー)"],1],
        ["次の明治時代の女性の髪型のうち、日本髪に該当するものはどれか。",["銀杏返し","ひさし髪","二百三高地髷","まがれいと"],1],
        ["近代の服装に関する次の記述のうち、誤っているものはどれか。",["明治維新後には、服飾の洋風化が文明開化のシンボルとされた。","日清戦争頃に国粋主義が台頭し、洋装化がさらに進んだ。","関東大震災以降に、女性の間で洋装が定着した。","大正末頃から、セーラー服とスカートが女学生の制服として採用された。"],2],
        ["女性の礼装である留袖に関する次の記述のうち、誤っているものはどれか。",["色ものは色留袖といい、黒地のものは黒留袖という。","色留袖は、既婚女性に限らず着用できる。","留袖には、肩、袖、腰から裾にかけて絵羽模様があしらわれている。","留袖の名前は、成人のしるしとして振袖の袖丈を短くし、振りを閉じたことに由来している。"],3],
        ["頭部のポイントとヘアラインに関する次の記述のうち、誤っているものはどれか。",["頭部の生え際をヘアラインという。","頭部の頂点で正中線上の点をゴールデンポイントという。","鬢の生え際をサイドラインという。","正中線上で後頭部の一番凸の部分をバックポイントという。"],2],
        ["ヘアドライヤーに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「ヘアドライヤーの構造で中心をなすのは [ A ] 、[ A ] を動かすための [ B ] 、そして [ C ] である。[ A ] により風が起こされ、この風が [ C ] により熱せられ、さらに [ A ] により送風される。」",["A:発熱器 ― B:モーター ― C:スイッチ","A:モーター ― B:ファン ― C:発熱器","A:スイッチ ― B:ファン ― C:モーター","A:ファン ― B:モーター ― C:発熱器"],4],
        ["次の技術のうち、ヘアトリートメント技術に該当しないものはどれか。",["ニーディング","ハッキング","フィンガースルー","スクランチ"],2],
        ["デザインの原理に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「同じ線であっても、その方向によって感じる印象は異なったものになる。[ A ] は安定感を与え、[ B ] は平衡・均衡・強力な支柱を暗示し、[ C ] は不安定感・運動感・緊張感を生じさせる。」",["A:水平線 ― B:垂直線 ― C:斜線","A:斜線 ― B:水平線 ― C:垂直線","A:垂直線 ― B:斜線 ― C:水平線","A:水平線 ― B:斜線 ― C:垂直線"],1],
        ["次のテーパーカットのうち、テーパーする深さにより分類されるカット技法はどれか。",["アウトサイドテーパーカット","ノーマルテーパーカット","インサイドテーパーカット","レフトサイドテーパーカット"],2],
        ["パーマネントウェーブ技術に関する次の記述のうち、正しいものはどれか。",["ワインディングする前に、フェイスラインに保護用クリームを塗る。","はっ水性毛は、パーマがかかりやすい。","テストカールは、第2剤塗布後に行う。","テストカール時の適正カールの直径は、使用したロッドの直径の約2.5倍である。"],4],
        ["ピンカールに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「カールの巻き方には、毛先に近いほうから巻いて毛先が内側になる場合と、根元のほうから巻いて毛先が外側になる場合とがある。毛先が内側の場合は、毛先のウェーブの幅が [ A ] 、根元になるほど幅が [ B ] なり、その代表的なカールとして [ C ] がある。」",["A:狭く ― B:広く ― C:クロッキノールカール","A:広く ― B:狭く ― C:メイポールカール","A:狭く ― B:広く ― C:メイポールカール","A:広く ― B:狭く ― C:クロッキノールカール"],1],
        ["次のヘアカラーのうち、赤みのある毛髪をナチュラルな毛髪の色に近づけたいときに用いるものはどれか。",["赤系のヘアカラー","青系のヘアカラー","紫系のヘアカラー","緑系のヘアカラー"],4],
        ["アーティフィシャルネイル技術の用具とその説明に関する次の組合せのうち、正しいものはどれか。",["フィラー ― 爪の長さや形を整えるもの","アクティベーター ― グルーの硬化促進剤","プライマー ― グルーと合わせて爪の修復や補強に使用するためのアクリルパウダー","エメリーボード ― アーティフィシャルネイルが爪によく付くようにするもの"],2],
        ["まつ毛エクステンションの用具に関する次の記述のうち、正しいものはどれか。",["グルーは、保管方法で劣化を防ぐことができるため、使用期限がない。","精製水は、すべての道具を消毒するために使用する。","エアブロアは、まつ毛やグルーを乾燥させるために使用する。","マイクロスティックは、目元を保護するために使用する。"],3],
        ["下図は、花嫁の文金高島田につける装飾品の各部を表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:中挿し ― B:根飾り ― C:前挿し","A:後挿し ― B:飾櫛 ― C:前飾り","A:後挿し ― B:前飾り ― C:根飾り","A:中挿し ― B:飾櫛 ― C:前挿し"],4],
        ["次の帯のうち、最も格調高いとされる幅約70cm、丈約4.2mの帯はどれか。",["角帯","名古屋帯","丸帯","兵児帯"],3]

      49: [
        ["美容師法に関する次の記述のうち、誤っているものはどれか。",["公衆衛生の向上に資することで国民全体の利益を図っている。","美容業の経営の健全化を促進することにより、美容業の振興を図っている。","美容の業務が適正に行われるように規律している。","美容師の資格を定め、美容師の免許を受けた者でなければ美容を業としてはならないとしている。"],2],
        ["美容師の免許に関する次の記述のうち、正しいものはどれか。",["免許の申請に当たっては、伝染性の疾病の有無に関する診断書を添付しなければならない。","他の都道府県に住所地を変更したときは、速やかに美容師名簿の訂正を申請しなければならない。","業務停止処分となったときは、速やかに処分を行った者に免許証(免許証明書)を提出する必要がある。","免許証(免許証明書)を紛失したときは、住所地の都道府県知事に再交付を申請しなければならない。"],3],
        ["次のうち、美容師の免許取消処分の対象となるものはどれか。",["美容師法の規定による業務の停止処分に違反して、業務停止の期間中に美容の業をした場合","美容師法等で定める衛生上必要な措置を講じなかった場合","伝染性の疾病にかかり、その就業が公衆衛生上不適当と認められる場合","美容師法の政令又は都道府県等の条例で定める特別の事情がないにもかかわらず、美容所以外の場所で美容の業をした場合"],1],
        ["管理美容師に関する次の記述のうち、正しいものはどれか。",["美容師が1人だけであっても、美容師以外の従業者が常時1人以上いる美容所は、管理美容師を置かなければならない。","管理美容師は、美容師の免許取得後3年以上経過し、厚生労働大臣が指定する講習会の課程を修了した者でなければならない。","美容所の開設者が管理美容師となる要件を満たす場合は、開設する複数の美容所の管理美容師となることができる。","美容所開設の届出には、管理美容師の氏名のほかに、その者の住所も届け出なければならない。"],4],
        ["美容所に関する次の記述のうち、誤っているものはどれか。",["美容所を開設しようとする者は、営業を開始する前に都道府県知事等に開設の届出をしなければならない。","要件を満たせば、自動車を使用した移動美容所の開設が認められる。","美容所と理容所を同一の施設において重複開設することは、いかなる場合でも認められない。","相続等により美容所の開設者の地位を承継した者は、遅滞なくその旨を届け出なければならない。"],3],
        ["美容師法に基づく美容所の検査に関する次の記述のうち、正しいものはどれか。",["都道府県知事は、美容所の衛生上必要な措置の実施状況と併せて経営状況についても立入検査を行わせることができる。","立入検査は、行政から委託された生活衛生監視員によって行われる。","立入検査を妨げた場合には、そのことにより美容所の閉鎖処分となることがある。","美容所の構造設備について確認検査を受けずに美容所を使用した場合には、罰金に処されることがある。"],4],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に基づく生活衛生同業組合に関する次の記述のうち、正しいものの組合せはどれか。\na 営利を目的として設立された組織である。\nb 組合員としての加入や脱退が任意にできる。\nc 振興指針に沿って振興計画を定めることができる。\nd 営業方法についての組合員間の協定を制約なく定めることができる。",["aとb","bとc","cとd","aとd"],2],
        ["税金に関する次の記述のうち、正しいものの組合せはどれか。\na 法人税や個人経営の場合の所得税は、利益が出ていなくても納めなければならない税金である。\nb 雇用主は、従業員の給与から源泉所得税を預かり、原則として翌月10日までに税務署に納める。\nc 申告納税しなければならない者が申告や納税義務を怠った場合には、罰則として追加の税が課されることになっている。\nd 個人経営の事業者は、毎年1月15日までに税務申告書を税務署に提出しなければならない。",["aとb","bとc","cとd","aとd"],2],
        ["労働基準法に関する次の記述のうち、誤っているものはどれか。",["労働者が使用者の別居の親族である場合は、労働基準法が適用される。","雇用契約を結ぶときは、労働者に契約期間や賃金等の労働条件を明示しなければならない。","パートタイムの労働者に対しては、年次有給休暇を与えなくてもよい。","労働時間が8時間を超える場合は、少なくとも1時間の休憩時間を労働時間の途中に与えなければならない。"],3],
        ["医療保険制度に関する次の記述のうち、正しいものの組合せはどれか。\na 美容所の従業者で、健康保険などの被用者保険や後期高齢者医療制度に加入していない者は、国民健康保険の対象となる。\nb 70歳以上の者はすべて、後期高齢者医療制度の被保険者となる。\nc 健康保険の療養の給付における一部負担金の割合は、年齢にかかわらず、かかった医療費の3割である。\nd 健康保険、国民健康保険ともに高額療養費制度がある。",["aとb","bとc","cとd","aとd"],4],
        ["母子保健に関する次の記述のうち、誤っているものはどれか。",["妊娠したことを市町村に届け出ると、母子健康手帳が交付される。","乳児の生存は、出産前も含めた母体の健康状態の影響を受ける。","医療機関等での妊婦の健康診査は、病気のある妊婦が対象である。","1歳6か月児や3歳児の健康診査では、心身の異常の早期発見や栄養指導が行われている。"],3],
        ["生活習慣病と健康増進対策に関する次の記述のうち、誤っているものはどれか。",["生活習慣には、食事や運動、喫煙が含まれる。","メタボリック症候群に着目した特定健診・特定保健指導は、30歳以上60歳未満の人が対象である。","生活習慣は、心疾患の発病に関与している。","「健康日本21(第2次)」は、健康寿命の延伸と健康格差の縮小を目指している。"],2],
        ["糖尿病に関する次の記述のうち、誤っているものはどれか。",["1型糖尿病の主たる原因は、食事や運動などの生活習慣である。","進行すると、腎機能障害や網膜症などを合併することがある。","心臓病の危険因子の一つである。","発症予防や重症化予防が、健康寿命の延伸につながる。"],1],
        ["室内の照度と照明に関する次の記述のうち、誤っているものはどれか。",["室内の照度が不適当な場合は、近視、眼精疲労、頭痛、作業効率の低下などを起こすことがある。","一般に日常生活に不自由のない明るさは、20〜30ルクス程度である。","理容所及び美容所における衛生管理要領では、作業中の作業面の照度が300ルクス以上であることが望ましいとされている。","作業場所だけを明るくする局所照明と、部屋全体を明るくする全般照明とがある。"],2],
        ["アタマジラミに関する次の記述のうち、誤っているものはどれか。",["頭皮に卵を産む。","幼虫、成虫とも頭皮から吸血する。","保育所や幼稚園で集団発生することがある。","櫛やタオルの共用でうつることがある。"],1],
        ["次の感染症のうち、美容師が感染している場合に、感染症法に基づく就業制限の対象となるものはどれか。",["風しん","日本脳炎","破傷風","結核"],4],
        ["感染症と病原体に関する次の組合せのうち、誤っているものはどれか。",["百日せき ― ウイルス","コレラ ― 細菌","マラリア ― 原虫","ツツガムシ病 ― リケッチア"],1],
        ["ウイルス性肝炎に関する次の記述のうち、誤っているものはどれか。",["A型肝炎は、経口感染が主な感染形式である。","B型肝炎は、垂直感染することがある。","C型肝炎は、血液等を介して感染する感染症である。","A型肝炎、B型肝炎、C型肝炎のうち、慢性肝炎に移行することがないのはC型肝炎だけである。"],4],
        ["次の感染症のうち、血液や体液を介して感染するものの組合せはどれか。\na 腸チフス\nb B型肝炎\nc 後天性免疫不全症候群(エイズ)\nd 腸管出血性大腸菌感染症",["aとb","bとc","cとd","aとd"],2],
        ["次の感染症のうち、妊娠中の母体から胎盤を介して胎児に感染することがあるものはどれか。（※公式採点では(2)と(4)のいずれも正解）",["ジフテリア","梅毒","細菌性赤痢","麻しん"],2],
        ["美容師法施行規則に定められた消毒の方法に関する次の記述のうち、正しいものはどれか。",["血液が付着していないかみそりを、次亜塩素酸ナトリウムが0.01%以上である水溶液中に10分間以上浸す。","血液が付着したはさみを、80℃を超える湿熱に10分間以上触れさせる。","血液が付着していないヘアブラシを、逆性石けんが0.1%以上である水溶液中に10分間以上浸す。","血液が付着したくしの表面を、消毒用エタノールを含ませた綿又はガーゼで拭く。"],3],
        ["消毒・殺菌に関する次の記述のうち、誤っているものはどれか。",["加熱消毒では、煮沸より蒸気の方が時間は長くかかる。","薬液消毒では、温度が低ければ時間は長くかかる。","加熱消毒では、同じ時間と温度であれば乾熱より湿熱の方が殺菌効果が高い。","薬液消毒では、温度・湿度・濃度が殺菌効果の3要素である。"],4],
        ["紫外線消毒に関する次の記述のうち、誤っているものはどれか。",["紫外線殺菌灯は、殺菌力の強い波長である253.7ナノメートル内外の紫外線を照射するように作られている。","美容所において、かみそり以外の血液の付着していない器具の消毒には、1cm²当たり85マイクロワット以上の紫外線を20分間以上照射する方法を用いることができる。","紫外線殺菌灯は、使用時間にかかわらず、発光していることが確認できれば殺菌力は変わらない。","紫外線消毒器内には、陰ができないように被消毒器具を配置する。"],3],
        ["次亜塩素酸ナトリウムに関する次の記述のうち、正しいものの組合せはどれか。\na 漂白作用がある。\nb 酸性の洗剤と混ぜると有害なガスが発生する。\nc 0.1%水溶液に10分間浸すと細菌の芽胞は不活化する。\nd 消毒するものに有機物の汚れが残っていても消毒効果は低下しない。",["aとb","bとc","cとd","aとd"],1],
        ["消毒薬水溶液の調製に関する次の記述のうち、正しいものはどれか。",["0.2%逆性石けん水溶液1,000mLを調製するためには、水990mLに10%逆性石けん10mLを加える。","0.1%両性界面活性剤水溶液1,000mLを調製するためには、水980mLに10%両性界面活性剤20mLを加える。","0.05%グルコン酸クロルヘキシジン水溶液1,000mLを調製するためには、水995mLに20%グルコン酸クロルヘキシジン5mLを加える。","0.05%次亜塩素酸ナトリウム水溶液1,000mLを調製するためには、水990mLに5%次亜塩素酸ナトリウム10mLを加える。"],4],
        ["次の神経のうち、上腕二頭筋が収縮するときに直接働くものはどれか。",["運動神経","知覚神経","交感神経","副交感神経"],1],
        ["視覚に関する次の記述のうち、正しいものはどれか。",["光は、眼球結膜を通って眼球内部に入る。","硝子体は、光の焦点を調節するレンズの役割を果たす。","角膜には、光を感じる杆体細胞と錐体細胞とがある。","光の感覚は、視神経を通して脳に伝えられる。"],4],
        ["次の血球のうち、健康な成人の血液において核のないものはどれか。",["好中球","赤血球","単球","リンパ球"],2],
        ["次の部位のうち、血液と空気の間でガス交換が行われるのはどれか。",["気管","喉頭","肺胞","鼻腔"],3],
        ["次のうち、内容物を肛門側に送るための小腸の運動はどれか。",["分節運動","振子運動","蠕動運動","嚥下"],3],
        ["次の細胞のうち、表皮に最も多く含まれるものはどれか。",["色素細胞(メラノサイト)","角化細胞(ケラチノサイト)","線維芽細胞","ランゲルハンス細胞"],2],
        ["皮膚付属器官の構造に関する次の記述のうち、誤っているものはどれか。",["毛母には、色素細胞が多数存在する。","立毛筋は、すべての毛包についているとは限らない。","手掌や足底には、独立脂腺が分布している。","エクリン腺は、生まれたときから全身のほとんどの皮膚に分布している。"],3],
        ["皮膚の保護作用に関する次の記述のうち、誤っているものはどれか。（※公式試験では採点除外問題）",["脂肪膜には、機械的外力に対する保護作用がある。","メラニンには、光線に対する保護作用がある。","ケラチンには、化学的刺激に対する保護作用がある。","皮膚常在菌には、微生物に対する保護作用がある。"],1],
        ["疾患と皮膚の状態に関する次の組合せのうち、誤っているものはどれか。",["心臓疾患 ― 蕁麻疹","肝臓障害 ― 黄疸","腎疾患 ― むくみ","糖尿病 ― 細菌や真菌による皮膚疾患"],1],
        ["次の疾患のうち、感染性の皮膚疾患に該当するものはどれか。",["アトピー性皮膚炎","尋常性乾癬","尋常性白斑","頭部白癬"],4],
        ["界面活性剤に関する次の記述のうち、正しいものはどれか。",["水中の界面活性剤は、臨界ミセル濃度以上になると疎水性の部分を外側に向けたミセルを形成する。","粉体を液体の基剤中に均一な微細粒子状で安定させることを乳化という。","石けんは、陽イオン界面活性剤である。","ヘアリンス剤に配合された第四級アンモニウム塩などの陽イオン界面活性剤には、帯電防止効果がある。"],4],
        ["香粧品に用いられる色材に関する次の記述のうち、誤っているものはどれか。（※公式採点では(2)と(3)のいずれも正解）",["酸化鉄は着色顔料で、黄色、赤色及び黒色がある。","酸化チタンは白色顔料で、紫外線散乱剤としてサンスクリーン製品に配合される。","有機合成色素(タール色素)は、光による経時変化を受けることはない。","雲母チタンは、パールのような光沢を発する。"],3],
        ["香粧品の品質保持に用いられる配合成分に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「香粧品には、微生物による変質を防ぐためにパラオキシ安息香酸エステル(パラベン)等の [ A ] が配合される。また、香粧品原料と空気中の [ B ] との接触により起こる酸化反応を抑えるため、トコフェロール(ビタミンE)等の酸化防止剤や [ C ] 等の金属イオン封鎖剤(キレート剤)が配合される。」",["A:防腐剤 ― B:窒素 ― C:イソプロピルメチルフェノール","A:防腐剤 ― B:酸素 ― C:エチレンジアミン四酢酸(エデト酸、EDTA)","A:抗酸化剤 ― B:酸素 ― C:イソプロピルメチルフェノール","A:抗酸化剤 ― B:窒素 ― C:エチレンジアミン四酢酸(エデト酸、EDTA)"],2],
        ["スタイリング剤に関する次の記述のうち、誤っているものはどれか。",["ジメチルエーテル(DME)は、保湿剤としてヘアジェルに用いられる。","ポリビニルピロリドン(PVP)は、皮膜形成剤としてセットローションに用いられる。","エタノール(エチルアルコール)は、溶剤としてヘアリキッドに用いられる。","ヒマシ油は、油性原料として植物性ポマードに用いられる。"],1],
        ["パーマ剤の有効成分に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「二浴式のパーマ剤は、[ A ] のような [ B ] を有効成分とする第1剤と、[ C ] のような [ D ] を有効成分とする第2剤とからなる。」",["A:臭素酸ナトリウム ― B:還元剤 ― C:チオグリコール酸 ― D:酸化剤","A:臭素酸ナトリウム ― B:酸化剤 ― C:チオグリコール酸 ― D:還元剤","A:チオグリコール酸 ― B:還元剤 ― C:臭素酸ナトリウム ― D:酸化剤","A:チオグリコール酸 ― B:酸化剤 ― C:臭素酸ナトリウム ― D:還元剤"],3],
        ["明治時代の女性の髪型に関する次の記述のうち、誤っているものはどれか。",["唐人髷や結綿は、代表的な束髪である。","丸髷は、既婚女性の髪型として結われた。","束髪は、日本髪に比べ手入れがしやすく衛生的で日常生活に便利であった。","女性の断髪は強い非難を浴び、東京府は女性の断髪を禁じた。"],1],
        ["次のうち、1958年のパリ・コレクションで多くのデザイナーに採用され、日本で大流行した筒形で袋のようなシルエットの洋服はどれか。",["マンボズボン","サックドレス","ミニスカート","ロングスカート"],2],
        ["花嫁の和装礼装に関する次の記述のうち、正しいものはどれか。",["懐剣は、帯の右胸下にさす。","小袖の身丈は、かかとの位置に仕立てる。","小袖の上につける掛下帯は、半幅帯を二重太鼓に結ぶ。","色直しは、大振袖の二枚重ねが正式である。"],4],
        ["下図は、手掌を表したものである。A、B、Cに該当する名称の次の組合せのうち、正しいものはどれか。",["A:小指球 ― B:指先 ― C:中指","A:母指球 ― B:指腹 ― C:中指","A:小指球 ― B:指腹 ― C:環指","A:母指球 ― B:指先 ― C:環指"],2,"hand_49_44"],
        ["次のコームの部位のうち、コームの目に入った毛髪を一線にそろえる働きをするものはどれか。",["歯","肩","歯元","歯先"],1],
        ["ヘッドスパに関する次の記述のうち、誤っているものはどれか。",["シャンプーだけでは取り除けない毛穴の老廃物を取り除き、頭皮ケアを行う。","血行を促進させ、新陳代謝を高めるために、頭部のマッサージを行う。","頭皮環境の改善が目的なので、髪質改善のためのトリートメントは同時に行わない。","施術中に、音やアロマなどでリラックスしてもらう。"],3],
        ["次のうち、下図に該当する錯視はどれか。",["分割距離錯視","距離・大きさの錯視","角度・方向の錯視","大きさの対比現象"],3,"zollner_49_47"],
        ["カッティングにおけるパネルに関する次の記述のうち、正しいものはどれか。",["パネルの面を頭皮面に対して90度に引くことを、オンベースという。","パネルの幅が同じ場合は、パネルの長さが短いほうがカットラインの長さの誤差が小さくなる。","パネルの長さが同じ場合は、パネルの幅が広いほうがカットラインの長さの誤差が小さくなる。","セイムレングスカットの場合は、アップステムでパネルをシェープする。"],1],
        ["次のうち、パーマネントウェーブ技術において直径10mmのロッドでフルウェーブを形成する場合に必要となる毛髪の長さはどれか。",["約11.3 cm","約9.4 cm","約8.5 cm","約7.5 cm"],2],
        ["パーマネントウェーブ技術に関する次の記述のうち、正しいものはどれか。",["毛髪診断は、シャンプーの前の毛髪が乾いた状態のみで行う。","毛髪をウェットの状態でワインディングした後、第1剤を塗布する方法を、つけ巻きという。","ウェーブの大小は、第1剤塗布後の放置タイムのみによって決まる。","テストカール時の適正カールの直径は、使用したロッドの直径の2.5倍である。"],4],
        ["ローラーカーリングに関する次の記述のうち、正しいものはどれか。",["毛先を中心に集めて巻くと、できたウェーブは平行な広がりを持ち、応用性に富んだムーブメントが得られる。","生え際で毛髪の立ち上がりを求める場合は、ベースを厚くとるとよい。","ストランドの中心が頭皮面に対して90度の角度になるようシェープして巻くと、最もボリュームが出る。","ダウンステムでボリュームを抑える場合は、ベースを厚めにするとローラーのおさまりがよい。"],1],
        ["ヘアカラー製品に関する次の記述のうち、誤っているものはどれか。",["永久染毛剤には、酸化染毛剤と非酸化染毛剤がある。","一時染毛料は、シャンプーイングしても色落ちしない。","半永久染毛料の色持ちは、約2〜4週間である。","脱色剤の刺激により接触皮膚炎を起こすことがある。"],2],
        ["まつ毛エクステンションに関する次の記述のうち、正しいものはどれか。",["グルーなどが目に入った場合は流水で流し、直ちに眼科医の診察を受けてもらう。","施術中は眼鏡が使用できないため、グルーが乾くまではコンタクトレンズを使用してもらう。","再来の場合は、カウンセリングを省略してもよい。","施術後すぐにメイクアップはできないので、アイメイクアップは落とさずに施術する。"],1],
        ["日本髪結髪用の櫛である鬼歯に関する次の記述のうち、正しいものはどれか。",["仕上げに表面の毛の流れを整えるために使う。","鬢を裏からふくらませたり、鬢の形を整えたりするために使う。","前髷などを広げるために使う。","おおまかに髪をとかすために使う。"],2],
        ["女性の和装着付けに関する次の記述のうち、正しいものはどれか。",["ひもを結ぶ位置は、必ず体の中心とする。","留袖では、帯締めや帯揚げ、半襟、足袋は華やかな色物を用いる。","大柄な人の帯幅は、狭くする。","若い人の帯幅は、広めにする。"],4]
      ],
      48: [
        ["美容師の養成と免許に関する次の記述のうち、誤っているものはどれか。",["外国で美容を業としていた者であっても、日本で美容師となるためには、美容師養成施設において必要な知識及び技能を修得しなければならない。","理容師養成施設又は美容師養成施設のいずれか一方を卒業した者が、他方の養成施設で履修する場合には、履修課目の一部を免除する制度が設けられている。","美容師試験に合格しても、かつて無免許で美容の業を行った者には、免許が与えられないことがある。","美容師試験に合格しても、伝染性の疾病にかかっている者には、免許が与えられないことがある。"],4],
        ["美容師に対する行政処分と罰則に関する次の記述のうち、誤っているものはどれか。",["美容師が伝染性の疾病にかかり、その就業が公衆衛生上不適当と認められるときは、業務停止処分となることがある。","美容師が業務停止処分に違反したときは、そのことにより罰金に処されることがある。","美容師が精神の機能の障害により業務を適正に行うことができないときは、免許を取り消されることがある。","美容師が免許の取消処分後においても、引き続き、美容の業務を行ったときは、罰金に処されることがある。"],2],
        ["美容所の開設に関する次の記述のうち、正しいものはどれか。",["美容所の開設者は、美容師の免許を有する者でなければならない。","会社の福利厚生のための美容所については、業として行う場合であっても開設の届出は不要である。","美容所の開設の届出事項には、美容師の氏名は含まれるが、その他の従業者の氏名は含まれない。","美容所の開設届には、業務に従事する美容師について、指定された伝染性疾病の有無に関する医師の診断書を添えなければならない。"],4],
        ["出張美容に関する次の記述のうち、正しいものはどれか。",["美容師が出張美容において美容師法に基づく衛生上の措置を行わなかったときは、業務停止処分となることがある。","出張美容が認められる場合については、都道府県等の条例のみで定められている。","家族の育児や介護に従事している者に対する出張美容は、いかなる場合も認められない。","美容師が出張美容が認められない場所で美容の業務を行ったときは、美容所の閉鎖処分となることがある。"],1],
        ["美容所の開設者に対する行政処分と罰則に関する次の記述のうち、正しいものの組合せはどれか。\na 管理美容師を設置すべき美容所に管理美容師を設置しないときは、美容所の閉鎖処分となることがある。\nb 美容所開設時における検査確認を受けずに美容所を使用したときは、罰金に処されることがある。\nc 美容師法に基づく衛生措置を行わなかったときは、そのことにより罰金に処されることがある。\nd 環境衛生監視員による立入検査を妨害したときは、美容所の閉鎖処分となることがある。",["aとb","bとc","cとd","aとd"],1],
        ["生活衛生関係営業の運営の適正化及び振興に関する法律に関する次の記述のうち、正しいものはどれか。",["生活衛生同業組合は、料金等を規制するための標準営業約款を定めることができる。","美容業については、1つの都道府県に複数の生活衛生同業組合を設立することができる。","生活衛生営業指導センターは、経営の健全化を通じて衛生水準の維持向上を図り、利用者又は消費者の利益を守るために設置されている。","都道府県知事は、生活衛生関係営業の振興を図るため、振興指針を定めることができる。"],3],
        ["美容業の衛生や運営に関連する法律に関する次の記述のうち、正しいものはどれか。",["医薬品、医療機器等の品質、有効性及び安全性の確保等に関する法律は、化粧品を規制の対象としていない。","医師法に基づき、医師でない者が針先に色素を付け皮膚の表面に墨等の色素を入れる行為(アートメイク)を業として行うことは禁止されている。","廃棄物の処理及び清掃に関する法律に基づき、美容所から出される毛髪については産業廃棄物として処理される。","個人情報の保護に関する法律は、一定の数以上の個人情報を管理する事業者のみを規制の対象としている。"],2],
        ["国民年金制度に関する次の記述のうち、誤っているものはどれか。",["老齢基礎年金は、保険料納付済期間によって給付額が異なる。","遺族基礎年金は、被保険者が死亡した場合に、一定の要件に該当する遺族に支給される。","国民年金の第1号被保険者(自営業者等)の保険料は、所得が高いほど高額となる。","付加保険料を納付することで付加年金が支給される制度が設けられている。"],3],
        ["医療保険に関する次の記述のうち、正しいものの組合せはどれか。\na 健康保険の保険者は、全国健康保険協会と健康保険組合である。\nb 健康保険の保険料は、すべての保険者で一律に設定されている。\nc 国民健康保険の保険者は、国と国民健康保険組合である。\nd 国民健康保険の保険料は、保険者ごとに個々に設定されている。",["aとb","bとc","cとd","aとd"],4],
        ["労働保険に関する次の記述のうち、誤っているものはどれか。",["雇用保険の基本手当は、一定の要件を満たせば自己都合で退職し失業した場合にも支給される。","雇用保険の給付には、育児休業給付は含まれない。","労働者災害補償保険の適用事業に雇用される者は、国籍や身分、年齢などにかかわらず適用労働者となる。","労働者災害補償保険では、通勤途上の事故により被った傷病に対しても保険給付を受けられることがある。"],2],
        ["保健所に関する次の記述のうち、誤っているものはどれか。",["地域における公衆衛生の第一線機関である。","感染症の予防や精神保健、難病に関する事業を実施している。","食品衛生関係施設の監視や指導を実施している。","介護認定審査会が設置されている。"],4],
        ["わが国の平均寿命に関する次の記述のうち、誤っているものはどれか。",["2015年の平均寿命は、男女とも80年を超えている。","2015年の男女の平均寿命の差は、10年以下である。","平均寿命は、2015年がピークである。","戦後の平均寿命の延びの一因は、公衆衛生の向上である。"],3],
        ["喫煙と飲酒に関する次の記述のうち、誤っているものはどれか。",["わが国の女性の喫煙者率は、2005年以降上昇し続けている。","たばこの煙には、多種の発がん物質や発がん促進物質が含まれている。","受動喫煙の防止が、健康増進法に定められている。","飲酒に起因する健康障害には、アルコール依存症のみならず、脳卒中、がんなども含まれる。"],1],
        ["日本の四季と疾病に関する次の記述のうち、誤っているものはどれか。",["春季には、スギやヒノキによる花粉症の患者が多くなる。","梅雨明け直後は、多くの人が十分に暑さに慣れていないため、熱中症リスクが高くなる。","夏季には、ウイルス性の食中毒の発生件数がピークとなる。","冬季には、季節性インフルエンザの患者が多くなる。"],3],
        ["一酸化炭素に関する次の記述のうち、正しいものはどれか。",["不快な臭いがする。","赤血球のヘモグロビンとの結合力が酸素より強い。","人間の健康に対する影響はない。","空気中には窒素に次いで多く含まれる。"],2],
        ["次の感染症のうち、細菌を病原体とするものはどれか。",["後天性免疫不全症候群(エイズ)","アニサキス症","重症急性呼吸器症候群(SARS)","百日せき"],4],
        ["細菌とウイルスに関する次の記述のうち、正しいものの組合せはどれか。\na 細菌は生きた細胞の中だけで発育するため、環境中に存在することはない。\nb 本来は病原性の強くない常在細菌によっても、宿主の抵抗力低下により発病することがある。\nc 細菌やウイルスが薬剤に対して抵抗性を持つようになることを、耐性を獲得したという。\nd ウイルスは変異によって弱毒となるが、強毒となることはない。",["aとb","bとc","cとd","aとd"],2],
        ["次の感染症のうち、空気感染するものはどれか。",["破傷風","C型肝炎","麻しん","デング熱"],3],
        ["結核に関する次の記述のうち、誤っているものはどれか。",["2週間以上の長く続くせきは、結核の症状の1つである。","早期発見のために定期の健康診断が行われている。","美容師が罹患した場合は、感染症法に基づく就業制限の対象となる。","年間の新規登録患者数は、近年1,000人程度で推移している。"],4],
        ["腸管出血性大腸菌感染症に関する次の記述のうち、正しいものの組合せはどれか。\na 保菌者の便を通じて家族などに二次感染することがある。\nb 病原体は、ベロ毒素を出すのが特徴である。\nc 病原体は熱に強く、加熱によって死滅することはない。\nd 潜伏期は、約20日である。",["aとb","bとc","cとd","aとd"],1],
        ["美容所で行うべき措置に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「美容師法では、皮ふに接する布片は客一人ごとに [ A ] 、皮ふに接する器具は客一人ごとに [ B ] することと定められている。また、美容所には [ C ] 設備を設けなければならない。」",["A:取りかえ ― B:消毒 ― C:消毒","A:消毒し ― B:消毒 ― C:滅菌","A:取りかえ ― B:洗浄 ― C:滅菌","A:消毒し ― B:洗浄 ― C:消毒"],1],
        ["美容所で行う血液が付着している疑いのない器具類の消毒法に関する次の記述のうち、誤っているものはどれか。",["かみそりの表面を消毒用エタノールを含ませた綿で拭く。","くしを0.01%次亜塩素酸ナトリウム水溶液に10分間以上浸す。","はさみを沸騰後2分間以上煮沸する。","クリッパーの刃を0.1%逆性石けん水溶液に10分間以上浸す。"],1],
        ["理学的消毒法に関する次の記述のうち、正しいものの組合せはどれか。\na 紫外線は固体表面の消毒に適するが、陰になる部分の消毒はできない。\nb 紫外線の消毒効果は、汚れのついた表面でも減弱しない。\nc 80〜100℃、10分間の蒸気消毒で細菌の芽胞は不活化する。\nd 2〜3分間の煮沸消毒では、細菌の芽胞は不活化しない。",["aとb","bとc","cとd","aとd"],4],
        ["消毒用エタノールに関する次の記述のうち、正しいものの組合せはどれか。\na エタノールの濃度は40〜50%である。\nb 消毒効果は逆性石けんと併用すると減弱する。\nc 揮発性が強く、引火性がある。\nd 手指や刃物類の消毒に適している。",["aとb","bとc","cとd","aとd"],3],
        ["次のうち、5%グルコン酸クロルヘキシジン10mLを水で希釈してグルコン酸クロルヘキシジン水溶液1,000mLを調製した場合の濃度はどれか。",["0.01%","0.05%","0.1%","0.5%"],2],

        ["次の骨の構造のうち、造血作用があるものはどれか。",["黄色骨髄","赤色骨髄","海綿質","緻密質"],2],
        ["次の筋のうち、副交感神経の興奮により収縮するものはどれか。",["心筋","皮膚血管の平滑筋","気管支の平滑筋","立毛筋"],3],
        ["次の眼の構造のうち、瞳孔に入る光の量を調節する絞りの働きをするものはどれか。",["角膜","虹彩","硝子体","毛様体"],2],
        ["次のうち、リンパ管が合流する血管はどれか。",["静脈","動脈","毛細血管","門脈"],1],
        ["皮膚の構造に関する次の記述のうち、正しいものはどれか。",["表皮は、皮膚表面より順に基底層、有棘層、顆粒層、角質層の4つの細胞層からなる。","色素細胞(メラノサイト)は、表皮細胞の95%を占める。","真皮の外側には、多量の脂肪を含んだ皮下組織がある。","真皮は表皮の数倍の厚さの層で、膠原線維や弾性線維を含む。"],4],
        ["皮膚付属器官の構造に関する次の記述のうち、誤っているものはどれか。",["睫毛(まつ毛)、耳毛、鼻毛以外の毛は、皮膚表面から垂直に生えている。","毛母の部分には色素細胞が多数存在し、毛に色素を与えている。","立毛筋は、毛包の一部がやや隆起した部分(毛隆起)に付着している。","毛は、ケラチンという硫黄を含むタンパク質の一種からなる。"],1],
        ["皮膚と皮膚付属器官の生理機能に関する次の記述のうち、誤っているものはどれか。",["皮膚の表面にある脂肪膜は弱酸性で、細菌などの発育を抑制する。","脂肪膜と角質層のケラチンは、化学的刺激に対する保護の働きをする。","男性ホルモンは、脂腺の発育を促進する。","エクリン腺の汗はアルカリ性で、アポクリン腺の汗は酸性である。"],4],
        ["皮膚と紫外線に関する次の記述のうち、正しいものはどれか。",["紫外線のうち、UVCの波長が最も長い。","UVBは、UVAに比べて皮膚に対する刺激が強い。","メラニンが産生され、皮膚の色が濃くなることをサンバーンという。","紫外線により生じる紅斑のことをサンタンという。"],2],
        ["次の感染性皮膚疾患のうち、ウイルスを病原体とするものはどれか。",["伝染性膿痂疹","疥癬","伝染性軟属腫(ミズイボ)","頭部白癬(シラクモ)"],3],
        ["アルコールに関する次の記述のうち、誤っているものはどれか。",["エタノール(エチルアルコール)は、水に溶けない化合物を化粧品に配合するための溶媒として用いられる。","メタノール(メチルアルコール)は、消毒・殺菌作用を持ち、化粧品に配合される。","セタノール(セチルアルコール)は、高級アルコールの一種で、乳化助剤として用いられる。","グリセリンは、天然の油脂を分解して得られるアルコールの一種である。"],2],
        ["界面活性剤に関する次の記述のうち、正しいものの組合せはどれか。\na 界面活性剤は、クリームに用いられることはない。\nb 界面活性剤は、水溶液中で必ずイオン化して作用を発揮する。\nc 陽イオン界面活性剤は、毛髪への吸着性に優れている。\nd アルキル硫酸ナトリウムは、シャンプー剤に用いられる。",["aとb","bとc","cとd","aとd"],3],
        ["香粧品原料に関する次の記述のうち、誤っているものはどれか。",["キトサンは、キチンから得られる高分子化合物である。","ラノリンは、羊の毛から得られるロウである。","じゃ香(ムスク)は、植物性香料である。","β-カロチンは、ニンジンに多く含まれる天然色素である。"],3],
        ["香粧品に用いられる成分とその配合目的に関する次の組合せのうち、誤っているものはどれか。",["パラオキシ安息香酸エステル(パラベン) ― 防腐剤","パラアミノ安息香酸エステル ― 金属イオン封鎖剤(キレート剤)","グリセリン ― 保湿剤","ジブチルヒドロキシトルエン(BHT) ― 酸化防止剤"],2],
        ["パーマ剤やヘアカラーの成分とその配合目的に関する次の組合せのうち、正しいものはどれか。",["アンモニア水 ― 調色剤(カップラー)","パラフェニレンジアミン ― 酸化剤","レゾルシン ― アルカリ剤","チオグリコール酸 ― 還元剤"],4],
        ["次の明治時代の女性の髪型のうち、束髪に該当するものはどれか。",["桃割れ","結綿","二百三高地髷","銀杏返し"],3],
        ["明治時代の服装に関する次の記述のうち、誤っているものはどれか。",["警官や鉄道員などの制服が洋装となった。","女性の車掌(バスガール)が登場し、洋装の制服が採用された。","海老茶袴が女学生の代名詞として流行した。","宮中における大礼服や通常礼服が洋装と規定された。"],2],
        ["下図の男性の礼装のうち、夜の略式礼装であるタキシードはどれか。",["(1) モーニングコート","(2) 燕尾服","(3) タキシード(拝絹の襟・蝶ネクタイ・カマーバンド)","(4) フロックコート"],3],
        ["コーム各部の名称とその働きに関する次の組合せのうち、正しいものはどれか。",["歯元 ― コーム全体の支えとなり、バランスをとる。","胴 ― 毛髪を引き起こし垂直に立てて両側から支え、そろえる。","歯先 ― 頭皮に接して毛髪を引き起こす手引きをする。","歯 ― コームの目に入った毛髪を一線にそろえる。"],3],
        ["シザーズの操作に関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「[ A ] で操作する方の鋏身を安定させる。[ B ] で操作する方の刃が [ C ] となる。」",["A:母指 ― B:薬指 ― C:静刃","A:薬指 ― B:薬指 ― C:動刃","A:母指 ― B:母指 ― C:静刃","A:薬指 ― B:母指 ― C:動刃"],4],

        ["デザインに関する次の記述のうち、誤っているものはどれか。",["ドンディスによる形の3つの基本形は、正方形・円・正三角形である。","ポンゾ錯視は、角度・方向錯視を代表するものである。","枠組み効果とは、枠組みによって対象の位置がずれて見える現象である。","主観的輪郭線とは、実際には輪郭線が存在しないのに、あたかも輪郭線がそこにあるように見える現象である。"],2],
        ["刃物の材料に関する次の記述のうち、正しいものはどれか。",["鉄に炭素を加えると加工性が低下する。","ステンレス鋼は、炭素鋼に比べてさびに弱い。","コバルト鋼は、炭素鋼に比べて摩耗に強い。","ステンレス鋼には、クロムが約3〜6%含まれている。"],3],

        ["パーマネントウェービングに関する次の記述のうち、正しいものはどれか。",["つけ巻きは、毛髪をウェットの状態でワインディング後、第1剤を塗布する方法である。","トリートメント巻きは、薬剤の作用をセーブし、かかりすぎないようにするために行う。","フルウェーブには、使用するロッドの2回転分の毛髪の長さが必要である。","テストカールは、第2剤の塗布後に行う。"],2],
        ["右図は、ピンカールのピンを取ったところを表したものである。このカールウェーブをつくるためのピンカールは、次のうちどれか。",["(1) クロッキノールカール(毛先が内側・外に向かって広がる)","(2) メイポールカール","(3) スカルプチュアカール(根元巻き)","(4) フォワードカール"],1],
        ["酸化染毛剤を用いたヘアカラーリングに関する次の文章の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「太くて硬く、黒い毛髪の場合は、[ A ] が出やすく、明るさは [ B ] ので、希望色より明度の [ C ] 染毛剤を選択するとよい。」",["A:赤み系 ― B:出にくい ― C:高い","A:黄み系 ― B:出やすい ― C:低い","A:黄み系 ― B:出にくい ― C:高い","A:赤み系 ― B:出やすい ― C:低い"],1],
        ["次のマニキュア技術の手順の [ ] 内に入る語句の組合せのうち、正しいものはどれか。「手指消毒→エナメル除去→カウンセリング→ [ A ] → [ B ] →キューティクル処理→マッサージ→ [ C ] →保湿」",["A:ファイリング ― B:バッフィング ― C:カラーリング","A:バッフィング ― B:ファイリング ― C:カラーリング","A:バッフィング ― B:カラーリング ― C:ファイリング","A:ファイリング ― B:カラーリング ― C:バッフィング"],1],
        ["まつ毛エクステンションに関する次の記述のうち、正しいものはどれか。",["まつ毛の毛周期は、頭髪の毛周期に比べて長い。","施術後すぐは、入浴やサウナなど高温・多湿の環境は避ける。","グルーやリムーバーによるアレルギー反応は、施術後数分で必ずあらわれる。","リペアは、個人差があるが通常6〜7週間で行う。"],2],
        ["下図は、着物の各部を表したものである。A、B、C、Dに該当する名称の次の組合せのうち、正しいものはどれか。",["A:裄 ― B:袖幅 ― C:身八つ口 ― D:身丈","A:袖付 ― B:袖幅 ― C:繰越し ― D:着丈","A:裄 ― B:袖付 ― C:着丈 ― D:身八つ口","A:袖幅 ― B:袖付 ― C:繰越し ― D:身丈"],1,"kimono_48_55"]
