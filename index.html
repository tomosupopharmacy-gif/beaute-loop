        render();
      },
      setSearchQuery(val) {
        state.searchQuery = val;
        render();
      },
      updateInput(field, val) {
        state[field] = val;
      },
      toggleQuestionExplanation(qId) {
        state.expandedExplanationIds[qId] = !state.expandedExplanationIds[qId];
        render();
      },
      toggleShowAllExplanations() {
        state.showAllExplanationsInList = !state.showAllExplanationsInList;
        render();
      },

      // =====================================================
      // 演習スタート（何回でもループ復習可能）
      // =====================================================
      startQuiz(mode, filterValue) {
        const allQ = buildAllQuestions();
        let targetQuestions = [];
        let title = '';
        let sessionLabel = '';

        if (mode === 'session_all') {
          const sesNum = Number(filterValue);
          targetQuestions = allQ.filter(q => q.session === sesNum).sort((a, b) => a.questionNumber - b.questionNumber);
          title = `第${sesNum}回 国家試験 全${targetQuestions.length}問演習`;
          sessionLabel = `第${sesNum}回`;
        } else if (mode === 'session_wrong') {
          const sesNum = Number(filterValue);
          targetQuestions = allQ.filter(q => {
            if (q.session !== sesNum) return false;
            const p = state.studentProgress[q.id];
            if (!p) return false;
            const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0));
            return p.status === 'review' || wrg > 0;
          }).sort((a, b) => a.questionNumber - b.questionNumber);
          title = `第${sesNum}回 間違えた問題ループ (${targetQuestions.length}問)`;
          sessionLabel = `第${sesNum}回 復習`;
        } else if (mode === 'category') {
          const catObj = CATEGORIES.find(c => c.id === filterValue);
          targetQuestions = allQ.filter(q => q.category === filterValue);
          title = `${catObj ? catObj.name : ''} 全14回横断ループ (${targetQuestions.length}問)`;
          sessionLabel = catObj ? catObj.shortName : '科目別';
        } else if (mode === 'category_wrong') {
          const catObj = CATEGORIES.find(c => c.id === filterValue);
          targetQuestions = allQ.filter(q => {
            if (q.category !== filterValue) return false;
            const p = state.studentProgress[q.id];
            if (!p) return false;
            const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0));
            return p.status === 'review' || wrg > 0;
          });
          title = `${catObj ? catObj.shortName : ''} 弱点ループ (${targetQuestions.length}問)`;
          sessionLabel = `${catObj ? catObj.shortName : ''} 弱点`;
        } else if (mode === 'review_loop') {
          targetQuestions = allQ.filter(q => state.studentProgress[q.id]?.status === 'review');
          title = `要復習（直近ミス）ループ演習 (${targetQuestions.length}問)`;
          sessionLabel = '要復習ループ';
        } else if (mode === 'ever_wrong_loop') {
          targetQuestions = allQ.filter(q => {
            const p = state.studentProgress[q.id];
            if (!p) return false;
            const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0));
            return wrg > 0 || p.status === 'review';
          });
          title = `過去に1度でも間違えた問題 徹底周回ループ (${targetQuestions.length}問)`;
          sessionLabel = '過去ミス徹底ループ';
        } else if (mode === 'unattempted_loop') {
          targetQuestions = allQ.filter(q => !state.studentProgress[q.id] || !state.studentProgress[q.id].attempts).slice(0, 55);
          title = `未着手問題 55問チャレンジ (${targetQuestions.length}問)`;
          sessionLabel = '未着手チャレンジ';
        } else if (mode === 'sticky_loop') {
          targetQuestions = allQ.filter(q => {
            const st = state.studentStickies[q.id];
            if (!st) return false;
            return filterValue === 'all' ? true : st.color === filterValue;
          });
          title = `付箋問題ループ演習 (${targetQuestions.length}問)`;
          sessionLabel = '付箋ループ';
        } else if (mode === 'single') {
          const qObj = allQ.find(q => q.id === filterValue);
          if (qObj) {
            targetQuestions = [qObj];
            title = `第${qObj.session}回 問${qObj.questionNumber} ピンポイント演習`;
            sessionLabel = `第${qObj.session}回`;
          }
        } else if (mode === 'filtered_custom') {
          targetQuestions = getFilteredQuestions(allQ);
          title = `絞り込み問題ループ演習 (${targetQuestions.length}問)`;
          sessionLabel = 'カスタム演習';
        }

        if (!targetQuestions.length) {
          showToast('対象となる問題がありません（他の条件や回数をお試しください）');
          return;
        }

        state.quizSession = {
          title,
          sessionLabel,
          mode,
          loopCountInSession: 1,
          questions: targetQuestions,
          currentIndex: 0,
          answers: {}, // { [qId]: { selectedIdx, isCorrect } }
          peekExplanation: false,
          isFinished: false
        };
        state.showJumpGrid = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      answerQuestion(selectedIdx) {
        const qs = state.quizSession;
        if (!qs || qs.isFinished) return;
        const currentQ = qs.questions[qs.currentIndex];
        if (!currentQ) return;
        if (qs.answers[currentQ.id] !== undefined) return;

        const isCorrect = (selectedIdx === currentQ.correctIndex) ||
          (currentQ.alsoCorrectIndex !== null && currentQ.alsoCorrectIndex !== undefined && selectedIdx === currentQ.alsoCorrectIndex);

        qs.answers[currentQ.id] = { selectedIdx, isCorrect };
        qs.peekExplanation = false;

        const prev = state.studentProgress[currentQ.id] || { status: 'unattempted', attempts: 0, correctCount: 0, wrongCount: 0, streak: 0 };
        const prevWrong = prev.wrongCount !== undefined ? prev.wrongCount : Math.max(0, (prev.attempts || 0) - (prev.correctCount || 0));
        const nextAttempts = (prev.attempts || 0) + 1;
        const nextCorrect = (prev.correctCount || 0) + (isCorrect ? 1 : 0);
        const nextWrong = prevWrong + (isCorrect ? 0 : 1);
        const nextStreak = isCorrect ? ((prev.streak || 0) + 1) : 0;
        const nextStatus = isCorrect ? 'mastered' : 'review';

        state.studentProgress[currentQ.id] = {
          status: nextStatus,
          attempts: nextAttempts,
          correctCount: nextCorrect,
          wrongCount: nextWrong,
          streak: nextStreak,
          lastAnsweredAt: Date.now()
        };

        savePersonalData();
        render();
      },

      togglePeekExplanation() {
        const qs = state.quizSession;
        if (!qs) return;
        qs.peekExplanation = !qs.peekExplanation;
        render();
      },

      nextQuestion() {
        const qs = state.quizSession;
        if (!qs) return;
        qs.peekExplanation = false;
        if (qs.currentIndex < qs.questions.length - 1) {
          qs.currentIndex++;
          window.scrollTo({ top: 0, behavior: 'smooth' });
          render();
        } else {
          this.finishQuizSession();
        }
      },

      prevQuestion() {
        const qs = state.quizSession;
        if (!qs || qs.currentIndex <= 0) return;
        qs.peekExplanation = false;
        qs.currentIndex--;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      jumpToQuestion(idx) {
        const qs = state.quizSession;
        if (!qs || idx < 0 || idx >= qs.questions.length) return;
        qs.peekExplanation = false;
        qs.currentIndex = idx;
        state.showJumpGrid = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      toggleJumpGrid() {
        state.showJumpGrid = !state.showJumpGrid;
        render();
      },

      finishQuizSession() {
        const qs = state.quizSession;
        if (!qs) return;
        qs.isFinished = true;
        const answeredCount = Object.keys(qs.answers).length;
        const correctCount = Object.values(qs.answers).filter(a => a.isCorrect).length;
        if (answeredCount > 0) {
          if (qs.mode === 'review_loop' || qs.mode === 'ever_wrong_loop' || qs.mode === 'retry_wrong') {
            state.completedReviewLoops = (state.completedReviewLoops || 0) + 1;
          }
          state.examLogs.unshift({
            date: Date.now(),
            score: correctCount,
            total: qs.questions.length,
            answered: answeredCount,
            mode: qs.title,
            session: qs.sessionLabel,
            loopRound: qs.loopCountInSession || 1
          });
          if (state.examLogs.length > 50) state.examLogs = state.examLogs.slice(0, 50);
          savePersonalData();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      // この演習で間違えた問題だけを即座に次の周回へループ
      retryWrongInSession() {
        const qs = state.quizSession;
        if (!qs) return;
        const wrongQs = qs.questions.filter(q => {
          const ans = qs.answers[q.id];
          return !ans || !ans.isCorrect;
        });
        if (!wrongQs.length) {
          showToast('全問正解しています！「同じセットをもう1周する」から再周回もできます');
          return;
        }
        const nextLoop = (qs.loopCountInSession || 1) + 1;
        state.quizSession = {
          title: `${qs.sessionLabel} 間違い直しループ ${nextLoop}周目 (${wrongQs.length}問)`,
          sessionLabel: qs.sessionLabel,
          mode: 'retry_wrong',
          loopCountInSession: nextLoop,
          questions: wrongQs,
          currentIndex: 0,
          answers: {},
          peekExplanation: false,
          isFinished: false
        };
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      // 同じ問題セットをもう1周最初から解き直す（何周でも反復可能）
      repeatSameQuizSet() {
        const qs = state.quizSession;
        if (!qs) return;
        const nextLoop = (qs.loopCountInSession || 1) + 1;
        state.quizSession = {
          title: `${qs.sessionLabel} 反復ループ ${nextLoop}周目 (${qs.questions.length}問)`,
          sessionLabel: qs.sessionLabel,
          mode: qs.mode,
          loopCountInSession: nextLoop,
          questions: [...qs.questions],
          currentIndex: 0,
          answers: {},
          peekExplanation: false,
          isFinished: false
        };
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      },

      closeQuizSession() {
        state.quizSession = null;
        state.showJumpGrid = false;
        render();
      },

      // =====================================================
      // 付箋（Sticky）モーダル操作
      // =====================================================
      openStickyModal(qId) {
        state.stickyModalQId = qId;
        const existing = state.studentStickies[qId];
        state.stickyDraftColor = existing ? existing.color : 'red';
        state.stickyDraftMemo = existing ? existing.memo : '';
        render();
      },
      closeStickyModal() {
        state.stickyModalQId = null;
        render();
      },
      setStickyDraftColor(c) {
        state.stickyDraftColor = c;
        render();
      },
      saveSticky() {
        const qId = state.stickyModalQId;
        if (!qId) return;
        state.studentStickies[qId] = {
          color: state.stickyDraftColor,
          memo: state.stickyDraftMemo.trim(),
          updatedAt: Date.now()
        };
        state.stickyModalQId = null;
        savePersonalData();
        showToast('付箋メモをブラウザに保存しました');
        render();
      },
      removeSticky(qId) {
        const target = qId || state.stickyModalQId;
        if (!target) return;
        delete state.studentStickies[target];
        state.stickyModalQId = null;
        savePersonalData();
        showToast('付箋を外しました');
        render();
      },

      // =====================================================
      // 学習データリセット・周回リセット確認モーダル
      // =====================================================
      openResetConfirmModal(type) {
        if (type === 'reopen_ever_wrong') {
          state.confirmModal = {
            title: '過去に間違えた問題をすべて「要復習」に戻す',
            message: 'これまでに1度でも間違えたことがある問題をすべて「要復習」ステータスに戻し、もう1周最初から復習ループできるようにします。（これまでの解答回数や付箋メモは消えません）',
            confirmLabel: '要復習に戻して周回する',
            actionType: 'reopen_ever_wrong'
          };
        } else if (type === 'reset_all') {
          state.confirmModal = {
            title: '学習履歴のリセット確認',
            message: 'このブラウザに保存されている解答履歴・演習ログを初期状態にリセットしますか？（※貼った付箋メモはそのまま残ります）',
            confirmLabel: '履歴をリセットする',
            actionType: 'reset_all'
          };
        }
        render();
      },
      closeConfirmModal() {
        state.confirmModal = null;
        render();
      },
      executeConfirmModal() {
        if (!state.confirmModal) return;
        const act = state.confirmModal.actionType;
        state.confirmModal = null;
        if (act === 'reopen_ever_wrong') {
          let count = 0;
          Object.keys(state.studentProgress).forEach(qId => {
            const p = state.studentProgress[qId];
            const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0));
            if (wrg > 0) {
              p.status = 'review';
              count++;
            }
          });
          savePersonalData();
          showToast(`${count}問の過去ミス問題を「要復習」に再セットしました！`);
        } else if (act === 'reset_all') {
          state.studentProgress = {};
          state.examLogs = [];
          state.completedReviewLoops = 0;
          savePersonalData();
          showToast('学習履歴をリセットしました（新しい1周目を開始できます）');
        }
        render();
      }
    };

    function getFilteredQuestions(allQuestions) {
      return allQuestions.filter(q => {
        if (state.selectedSessionFilter !== 'all' && String(q.session) !== String(state.selectedSessionFilter)) return false;
        if (state.selectedCategoryFilter !== 'all' && q.category !== state.selectedCategoryFilter) return false;
        if (state.selectedStatusFilter !== 'all') {
          const p = state.studentProgress[q.id];
          const wrg = p ? (p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0))) : 0;
          if (state.selectedStatusFilter === 'review' && p?.status !== 'review') return false;
          if (state.selectedStatusFilter === 'ever_wrong' && !(wrg > 0 || p?.status === 'review')) return false;
          if (state.selectedStatusFilter === 'unattempted' && (p && p.attempts > 0)) return false;
          if (state.selectedStatusFilter === 'mastered' && p?.status !== 'mastered') return false;
        }
        if (state.searchQuery.trim() !== '') {
          const kw = state.searchQuery.trim().toLowerCase();
          const inQ = q.question.toLowerCase().includes(kw);
          const inOpt = q.options.some(o => o.toLowerCase().includes(kw));
          const inExp = q.explanation.toLowerCase().includes(kw);
          if (!inQ && !inOpt && !inExp) return false;
        }
        return true;
      }).sort((a, b) => (b.session - a.session) || (a.questionNumber - b.questionNumber));
    }

                      <div>

                    </div>
                    <div class="flex items-center gap-2">
                      <button type="button" onclick="window.appActions.startQuiz('session_all', ${ex.session})"

                        全${ss.total}問を解く

                      <button type="button" onclick="window.appActions.startQuiz('session_wrong', ${ex.session})"

    // C. 過去問14回分（全770問）一覧 & 解答・解説表示タブ
    function renderExamListTab(allQuestions, stats) {
      const filtered = getFilteredQuestions(allQuestions);

      return `
        <div class="space-y-4 animate-fadeIn">
          <div class="bg-white rounded-3xl p-4 sm:p-5 shadow-sm border border-slate-200 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="text-base font-black text-slate-900">過去問14回分（第41回〜第54回・全${allQuestions.length}問）問題＆解答・解説集</h2>

              <div class="flex flex-wrap items-center gap-2">
                <button type="button" onclick="window.appActions.toggleShowAllExplanations()"
                  class="px-3 py-2 rounded-xl ${state.showAllExplanationsInList ? 'bg-indigo-600 text-white' : 'bg-indigo-50 text-indigo-700 border border-indigo-200'} font-bold text-xs transition flex items-center gap-1">
                  <i data-lucide="book-open-check" class="w-3.5 h-3.5"></i>
                  ${state.showAllExplanationsInList ? '全問の解答・解説を隠す' : '全問の解答・解説を一括表示'}
                </button>
                <button type="button" onclick="window.appActions.startQuiz('filtered_custom')"
                  class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm transition flex items-center gap-1.5">
                  <i data-lucide="play" class="w-3.5 h-3.5"></i> 表示中の${filtered.length}問を演習
                </button>
              </div>
            </div>

            <!-- 回数フィルター（第54回〜第41回） -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              <button type="button" onclick="window.appActions.setSessionFilter('all')"
                class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 transition ${state.selectedSessionFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                全14回 (${allQuestions.length})
              </button>
              ${EXAM_PDF_LIST.map(ex => `
                <button type="button" onclick="window.appActions.setSessionFilter('${ex.session}')"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 transition ${String(state.selectedSessionFilter) === String(ex.session) ? 'bg-rose-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                  第${ex.session}回
                </button>
              `).join('')}
            </div>

            <!-- 科目・状態フィルター & キーワード検索 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <select onchange="window.appActions.setCategoryFilter(this.value)"
                class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 bg-slate-50">
                <option value="all" ${state.selectedCategoryFilter === 'all' ? 'selected' : ''}>すべての科目（問1〜問55）</option>
                ${CATEGORIES.map(c => `<option value="${c.id}" ${state.selectedCategoryFilter === c.id ? 'selected' : ''}>${c.name} (${c.range})</option>`).join('')}
              </select>
              <select onchange="window.appActions.setStatusFilter(this.value)"
                class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 bg-slate-50">
                <option value="all" ${state.selectedStatusFilter === 'all' ? 'selected' : ''}>すべての学習状態</option>
                <option value="review" ${state.selectedStatusFilter === 'review' ? 'selected' : ''}>要復習（直近ミス）のみ</option>
                <option value="ever_wrong" ${state.selectedStatusFilter === 'ever_wrong' ? 'selected' : ''}>過去に1度でも間違えた問題</option>
                <option value="unattempted" ${state.selectedStatusFilter === 'unattempted' ? 'selected' : ''}>未着手の問題のみ</option>
                <option value="mastered" ${state.selectedStatusFilter === 'mastered' ? 'selected' : ''}>定着済（○）のみ</option>
              </select>
              <input type="text" value="${escapeHtml(state.searchQuery)}" oninput="window.appActions.setSearchQuery(this.value)"
                placeholder="キーワード検索（例：次亜塩素酸、管理美容師）"
                class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs bg-slate-50 focus:bg-white focus:border-rose-500 focus:outline-none" />

          </div>

          <!-- 問題リスト -->
          <div class="space-y-3">
            ${filtered.map(q => {
              const p = state.studentProgress[q.id];
              const sticky = state.studentStickies[q.id];
              const cat = CATEGORIES.find(c => c.id === q.category) || CATEGORIES[0];
              const isExpOpen = state.showAllExplanationsInList || !!state.expandedExplanationIds[q.id];

              let statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-500">未着手</span>`;

              else if (p?.status === 'review') statusBadge = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700">要復習 ×</span>`;

              return `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 hover:border-rose-300 transition space-y-2.5">

                      <span class="px-2 py-0.5 rounded-lg text-[11px] font-bold ${cat.lightBg} ${cat.text}">${cat.name}</span>
                      ${statusBadge}
                    </div>
                    <div class="flex items-center gap-1.5">
                      ${renderPersonalAttemptBadge(q.id)}

                          <span class="font-black mr-1">(${idx + 1})</span>${escapeHtml(opt)}
                          ${isCorrectOpt ? `<span class="ml-1 text-[10px] font-extrabold text-emerald-700 bg-emerald-100 px-1.5 py-0.2 rounded">正解</span>` : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>

                  ${sticky ? `
                    <div class="p-2.5 rounded-xl ${STICKY_COLORS[sticky.color]?.bg || 'bg-amber-50'} border ${STICKY_COLORS[sticky.color]?.border || 'border-amber-200'} text-xs flex items-center gap-1.5">
                      <span class="w-2 h-2 rounded-full ${STICKY_COLORS[sticky.color]?.dot || 'bg-amber-500'}"></span>
                      <span class="font-bold ${STICKY_COLORS[sticky.color]?.text || 'text-amber-800'}">${escapeHtml(sticky.memo || STICKY_COLORS[sticky.color]?.label)}</span>
                    </div>
                  ` : ''}

                  ${isExpOpen ? `
                    <div class="p-3.5 rounded-2xl bg-indigo-50/70 border border-indigo-200 space-y-1.5 animate-fadeIn">
                      <div class="text-xs font-black text-indigo-900 flex items-center gap-1.5">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-indigo-600"></i> 解答・詳しい解説
                      </div>
                      <p class="text-xs text-slate-800 leading-relaxed whitespace-pre-line">${escapeHtml(q.explanation)}</p>
                    </div>
                  ` : ''}

                  <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100">
                    <div class="flex items-center gap-3">
                      <button type="button" onclick="window.appActions.toggleQuestionExplanation('${q.id}')"
                        class="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                        <i data-lucide="help-circle" class="w-3.5 h-3.5"></i> ${isExpOpen ? '解答・解説を閉じる' : '解答・解説を見る'}
                      </button>
                      <button type="button" onclick="window.appActions.openStickyModal('${q.id}')"
                        class="text-xs font-bold text-slate-500 hover:text-rose-600 flex items-center gap-1">
                        <i data-lucide="bookmark" class="w-3.5 h-3.5"></i> ${sticky ? '付箋を編集' : '付箋を貼る'}
                      </button>
                    </div>
                    <button type="button" onclick="window.appActions.startQuiz('single', '${q.id}')"
                      class="px-3.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-600 text-rose-700 hover:text-white font-bold text-xs transition flex items-center gap-1">
                      この問題を解く <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

    // D. 復習ループ・付箋メモ帳タブ
    function renderStickiesTab(allQuestions, stats) {
      const stickyQuestions = allQuestions.filter(q => {
        const st = state.studentStickies[q.id];
        if (!st) return false;
        return state.selectedStickyFilter === 'all' ? true : st.color === state.selectedStickyFilter;
      });

      const reviewQuestions = allQuestions.filter(q => state.studentProgress[q.id]?.status === 'review');
      const everWrongQuestions = allQuestions.filter(q => {
        const p = state.studentProgress[q.id];
        if (!p) return false;
        const wrg = p.wrongCount !== undefined ? p.wrongCount : Math.max(0, (p.attempts || 0) - (p.correctCount || 0));
        return wrg > 0 || p.status === 'review';
      });

      return `
        <div class="space-y-5 animate-fadeIn">
          <!-- 間違えた問題・過去ミス周回ボックス -->
          <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
                  <i data-lucide="repeat" class="w-5 h-5 text-rose-600"></i> 間違えた問題の周回ループ（要復習 ${reviewQuestions.length}問 ／ 過去ミス履歴 ${everWrongQuestions.length}問）
                </h2>
                <p class="text-xs text-slate-500">1度正解して「定着済」になった問題も、「過去ミス徹底ループ」から何度でも周回できます</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button type="button" onclick="window.appActions.startQuiz('review_loop')"
                  class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm transition">
                  要復習(${reviewQuestions.length}問)をループ
                </button>
                <button type="button" onclick="window.appActions.startQuiz('ever_wrong_loop')"
                  class="px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-700 text-white font-bold text-xs shadow-sm transition">
                  過去ミス全${everWrongQuestions.length}問を何周でもループ
                </button>
              </div>
            </div>

            ${everWrongQuestions.length === 0 ? `
              <div class="p-6 text-center text-xs text-slate-500 bg-slate-50 rounded-2xl">
                現在、間違えた問題の履歴はありません。過去問演習を進めましょう！
              </div>
            ` : `
              <div class="space-y-2.5 max-h-[30rem] overflow-y-auto pr-1">
                ${everWrongQuestions.map(q => {
                  const p = state.studentProgress[q.id];
                  const isExpOpen = !!state.expandedExplanationIds[q.id];
                  return `
                    <div class="p-3.5 rounded-2xl ${p?.status === 'review' ? 'bg-rose-50/70 border-rose-200' : 'bg-orange-50/50 border-orange-200'} border space-y-2">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="flex flex-wrap items-center gap-1.5">
                          <span class="text-xs font-black ${p?.status === 'review' ? 'text-rose-700' : 'text-orange-800'}">第${q.session}回 問${q.questionNumber}</span>
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${p?.status === 'review' ? 'bg-rose-600 text-white' : 'bg-emerald-100 text-emerald-800'}">
                            ${p?.status === 'review' ? '要復習 ×' : '復習クリア済 ○'}
                          </span>
                          ${renderPersonalAttemptBadge(q.id)}
                        </div>
                        <div class="flex items-center gap-2">
                          <button type="button" onclick="window.appActions.toggleQuestionExplanation('${q.id}')"
                            class="text-xs font-bold text-indigo-600 hover:underline">
                            ${isExpOpen ? '解説を閉じる' : '解答・解説'}
                          </button>
                          <button type="button" onclick="window.appActions.startQuiz('single', '${q.id}')"
                            class="px-3 py-1 rounded-xl bg-white text-rose-600 font-bold text-xs border border-rose-200 shrink-0 shadow-xs">
                            再挑戦
                          </button>
                        </div>
                      </div>
                      <p class="text-xs font-bold text-slate-800">${escapeHtml(q.question)}</p>
                      ${isExpOpen ? `
                        <div class="p-3 rounded-xl bg-white border border-slate-200 text-xs text-slate-700 whitespace-pre-line leading-relaxed">
                          ${escapeHtml(q.explanation)}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}

      const qs = state.quizSession;
      if (!qs) return '';

      if (qs.isFinished) {
        const total = qs.questions.length;
        const answered = Object.keys(qs.answers).length;
        const correct = Object.values(qs.answers).filter(a => a.isCorrect).length;
        const wrongCount = total - correct;
        const rate = total > 0 ? Math.round((correct / total) * 100) : 0;
        const passed = rate >= 60;

        return `
          <div class="max-w-2xl mx-auto space-y-5 animate-fadeIn">
            <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 space-y-5">

                </span>
                <h2 class="text-xl font-black text-slate-900">${escapeHtml(qs.title)} 結果</h2>
                <div class="text-4xl font-black ${passed ? 'text-emerald-600' : 'text-rose-600'}">
                  ${correct} <span class="text-lg text-slate-500">/ ${total}問正解 (${rate}%)</span>
                </div>

                  ${wrongCount === 0 ? 'disabled' : ''}

                  class="text-xs font-bold text-rose-600 underline">ここまでの結果を集計する</button>
              </div>
              <div class="grid grid-cols-10 gap-1.5">
                ${qs.questions.map((qItem, i) => {
                  const a = qs.answers[qItem.id];
                  let cls = 'bg-slate-100 text-slate-700';
                  if (a?.isCorrect === true) cls = 'bg-emerald-500 text-white';
                  else if (a?.isCorrect === false) cls = 'bg-rose-500 text-white';
                  if (i === qs.currentIndex) cls += ' ring-2 ring-slate-900';
                  return `<button type="button" onclick="window.appActions.jumpToQuestion(${i})" class="py-1.5 rounded-lg text-xs font-bold ${cls}">${i + 1}</button>`;
                }).join('')}
              </div>
            </div>
          ` : ''}

          <!-- 問題カード本体 -->
          <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="px-2.5 py-1 rounded-xl text-xs font-black bg-slate-900 text-white">第${currentQ.session}回 問${currentQ.questionNumber}</span>
                <span class="px-2.5 py-1 rounded-xl text-xs font-bold ${cat.lightBg} ${cat.text}">${cat.name}</span>
              </div>
              <div class="flex items-center gap-1.5">
                ${renderPersonalAttemptBadge(currentQ.id)}
                <button type="button" onclick="window.appActions.openStickyModal('${currentQ.id}')"
                  class="px-2.5 py-1 rounded-xl text-xs font-bold border ${sticky ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-slate-50 text-slate-600 border-slate-200'} flex items-center gap-1">
                  <i data-lucide="bookmark" class="w-3.5 h-3.5"></i> 付箋
                </button>
              </div>
            </div>

            <div class="text-base font-bold text-slate-900 leading-relaxed whitespace-pre-line">${escapeHtml(currentQ.question)}</div>

            ${currentQ.svgKey && QUESTION_SVGS[currentQ.svgKey] ? `
              <div class="my-2">${QUESTION_SVGS[currentQ.svgKey]}</div>
            ` : ''}

            <!-- 4択ボタン -->
            <div class="space-y-2.5 pt-1">
              ${currentQ.options.map((optText, idx) => {
                let btnCls = 'bg-slate-50 hover:bg-rose-50/60 border-slate-200 text-slate-800';
                let badgeCls = 'bg-white text-slate-700 border-slate-300';
                if (showExplanationBox) {
                  const isThisCorrect = (idx === currentQ.correctIndex) || (currentQ.alsoCorrectIndex === idx);
                  const isSelected = ans && ans.selectedIdx === idx;
                  if (isThisCorrect) {
                    btnCls = 'bg-emerald-50 border-emerald-500 text-emerald-950 font-bold';
                    badgeCls = 'bg-emerald-600 text-white border-emerald-600';
                  } else if (isSelected) {
                    btnCls = 'bg-rose-50 border-rose-500 text-rose-950 font-bold';
                    badgeCls = 'bg-rose-600 text-white border-rose-600';
                  } else {
                    btnCls = 'bg-slate-50 border-slate-200 text-slate-400 opacity-75';
                  }
                }
                return `
                  <button type="button" onclick="window.appActions.answerQuestion(${idx})"
                    ${ans !== undefined ? 'disabled' : ''}
                    class="w-full p-3.5 rounded-2xl border-2 text-left transition flex items-start gap-3 ${btnCls}">
                    <span class="w-6 h-6 rounded-lg border text-xs font-black flex items-center justify-center shrink-0 mt-0.5 ${badgeCls}">
                      ${idx + 1}
                    </span>
                    <span class="text-sm leading-snug">${escapeHtml(optText)}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- 解答前に解説を見たい場合のトグルボタン -->
            ${ans === undefined ? `
              <div class="flex justify-end">
                <button type="button" onclick="window.appActions.togglePeekExplanation()"
                  class="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
                  <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
                  ${qs.peekExplanation ? '解答・解説を隠す' : '解答・解説を先に確認する'}
                </button>
              </div>
            ` : ''}

            <!-- 解答後の正誤＆詳しい解説ボックス -->
            ${showExplanationBox ? `
              <div class="mt-4 p-4 rounded-2xl border ${ans === undefined ? 'bg-indigo-50/70 border-indigo-200' : ans.isCorrect ? 'bg-emerald-50/70 border-emerald-200' : 'bg-rose-50/70 border-rose-200'} space-y-2.5 animate-fadeIn">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="text-sm font-black ${ans === undefined ? 'text-indigo-800' : ans.isCorrect ? 'text-emerald-700' : 'text-rose-700'} flex items-center gap-1.5">
                    <i data-lucide="${ans === undefined ? 'book-open' : ans.isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-5 h-5"></i>
                    ${ans === undefined
                      ? `正解は（${currentQ.correctIndex + 1}）です`
                      : ans.isCorrect
                        ? '正解！「定着済」に記録されました'
                        : `不正解… 正解は（${currentQ.correctIndex + 1}）です（「要復習」に登録されました）`}
                  </div>
                </div>
                <div class="p-3.5 rounded-xl bg-white/90 border border-slate-200/80 text-xs text-slate-800 leading-relaxed whitespace-pre-line">
                  ${escapeHtml(currentQ.explanation)}
                </div>
              </div>
            ` : ''}

            <!-- 前後の問題ナビゲーション -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-3">
              <button type="button" onclick="window.appActions.prevQuestion()"
                ${qs.currentIndex === 0 ? 'disabled' : ''}
                class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 font-bold text-xs">
                前の問題
              </button>
              <button type="button" onclick="window.appActions.nextQuestion()"
                class="px-6 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm">
                ${qs.currentIndex === qs.questions.length - 1 ? '結果と全問解説を見る' : '次の問題へ'}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // H. モーダル群（付箋メモ設定モーダル / 履歴リセット確認モーダル）
    function renderModals() {
      let html = '';

      if (state.stickyModalQId) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-4 animate-fadeIn">
              <div class="flex items-center justify-between">
                <h3 class="text-base font-black text-slate-900">付箋と暗記メモの設定</h3>
                <button type="button" onclick="window.appActions.closeStickyModal()" class="text-slate-400 hover:text-slate-700">✕</button>
              </div>
              <div class="grid grid-cols-3 gap-2">
                ${Object.values(STICKY_COLORS).map(sc => `
                  <button type="button" onclick="window.appActions.setStickyDraftColor('${sc.id}')"
                    class="p-2.5 rounded-xl border text-xs font-bold flex flex-col items-center gap-1 ${state.stickyDraftColor === sc.id ? `${sc.bg} ${sc.text} ${sc.border} ring-2 ring-slate-900` : 'bg-slate-50 text-slate-600 border-slate-200'}">
                    <span class="w-3 h-3 rounded-full ${sc.dot}"></span>
                    <span>${sc.label}</span>
                  </button>
                `).join('')}
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">暗記メモ・ポイント</label>
                <textarea rows="3" oninput="window.appActions.updateInput('stickyDraftMemo', this.value)"
                  placeholder="例：取消処分の返納は5日以内！30日とひっかけ注意"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs">${escapeHtml(state.stickyDraftMemo)}</textarea>
              </div>
              <div class="flex items-center justify-between gap-2 pt-2">
                <button type="button" onclick="window.appActions.removeSticky()"
                  class="px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 font-bold text-xs">
                  付箋を外す
                </button>
                <div class="flex items-center gap-2">
                  <button type="button" onclick="window.appActions.closeStickyModal()"
                    class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">キャンセル</button>
                  <button type="button" onclick="window.appActions.saveSticky()"
                    class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm">保存する</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (state.confirmModal) {
        html += `
          <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl space-y-4 animate-fadeIn">
              <h3 class="text-base font-black text-slate-900">${escapeHtml(state.confirmModal.title)}</h3>
              <p class="text-xs text-slate-600 leading-relaxed">${escapeHtml(state.confirmModal.message)}</p>
              <div class="flex items-center justify-end gap-2 pt-2">
                <button type="button" onclick="window.appActions.closeConfirmModal()"
                  class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs">キャンセル</button>
                <button type="button" onclick="window.appActions.executeConfirmModal()"
                  class="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm">
                  ${escapeHtml(state.confirmModal.confirmLabel)}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      return html;
    }

    // =========================================================
    // 9. メイン render() 関数
    // =========================================================
    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      const allQuestions = buildAllQuestions();
      const stats = computeStudentStats(allQuestions);

      let mainBody = '';
      if (state.quizSession) {
        mainBody = renderQuizRunner();
      } else if (state.activeTab === 'dashboard') {
        mainBody = renderDashboardTab(allQuestions, stats);
      } else if (state.activeTab === 'exam') {
        mainBody = renderExamListTab(allQuestions, stats);
      } else if (state.activeTab === 'stickies') {
        mainBody = renderStickiesTab(allQuestions, stats);
      } else if (state.activeTab === 'analytics') {
        mainBody = renderAnalyticsTab(allQuestions, stats);
      } else if (state.activeTab === 'pdfs') {
        mainBody = renderPdfsTab();
      }

      const contentHtml = `
        <div class="min-h-screen flex flex-col bg-slate-50">
          ${renderStudentHeader(stats)}
          <main class="flex-1 max-w-4xl w-full mx-auto px-4 pt-4 pb-safe-main">
            ${mainBody}
          </main>
          ${renderStudentBottomNav(stats)}
        </div>
      `;

      const toastHtml = state.toastMessage ? `
        <div class="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-slate-900/95 text-white text-xs font-bold shadow-xl flex items-center gap-2 animate-fadeIn">
          <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
          <span>${escapeHtml(state.toastMessage)}</span>
        </div>
      ` : '';

      appEl.innerHTML = contentHtml + renderModals() + toastHtml;

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    // 初期ロード＆描画
    loadPersonalData();
    render();
  </script>
</body>
</html>
